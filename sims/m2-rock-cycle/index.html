<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0ea5e9">
  <title>암석의 생성과 순환 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪨</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-card { background: #140f18; }
    /* 태블릿: 가로 배치 캔버스 · 휴대폰: 세로 배치 캔버스 */
    .sc-tall { display: none; }
    @media (max-width: 599px) { .sc-wide { display: none; } .sc-tall { display: block; } }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; display: flex; flex-direction: column; gap: 10px; }
    .is-off { display: none !important; }
    .seg-label { display: block; font-weight: 800; font-size: 14.5px; color: var(--muted); margin-bottom: 4px; }
    .segmented { display: flex; width: 100%; border-radius: 22px; }
    .segmented button { flex: 1 1 auto; min-height: 44px; padding: 6px 4px; font-size: 14px; white-space: nowrap; }
    .segmented button.on { color: #075985; }
    .range-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .range-head output { font-weight: 800; font-size: 14px; color: color-mix(in srgb, var(--subject) 85%, black); text-align: right; }
    .range-ends { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); font-weight: 700; margin-top: -6px; }
    input[type=range] { height: 44px; }
    .btn-sm { min-height: 44px; }
    .btn.on-state { background: #0f766e; border-color: #0f766e; color: #fff; box-shadow: 0 3px 0 #0a4f49; }
    .ctrl-note { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
    .game-foot button { min-height: 44px; }
    .mission-figure svg { border-radius: 12px; }
    .note-fig { margin: 6px 0; text-align: center; }
    .note-fig svg { max-width: 100%; height: auto; border-radius: 10px; }
    .cmp { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0; }
    .cmp th, .cmp td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
    .cmp th { background: var(--surface-2); font-weight: 800; }
  </style>
</head>
<body class="sim-page" data-subject="earth">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g2">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중2 · Ⅱ. 지권의 변화</div>
      <h1>암석의 생성과 순환</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-canvas sc-wide"><canvas id="cvWide" aria-label="마그마가 식어 화성암이 되고, 퇴적물이 굳어 퇴적암이 되고, 열과 압력으로 변성암이 되는 과정을 보여 주는 화면"></canvas></div>
        <div class="stage-canvas sc-tall"><canvas id="cvTall" aria-label="마그마가 식어 화성암이 되고, 퇴적물이 굳어 퇴적암이 되고, 열과 압력으로 변성암이 되는 과정을 보여 주는 화면"></canvas></div>
      </section>
    </div>

    <aside class="side-col">
      <section class="card card-pad is-off" id="ctrlCard">
        <!-- 자유 탐색(모든 단계를 마친 뒤): 장면 고르기 -->
        <div class="control is-off" id="cTabs">
          <span class="seg-label">📍 장면 고르기</span>
          <div class="segmented" id="tabSeg" role="group" aria-label="장면 고르기">
            <button type="button" data-sc="igneous">🌋 화성암</button><button type="button" data-sc="sed">🪨 퇴적암</button><button type="button" data-sc="meta">💠 변성암</button><button type="button" data-sc="cycle">♻️ 순환</button>
          </div>
        </div>
        <!-- 1단계: 화성암 -->
        <div class="control is-off" id="cIg" data-scene="igneous">
          <div>
            <span class="seg-label">🌋 마그마의 색</span>
            <div class="segmented" id="magmaSeg" role="group" aria-label="마그마의 색">
              <button type="button" data-m="dark">⚫ 어두운색</button><button type="button" data-m="light">⚪ 밝은색</button>
            </div>
          </div>
          <div>
            <div class="range-head"><span class="seg-label">🌡️ 식는 빠르기</span><output id="coolOut"></output></div>
            <input type="range" id="coolRange" min="0" max="100" value="50" aria-label="식는 빠르기">
            <div class="range-ends"><span>빠르게</span><span>천천히</span></div>
          </div>
          <button class="btn btn-sm btn-primary btn-block" id="coolBtn" type="button">❄️ 식히기</button>
        </div>
        <!-- 2단계: 퇴적암 -->
        <div class="control is-off" id="cSed" data-scene="sed">
          <div>
            <span class="seg-label">⬇️ 퇴적물 쌓기 (눌러서 쏟아요)</span>
            <div class="segmented" id="sedSeg" role="group" aria-label="퇴적물 고르기">
              <button type="button" data-s="gravel">🪨 자갈</button><button type="button" data-s="sand">🏖️ 모래</button><button type="button" data-s="mud">🟤 진흙</button><button type="button" data-s="lime">🐚 석회물질</button>
            </div>
          </div>
          <div>
            <div class="range-head"><span class="seg-label">⏳ 눌리고 굳는 시간</span><output id="pressOut"></output></div>
            <input type="range" id="pressRange" min="0" max="100" value="0" aria-label="눌리고 굳는 시간">
            <div class="range-ends"><span>쌓이는 중</span><span>굳은 암석</span></div>
          </div>
          <button class="btn btn-sm btn-block" id="sedReset" type="button">↺ 퇴적물 비우기</button>
        </div>
        <!-- 3단계: 변성암 -->
        <div class="control is-off" id="cMeta" data-scene="meta">
          <div>
            <span class="seg-label">🪨 처음 암석</span>
            <div class="segmented" id="metaSeg" role="group" aria-label="처음 암석">
              <button type="button" data-r="mud">이암</button><button type="button" data-r="sand">사암</button><button type="button" data-r="lime">석회암</button>
            </div>
          </div>
          <div>
            <div class="range-head"><span class="seg-label">🔥 열과 압력</span><output id="heatOut"></output></div>
            <input type="range" id="heatRange" min="0" max="100" value="0" aria-label="열과 압력">
            <div class="range-ends"><span>약하게</span><span>세게</span></div>
          </div>
          <p class="ctrl-note" id="metaNote">양옆의 화살표를 안쪽으로 끌어도 돼요.</p>
        </div>
        <!-- 4단계: 순환 -->
        <div class="control is-off" id="cCyc" data-scene="cycle">
          <button class="btn btn-sm btn-block" id="extraBtn" type="button" aria-pressed="false">➕ 다른 길도 보기</button>
          <p class="ctrl-note" id="cycNote">암석은 한 가지 길로만 바뀌지 않아요.</p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
