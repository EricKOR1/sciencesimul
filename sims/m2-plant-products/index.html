<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16a34a">
  <title>광합성 산물의 이동과 저장 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥔</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-toolbar { min-height: 61px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #resetBtn { font-size: 20px; }
    .stage-toolbar .segmented button { min-height: 44px; padding: 6px 12px; font-size: 14.5px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    .ctrl-note { font-size: 13.5px; color: var(--muted); margin: 8px 0 0; line-height: 1.45; }
    .btn-block { min-height: 52px; font-size: 17px; }
    .btn-row { display: flex; gap: 8px; }
    .btn-row .btn { flex: 1; min-height: 48px; }
    .opt-seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
    .opt-seg.two { grid-template-columns: 1fr 1fr; }
    .opt-seg.four { grid-template-columns: repeat(4, 1fr); }
    .opt-seg button {
      min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink);
      font-weight: 800; font-size: 15px; cursor: pointer; padding: 6px 6px; line-height: 1.25;
    }
    .opt-seg button small { display: block; font-size: 12px; font-weight: 700; color: var(--muted); }
    .opt-seg button[aria-pressed="true"] { border-color: var(--subject); background: #eaf8ee; color: #0f5a2c; box-shadow: 0 0 0 3px color-mix(in srgb, var(--subject) 18%, transparent); }
    .tgl {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; width: 100%;
      border: 2px solid var(--line); background: var(--surface); color: var(--muted);
      border-radius: 12px; padding: 5px 14px; font-weight: 800; font-size: 15px; cursor: pointer;
    }
    .tgl[aria-pressed="true"] { color: #0f5a2c; border-color: #86d9a0; background: #eaf8ee; }
    .readout .value.word { font-family: var(--font); font-size: 17px; line-height: 1.5; overflow: hidden; text-overflow: ellipsis; }
    .mission-figure svg { border-radius: 12px; max-width: 100%; height: auto; }
    button[disabled].btn { opacity: .55; cursor: not-allowed; }
    .dz { display: grid; grid-template-columns: 1fr auto; gap: 6px 8px; align-items: center; }
    .dz .dz-name { font-weight: 800; font-size: 15px; line-height: 1.2; }
    .dz .dz-name small { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }
    .dz .dz-pair { display: inline-flex; gap: 4px; }
    .dz .dz-pair button {
      min-height: 44px; min-width: 62px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface);
      font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--muted);
    }
    .dz .dz-pair button[data-v="diff"][aria-pressed="true"] { border-color: #f59e0b; background: #fff4de; color: #92400e; }
    .dz .dz-pair button[data-v="same"][aria-pressed="true"] { border-color: #86d9a0; background: #eaf8ee; color: #0f5a2c; }
    .dz-head { font-weight: 800; font-size: 15.5px; margin-bottom: 8px; }
    @media (max-width: 599px) {
      .stage-toolbar { min-height: 0; }
      .stage-toolbar .segmented { width: 100%; }
      .stage-toolbar .segmented button { flex: 1 1 auto; padding: 6px 6px; font-size: 13.5px; }
      .readout .value.word { font-size: 15px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="bio">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g2">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중2 · Ⅴ. 식물과 에너지</div>
      <h1>광합성 산물의 이동과 저장</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🧪 잎에 녹말이 만들어졌을까?</span>
          <span class="spacer"></span>
          <div class="segmented" id="sceneSeg" role="group" aria-label="장면 고르기">
            <button type="button" data-scene="leaf">🧪 녹말</button>
            <button type="button" data-scene="plant" data-feature="plant">🌱 이동</button>
            <button type="button" data-scene="test" data-feature="store">🔬 검출</button>
            <button type="button" data-scene="cards" data-feature="store">🃏 저장</button>
            <button type="button" data-scene="use" data-feature="use">🍽️ 이용</button>
          </div>
          <button class="icon-btn" id="resetBtn" type="button" title="처음 상태로" aria-label="처음 상태로">↺</button>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="잎의 녹말을 아이오딘 용액으로 확인하는 실험, 낮과 밤의 양분 이동 모형, 저장 물질 검출 실험, 저장 기관과 저장 물질 짝짓기, 광합성 산물의 이용 정보 그림"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts" id="readouts">
        <div class="readout"><span class="label" id="rl1">-</span><span class="value word" id="r1">-</span></div>
        <div class="readout"><span class="label" id="rl2">-</span><span class="value word" id="r2">-</span></div>
        <div class="readout"><span class="label" id="rl3">-</span><span class="value word" id="r3">-</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" id="ctlLeaf">
          <button class="btn btn-primary btn-block" id="leafBtn" type="button">☀️ 하루 동안 빛 쬐기</button>
          <p class="ctrl-note" id="leafNote">잎의 부분을 눌러 은박지를 씌우거나 벗겨요. 그다음 하루 동안 빛을 쬐어요.</p>
        </div>
        <div class="control" id="ctlPlant" hidden data-feature="plant">
          <div class="opt-seg two" style="margin:0" role="group" aria-label="낮과 밤">
            <button type="button" id="btnDay" aria-pressed="true">☀️ 낮</button>
            <button type="button" id="btnNight" aria-pressed="false">🌙 밤</button>
          </div>
          <p class="ctrl-note" id="plNote">낮에는 광합성으로 잎에 녹말이 쌓여요. 🌙 밤으로 바꿔 보세요.</p>
        </div>
        <div class="control" id="ctlTest" hidden data-feature="store">
          <div class="opt-seg four" id="sampSeg" role="group" aria-label="검사할 시료">
            <button type="button" data-i="0" aria-pressed="true">🥔<small>감자</small></button>
            <button type="button" data-i="1" aria-pressed="false">🍇<small>포도</small></button>
            <button type="button" data-i="2" aria-pressed="false">🍚<small>쌀</small></button>
            <button type="button" data-i="3" aria-pressed="false">🫘<small>콩</small></button>
          </div>
          <div class="btn-row">
            <button class="btn btn-primary" id="btnIod" type="button">💧 아이오딘</button>
            <button class="btn btn-primary" id="btnBen" type="button">🔥 베네딕트</button>
          </div>
          <p class="ctrl-note" id="testNote">시료를 고르고 시약을 떨어뜨려 색 변화를 관찰해요. (시약병을 눌러도 돼요)</p>
        </div>
        <div class="control" id="ctlCards" hidden data-feature="store">
          <button class="btn btn-block" id="cardsReset" type="button">↺ 카드 다시 놓기</button>
          <p class="ctrl-note">카드를 끌어다 알맞은 칸에 놓아요. (카드를 누른 뒤 칸을 눌러도 돼요)</p>
        </div>
        <div class="control" id="ctlUse" hidden data-feature="use">
          <button class="btn btn-block" id="useReset" type="button">↺ 카드 다시 놓기</button>
          <p class="ctrl-note">필요한 카드만 골라 칸에 놓아요. 쓰지 않는 카드도 있어요.</p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
