<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16a34a">
  <title>생식세포와 다양성 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 58px; }
    .stage-toolbar .segmented { flex-wrap: wrap; }
    .stage-toolbar .segmented button { min-height: 40px; padding: 5px 10px; font-size: 14px; white-space: nowrap; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard [hidden] { display: none !important; }
    .btn-sm { min-height: 44px; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .ctrl-note { margin: 6px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
    .ctrl-note b { color: var(--ink); }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .seg-full { display: flex; width: 100%; }
    .seg-full button { flex: 1 1 0; min-width: 0; min-height: 44px; font-size: 14.5px; }
    .chip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    .chip-grid.three { grid-template-columns: 1fr 1fr 1fr; }
    .chip-grid button { min-height: 44px; padding: 6px 8px; border: 2px solid var(--line); background: #fff; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; color: var(--ink); text-align: center; }
    .chip-grid button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); }
    .chip-grid button.seen:not(.on) { border-color: color-mix(in srgb, var(--subject) 45%, white); }
    .chip-grid button:disabled { opacity: .45; cursor: not-allowed; }
    .chip-grid button:active { transform: scale(.98); }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .num-in { width: 100%; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 16px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: #fff; text-align: right; }
    .num-in:focus { outline: none; border-color: var(--subject); }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .in-unit { font-size: 12.5px; color: var(--muted); font-weight: 700; }
    .in-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; align-items: end; margin-top: 8px; }
    .in-row .lab { font-weight: 800; font-size: 13.5px; margin-bottom: 3px; line-height: 1.25; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    .pk-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .pk-item { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; color: var(--ink); }
    .pk-item:disabled { opacity: .35; cursor: default; }
    .pk-seq { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 46px; border: 2px dashed var(--line); border-radius: 12px; padding: 6px; }
    .pk-chip { min-height: 34px; padding: 3px 10px; border: 2px solid var(--subject); background: color-mix(in srgb, var(--subject) 12%, white); border-radius: 999px; font-weight: 800; font-size: 13.5px; cursor: pointer; color: var(--ink); }
    .pk-chip b { color: var(--subject); margin-right: 2px; }
    .pk-reset { margin-top: 8px; width: 100%; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 6px; }
    .tbl th, .tbl td { border: 1px solid var(--line); padding: 4px 4px; text-align: center; }
    .tbl th { background: var(--surface-2); font-weight: 800; }
    .tbl td.rowh { font-weight: 800; text-align: left; background: var(--surface-2); }
    .tbl select { width: 100%; min-height: 40px; border: 2px solid var(--line); border-radius: 8px; font: 800 13.5px var(--font); background: #fff; color: var(--ink); }
    .tbl select.ok { border-color: var(--good); background: var(--good-soft); }
    .tbl select.bad { border-color: var(--bad); background: var(--bad-soft); }
    .check-list { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; font-weight: 700; }
    .check-list li { display: flex; gap: 6px; align-items: baseline; }
    .check-list li.on { color: var(--good); }
    .btn-col { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    #modeSeg button.lv-off { display: none; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (max-width: 599px) {
      .readout .value { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar .segmented button { padding: 5px 8px; font-size: 13.5px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }

    .tok { min-height: 44px; padding: 4px 8px; border: 2px solid var(--line); background: #fff; border-radius: 12px; font-weight: 800; font-size: 13px; cursor: pointer; color: var(--ink); text-align: left; line-height: 1.2; }
    .tok.bad { border-style: dashed; color: #b91c1c; }
    .tok:active { transform: scale(.98); }
    .tok-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
    .tl-sel { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 6px; }
    .tl-sel button { min-height: 44px; border: 2px solid var(--line); background: #fff; border-radius: 12px; font-weight: 800; font-size: 13.5px; cursor: pointer; color: var(--ink); }
    .tl-sel button:disabled { opacity: .35; cursor: default; }
    .tl-list { display: grid; gap: 4px; margin-top: 6px; }
    .tl-row { display: grid; grid-template-columns: 1fr 36px 36px 36px; gap: 4px; align-items: center; }
    .tl-row button { min-height: 40px; border: 2px solid var(--line); background: #fff; border-radius: 10px; font-weight: 800; cursor: pointer; color: var(--ink); font-size: 13px; padding: 0 4px; }
    .tl-row button:disabled { opacity: .35; }
    .tl-row .tl-name { text-align: left; padding: 0 8px; }
    .tl-row.on .tl-name { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 12%, white); }
    .tl-row.bad .tl-name { border-color: #dc2626; color: #b91c1c; }
    .tl-row .tl-name b { color: var(--subject); margin-right: 2px; }
    .chk-two { grid-template-columns: 1fr; }
    .toggle-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-weight: 800; font-size: 13.5px; }
    .toggle-row label { display: flex; align-items: center; gap: 6px; min-height: 40px; cursor: pointer; }
    .toggle-row input { width: 22px; height: 22px; accent-color: var(--subject); }
    </style>
</head>
<body class="sim-page" data-subject="bio">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hb">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">생명과학 · Ⅲ. 생명의 연속성과 다양성</div>
      <h1>생식세포와 다양성</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🎲 감수 분열로 만들어지는 염색체 조합</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기">
            <button type="button" data-mode="combo" data-lv="1" data-feature="combo">🎲 조합 모으기</button>
            <button type="button" data-mode="log" data-lv="1" data-feature="log">📈 2ⁿ 그래프</button>
            <button type="button" data-mode="cross" data-lv="2" data-feature="cross">✂️ 교차</button>
            <button type="button" data-mode="cont" data-lv="3" data-feature="cont">🔗 연속성</button>
            <button type="button" data-mode="studio" data-lv="4" data-feature="studio">🛠️ 스튜디오</button>
            <button type="button" data-mode="gallery" data-lv="4" data-feature="gallery">🖼️ 갤러리</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="감수 분열 모형으로 모으는 생식세포 염색체 조합 표와 2의 n제곱 로그 막대그래프, 교차 모형, 수정과 세대별 염색체 수 그래프, 생식세포 형성 모델 스튜디오와 갤러리"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="combo">
          <div class="control-head"><span>🎲 감수 분열 실험</span><output id="oRuns">0번</output></div>
          <div class="btn-col">
            <button class="btn btn-sm btn-primary" id="bRun" type="button">🎲 감수 분열 실행!</button>
            <button class="btn btn-sm" id="bRun10" type="button">⏩ 10번 한꺼번에 실행</button>
            <button class="btn btn-sm" id="bClr" type="button">↺ 표 지우기</button>
          </div>
          <p class="ctrl-note" id="cbNote"></p>
        </div>
        <div class="control" data-modes="log">
          <div class="control-head"><label for="sN">📈 염색체 쌍의 수</label><output id="oN">n = 3</output></div>
          <div class="range-row"><input type="range" id="sN" min="1" max="23" step="1" value="3" aria-label="염색체 쌍의 수 n (1에서 23)"></div>
        </div>
        <div class="control" data-modes="log">
          <div class="control-head"><label for="calcIn">🧮 2²³ ≈ □ × 10⁶ 가지</label><span class="in-unit">□ =</span></div>
          <input class="num-in" id="calcIn" type="text" inputmode="decimal" maxlength="5" aria-label="2의 23제곱을 10의 6제곱으로 나눈 값">
          <p class="ctrl-note" id="calcNote"></p>
        </div>
        <div class="control" data-modes="cross">
          <div class="control-head"><span>✂️ 교차 실험</span></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bGam" type="button">▶ 생식세포 만들기</button><button class="btn btn-sm" id="bCrReset" type="button">↺ 되돌리기</button></div>
          <p class="ctrl-note" id="crNote"></p>
        </div>
        <div class="control" data-modes="cont">
          <div class="control-head"><span>🔗 생식세포를 만드는 방법</span></div>
          <div class="segmented seg-full" id="cmSeg" role="group" aria-label="생식세포를 만드는 방법"><button type="button" data-h="0">감수 분열 (실제)</button><button type="button" data-h="1">체세포분열 (가정)</button></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bFert" type="button">▶ 수정시키기</button></div>
          <p class="ctrl-note" id="ctNote"></p>
        </div>
        <div class="control" data-modes="cont" id="predWrap" hidden>
          <div class="control-head"><span>✏️ 가정일 때 염색체 수 예측</span></div>
          <div class="in-row" style="grid-template-columns:1fr 1fr 1fr">
            <div><div class="lab"><label for="pd1">1세대</label></div><input class="num-in" id="pd1" type="text" inputmode="numeric" maxlength="4" aria-label="1세대 염색체 수"></div>
            <div><div class="lab"><label for="pd2">2세대</label></div><input class="num-in" id="pd2" type="text" inputmode="numeric" maxlength="4" aria-label="2세대 염색체 수"></div>
            <div><div class="lab"><label for="pd3">3세대</label></div><input class="num-in" id="pd3" type="text" inputmode="numeric" maxlength="4" aria-label="3세대 염색체 수"></div>
          </div>
        </div>
        <div class="control" data-modes="studio">
          <div class="control-head"><span>🧰 장면 도구 (눌러서 넣기)</span></div>
          <div class="tok-grid" id="tokGrid"></div>
          <div class="control-head" style="margin-top:12px"><span id="tlTitle">🎞️ 아래 장면을 눌러 고르면 옮길 수 있어요</span></div>
          <div class="tl-sel"><button type="button" id="tlUp">◀ 앞으로</button><button type="button" id="tlDn">뒤로 ▶</button><button type="button" id="tlRm">✕ 지우기</button></div>
          <div class="control-head" style="margin-top:12px"><span>🎨 색상표 · 이름표</span></div>
          <div class="segmented seg-full" id="palSeg" role="group" aria-label="색상표"><button type="button" data-p="0">파랑·빨강</button><button type="button" data-p="1">초록·주황</button><button type="button" data-p="2">보라·노랑</button></div>
          <div class="segmented seg-full" id="stStyle" role="group" aria-label="이름표 방식" style="margin-top:6px"><button type="button" data-s="name">이름으로 표기</button><button type="button" data-s="num">번호로 표기</button></div>
          <div class="toggle-row"><label><input type="checkbox" id="tgTag" checked> 단계 이름표</label><label><input type="checkbox" id="tgN" checked> 염색체 수 표시 (n, 2n)</label></div>
          <p class="ctrl-note" id="stNote"></p>
          <div class="btn-row"><button class="btn btn-sm" id="bPlay" type="button">▶ 재생</button><button class="btn btn-sm btn-primary" id="bPost" type="button">📤 갤러리에 올리기</button></div>
        </div>
        <div class="control" data-modes="gallery" id="galWrap" hidden>
          <div class="control-head"><span>🔎 빠진 필수 요소 찾기</span></div>
          <div class="in-row" style="grid-template-columns:1fr">
            <div><div class="lab"><label for="galB">모둠 B에서 빠진 것</label></div><select class="sel-in" id="galB" aria-label="모둠 B에서 빠진 요소"><option value="">고르기</option><option value="rep">복제</option><option value="syn">2가 염색체 형성</option><option value="crs">교차</option><option value="sp1">상동 염색체 분리</option><option value="sp2">염색 분체 분리</option><option value="gam">생식세포 4개</option><option value="fer">수정 (2n 회복)</option></select></div>
            <div><div class="lab"><label for="galC">모둠 C에서 빠진 것</label></div><select class="sel-in" id="galC" aria-label="모둠 C에서 빠진 요소"><option value="">고르기</option><option value="rep">복제</option><option value="syn">2가 염색체 형성</option><option value="crs">교차</option><option value="sp1">상동 염색체 분리</option><option value="sp2">염색 분체 분리</option><option value="gam">생식세포 4개</option><option value="fer">수정 (2n 회복)</option></select></div>
          </div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
