<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>전동기와 스피커 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .seg-wrap { display: flex; flex-wrap: wrap; width: 100%; }
    .seg-wrap button { flex: 1 1 30%; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hp">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">물리학 · Ⅱ. 전기와 자기</div>
      <h1>전동기와 스피커</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">⚡ 힘의 요인</span>
          <span class="spacer"></span>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="자기장 속 도선이 받는 힘 측정, 전동기의 코일과 정류자, 스피커 단면과 신호 파형, 스피커 설계와 주파수 응답 곡선"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" id="viewCtl" hidden>
          <div class="control-head"><span>🔀 화면 고르기</span></div>
          <div class="segmented seg-wrap" id="viewSeg" role="group" aria-label="화면 고르기"></div>
        </div>
        <!-- ① 힘의 요인 -->
        <div class="control" data-modes="force">
          <div class="control-head"><label for="sCur">⚡ 전류 I</label><output id="oCur">2.0 A</output></div>
          <div class="range-row"><input type="range" id="sCur" min="0" max="4" step="0.5" value="2" aria-label="전류 (0부터 4 암페어)"></div>
          <div class="segmented view-seg" id="dirSeg" role="group" aria-label="전류 방향" style="margin-top:6px">
            <button type="button" data-v="1">↑ 위로</button>
            <button type="button" data-v="-1">↓ 아래로</button>
          </div>
        </div>
        <div class="control" data-modes="force">
          <div class="control-head"><span>🧲 자기장 B</span></div>
          <div class="segmented view-seg" id="bSeg" role="group" aria-label="자기장의 세기">
            <button type="button" data-v="0.2">약 0.20 T</button>
            <button type="button" data-v="0.4">중 0.40 T</button>
            <button type="button" data-v="0.6">강 0.60 T</button>
          </div>
        </div>
        <div class="control" data-modes="force">
          <div class="control-head"><span>📏 자기장 속 도선 길이 L</span></div>
          <div class="segmented view-seg" id="lSeg" role="group" aria-label="자기장 속 도선 길이">
            <button type="button" data-v="0.1">0.10 m</button>
            <button type="button" data-v="0.25">0.25 m</button>
            <button type="button" data-v="0.4">0.40 m</button>
          </div>
          <div class="btn-row">
            <button class="btn btn-sm btn-primary" id="bRec" type="button">📏 기록하기</button>
            <button class="btn btn-sm" id="bRecClear" type="button">🗑 지우기</button>
          </div>
        </div>
        <div class="control" data-modes="force" data-need="pred">
          <div class="control-head"><label for="inF">✍️ 예측한 힘 F (N)</label></div>
          <input class="sel-in" id="inF" type="number" step="0.01" min="0" inputmode="decimal" placeholder="예: 0.30" aria-label="예측한 힘 (뉴턴)">
        </div>
        <!-- ② 전동기 -->
        <div class="control" data-modes="motor">
          <div class="control-head"><span>🔌 전원 (24 V)</span></div>
          <div class="segmented view-seg" id="pwSeg" role="group" aria-label="전원">
            <button type="button" data-v="1">켜기</button>
            <button type="button" data-v="0">끄기</button>
          </div>
        </div>
        <div class="control" data-modes="motor">
          <div class="control-head"><label for="sLoad">⚖️ 부하 토크</label><output id="oLoad">1.0 N·m</output></div>
          <div class="range-row"><input type="range" id="sLoad" min="0.5" max="7.5" step="0.5" value="1" aria-label="부하 토크 (0.5부터 7.5 뉴턴미터)"></div>
          <div class="btn-row"><button class="btn btn-sm" id="bStall" type="button">🛑 회전 막기</button></div>
        </div>
        <div class="control" data-modes="motor" data-need="eta">
          <div class="control-head"><label for="inEta">✍️ 전동기의 효율 (%)</label></div>
          <input class="sel-in" id="inEta" type="number" step="1" min="0" max="100" inputmode="numeric" placeholder="예: 75" aria-label="효율 (퍼센트)">
        </div>
        <!-- ③ 스피커 -->
        <div class="control" data-modes="speaker">
          <div class="control-head"><span>🎙️ 신호 전류</span></div>
          <div class="segmented view-seg" id="kindSeg" role="group" aria-label="신호 종류">
            <button type="button" data-v="ac">교류 (소리 신호)</button>
            <button type="button" data-v="dc">직류</button>
          </div>
        </div>
        <div class="control" data-modes="speaker">
          <div class="control-head"><label for="sAmp">📈 신호의 진폭 (소리 크기)</label><output id="oAmp">0.05 A</output></div>
          <div class="range-row"><input type="range" id="sAmp" min="0" max="0.2" step="0.01" value="0.05" aria-label="신호 전류의 진폭 (0부터 0.20 암페어)"></div>
        </div>
        <div class="control" data-modes="speaker" id="freqCtl">
          <div class="control-head"><label for="sFrq">🎵 진동수 (음의 높이)</label><output id="oFrq">400 Hz</output></div>
          <div class="range-row"><input type="range" id="sFrq" min="200" max="2000" step="100" value="400" aria-label="신호의 진동수 (200부터 2000 헤르츠)"></div>
          <div class="btn-row"><button class="btn btn-sm" id="bTone" type="button">🔊 0.6초 들어 보기</button></div>
        </div>
        <!-- ④ 설계 -->
        <div class="control" data-modes="design">
          <div class="control-head"><label for="sTurn">🌀 코일 감은 수 N</label><output id="oTurn">40회</output></div>
          <div class="range-row"><input type="range" id="sTurn" min="20" max="100" step="10" value="40" aria-label="코일 감은 수 (20부터 100회)"></div>
          <div class="segmented view-seg" id="wireSeg" role="group" aria-label="코일 선 굵기" style="margin-top:6px">
            <button type="button" data-v="thin">얇은 선</button>
            <button type="button" data-v="thick">굵은 선</button>
          </div>
        </div>
        <div class="control" data-modes="design">
          <div class="control-head"><span>🧲 자석 세기</span></div>
          <div class="segmented view-seg" id="magSeg" role="group" aria-label="자석 세기">
            <button type="button" data-v="0.2">약 0.20 T</button>
            <button type="button" data-v="0.4">보통 0.40 T</button>
            <button type="button" data-v="0.6">강 0.60 T</button>
          </div>
        </div>
        <div class="control" data-modes="design">
          <div class="control-head"><span>🥤 진동판</span></div>
          <div class="segmented view-seg" id="cupSeg" role="group" aria-label="진동판 크기">
            <button type="button" data-v="small">작은 컵</button>
            <button type="button" data-v="large">큰 컵</button>
          </div>
          <div class="segmented view-seg" id="matSeg" role="group" aria-label="진동판 재질" style="margin-top:6px">
            <button type="button" data-v="thin">얇은 종이</button>
            <button type="button" data-v="thick">두꺼운 판지</button>
          </div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bTest" type="button">🔊 시험하기</button></div>
        </div>
        <div class="control" data-modes="design" data-need="why">
          <div class="control-head"><span>🛠️ 설계 근거 고르기</span></div>
          <div id="whyRows"></div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
  <script src="../../assets/js/sim3d.js"></script>
  <script src="v3d.js"></script>
</body>
</html>
