<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>탄성파의 진행 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
<style>
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--phy); color: #fff; }
    #modeSeg { width: 100%; flex-wrap: wrap; }
    #modeSeg button { flex: 1 1 auto; min-width: 0; padding-left: 8px; padding-right: 8px; font-size: 14.5px; }
    #modeSeg button[hidden] { display: none !important; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; line-height: 1.4; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .seg-wrap { border-radius: 20px; display: flex; flex-wrap: wrap; width: 100%; }
    .seg-wrap button { flex: 1 1 auto; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .num-in { width: 100%; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 16px var(--font); color: var(--ink); background: #fff; }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .in-grid { display: grid; grid-template-columns: 96px 1fr; gap: 6px 8px; align-items: center; margin-top: 6px; }
    .in-grid .lab { font-weight: 800; font-size: 14px; line-height: 1.25; }
    .in-grid .sel-in { min-height: 44px; padding: 2px 6px; font-size: 14px; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); font-family: inherit; }
    .chips button.on { border-color: var(--phy); background: color-mix(in srgb, var(--phy) 14%, white); color: #9a3412; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini, table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td, table.mini th, table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th, table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer { display: none; }
      #modeSeg button { font-size: 13.5px; padding-left: 6px; padding-right: 6px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hm">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">역학과 에너지 · Ⅲ. 탄성파와 소리</div>
      <h1>탄성파의 진행</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기">
            <button type="button" data-mode="model">🧩 연결 모형</button>
            <button type="button" data-mode="lt">↕↔ 종파·횡파</button>
            <button type="button" data-mode="fl">〰 v = fλ</button>
            <button type="button" data-mode="sp">🧵 줄 파동</button>
            <button type="button" data-mode="snd">🔊 소리의 속력</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="질량과 용수철이 이어진 사슬과 줄에서 탄성파가 진행하는 모습을 보고, 종파와 횡파, 진동수와 파장과 속력의 관계, 줄의 장력과 굵기와 소리의 속력을 알아보는 화면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <!-- ① 연결 모형 -->
        <div class="control" data-modes="model">
          <div class="control-head"><label for="sK">🔩 용수철 상수 k</label><output id="oK">25 N/m</output></div>
          <div class="range-row"><input type="range" id="sK" min="0" max="3" step="1" value="1" aria-label="용수철 상수 (12.5, 25, 50, 100 뉴턴 매 미터)"></div>
          <div class="control-head"><label for="sMm">⚖️ 질량 m</label><output id="oMm">0.040 kg</output></div>
          <div class="range-row"><input type="range" id="sMm" min="0" max="3" step="1" value="1" aria-label="질량 (0.02, 0.04, 0.08, 0.16 킬로그램)"></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bPulse1" type="button">👆 펄스 보내기</button><button class="btn btn-sm" id="bWave1" type="button">〰 계속 흔들기</button></div>
          <div class="btn-row"><button class="btn btn-sm slow-btn" type="button">🐢 느리게 보기</button></div>
          <p class="ctrl-note" id="nModel"></p>
        </div>
        <!-- ② 종파·횡파 -->
        <div class="control" data-modes="lt">
          <div class="control-head"><span>🌊 파동의 종류</span></div>
          <div class="segmented seg-wrap" id="dirSeg" role="group" aria-label="파동의 종류">
            <button type="button" data-d="T">↕ 횡파 (위아래로)</button><button type="button" data-d="L">↔ 종파 (앞뒤로)</button></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bPulse2" type="button">👆 한 번 흔들기</button></div>
          <div class="btn-row"><button class="btn btn-sm slow-btn" type="button">🐢 느리게 보기</button></div>
          <p class="ctrl-note" id="nLt"></p>
        </div>
        <div class="control" data-modes="lt" data-calc="speeds">
          <div class="control-head"><span>📝 속력 계산 (m/s)</span></div>
          <div class="in-grid">
            <span class="lab">횡파 속력</span><input class="num-in" id="iVT" type="number" inputmode="decimal" step="any" aria-label="횡파의 속력 (미터 매 초)">
            <span class="lab">종파 속력</span><input class="num-in" id="iVL" type="number" inputmode="decimal" step="any" aria-label="종파의 속력 (미터 매 초)">
          </div>
        </div>
        <!-- ③ v = fλ -->
        <div class="control" data-modes="fl">
          <div class="control-head"><label for="sF">🎚️ 진동수 f</label><output id="oF">2.0 Hz</output></div>
          <div class="range-row"><input type="range" id="sF" min="0" max="4" step="1" value="2" aria-label="진동수 (1.0헤르츠부터 3.0헤르츠까지)"></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bRecF" type="button">📍 기록하기</button><button class="btn btn-sm" id="bClrF" type="button">🗑 지우기</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="bPause" type="button">⏸ 멈추고 읽기</button></div>
          <p class="ctrl-note" id="nFl"></p>
        </div>
        <div class="control" data-modes="fl" data-calc="read">
          <div class="control-head"><span>📝 f = 2.0 Hz인 파</span></div>
          <div class="in-grid">
            <span class="lab">파장 λ (m)</span><input class="num-in" id="iLam" type="number" inputmode="decimal" step="any" aria-label="그래프에서 읽은 파장 (미터)">
            <span class="lab">주기 T (s)</span><input class="num-in" id="iTp" type="number" inputmode="decimal" step="any" aria-label="그래프에서 읽은 주기 (초)">
            <span class="lab">속력 v (m/s)</span><input class="num-in" id="iVv" type="number" inputmode="decimal" step="any" aria-label="계산한 속력 (미터 매 초)">
          </div>
        </div>
        <!-- ④ 속력 요인 -->
        <div class="control" data-modes="sp">
          <div class="control-head"><label for="sT">💪 장력 T</label><output id="oT">10 N</output></div>
          <div class="range-row"><input type="range" id="sT" min="0" max="3" step="1" value="0" aria-label="줄의 장력 (10, 20, 30, 40 뉴턴)"></div>
          <div class="control-head"><label for="sMu">🧶 줄의 굵기 μ</label><output id="oMu">0.1 kg/m</output></div>
          <div class="range-row"><input type="range" id="sMu" min="0" max="3" step="1" value="0" aria-label="단위 길이당 질량 (0.1, 0.2, 0.3, 0.4 킬로그램 매 미터)"></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bPulse4" type="button">🔔 펄스 보내고 시간 재기</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="bClr4" type="button">🗑 표 지우기</button><button class="btn btn-sm slow-btn" type="button">🐢 느리게 보기</button></div>
          <p class="ctrl-note" id="nSp"></p>
        </div>
        <div class="control" data-modes="sp" data-calc="pred">
          <div class="control-head"><span>📝 T = 40 N일 때 속력 예측</span></div>
          <input class="num-in" id="iPr" type="number" inputmode="decimal" step="any" aria-label="장력 40뉴턴일 때 예측한 속력 (미터 매 초)">
          <p class="ctrl-note">μ = 0.1 kg/m인 같은 줄이에요. 측정하지 않고 예측해 보세요.</p>
        </div>
        <div class="control" data-modes="snd">
          <div class="control-head"><label for="sTemp">🌡️ 기온</label><output id="oTemp">15 °C</output></div>
          <div class="range-row"><input type="range" id="sTemp" min="0" max="7" step="1" value="3" aria-label="기온 (0도부터 35도까지)"></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bRace" type="button">🏁 출발</button></div>
          <p class="ctrl-note" id="nSnd"></p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
