<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16a34a">
  <title>식물의 분류군 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 58px; }
    .stage-toolbar .segmented { flex-wrap: wrap; }
    .stage-toolbar .segmented button { min-height: 40px; padding: 5px 10px; font-size: 14px; white-space: nowrap; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard [hidden] { display: none !important; }
    .btn-sm { min-height: 44px; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .ctrl-note { margin: 6px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
    .ctrl-note b { color: var(--ink); }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .seg-full { display: flex; width: 100%; }
    .seg-full button { flex: 1 1 0; min-width: 0; min-height: 44px; font-size: 14.5px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 14px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); }
    .chip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    .chip-grid button { min-height: 44px; padding: 6px 8px; border: 2px solid var(--line); background: #fff; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; color: var(--ink); text-align: center; }
    .chip-grid button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); }
    .chip-grid button:active, .chips button:active { transform: scale(.98); }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row:first-of-type { margin-top: 4px; }
    .sel-row .q { font-weight: 800; font-size: 13.5px; margin-bottom: 3px; line-height: 1.25; }
    .num-in { width: 100%; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 16px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: #fff; text-align: right; }
    .num-in:focus { outline: none; border-color: var(--subject); }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .in-grid { display: grid; gap: 6px 8px; align-items: center; margin-top: 6px; }
    .in-grid .lab { font-weight: 800; font-size: 13.5px; line-height: 1.25; }
    .in-grid .hd { font-weight: 800; font-size: 12.5px; color: var(--muted); text-align: center; }
    .in-unit { font-size: 12.5px; color: var(--muted); font-weight: 700; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (max-width: 599px) {
      .readout .value { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar .segmented button { padding: 5px 8px; font-size: 13.5px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
    #modeSeg button.lv-off { display: none; }
    .num-in.sm { padding: 4px 6px; font-size: 15px; min-width: 0; }
    .btn.done { background: var(--good-soft); border-color: var(--good); color: #0b6b39; }

  
    .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    .tool-grid button, .tool-row button { min-height: 44px; padding: 6px 8px; border: 2px solid var(--line); background: #fff; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; color: var(--ink); text-align: center; line-height: 1.2; }
    .tool-grid button.on, .tool-row button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); }
    .tool-grid button.ok, .tool-row button.ok { border-color: var(--good); background: var(--good-soft); }
    .tool-grid button.bad, .tool-row button.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .tool-grid button:disabled, .tool-row button:disabled { opacity: .45; cursor: default; }
    .tool-grid button:active, .tool-row button:active { transform: scale(.98); }
    .tool-row { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .tool-row button { flex: 1 1 0; min-width: 0; }
    .sub-h { font-weight: 800; font-size: 14px; margin: 10px 0 2px; }
    .sub-h:first-child { margin-top: 0; }
    .seq-list { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .seq-list li { display: flex; align-items: center; gap: 6px; }
    .seq-list li .nm { flex: 1; font-weight: 800; font-size: 14px; border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; background: #fff; min-height: 44px; display: flex; align-items: center; }
    .seq-list li button { width: 44px; min-height: 44px; border: 2px solid var(--line); background: #fff; border-radius: 12px; font-weight: 800; cursor: pointer; }

    #modeSeg button.lv-off { display: none; }
    #bYes:not(:disabled) { border-color: #16a34a; background: #dcfce7; }
    #bNo:not(:disabled) { border-color: #dc2626; background: #fee2e2; }

  </style>
</head>
<body class="sim-page" data-subject="bio">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hb">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">생명과학 · Ⅲ. 생명의 연속성과 다양성</div>
      <h1>식물의 분류군</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🌿 가상 정원: 식물 관찰</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기">
            <button type="button" data-mode="garden" data-lv="1" data-feature="garden">🌿 정원 관찰</button>
            <button type="button" data-mode="key" data-lv="2" data-feature="key">🔑 검색표</button>
            <button type="button" data-mode="korder" data-lv="2" data-feature="korder">🔀 질문 순서</button>
            <button type="button" data-mode="tbl" data-lv="3" data-feature="tbl">📋 문 비교표</button>
            <button type="button" data-mode="sec" data-lv="3" data-feature="sec">🔬 단면 비교</button>
            <button type="button" data-mode="book" data-lv="4" data-feature="book">📖 도감 쓰기</button>
            <button type="button" data-mode="group" data-lv="4" data-feature="group">👥 모둠 도감</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="가상 정원 식물 8종 관찰과 형질 체크리스트, 이분 검색표, 4개 문의 비교표와 겉씨 속씨 단면, 식물도감 카드와 모둠 도감 화면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="garden">
          <div class="control-head"><span id="gdName">🌿 식물</span></div>
          <div data-feature="chk">
            <div class="sub-h">관다발</div><div class="segmented seg-full" data-trait="0" role="group" aria-label="관다발 있음 없음"><button type="button" data-v="1">있음</button><button type="button" data-v="0">없음</button></div>
            <div class="sub-h">종자</div><div class="segmented seg-full" data-trait="1" role="group" aria-label="종자 있음 없음"><button type="button" data-v="1">있음</button><button type="button" data-v="0">없음</button></div>
            <div class="sub-h">씨방</div><div class="segmented seg-full" data-trait="2" role="group" aria-label="씨방 있음 없음"><button type="button" data-v="1">있음</button><button type="button" data-v="0">없음</button></div>
          </div>
          <p class="ctrl-note" id="gdNote"></p>
        </div>
        <div class="control" data-modes="key">
          <div class="control-head"><span>🔑 질문에 답하기</span></div>
          <div class="tool-row"><button type="button" id="bYes">예 (있어요)</button><button type="button" id="bNo">아니오 (없어요)</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="bKeyReset" type="button">↺ 처음부터</button></div>
          <p class="ctrl-note" id="keyNote"></p>
        </div>
        <div class="control" data-modes="korder">
          <div class="control-head"><span>🔀 검색표 고르기</span></div>
          <div class="tool-grid" id="koGrid">
            <button type="button" data-o="0">A 관다발 → 종자 → 씨방</button>
            <button type="button" data-o="1">B 종자 → 관다발 / 씨방</button>
            <button type="button" data-o="2">C 씨방 → 종자 → 관다발</button>
            <button type="button" data-o="3">D 키가 30 cm보다 큰가요?</button>
          </div>
          <p class="ctrl-note" id="koNote"></p>
        </div>
        <div class="control" data-modes="tbl sec">
          <div class="control-head"><span>📋 문 비교표</span></div>
          <p class="ctrl-note" id="tblNote"></p>
          <div class="btn-row"><button class="btn btn-sm" id="bTblClear" type="button">↺ 표 지우기</button></div>
          <div data-modes="sec">
            <div class="control-head" style="margin-top:12px"><span>⏱ 꽃가루받이 이후</span><output id="oSec">꽃가루받이 전</output></div>
            <div class="range-row"><input type="range" id="sSec" min="0" max="100" step="1" value="0" aria-label="꽃가루받이 이후 시간"></div>
          </div>
        </div>
        <div class="control" data-modes="book">
          <div class="control-head"><span id="bkName">📖 도감 카드</span></div>
          <div class="btn-row" style="margin-top:0"><button class="btn btn-sm" id="bPrev" type="button">◀ 이전</button><button class="btn btn-sm" id="bNext" type="button">다음 ▶</button></div>
          <div class="sub-h">서식지</div><select class="sel-in" id="selHab" aria-label="서식지 고르기"></select>
          <div class="sub-h">소속 문</div><select class="sel-in" id="selPh" aria-label="소속 문 고르기"></select>
          <div class="sub-h">근거 형질 (2개)</div><div class="chip-grid" id="evGrid"></div>
          <div class="btn-row"><button class="btn btn-primary btn-sm" id="bSave" type="button">📖 도감에 저장</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="bGal" type="button" hidden>📚 도감 모아 보기 / 카드 보기</button></div>
          <p class="ctrl-note" id="bkNote"></p>
        </div>
        <div class="control" data-modes="group">
          <div class="control-head"><span>👥 카드의 문 옮기기</span></div>
          <div class="sub-h" id="grpName">카드를 먼저 눌러요</div>
          <select class="sel-in" id="grpSel" aria-label="카드의 문 고르기" disabled></select>
          <p class="ctrl-note" id="grpNote"></p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
