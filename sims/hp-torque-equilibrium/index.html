<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>돌림힘과 평형 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--phy); color: #fff; }
    #modeSeg { width: 100%; }
    #modeSeg button { flex: 1 1 auto; min-width: 0; padding-left: 8px; padding-right: 8px; font-size: 14.5px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .num-in { width: 100%; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 16px var(--font); color: var(--ink); background: #fff; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer { display: none; }
      #modeSeg button { font-size: 13.5px; padding-left: 6px; padding-right: 6px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hp">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">물리학 · Ⅰ. 힘과 에너지</div>
      <h1>돌림힘과 평형</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기">
            <button type="button" data-mode="spanner" data-feature="spanner">🔧 스패너</button>
            <button type="button" data-mode="seesaw" data-feature="seesaw">⚖️ 시소</button>
            <button type="button" data-mode="couple" data-feature="couple">🌀 우력</button>
            <button type="button" data-mode="plank" data-feature="plank">🌉 널빤지</button>
            <button type="button" data-mode="tilt" data-feature="tilt">📦 기울기</button>
            <button type="button" data-mode="crane" data-feature="crane">🏗️ 크레인</button>
            <button type="button" data-mode="load" data-feature="load">📚 책장</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="스패너와 시소, 우력, 널빤지 다리, 직육면체 기울기, 크레인, 책장을 보여 주는 돌림힘 실험 화면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">힘 F</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">수직 거리 ℓ</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">돌림힘 τ</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <!-- ① 스패너 -->
        <div class="control" data-modes="spanner">
          <div class="control-head"><label for="sF">💪 힘의 크기 F</label><output id="oF">50 N</output></div>
          <div class="range-row"><input type="range" id="sF" min="10" max="100" step="10" value="50" aria-label="힘의 크기 (10뉴턴부터 100뉴턴까지)"></div>
        </div>
        <div class="control" data-modes="spanner">
          <div class="control-head"><span>📍 손으로 미는 위치 r (볼트 중심에서)</span></div>
          <div class="segmented view-seg" id="rSeg" role="group" aria-label="미는 위치">
            <button type="button" data-r="0.1">0.1 m</button>
            <button type="button" data-r="0.2">0.2 m</button>
            <button type="button" data-r="0.3">0.3 m</button>
            <button type="button" data-r="0.4">0.4 m</button>
          </div>
        </div>
        <div class="control" data-modes="spanner">
          <div class="control-head"><span>🧭 힘의 방향 (손잡이와 이루는 각)</span></div>
          <div class="segmented view-seg" id="thSeg" role="group" aria-label="힘의 방향">
            <button type="button" data-th="90">수직 90°</button>
            <button type="button" data-th="30">비스듬 30°</button>
            <button type="button" data-th="0">나란히 0°</button>
          </div>
          <div class="btn-row">
            <button class="btn btn-sm btn-primary" id="bSpRun" type="button">🔧 돌려 보기</button>
          </div>
        </div>
        <!-- ② 시소 -->
        <div class="control" data-modes="seesaw">
          <div class="control-head"><span>⬅️ 왼쪽 추 질량</span></div>
          <div class="segmented view-seg" id="mASeg" role="group" aria-label="왼쪽 추 질량">
            <button type="button" data-m="15">15 kg</button>
            <button type="button" data-m="30">30 kg</button>
            <button type="button" data-m="45">45 kg</button>
            <button type="button" data-m="60">60 kg</button>
          </div>
        </div>
        <div class="control" data-modes="seesaw">
          <div class="control-head"><span>➡️ 오른쪽 추 질량</span></div>
          <div class="segmented view-seg" id="mBSeg" role="group" aria-label="오른쪽 추 질량">
            <button type="button" data-m="15">15 kg</button>
            <button type="button" data-m="30">30 kg</button>
            <button type="button" data-m="45">45 kg</button>
            <button type="button" data-m="60">60 kg</button>
          </div>
          <div class="btn-row">
            <button class="btn btn-sm" id="bSsReset" type="button">↺ 처음 배치</button>
          </div>
          <p class="ctrl-note">추를 손가락으로 끌면 눈금(거리)을 바꿀 수 있어요.</p>
        </div>
        <div class="control" data-modes="seesaw" data-rule>
          <div class="control-head"><span>📝 규칙 문장 완성하기</span></div>
          <div id="ruleRows"></div>
        </div>
        <!-- ③ 우력 -->
        <div class="control" data-modes="couple">
          <div class="control-head"><label for="sFL">⬅️ 왼쪽 끝의 힘 (위쪽 +)</label><output id="oFL">0 N</output></div>
          <div class="range-row"><input type="range" id="sFL" min="-20" max="20" step="10" value="0" aria-label="왼쪽 끝에 작용하는 힘 (아래쪽 20뉴턴부터 위쪽 20뉴턴까지)"></div>
        </div>
        <div class="control" data-modes="couple">
          <div class="control-head"><label for="sFC">⏺️ 가운데의 힘 (위쪽 +)</label><output id="oFC">0 N</output></div>
          <div class="range-row"><input type="range" id="sFC" min="-20" max="20" step="10" value="0" aria-label="가운데에 작용하는 힘 (아래쪽 20뉴턴부터 위쪽 20뉴턴까지)"></div>
        </div>
        <div class="control" data-modes="couple">
          <div class="control-head"><label for="sFR">➡️ 오른쪽 끝의 힘 (위쪽 +)</label><output id="oFR">0 N</output></div>
          <div class="range-row"><input type="range" id="sFR" min="-20" max="20" step="10" value="0" aria-label="오른쪽 끝에 작용하는 힘 (아래쪽 20뉴턴부터 위쪽 20뉴턴까지)"></div>
          <div class="btn-row">
            <button class="btn btn-sm btn-primary" id="bCpRun" type="button">▶ 힘 가하기</button>
            <button class="btn btn-sm" id="bCpReset" type="button">↺ 원위치</button>
          </div>
        </div>
        <!-- ③ 널빤지 -->
        <div class="control" data-modes="plank">
          <div class="control-head"><label for="sLoad">📦 짐의 위치 (A에서)</label><output id="oLoad">1.0 m</output></div>
          <div class="range-row"><input type="range" id="sLoad" min="0" max="6" step="0.5" value="1" aria-label="짐의 위치 (A에서 0미터부터 6미터까지)"></div>
        </div>
        <div class="control" data-modes="plank">
          <div class="control-head"><span>📌 돌림힘의 기준점</span></div>
          <div class="segmented view-seg" id="refSeg" role="group" aria-label="기준점 고르기">
            <button type="button" data-ref="A">A 점</button>
            <button type="button" data-ref="B">B 점</button>
          </div>
        </div>
        <div class="control" data-modes="plank">
          <div class="control-head"><label for="predIn">🎯 N_B 예측값 (N)</label></div>
          <div class="btn-row">
            <input class="num-in" id="predIn" type="number" inputmode="numeric" min="0" max="1000" step="1" placeholder="예: 150" aria-label="B 받침 힘 N_B의 예측값 (뉴턴)">
            <button class="btn btn-sm btn-primary" id="bPred" type="button">확인</button>
          </div>
        </div>
        <!-- ④ 기울기 -->
        <div class="control" data-modes="tilt">
          <div class="control-head"><span>↔️ 아랫면 폭 w</span></div>
          <div class="segmented view-seg" id="tWSeg" role="group" aria-label="아랫면의 폭">
            <button type="button" data-w="0.4">0.4 m</button>
            <button type="button" data-w="0.6">0.6 m</button>
          </div>
        </div>
        <div class="control" data-modes="tilt">
          <div class="control-head"><span>🎯 무게중심의 높이 h</span></div>
          <div class="segmented view-seg" id="tHSeg" role="group" aria-label="무게중심 높이">
            <button type="button" data-h="0.5">0.5 m (고르게)</button>
            <button type="button" data-h="0.3">0.3 m (아래에 추)</button>
          </div>
        </div>
        <div class="control" data-modes="tilt">
          <div class="control-head"><label for="sTilt">📐 기울이는 각 θ</label><output id="oTilt">0°</output></div>
          <div class="range-row"><input type="range" id="sTilt" min="0" max="60" step="1" value="0" aria-label="기울이는 각 (0도부터 60도까지)"></div>
          <div class="btn-row"><button class="btn btn-sm" id="bTiltReset" type="button">↺ 세워 놓기</button></div>
        </div>
        <!-- ④ 크레인 -->
        <div class="control" data-modes="crane">
          <div class="control-head"><span>📦 짐의 무게</span></div>
          <div class="segmented view-seg" id="cWSeg" role="group" aria-label="짐의 무게">
            <button type="button" data-wl="1000">1000 N</button>
            <button type="button" data-wl="2000">2000 N</button>
            <button type="button" data-wl="3000">3000 N</button>
          </div>
        </div>
        <div class="control" data-modes="crane">
          <div class="control-head"><span>↔️ 짐의 거리 (탑에서)</span></div>
          <div class="segmented view-seg" id="cDSeg" role="group" aria-label="짐의 거리">
            <button type="button" data-dl="3">3 m</button>
            <button type="button" data-dl="6">6 m</button>
          </div>
        </div>
        <div class="control" data-modes="crane">
          <div class="control-head"><label for="sCw">🧱 평형추의 위치 (탑에서)</label><output id="oCw">4.0 m</output></div>
          <div class="range-row"><input type="range" id="sCw" min="0.5" max="6" step="0.5" value="4" aria-label="평형추의 위치 (탑에서 0.5미터부터 6미터까지)"></div>
        </div>
        <!-- ④ 책장 -->
        <div class="control" data-modes="load">
          <div class="control-head"><span>📚 무거운 책을 둘 칸</span></div>
          <div class="segmented view-seg" id="lPosSeg" role="group" aria-label="무거운 책을 둘 칸">
            <button type="button" data-pos="top">위칸</button>
            <button type="button" data-pos="mid">가운데</button>
            <button type="button" data-pos="bottom">아래칸</button>
          </div>
        </div>
        <div class="control" data-modes="load">
          <div class="control-head"><label for="sLTilt">📐 기울이는 각 θ</label><output id="oLTilt">0°</output></div>
          <div class="range-row"><input type="range" id="sLTilt" min="0" max="40" step="1" value="0" aria-label="책장을 기울이는 각 (0도부터 40도까지)"></div>
          <div class="btn-row"><button class="btn btn-sm" id="bLoadReset" type="button">↺ 세워 놓기</button></div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
