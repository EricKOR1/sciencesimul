<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#8b5cf6">
  <title>결합과 전기 전도성 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-card { background: #f3f0fb; }
    .stage-toolbar { min-height: 58px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar .segmented button { min-height: 40px; padding: 5px 12px; font-size: 14.5px; white-space: nowrap; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #resetBtn { font-size: 20px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-set { display: flex; flex-direction: column; gap: 10px; }
    .ctrl-note { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
    .opt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .opt-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .opt {
      min-height: 46px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px;
      font-weight: 800; font-size: 14.5px; cursor: pointer; padding: 4px 6px; font-family: inherit; line-height: 1.2;
    }
    .opt.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .opt.done::after { content: " ✓"; color: var(--good); }
    .opt.wide { grid-column: 1 / -1; }
    .opt.sw-on { border-color: var(--good); background: var(--good-soft); color: #0b6b39; }
    .opt:disabled { opacity: .5; cursor: not-allowed; }
    .opt.target { animation: tgtPulse 1.1s ease-in-out infinite; }
    @keyframes tgtPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); } 50% { box-shadow: 0 0 0 6px rgba(139, 92, 246, .3); } }
    .stage-hint { white-space: normal; width: max-content; max-width: calc(100% - 24px); text-align: center; top: 10px; bottom: auto; }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .readout .value sup, .readout .value sub { font-size: .65em; }
    sup, sub { font-size: .7em; line-height: 0; }
    .step-intro .si-q {
      background: #fff; border: 2px solid color-mix(in srgb, var(--subject) 45%, white); border-radius: 12px;
      padding: 9px 12px; font-weight: 800; font-size: 16px; color: #4c1d95; margin: 4px 0 8px;
    }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .sel-row { margin-top: 2px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .ctable { border-collapse: separate; border-spacing: 4px 4px; width: 100%; font-size: 14px; }
    .ctable th { text-align: left; font-weight: 800; padding: 0 4px 0 0; line-height: 1.2; font-size: 13.5px; }
    .ctable thead th { text-align: center; color: var(--muted); }
    .ctable td { text-align: center; padding: 0; font-weight: 800; color: var(--muted); }
    .ctable select { width: 100%; min-width: 0; height: 40px; border: 2px dashed #b4bfcf; border-radius: 10px; background: #fff; text-align: center; text-align-last: center; font-weight: 800; font-size: 15px; color: var(--ink); font-family: inherit; }
    .ctable select.ok { border-style: solid; border-color: var(--good); background: var(--good-soft); color: #0b6b39; }
    .ctable select.bad { border-style: solid; border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    @media (max-width: 599px) {
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar .segmented button { padding: 5px 8px; font-size: 13.5px; }
      .readout .value.txt { font-size: 15px; }
    }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
  </style>
</head>
<body class="sim-page" data-subject="chem">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hc">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">화학 · Ⅱ. 물질의 구조와 성질</div>
      <h1>결합과 전기 전도성</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🔌 전기 전도성 시험</span>
          <span class="spacer"></span>
          <div class="segmented" id="sceneSeg" role="group" aria-label="장면 고르기" data-feature="model">
            <button type="button" data-scene="lab" data-feature="lab">🔌 회로 실험</button>
            <button type="button" data-scene="model" data-feature="model">🔬 입자 모형</button>
            <button type="button" data-scene="secret" data-feature="secret">🕵️ 비밀 시료</button>
          </div>
          <button class="icon-btn" id="resetBtn" type="button" title="처음 상태로" aria-label="처음 상태로">↺</button>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="전지와 전구, 전류계 회로에 시료를 연결해 전기가 통하는지 시험하는 장면, 전기장 속 전하 운반자 입자 모형, 비밀 시료 분류 흐름도"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="roL1">-</span><span class="value txt" id="roV1">-</span></div>
        <div class="readout"><span class="label" id="roL2">-</span><span class="value txt" id="roV2">-</span></div>
        <div class="readout"><span class="label" id="roL3">-</span><span class="value txt" id="roV3">-</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <!-- 고체 시료 -->
        <div class="ctrl-set" id="cs-solids" hidden>
          <div class="control-head" style="margin-bottom:0"><span>🧪 고체 시료 고르기</span></div>
          <div class="opt-grid" id="solidBtns"></div>
        </div>
        <!-- 액체·수용액 시료 -->
        <div class="ctrl-set" id="cs-liquids" hidden>
          <div class="control-head" style="margin-bottom:0"><span>🧪 액체 · 수용액 시료 고르기</span></div>
          <div class="opt-grid" id="liquidBtns"></div>
        </div>
        <!-- 정리표 -->
        <div class="ctrl-set" id="cs-table" hidden>
          <div class="control-head" style="margin-bottom:0"><span>✍️ 전기가 통하나요? (O / X)</span></div>
          <table class="ctable" id="tblSel"></table>
        </div>
        <!-- 입자 모형 -->
        <div class="ctrl-set" id="cs-model" hidden>
          <div class="control-head" style="margin-bottom:0"><span>🔬 시료 고르기</span></div>
          <div class="opt-grid" id="modelBtns"></div>
          <div class="opt-grid">
            <button type="button" class="opt wide" id="fieldBtn">⚡ 전기장 켜기</button>
            <button type="button" class="opt wide" id="dissBtn" hidden>💧 물에 녹이기</button>
          </div>
        </div>
        <div class="ctrl-set" id="cs-carrier" hidden>
          <div class="control-head" style="margin-bottom:0"><span>✍️ 전기를 나르는 입자는?</span></div>
          <div id="carrierSel"></div>
        </div>
        <!-- 비밀 시료 -->
        <div class="ctrl-set" id="cs-secret" hidden>
          <div class="control-head" style="margin-bottom:0"><span>🕵️ 비밀 시료 고르기</span></div>
          <div class="opt-grid three" id="secBtns"></div>
          <div class="control-head" style="margin-bottom:0"><span>🔌 시험하기</span></div>
          <div class="opt-grid three" id="testBtns"></div>
          <div class="control-head" style="margin-bottom:0"><span>🏷️ 이 시료는 무엇일까요?</span></div>
          <div class="opt-grid three" id="clsBtns"></div>
        </div>
        <div class="ctrl-set" id="cs-flow" hidden>
          <div class="control-head" style="margin-bottom:0"><span>✍️ 흐름도의 빈칸 채우기</span></div>
          <div id="flowSel"></div>
        </div>
        <p class="ctrl-note" id="ctlNote"></p>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
