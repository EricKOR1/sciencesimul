<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#8b5cf6">
  <title>전자의 이동과 산화·환원 | 고1 통합과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-toolbar { min-height: 58px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; }
    .stage-toolbar .segmented button { min-height: 40px; padding: 5px 12px; font-size: 14.5px; white-space: nowrap; }
    .segmented button.on { background: var(--subject); color: #fff; }
    .seg-wide { display: flex; width: 100%; margin-top: 8px; }
    .seg-wide button { flex: 1; min-width: 0; padding: 6px 4px; font-size: 14px; min-height: 44px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard [hidden] { display: none !important; }
    .btn-sm { min-height: 44px; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .btn.done { background: var(--good-soft); border-color: var(--good); color: #0b6b39; }
    .btn.on { background: var(--subject); border-color: var(--subject); color: #fff; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .ctrl-note { margin: 6px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
    .stepper .st .l { white-space: normal; text-align: center; line-height: 1.15; overflow: visible; }
    .readout .value { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .tag-rows { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .tag-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-items: center; font-weight: 800; font-size: 14px; }
    .tag-row select { width: 100%; min-height: 40px; border: 2px dashed #b4bfcf; border-radius: 10px; background: #fff; font-weight: 800; font-size: 13.5px; color: var(--ink); padding: 0 4px; font-family: inherit; }
    .tag-row select:focus { outline: none; border-style: solid; border-color: var(--subject); }
    .tag-row select.ok { border-style: solid; border-color: var(--good); background: var(--good-soft); color: #0b6b39; }
    .tag-row select.bad { border-style: solid; border-color: var(--bad); background: var(--bad-soft); }
    .tag-head { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 12.5px; color: var(--muted); font-weight: 800; margin-top: 8px; }
    sub, sup { font-size: .7em; line-height: 0; }
    .stepper-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .stepper-row .lbl { flex: 1; font-weight: 800; font-size: 15px; }
    .stepper-row .num { min-width: 30px; text-align: center; font-weight: 800; font-size: 20px; font-family: ui-monospace, Menlo, monospace; }
    .stepper-row button { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); background: #fff; font-size: 24px; font-weight: 800; cursor: pointer; line-height: 1; }
    .stepper-row button:active { transform: scale(.94); }
    .tag-row.three { grid-template-columns: 1fr 1fr 1fr; }
    .step-intro .si-q { background: #fff; border: 2px solid color-mix(in srgb, var(--subject) 45%, white); border-radius: 12px; padding: 9px 12px; font-weight: 800; font-size: 16px; color: #4c1d95; margin: 4px 0 8px; }
    @media (max-width: 599px) { .readout .value { font-size: 15px; } .stage-toolbar .spacer { display: none; } .stage-toolbar .segmented button { padding: 5px 8px; font-size: 13.5px; } }
  </style>
</head>
<body class="sim-page" data-subject="chem">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#h1b">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">통합과학2 · Ⅰ. 변화와 다양성</div>
      <h1>전자의 이동과 산화·환원</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🧪 금속과 이온</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" hidden>
            <button type="button" data-mode="bench" data-feature="bench">🧪 금속과 이온</button>
            <button type="button" data-mode="move" data-feature="move">⚡ 전자 이동</button>
            <button type="button" data-mode="rule" data-feature="rule">📒 규칙성</button>
            <button type="button" data-mode="life" data-feature="life">🏠 생활</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="아연과 구리 이온, 구리와 은 이온 사이의 반응 실험, 전자를 끌어 옮기는 모형, 마그네슘 연소를 산소와 전자 두 관점으로 보는 화면과 전자 장부, 생활 속 산화·환원 사례 분류"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1"> </span><span class="value" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2"> </span><span class="value" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3"> </span><span class="value" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-show="bench">
          <div class="control-head"><span>🧪 실험 고르기</span><output id="oBench">대기</output></div>
          <div class="segmented seg-wide" id="benchSeg"><button type="button" data-k="zn">Zn + Cu<sup>2+</sup></button><button type="button" data-k="ag">Cu + Ag<sup>+</sup></button></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bRun1" type="button">▶ 반응 시작</button><button class="btn btn-sm" id="bReset1" type="button">↺ 다시</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="bElec" type="button">🔍 전자 보기</button></div>
          <p class="ctrl-note" id="note1"></p>
        </div>
        <div class="control" data-show="move">
          <div class="control-head"><span>⚡ 옮긴 전자</span><output id="oMove">0 / 4</output></div>
          <div class="btn-row"><button class="btn btn-sm" id="bReset2" type="button">↺ 다시</button></div>
          <div class="tag-head"><span>반쪽 반응식 채우기</span><span></span></div>
          <div class="tag-rows" id="halfRows"></div>
          <p class="ctrl-note" id="note2"></p>
        </div>
        <div class="control" data-show="rule">
          <div class="segmented seg-wide" id="ruleSeg"><button type="button" data-sub="dual">🔍 두 관점</button><button type="button" data-sub="ledger">⚖️ 전자 장부</button></div>
        </div>
        <div class="control" data-show="rule:dual">
          <div class="control-head"><span>🔍 마그네슘의 연소</span><output id="oDual">대기</output></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bRun3" type="button">▶ 반응 보기</button><button class="btn btn-sm" id="bReset3" type="button">↺ 다시</button></div>
          <p class="ctrl-note">같은 반응을 왼쪽은 <b>산소</b>의 눈으로, 오른쪽은 <b>전자</b>의 눈으로 동시에 봐요.</p>
        </div>
        <div class="control" data-show="rule:ledger">
          <div class="control-head"><span>⚖️ Cu + Ag<sup>+</sup> 전자 장부</span><output id="oLedger">맞추기</output></div>
          <div class="stepper-row"><span class="lbl">구리 원자 Cu</span><button type="button" id="cuMinus" aria-label="구리 줄이기">−</button><span class="num" id="numCu">1</span><button type="button" id="cuPlus" aria-label="구리 늘리기">+</button></div>
          <div class="stepper-row"><span class="lbl">은 이온 Ag<sup>+</sup></span><button type="button" id="agMinus" aria-label="은 이온 줄이기">−</button><span class="num" id="numAg">1</span><button type="button" id="agPlus" aria-label="은 이온 늘리기">+</button></div>
          <p class="ctrl-note" id="note3"></p>
        </div>
        <div class="control" data-show="life">
          <div class="control-head"><span>🏠 분류한 카드</span><output id="oLife">0 / 10</output></div>
          <div class="btn-row"><button class="btn btn-sm" id="bLifeReset" type="button">↺ 카드 다시 모으기</button></div>
          <p class="ctrl-note">카드를 끌어 <b>전자를 잃는 쪽</b>과 <b>전자를 얻는 쪽</b> 칸에 놓아요. 카드를 누른 뒤 칸을 눌러도 돼요.</p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
