<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0ea5e9">
  <title>태양계 구성 천체 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-card { background: #070d1f; }
    /* 태블릿: 가로 배치 캔버스 · 휴대폰: 세로 배치 캔버스 */
    .sc-tall { display: none; }
    @media (max-width: 599px) { .sc-wide { display: none; } .sc-tall { display: block; } }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    .is-off { display: none !important; }
    .seg-label { display: block; font-weight: 800; font-size: 14.5px; color: var(--muted); margin-bottom: 6px; }
    .segmented { display: flex; width: 100%; }
    .segmented button { flex: 1 1 auto; min-height: 44px; padding: 6px 10px; font-size: 14.5px; }
    .segmented button.on { color: #075985; }
    .play-row { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; }
    .play-row .btn { min-width: 140px; }
    .ctrl-note { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; flex: 1 1 120px; }
    .btn-sm { min-height: 44px; }
    .game-foot button { min-height: 44px; }
    .mission-figure svg { border-radius: 12px; }
  </style>
</head>
<body class="sim-page" data-subject="earth">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g1">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중1 · Ⅶ. 태양계</div>
      <h1>태양계 구성 천체</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-canvas sc-wide"><canvas id="cvWide" aria-label="위에서 내려다본 태양계 지도와 천체 카드, 천체 분류 열쇠"></canvas></div>
        <div class="stage-canvas sc-tall"><canvas id="cvTall" aria-label="위에서 내려다본 태양계 지도와 천체 카드, 천체 분류 열쇠"></canvas></div>
      </section>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" id="cScene">
          <span class="seg-label">🧭 화면</span>
          <div class="segmented" id="sceneSeg" role="group" aria-label="화면 고르기">
            <button type="button" data-s="map">🗺️ 태양계 지도</button><button type="button" data-s="key">🔑 분류 열쇠</button>
          </div>
        </div>
        <div class="control" id="cView" data-feature="map">
          <span class="seg-label">🔭 지도 보기</span>
          <div class="segmented" id="viewSeg" role="group" aria-label="지도 보기">
            <button type="button" data-v="inner">안쪽 태양계</button><button type="button" data-v="full">전체 태양계</button><button type="button" data-v="comet" data-feature="comet">☄️ 혜성</button>
          </div>
        </div>
        <div class="control" id="cPlay" data-feature="map">
          <div class="play-row">
            <button class="btn btn-sm btn-primary" id="playBtn" type="button" aria-pressed="false">▶ 공전 재생</button>
            <p class="ctrl-note" id="playNote">지도의 천체를 누르면 천체 카드가 열려요.</p>
          </div>
        </div>
        <div class="control" id="cReset">
          <button class="btn btn-sm" id="resetBtn" type="button">↺ 카드 되돌리기</button>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
