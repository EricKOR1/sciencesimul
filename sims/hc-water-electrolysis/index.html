<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#8b5cf6">
  <title>물의 전기 분해 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-card { background: #f3f0fb; }
    .stage-toolbar { min-height: 58px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar .segmented button { min-height: 40px; padding: 5px 12px; font-size: 14.5px; white-space: nowrap; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #resetBtn { font-size: 20px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-set { display: flex; flex-direction: column; gap: 10px; }
    .ctrl-set .segmented { align-self: stretch; flex-wrap: nowrap; }
    .ctrl-set .segmented button { flex: 1 1 0; min-width: 0; min-height: 44px; font-size: 14.5px; padding-left: 6px; padding-right: 6px; }
    .ctrl-note { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
    .opt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .opt {
      min-height: 46px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px;
      font-weight: 800; font-size: 14.5px; cursor: pointer; padding: 4px 6px; font-family: inherit; line-height: 1.2;
    }
    .opt.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .opt.done::after { content: " ✓"; color: var(--good); }
    .opt.wide { grid-column: 1 / -1; }
    .opt.sw-on { border-color: var(--good); background: var(--good-soft); color: #0b6b39; }
    .opt:disabled { opacity: .5; cursor: not-allowed; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .nudge:disabled { opacity: .4; }
    .stage-hint { white-space: normal; width: max-content; max-width: calc(100% - 24px); text-align: center; top: 10px; bottom: auto; }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    sup, sub { font-size: .7em; line-height: 0; }
    .step-intro .si-q {
      background: #fff; border: 2px solid color-mix(in srgb, var(--subject) 45%, white); border-radius: 12px;
      padding: 9px 12px; font-weight: 800; font-size: 16px; color: #4c1d95; margin: 4px 0 8px;
    }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .sel-row { margin-top: 2px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.3; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .ord-row { display: flex; align-items: center; gap: 8px; border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 6px 8px; font-weight: 800; font-size: 14px; line-height: 1.3; }
    .ord-row .no { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--subject); color: #fff; display: grid; place-items: center; font-size: 13px; }
    .ord-row .tx { flex: 1; min-width: 0; }
    .ord-row button { flex: none; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 16px; cursor: pointer; font-weight: 900; }
    .ord-row button:disabled { opacity: .35; }
    .ord-row.ok { border-color: var(--good); background: var(--good-soft); }
    .ord-row.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    #ordList { display: flex; flex-direction: column; gap: 6px; }
    @media (max-width: 599px) {
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar .segmented button { padding: 5px 8px; font-size: 13.5px; }
      .readout .value.txt { font-size: 15px; }
    }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
  </style>
</head>
<body class="sim-page" data-subject="chem">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hc">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">화학 · Ⅱ. 물질의 구조와 성질</div>
      <h1>물의 전기 분해</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">⚡ 전기 분해 장치</span>
          <span class="spacer"></span>
          <div class="segmented" id="sceneSeg" role="group" aria-label="장면 고르기" data-feature="graph">
            <button type="button" data-scene="lab" data-feature="lab">⚡ 장치</button>
            <button type="button" data-scene="graph" data-feature="graph">📈 그래프</button>
            <button type="button" data-scene="model" data-feature="model">🔬 입자 모형</button>
          </div>
          <button class="icon-btn" id="resetBtn" type="button" title="장치 비우기" aria-label="장치 비우기">↺</button>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="호프만 장치로 물을 전기 분해해 수소와 산소를 모으는 장면, 시간에 따른 기체 부피 그래프, 물 분자가 수소와 산소 분자로 바뀌는 입자 모형"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="roL1">-</span><span class="value txt" id="roV1">-</span></div>
        <div class="readout"><span class="label" id="roL2">-</span><span class="value txt" id="roV2">-</span></div>
        <div class="readout"><span class="label" id="roL3">-</span><span class="value txt" id="roV3">-</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <!-- 장치 -->
        <div class="ctrl-set" id="cs-lab" hidden>
          <div class="control" style="margin:0">
            <div class="control-head"><span>🧪 물에 넣은 것</span></div>
            <div class="segmented" id="solSeg" role="group" aria-label="용액 고르기">
              <button type="button" data-v="0">순수한 물</button>
              <button type="button" data-v="1">전해질 수용액</button>
            </div>
          </div>
          <div class="control" style="margin:0">
            <div class="control-head"><label for="sVolt">🔌 전압</label><output id="oVolt">9 V</output></div>
            <div class="range-row">
              <button class="nudge" id="vMinus" type="button" aria-label="전압 줄이기">−</button>
              <input type="range" id="sVolt" min="0" max="12" step="1" value="9" aria-label="전압 (0볼트부터 12볼트)">
              <button class="nudge" id="vPlus" type="button" aria-label="전압 올리기">+</button>
            </div>
          </div>
          <div class="opt-grid">
            <button type="button" class="opt" id="powerBtn">⏻ 전원 켜기</button>
            <button type="button" class="opt" id="drainBtn">🧹 장치 비우기</button>
          </div>
        </div>
        <!-- 그래프 -->
        <div class="ctrl-set" id="cs-graph" hidden>
          <div class="control-head" style="margin-bottom:0"><span>📈 그래프 그리기</span></div>
          <div class="opt-grid">
            <button type="button" class="opt" id="drawH">📈 H₂ 그래프</button>
            <button type="button" class="opt" id="drawO">📈 O₂ 그래프</button>
          </div>
          <div class="control-head" style="margin-bottom:0"><span>🧮 기울기의 비 H₂ : O₂ =</span></div>
          <div class="segmented" id="ratioSeg" role="group" aria-label="기울기의 비 고르기">
            <button type="button" data-v="1:1">1 : 1</button>
            <button type="button" data-v="2:1">2 : 1</button>
            <button type="button" data-v="3:1">3 : 1</button>
            <button type="button" data-v="1:2">1 : 2</button>
          </div>
        </div>
        <!-- 입자 모형 -->
        <div class="ctrl-set" id="cs-model" hidden>
          <div class="control" style="margin:0">
            <div class="control-head"><label for="sMod">🎞️ 반응 진행</label><output id="oMod">0 %</output></div>
            <div class="range-row"><input type="range" id="sMod" min="0" max="100" step="1" value="0" aria-label="반응 진행 정도 (0퍼센트부터 100퍼센트)"></div>
          </div>
          <div class="opt-grid">
            <button type="button" class="opt wide" id="playBtn">▶ 처음부터 재생</button>
          </div>
        </div>
        <div class="ctrl-set" id="cs-ord" hidden>
          <div class="control-head" style="margin-bottom:0"><span>✍️ 일어나는 순서대로 놓기</span></div>
          <div id="ordList"></div>
        </div>
        <div class="ctrl-set" id="cs-calc" hidden>
          <div class="control-head" style="margin-bottom:0"><span>🧮 8.0 mL의 H₂로 물의 양 구하기</span></div>
          <div id="calcSel"></div>
        </div>
        <p class="ctrl-note" id="ctlNote"></p>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
