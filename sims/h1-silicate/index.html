<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0ea5e9">
  <title>규산염 광물 | 고1 통합과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪨</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-card { background: #eef5fb; }
    .stage-toolbar { min-height: 58px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; }
    .stage-toolbar .segmented button { min-height: 40px; padding: 5px 12px; font-size: 14.5px; white-space: nowrap; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #resetBtn { font-size: 20px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    .ctrl-set { display: flex; flex-direction: column; gap: 10px; }
    .ctrl-set[hidden], .ctrl-row[hidden] { display: none; }
    .ctrl-row { display: flex; flex-direction: column; gap: 8px; }
    .ctrl-set .segmented { align-self: stretch; flex-wrap: nowrap; }
    .ctrl-set .segmented button { flex: 1 1 0; min-width: 0; min-height: 44px; font-size: 14.5px; padding-left: 6px; padding-right: 6px; }
    .ctrl-note { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
    .opt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .opt {
      min-height: 46px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px;
      font-weight: 800; font-size: 14.5px; cursor: pointer; padding: 4px 6px; font-family: inherit; line-height: 1.2;
    }
    .opt.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .opt.done::after { content: " ✓"; color: var(--good); }
    .opt.wide { grid-column: 1 / -1; }
    .opt.sw-on { border-color: var(--good); background: var(--good-soft); color: #0b6b39; }
    .opt:disabled { opacity: .5; cursor: not-allowed; }
    .stepper-row { display: flex; align-items: center; gap: 8px; }
    .stepper-row .lbl { flex: 1; font-weight: 800; font-size: 15px; }
    .stepper-row .lbl sup { font-size: 11px; }
    .stepper-row .num { min-width: 30px; text-align: center; font-weight: 800; font-size: 20px; font-family: ui-monospace, Menlo, monospace; }
    .stepper-row button { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); background: #fff; font-size: 24px; font-weight: 800; cursor: pointer; line-height: 1; }
    .stepper-row button:active { transform: scale(.94); }
    .target { animation: tgtPulse 1.1s ease-in-out infinite; }
    @keyframes tgtPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0); }
      50% { box-shadow: 0 0 0 6px rgba(14, 165, 233, .3); }
    }
    .stage-hint { white-space: normal; width: max-content; max-width: calc(100% - 24px); text-align: center; }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .readout .value sup { font-size: .6em; }
    .step-intro .si-q {
      background: #fff; border: 2px solid color-mix(in srgb, var(--subject) 45%, white); border-radius: 12px;
      padding: 9px 12px; font-weight: 800; font-size: 16px; color: #075985; margin: 4px 0 8px;
    }
    sup { font-size: .7em; line-height: 0; }
    sub { font-size: .7em; line-height: 0; }
    .fig-box { display: block; margin: 4px auto; max-width: 100%; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }

    /* 결과 표 */
    .data-card { flex: none; padding: 8px 12px; display: flex; align-items: center; gap: 12px; }
    .data-card[hidden] { display: none; }
    .data-head { flex: none; display: flex; flex-direction: column; gap: 2px; font-size: 14.5px; line-height: 1.25; }
    .data-head .n { font-size: 12.5px; color: var(--muted); font-weight: 700; }
    .data-scroll { flex: 1; min-width: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .ctable { border-collapse: separate; border-spacing: 4px 3px; width: 100%; font-size: 14.5px; }
    .ctable th { text-align: left; white-space: nowrap; padding: 2px 8px 2px 2px; color: var(--ink); font-weight: 800; font-size: 14px; }
    .ctable thead th { text-align: center; color: var(--muted); font-size: 13.5px; }
    .ctable td { text-align: center; padding: 0; }
    .ctable select {
      width: 100%; min-width: 0; height: 36px; border: 2px dashed #b4bfcf; border-radius: 10px; background: #fff; text-align: center; text-align-last: center;
      font-weight: 800; font-size: 14.5px; color: var(--ink); padding: 0 4px; font-family: inherit;
    }
    .ctable select:focus { outline: none; border-style: solid; border-color: var(--subject); box-shadow: 0 0 0 3px color-mix(in srgb, var(--subject) 22%, transparent); }
    .ctable select.ok { border-style: solid; border-color: var(--good); background: var(--good-soft); color: #0b6b39; }
    .ctable select.bad { border-style: solid; border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    @media (max-width: 599px) {
      .data-card { flex-direction: column; align-items: stretch; gap: 4px; }
      .data-head { flex-direction: row; gap: 8px; align-items: baseline; }
      .stage-toolbar .spacer { display: none; }
      .stage-toolbar .segmented button { padding: 5px 8px; font-size: 13.5px; }
      .readout .value.txt { font-size: 15px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="earth">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#h1a">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">통합과학1 · Ⅱ. 물질과 규칙성</div>
      <h1>규산염 광물</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🪨 지각을 이루는 원소</span>
          <span class="spacer"></span>
          <div class="segmented" id="sceneSeg" role="group" aria-label="장면 고르기" hidden>
            <button type="button" data-scene="crust" data-feature="crust">🪨 지각의 광물</button>
            <button type="button" data-scene="tetra" data-feature="tetra">🔺 사면체</button>
            <button type="button" data-scene="struct" data-feature="struct">🧱 연결 방식</button>
            <button type="button" data-scene="sort" data-feature="sort">📚 정리</button>
          </div>
          <button class="icon-btn" id="resetBtn" type="button" title="처음 상태로" aria-label="처음 상태로">↺</button>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="지각을 이루는 원소와 화강암 속 광물, 규소 1개와 산소 4개로 이루어진 사면체 블록, 블록의 연결 방식에 따른 규산염 광물의 구조, 규산염 광물 분류"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts" id="readouts">
        <div class="readout"><span class="label" id="roL1">-</span><span class="value txt" id="roV1">-</span></div>
        <div class="readout"><span class="label" id="roL2">-</span><span class="value txt" id="roV2">-</span></div>
        <div class="readout"><span class="label" id="roL3">-</span><span class="value txt" id="roV3">-</span></div>
      </div>
      <section class="card data-card" id="tableCard" hidden>
        <div class="data-head"><b>📋 결과 표</b><span class="n">알맞은 것을 골라요</span></div>
        <div class="data-scroll">
          <table class="ctable" id="ctable"></table>
        </div>
      </section>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <!-- 지각의 광물 -->
        <div class="ctrl-set" id="cs-crust" hidden>
          <div class="segmented" id="crustTabs" role="group" aria-label="보기">
            <button type="button" data-v="pie" class="on">📊 원소 비율</button>
            <button type="button" data-v="rock">🪨 암석·광물</button>
          </div>
          <div class="ctrl-row" id="zoomRow" hidden>
            <div class="stepper-row" style="gap:10px">
              <button type="button" class="opt" id="zoomOut" style="flex:1">➖ 축소</button>
              <button type="button" class="opt" id="zoomIn" style="flex:1">➕ 확대</button>
            </div>
          </div>
          <p class="ctrl-note" id="crustNote">조각을 눌러 지각을 이루는 원소의 비율을 살펴봐요.</p>
        </div>
        <!-- 사면체 -->
        <div class="ctrl-set" id="cs-tetra" hidden>
          <div class="segmented" id="tetraTabs" role="group" aria-label="보기">
            <button type="button" data-v="make" class="on">🔺 사면체 만들기</button>
            <button type="button" data-v="join">🔗 이어 붙이기</button>
          </div>
          <p class="ctrl-note" id="tetraNote">규소(Si) 1개와 산소(O) 4개를 끌어다 점선 자리에 놓아요.</p>
        </div>
        <!-- 연결 방식 -->
        <div class="ctrl-set" id="cs-struct" hidden>
          <div class="segmented" id="structTabs" role="group" aria-label="보기">
            <button type="button" data-v="build" class="on">🧱 조립하기</button>
            <button type="button" data-v="spec">🔨 표본 살펴보기</button>
          </div>
          <div class="ctrl-row" id="typeRow">
            <div class="opt-grid" id="typeBtns">
              <button type="button" class="opt" data-t="island">독립형</button>
              <button type="button" class="opt" data-t="chain">사슬형</button>
              <button type="button" class="opt" data-t="sheet">판상형</button>
              <button type="button" class="opt" data-t="frame">망상형</button>
            </div>
          </div>
          <p class="ctrl-note" id="structNote">아래 블록을 끌어다 점선 자리에 놓아 배열을 완성해요.</p>
        </div>
        <!-- 정리 -->
        <div class="ctrl-set" id="cs-sort" hidden>
          <p class="ctrl-note" id="sortNote">광물 카드를 끌어 <b>규산염 광물</b> / <b>비규산염 광물</b> 상자에 넣어요. 카드의 원소 동그라미를 살펴봐요.</p>
          <button type="button" class="opt wide" id="shuffleBtn">🔀 카드 섞기</button>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
  <script src="../../assets/js/sim3d.js"></script>
  <script src="v3d.js"></script>
</body>
</html>
