<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>원자·이온 공방 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    /* ---- 원자·이온 공방 전용 스타일 ---- */
    .legend { display: inline-flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-weight: 700; font-size: 14px; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .ball {
      width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
      color: #fff; font-weight: 900; font-size: 19px; line-height: 1; box-shadow: inset 0 -2px 3px rgba(0,0,0,.18);
    }
    .ball.p { background: radial-gradient(circle at 34% 32%, #ffb1b1, #e2464b 58%, #b3262b); }
    .ball.e { background: radial-gradient(circle at 34% 32%, #b4cdff, #3867f4 58%, #2142b0); }
    .legend .ball { width: 22px; height: 22px; font-size: 15px; }

    .part-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
    .part-row + .part-row { border-top: 1px dashed var(--line); }
    .part-label { flex: 1; min-width: 0; line-height: 1.3; }
    .part-label b { display: block; font-size: 16px; }
    .part-label small { display: block; color: var(--muted); font-size: 12.5px; font-weight: 600; }
    .stepper { display: flex; align-items: center; gap: 6px; flex: none; }
    .step-btn {
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
      font-size: 24px; font-weight: 800; cursor: pointer; display: grid; place-items: center; line-height: 1; padding: 0;
      transition: transform .08s, background .15s, border-color .15s; touch-action: manipulation;
    }
    .step-btn:hover:not([disabled]) { background: var(--surface-2); border-color: #c4cfdf; }
    .step-btn:active:not([disabled]) { transform: scale(.92); }
    .step-btn[disabled] { opacity: .35; cursor: not-allowed; }
    .step-btn.p { color: #c4313a; }
    .step-btn.e { color: #2a52d6; }
    .step-val { min-width: 42px; text-align: center; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 24px; font-weight: 800; }
    .side-note { margin-top: 10px; font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 8px 10px; line-height: 1.45; }
    .side-note b { color: color-mix(in srgb, var(--subject) 85%, black); }
    .side-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }

    .readout .value.q-pos { color: #d0343a; }
    .readout .value.q-neg { color: #2a52d6; }
    .readout .value.q-zero { color: #0f8a4b; }
    .readout .value sup { font-size: .6em; }

    /* 캔버스 아래쪽에 안내 말풍선 */
    .stage-hint { top: auto; bottom: 16px; left: 46.5%; white-space: normal; text-align: center; max-width: calc(100% - 32px); }

    @media (max-width: 480px) {
      .stage-hint { font-size: 12px; padding: 4px 10px; bottom: 8px; }
      .stage-toolbar { padding: 8px 10px; }
      .legend { font-size: 13px; gap: 4px 10px; }
      .part-label b { font-size: 15px; }
    }
    .mission-goal sup, .choice sup, .mission-explain sup, .concept sup, .mission-status sup, .mission-feedback sup { font-size: .68em; line-height: 0; }
    .mission-figure svg { width: 220px; }
    .concept table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 6px 0; }
    .concept th, .concept td { border: 1px solid var(--line); padding: 5px 6px; text-align: center; }
    .concept th { background: var(--surface-2); }
  </style>
</head>
<body class="sim-page" data-subject="chem">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g2">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중2 · Ⅳ. 물질의 구성</div>
      <h1>원자·이온 공방</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <div class="legend" aria-label="범례">
            <span><i class="ball p">+</i> 양성자 (원자핵 속)</span>
            <span><i class="ball e">−</i> 전자</span>
          </div>
          <span class="spacer"></span>
          <label class="switch"><input type="checkbox" id="orbitChk" checked> 전자 움직임</label>
        </div>
        <canvas id="cv" aria-label="원자 모형: 양성자와 전자를 끌어서 넣고 빼는 시뮬레이션"></canvas>
        <div class="stage-hint" id="stageHint">👆 입자를 끌어서 원자에 넣고 빼 보세요</div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label">양성자 수 (원자핵 전하)</span><span class="value" id="rP">1</span></div>
        <div class="readout"><span class="label">전자 수</span><span class="value" id="rE">1</span></div>
        <div class="readout"><span class="label">전체 전하</span><span class="value" id="rQ">0</span></div>
        <div class="readout"><span class="label">종류</span><span class="value" id="rK">원자</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad">
        <div class="card-title">🧪 입자 넣고 빼기</div>
        <div class="part-row">
          <i class="ball p" aria-hidden="true">+</i>
          <div class="part-label"><b>양성자</b><small>원자핵 속 · (+)전하</small></div>
          <div class="stepper">
            <button class="step-btn p" id="pMinus" type="button" aria-label="양성자 1개 빼기">−</button>
            <output class="step-val" id="oP" aria-live="polite">1</output>
            <button class="step-btn p" id="pPlus" type="button" aria-label="양성자 1개 넣기">+</button>
          </div>
        </div>
        <div class="part-row">
          <i class="ball e" aria-hidden="true">−</i>
          <div class="part-label"><b>전자</b><small>원자핵 주위 · (−)전하</small></div>
          <div class="stepper">
            <button class="step-btn e" id="eMinus" type="button" aria-label="전자 1개 빼기">−</button>
            <output class="step-val" id="oE" aria-live="polite">1</output>
            <button class="step-btn e" id="ePlus" type="button" aria-label="전자 1개 넣기">+</button>
          </div>
        </div>
        <div class="side-note">💡 원소의 종류는 <b>양성자 수</b>(원자핵의 (+)전하량)로 정해지고, 이온은 <b>전자</b>를 잃거나 얻어서 만들어져요.</div>
        <div class="side-foot">
          <span style="flex:1"></span>
          <button class="btn btn-sm btn-ghost" id="resetBtn" type="button">↺ 수소 원자로 되돌리기</button>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="sim.js"></script>
</body>
</html>
