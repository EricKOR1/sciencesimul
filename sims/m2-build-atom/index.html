<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#8b5cf6">
  <title>원자의 구조 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    /* ---- 원자의 구조 전용 스타일 ---- */
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; }
    .legend { display: inline-flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; font-weight: 700; font-size: 15px; color: var(--muted); padding-left: 4px; }
    .legend > span { display: inline-flex; align-items: center; gap: 6px; }
    .ball {
      width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; font-style: normal;
      color: #fff; font-weight: 900; font-size: 19px; line-height: 1; box-shadow: inset 0 -2px 3px rgba(0,0,0,.18);
    }
    .ball.p { background: radial-gradient(circle at 34% 32%, #ffb1b1, #e2464b 58%, #b3262b); }
    .ball.n { background: radial-gradient(circle at 34% 32%, #f1f3f7, #a3acbb 58%, #6f7889); }
    .ball.e { background: radial-gradient(circle at 34% 32%, #b4cdff, #3867f4 58%, #2142b0); }
    .legend .ball { width: 24px; height: 24px; font-size: 16px; }

    /* 입자 넣고 빼기 (버튼) */
    .card-title { margin: -6px 0 2px; }
    .card-title .btn { color: var(--muted); font-size: 14.5px; padding: 6px 10px; min-height: 44px; }
    .part-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
    .part-row.p-row { border-bottom: 1px dashed var(--line); }
    .part-label { flex: 1; min-width: 0; line-height: 1.3; }
    .part-label b { display: block; font-size: 16px; }
    .part-label small { display: block; color: var(--muted); font-size: 13px; font-weight: 600; }
    .counter { display: flex; align-items: center; gap: 4px; flex: none; }
    .cnt-btn {
      width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
      font-size: 25px; font-weight: 800; cursor: pointer; display: grid; place-items: center; line-height: 1; padding: 0;
      transition: transform .08s, background .15s, border-color .15s; touch-action: manipulation;
    }
    @media (hover: hover) { .cnt-btn:hover:not([disabled]) { background: var(--surface-2); border-color: #c4cfdf; } }
    .cnt-btn:active:not([disabled]) { transform: scale(.92); background: var(--surface-2); }
    .cnt-btn[disabled] { opacity: .35; cursor: not-allowed; }
    .cnt-btn.p { color: #c4313a; }
    .cnt-btn.e { color: #2a52d6; }
    .cnt-val { min-width: 40px; text-align: center; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 24px; font-weight: 800; }
    .side-note { margin-top: 8px; font-size: 14px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 8px 10px; line-height: 1.45; }
    .side-note b { color: color-mix(in srgb, var(--subject) 85%, black); }

    .stage-hint { white-space: normal; text-align: center; max-width: calc(100% - 32px); }

    .mission-figure svg { width: 180px; max-width: 100%; }
    .concept table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 6px 0; }
    .concept th, .concept td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept th { background: var(--surface-2); }

    @media (orientation: portrait) and (min-width: 600px) {
      .cnt-val { min-width: 34px; font-size: 22px; }
      /* 1단계에는 조작 카드가 없으므로 미션 패널을 넓게 */
      body.no-ctrl .side-col > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .legend { font-size: 13.5px; gap: 4px 10px; }
      .toolbar-label { font-size: 13.5px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; bottom: 8px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="chem">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g2">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중2 · Ⅳ. 물질의 구성</div>
      <h1>원자의 구조</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🔍 원자 모형 속 입자를 하나씩 눌러 관찰해요</span>
          <div class="legend" aria-label="범례" data-feature="meter">
            <span><i class="ball p">+</i> 양성자 (+)</span>
            <span><i class="ball n"></i> 중성자 (전하 없음)</span>
            <span><i class="ball e">−</i> 전자 (−)</span>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="원자 모형: 양성자, 중성자, 전자로 원자를 만드는 시뮬레이션"></canvas>
          <div class="stage-hint" id="stageHint">👆 입자를 눌러 보세요</div>
        </div>
      </section>
      <div class="readouts" data-feature="meter">
        <div class="readout"><span class="label">양성자 수</span><span class="value" id="rP">2</span></div>
        <div class="readout"><span class="label">중성자 수</span><span class="value" id="rN">2</span></div>
        <div class="readout"><span class="label">전자 수</span><span class="value" id="rE">2</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" data-feature="ebin">
        <div class="card-title">🧪 입자 넣고 빼기<span style="flex:1"></span><button class="btn btn-sm btn-ghost" id="resetBtn" type="button">↺ 처음 상태로</button></div>
        <div class="part-row p-row" data-feature="pbin">
          <i class="ball p" aria-hidden="true">+</i>
          <div class="part-label"><b>양성자</b><small>중성자는 자동으로</small></div>
          <div class="counter">
            <button class="cnt-btn p" id="pMinus" type="button" aria-label="양성자 1개 빼기">−</button>
            <output class="cnt-val" id="oP" aria-live="polite">1</output>
            <button class="cnt-btn p" id="pPlus" type="button" aria-label="양성자 1개 넣기">+</button>
          </div>
        </div>
        <div class="part-row">
          <i class="ball e" aria-hidden="true">−</i>
          <div class="part-label"><b>전자</b><small>원자핵 주위 (−)</small></div>
          <div class="counter">
            <button class="cnt-btn e" id="eMinus" type="button" aria-label="전자 1개 빼기">−</button>
            <output class="cnt-val" id="oE" aria-live="polite">1</output>
            <button class="cnt-btn e" id="ePlus" type="button" aria-label="전자 1개 넣기">+</button>
          </div>
        </div>
        <div class="side-note" id="sideNote"></div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
