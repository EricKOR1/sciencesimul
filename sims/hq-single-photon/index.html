<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>한 알씩 이중 슬릿 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; white-space: nowrap; }
    .segmented button.on { background: var(--subject); color: #fff; }
    .stage-toolbar .segmented { flex-wrap: wrap; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .chips button:disabled { opacity: .45; }
    .tog { width: 100%; min-height: 44px; border: 2px solid var(--line); background: #fff; border-radius: 12px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); padding: 6px 10px; text-align: left; }
    .tog.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .num-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 17px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: #fff; }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
    #modeSeg button { font-size: 13.5px; padding-left: 8px; padding-right: 8px; }
    .unit-in { display: flex; align-items: center; gap: 6px; }
    .unit-in .u { font-weight: 800; color: var(--muted); white-space: nowrap; }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hq">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">전자기와 양자 · Ⅲ. 양자와 미시세계</div>
      <h1>한 알씩 이중 슬릿</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🎯 한 알씩 이중 슬릿</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="shoot">
            <button type="button" data-mode="shoot" data-feature="shoot">🎯 한 알씩</button><button type="button" data-mode="pattern" data-feature="pattern">📊 무늬 쌓기</button><button type="button" data-mode="which" data-feature="which">🔍 어느 틈?</button><button type="button" data-mode="dbl" data-feature="dbl">📐 드브로이 파장</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="전자총에서 이중 슬릿을 지나 형광 스크린에 한 점씩 도착하는 전자, 쌓이는 도착 점과 도착 횟수 히스토그램, 입자별 드브로이 파장 표"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">-</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">-</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">-</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="shoot">
          <div class="control-head"><span id="hShoot">⚡ 전자 쏘기</span></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bS1" type="button">1개 쏘기</button><button class="btn btn-sm btn-primary" id="bS10" type="button">10개 쏘기</button></div>
          <p class="ctrl-note">스크린(오른쪽 검은 화면)의 한 곳을 누르면 “다음 점은 여기!”라고 예측할 수 있어요.</p>
        </div>
        <div class="control" data-modes="shoot">
          <button class="tog" id="bBullet" type="button" aria-pressed="false">🔫 총알(고전 입자)이라면? 예상 보기</button>
        </div>
        <div class="control" data-modes="pattern which">
          <div class="control-head"><span>⚡ 전자 더 쏘기</span></div>
          <div class="chips" id="addChips" role="group" aria-label="더 쏠 개수"><button type="button" data-n="10">+10</button><button type="button" data-n="100">+100</button><button type="button" data-n="1000">+1000</button><button type="button" data-n="10000">+10000</button></div>
        </div>
        <div class="control" data-modes="pattern" data-kind="e">
          <div class="control-head"><span>🔋 전자의 가속 전압</span></div>
          <div class="segmented view-seg" id="vSeg" role="group" aria-label="가속 전압"><button type="button" data-v="50">50 V</button><button type="button" data-v="100">100 V</button><button type="button" data-v="500">500 V</button></div>
        </div>
        <div class="control" data-modes="pattern">
          <div class="control-head"><span>🚪 열어 둔 틈</span></div>
          <div class="segmented view-seg" id="slSeg" role="group" aria-label="열어 둔 틈"><button type="button" data-v="both">두 틈</button><button type="button" data-v="A">틈 A만</button></div>
        </div>
        <div class="control" data-modes="which">
          <button class="tog" id="bDet" type="button" aria-pressed="false">👁️ 틈 검출기 켜기 (지금: 꺼짐)</button>
        </div>
        <div class="control" data-modes="which">
          <div class="control-head"><span>🧪 쏘는 입자</span></div>
          <div class="segmented view-seg" id="kSeg" role="group" aria-label="쏘는 입자"><button type="button" data-v="e">전자</button><button type="button" data-v="ph">광자 (레이저)</button></div>
        </div>
        <div class="control" data-modes="pattern which">
          <button class="tog" id="bWave" type="button" aria-pressed="false">🌊 확률 파동 · 확률 곡선 보기</button>
        </div>
        <div class="control" data-modes="which">
          <button class="tog" id="bCmp" type="button" aria-pressed="false">📈 두 가지 계산 곡선 비교하기</button>
        </div>
        <div class="control" data-modes="shoot pattern which">
          <button class="btn btn-sm" id="bClear" type="button">🧹 스크린 지우기</button>
        </div>
        <div class="control" data-modes="shoot" data-match="selA"><div class="control-head"><span>✍️ 결과 정리하기</span></div><div id="selA"></div></div>
        <div class="control" data-modes="pattern" data-match="selP"><div class="control-head"><span>✍️ 문장 완성하기</span></div><div id="selP"></div></div>
        <div class="control" data-modes="which" data-match="selW"><div class="control-head"><span>✍️ 문장 완성하기</span></div><div id="selW"></div></div>
        <div class="control" data-modes="dbl">
          <div class="control-head"><span>🏃 고른 줄의 속력</span></div>
          <div class="segmented view-seg" id="fSeg" role="group" aria-label="고른 입자의 속력 배율"><button type="button" data-v="0.5">× ½</button><button type="button" data-v="1">× 1</button><button type="button" data-v="2">× 2</button></div>
          <p class="ctrl-note">표에서 입자 줄을 누르면 그 입자를 골라요.</p>
        </div>
        <div class="control" data-modes="dbl" data-match="dblPick">
          <div class="control-head"><span>✅ 간섭무늬를 볼 수 있는 입자</span></div>
          <div class="chips" id="pickChips" role="group" aria-label="간섭무늬를 볼 수 있는 입자 고르기"><button type="button" data-p="e">전자</button><button type="button" data-p="n">중성자</button><button type="button" data-p="c">C₆₀</button><button type="button" data-p="b">야구공</button></div>
        </div>
        <div class="control" data-modes="dbl" data-match="dblIn">
          <div class="control-head"><span>✍️ 계산하기</span></div>
          <div class="sel-row"><div class="q">속력 × 1인 전자의 드브로이 파장 λ는?</div><div class="unit-in"><input class="num-in" id="nLam" inputmode="decimal" autocomplete="off" aria-label="전자의 드브로이 파장 (나노미터)"><span class="u">nm</span></div></div>
          <div id="selD"></div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
