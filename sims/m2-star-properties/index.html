<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0ea5e9">
  <title>별의 밝기와 색 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-card { background: #070d1f; }
    .sc-tall { display: none; }
    @media (max-width: 599px) { .sc-wide { display: none; } .sc-tall { display: block; } }
    .stage-toolbar { min-height: 56px; background: var(--surface); }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; }
    #resetBtn { font-size: 20px; }
    .segmented button { min-height: 40px; padding: 6px 12px; font-size: 14.5px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    .is-off { display: none !important; }
    #ctrlCard[hidden] { display: none; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1 1 0; min-width: 0; min-height: 46px; }
    .ctrl-note { font-size: 13.5px; color: var(--muted); margin: 4px 0 0; line-height: 1.45; }
    .btn-sm { min-height: 44px; }
    input[type=range] { height: 44px; }
    .game-foot button { min-height: 44px; }
    .mission-figure svg, .note-fig svg { border-radius: 12px; max-width: 100%; height: auto; }
    .note-fig { margin: 6px 0; text-align: center; }
    kbd { font-family: inherit; font-size: 12px; background: rgba(0,0,0,.12); border-radius: 5px; padding: 0 5px; }

    /* 측정 기록 표 */
    .data-card { flex: none; padding: 8px 12px; display: flex; align-items: center; gap: 12px; }
    .data-head { flex: none; display: flex; flex-direction: column; gap: 2px; font-size: 14.5px; line-height: 1.25; }
    .data-head .n { font-size: 12.5px; color: var(--muted); font-weight: 700; }
    .data-scroll { flex: 1; min-width: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .data-table { border-collapse: collapse; font-size: 14.5px; }
    .data-table th { text-align: left; white-space: nowrap; padding: 3px 10px 3px 2px; color: var(--muted); font-weight: 800; font-size: 13.5px; }
    .data-table td {
      min-width: 54px; text-align: center; padding: 3px 6px; border-left: 1px solid var(--line);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 800; white-space: nowrap;
    }
    .data-table td.empty { color: #c3ccd9; font-weight: 600; }
    .data-table tr:first-child td { color: #1d4ed8; }
    .data-table tr:last-child td { color: #b91c1c; }
    .data-table td.fresh { background: #fff4dc; }
    @media (max-width: 599px) {
      .data-card { flex-direction: column; align-items: stretch; gap: 4px; }
      .data-head { flex-direction: row; gap: 8px; align-items: baseline; }
      .data-table td { min-width: 44px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="earth">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g2">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중2 · Ⅷ. 별과 우주</div>
      <h1>별의 밝기와 색</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="sceneLabel">🌌 겨울철 남쪽 밤하늘</span>
          <span class="spacer"></span>
          <div class="segmented is-off" id="sceneTabs" role="tablist" aria-label="장면 선택">
            <button type="button" data-scene="sky" class="on">🌌 하늘</button>
            <button type="button" data-scene="lab">🔦 실험</button>
            <button type="button" data-scene="map10">🗺 10 pc</button>
            <button type="button" data-scene="heater">🌡 색</button>
          </div>
          <button class="icon-btn" id="resetBtn" type="button" title="이 장면 처음 상태로" aria-label="이 장면 처음 상태로">↺</button>
        </div>
        <div class="stage-canvas sc-wide"><canvas id="cvWide" aria-label="겨울 밤하늘의 별 밝기 비교, 빛의 세기 실험, 10 pc 거리 지도, 별 모형과 색"></canvas></div>
        <div class="stage-canvas sc-tall"><canvas id="cvTall" aria-label="겨울 밤하늘의 별 밝기 비교, 빛의 세기 실험, 10 pc 거리 지도, 별 모형과 색"></canvas></div>
      </section>
      <div class="readouts" id="readouts">
        <div class="readout" id="ro0"><span class="label"></span><span class="value"></span></div>
        <div class="readout" id="ro1"><span class="label"></span><span class="value"></span></div>
        <div class="readout" id="ro2"><span class="label"></span><span class="value"></span></div>
      </div>
      <section class="card data-card is-off" id="recCard" data-feature="record">
        <div class="data-head"><b>📋 실험 결과</b><span class="n" id="dataN">기록 0개</span><span class="n">가까운 것부터</span></div>
        <div class="data-scroll">
          <table class="data-table"><tbody>
            <tr id="rowD"><th>거리 (cm)</th></tr>
            <tr id="rowP"><th>빛의 세기 (lx)</th></tr>
          </tbody></table>
        </div>
      </section>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" id="cCmp" data-feature="compare">
          <div class="control-head"><label>⚖️ 시험 별의 등급</label><output id="oCmp"></output></div>
          <div class="btn-row">
            <button class="btn btn-primary" id="cmpBright" type="button">◀ 밝게</button>
            <button class="btn" id="cmpDim" type="button">어둡게 ▶</button>
          </div>
          <p class="ctrl-note">등급이 1 작아질 때마다 밝기는 몇 배씩 커질까요?</p>
        </div>
        <div class="control" id="cSensor" data-feature="sensor">
          <div class="control-head"><label for="sSensor">📱 센서의 위치</label><output id="oSensor"></output></div>
          <input type="range" id="sSensor" min="20" max="100" step="10" value="30">
          <p class="ctrl-note">화면 속 센서를 끌어도 돼요. (전구에서 20 cm 이상)</p>
        </div>
        <div class="control" id="cRec" data-feature="record">
          <div class="btn-row">
            <button class="btn btn-primary" id="recBtn" type="button">📍 기록</button>
            <button class="btn" id="clearBtn" type="button">지우기</button>
          </div>
        </div>
        <div class="control" id="cTemp" data-feature="heater">
          <div class="control-head"><label for="sTemp">🌡 별 모형의 표면 온도</label><output id="oTemp"></output></div>
          <input type="range" id="sTemp" min="0" max="1000" step="1" value="400">
          <p class="ctrl-note">화면 속 다이얼을 돌려도 돼요.</p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
