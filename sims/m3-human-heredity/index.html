<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16a34a">
  <title>사람의 유전 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👪</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-toolbar { min-height: 52px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; }
    .stage-hint { white-space: normal; width: max-content; max-width: calc(100% - 24px); text-align: center; }
    .stage-actions {
      flex: none; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      padding: 8px 12px; border-top: 1px solid var(--line); background: var(--surface); min-height: 62px;
    }
    .stage-actions .spacer { flex: 1; }
    .stage-actions .btn { min-height: 46px; }
    .stage-actions [hidden] { display: none !important; }
    #actions [data-scene] { display: none; }
    #actions[data-sc="cmp"] .tb-group[data-scene="cmp"],
    #actions[data-sc="twin"] .tb-group[data-scene="twin"] { display: inline-flex; }
    #actions[data-sc="cb"] .btn[data-scene="cb"],
    #actions[data-sc="cb"] .tgl[data-scene="cb"] { display: inline-flex; }
    .btn-go { padding: 10px 24px; font-size: 17px; }
    .btn-go[disabled] { opacity: .55; cursor: default; }
    .tb-group { display: inline-flex; align-items: center; gap: 8px; }
    .tb-label { font-size: 14px; font-weight: 800; color: var(--muted); }
    .segmented button { min-height: 40px; font-size: 15px; }
    .tgl {
      display: inline-flex; align-items: center; gap: 6px; min-height: 44px;
      border: 2px solid var(--line); background: var(--surface); color: var(--muted);
      border-radius: 999px; padding: 5px 16px; font-weight: 800; font-size: 15px; cursor: pointer;
    }
    .tgl[aria-pressed="true"] { color: #0b6b39; border-color: #86d3a8; background: #e8f8ef; }
    .target { animation: tgtPulse 1.1s ease-in-out infinite; }
    @keyframes tgtPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(20, 160, 88, 0); }
      50% { box-shadow: 0 0 0 6px rgba(20, 160, 88, .3); }
    }
    .step-intro .si-q {
      background: #fff; border: 2px solid color-mix(in srgb, var(--subject) 45%, white); border-radius: 12px;
      padding: 9px 12px; font-weight: 800; font-size: 16px; color: #14532d; margin: 4px 0 8px;
    }
    .mission-figure svg { max-width: 100%; height: auto; }
    .tbl-fill { border-collapse: collapse; width: 100%; font-size: 14.5px; margin: 2px 0; }
    .tbl-fill th, .tbl-fill td { border: 1px solid var(--line); padding: 4px 3px; text-align: center; }
    .tbl-fill th { background: var(--surface-2); font-weight: 800; font-size: 13px; }
    .tbl-fill td.k { font-weight: 800; background: #fafcff; }
    .tbl-fill select {
      min-height: 44px; min-width: 62px; font: inherit; font-weight: 800; border: 2px solid #b9c6d8; border-radius: 10px;
      background: #fff; color: var(--ink); padding: 0 4px;
    }
    .tbl-fill select.has { border-color: var(--subject); background: #f1fbf5; }
    .cards-note { font-size: 13px; color: var(--muted); margin: 2px 0 0; }
    .case-list { margin: 4px 0 6px; padding: 0; list-style: none; font-size: 14px; line-height: 1.45; }
    .case-list li { padding: 2px 0; }
    .case-list b { color: #0b6b39; margin-right: 4px; }
    .tbl-fill td.l { text-align: left; padding-left: 8px; font-weight: 800; }
    @media (max-width: 599px) {
      .stage-actions { gap: 8px; padding: 8px; }
      .btn-go { padding: 10px 16px; }
      .segmented button { padding-left: 9px; padding-right: 9px; font-size: 14px; }
      .tb-label { display: none; }
    }
  </style>
</head>
<body class="sim-page" data-subject="bio">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g3">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중3 · Ⅵ. 생식과 유전</div>
      <h1>사람의 유전</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="sceneTitle">🔍 사람의 유전 연구</span>
          <span class="spacer"></span>
          <span class="toolbar-label" id="sceneSub"></span>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="사람의 유전: 완두와 사람 비교, 쌍둥이, 가계도, ABO식 혈액형 퍼넷 사각형, 적록 색맹 가계도"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
        <div class="stage-actions" id="actions" data-sc="cmp">
          <div class="tb-group" data-scene="cmp">
            <span class="tb-label">비교 항목</span>
            <div class="segmented" id="cmpSeg" role="group" aria-label="비교 항목">
              <button type="button" data-k="0">세대 시간</button>
              <button type="button" data-k="1">자손 수</button>
              <button type="button" data-k="2">교배 실험</button>
              <button type="button" data-k="3">형질</button>
            </div>
          </div>
          <div class="tb-group" data-scene="twin">
            <div class="segmented" id="twSeg" role="group" aria-label="쌍둥이 종류">
              <button type="button" data-k="1" class="on">1란성</button>
              <button type="button" data-k="2">2란성</button>
            </div>
            <button class="btn" id="twPlay" type="button">▶ 다시 보기</button>
          </div>
          <button class="btn btn-primary btn-go" id="pathBtn" type="button" data-scene="cb">▶ 전달 경로 보기</button>
          <button class="tgl" id="chrBtn" type="button" aria-pressed="false" data-scene="cb">🧬 염색체 보기</button>
          <span class="spacer"></span>
          <button class="btn" id="resetBtn" type="button" title="처음 상태로">↺ 다시</button>
        </div>
      </section>
    </div>
    <aside class="side-col">
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
