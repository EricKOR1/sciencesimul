<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16a34a">
  <title>호흡계와 호흡 운동 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫁</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-card { background: #eef4ef; }
    .stage-toolbar { min-height: 61px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #sceneSeg button { min-height: 44px; padding: 6px 11px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard [hidden] { display: none !important; }
    .cgrp { display: flex; flex-direction: column; gap: 10px; }
    .cgrp .btn { min-height: 48px; font-size: 16px; }
    .cgrp .btn[disabled] { opacity: .45; cursor: default; }
    input[type=range] { height: 44px; }
    .ctrl-note { font-size: 13.5px; color: var(--muted); margin: 2px 0 0; line-height: 1.4; }
    .mission-figure svg { border-radius: 12px; }
    @media (max-width: 599px) {
      #sceneSeg { flex-wrap: nowrap; }
      #sceneSeg button { padding: 6px 10px; font-size: 14px; }
      #sceneSeg button:not(.on) .t { display: none; }
    }
  </style>
</head>
<body class="sim-page" data-subject="bio">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g2">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중2 · Ⅵ. 동물과 에너지</div>
      <h1>호흡계와 호흡 운동</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="sceneLabel">🫁 호흡 기관: 공기가 지나가는 길</span>
          <span class="spacer"></span>
          <div class="segmented" id="sceneSeg" role="tablist" aria-label="학습 장면">
            <button type="button" data-scene="airway" data-feature="airway" title="호흡 기관" aria-label="호흡 기관">🫁<span class="t"> 호흡 기관</span></button>
            <button type="button" data-scene="model" data-feature="model" title="호흡 모형" aria-label="호흡 모형">🧪<span class="t"> 모형</span></button>
            <button type="button" data-scene="chest" data-feature="chest" title="들숨과 날숨" aria-label="들숨과 날숨">💨<span class="t"> 들숨·날숨</span></button>
            <button type="button" data-scene="alveoli" data-feature="alveoli" title="폐포" aria-label="폐포">🔬<span class="t"> 폐포</span></button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="호흡계와 호흡 운동: 호흡 기관, 호흡 운동 모형, 갈비뼈와 가로막의 움직임, 폐포의 기체 교환을 살펴보는 화면"></canvas>
        </div>
      </section>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="cgrp" data-scene="airway">
          <button class="btn btn-subject" type="button" id="btnBreath">💨 숨 쉬기 시작</button>
          <p class="ctrl-note">파란 입자는 들이쉬는 공기, 주황색 입자는 내쉬는 공기예요.</p>
        </div>
        <div class="cgrp" data-scene="model" hidden>
          <button class="btn btn-subject" type="button" id="btnPull">👇 고무막 당기기</button>
          <p class="ctrl-note">노란 손잡이를 손가락으로 아래로 끌어도 돼요. 놓으면 고무막이 탄성으로 되돌아와요.</p>
        </div>
        <div class="cgrp" data-scene="chest" hidden>
          <button class="btn btn-subject" type="button" id="btnAutoBreath">🔁 자동으로 숨 쉬기</button>
          <p class="ctrl-note">노란 손잡이(갈비뼈)와 빨간 손잡이(가로막)를 위아래로 끌어 보세요.</p>
        </div>
        <div class="cgrp" data-scene="alveoli" hidden>
          <div class="control">
            <div class="control-head"><label for="sEx">🏃 운동 강도</label><output id="oEx">😌 쉬는 중</output></div>
            <input type="range" id="sEx" min="0" max="1" step="0.01" value="0" aria-label="운동 강도">
          </div>
          <p class="ctrl-note">강도를 올리면 혈액이 빨리 흐르고 숨도 빨라져요.</p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
