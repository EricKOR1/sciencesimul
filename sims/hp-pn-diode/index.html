<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>p-n 접합과 다이오드 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔺</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #tbSeg button { padding-left: 10px; padding-right: 10px; font-size: 14.5px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .seg-wrap { display: flex; flex-wrap: wrap; width: 100%; }
    .seg-wrap button { flex: 1 1 30%; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .num-in { width: 100%; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 16px var(--font); color: var(--ink); background: #fff; }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .in-grid { display: grid; grid-template-columns: 1fr 104px; gap: 6px 8px; align-items: center; margin-top: 6px; }
    .in-grid .lab { font-weight: 800; font-size: 14px; line-height: 1.25; }
    .in-grid .num-in { min-height: 40px; padding: 2px 8px; font-size: 15px; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
      #tbSeg button { padding-left: 7px; padding-right: 7px; font-size: 13.5px; }
    }
  </style>

</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hp">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">물리학 · Ⅲ. 빛과 물질</div>
      <h1>p-n 접합과 다이오드</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">—</span>
          <span class="spacer"></span>
          <div class="segmented" id="tbSeg" role="group" aria-label="화면 고르기" hidden></div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="p-n 접합과 공핍층, 전압에 따른 전류, 정류 회로와 파형, LED와 태양 전지"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <!-- ① 접합 -->
        <div class="control" data-modes="junc" data-hide="fld">
          <div class="control-head"><span>🔗 p형과 n형 맞대기</span></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bJoin" type="button">🔗 접합하기</button><button class="btn btn-sm" id="bSep" type="button">↩ 떼어 내기</button></div>
          <p class="ctrl-note" id="jNote">두 반도체를 맞대면 접합면에서 어떤 일이 생길까요?</p>
        </div>
        <div class="control" data-modes="junc" data-need="fld">
          <div class="control-head"><span>🧭 접합면의 전기장과 전위</span></div>
          <div id="fldRows"></div>
        </div>
        <!-- ② 전압 방향 -->
        <div class="control" data-modes="iv">
          <div class="control-head"><label for="sVs">🔋 전원 전압 V<sub>s</sub></label><output id="oVs">0.00 V</output></div>
          <div class="range-row"><input type="range" id="sVs" min="-5" max="2" step="0.05" value="0" aria-label="전원 전압 (마이너스 5부터 2 볼트)"></div>
          <p class="ctrl-note" id="vNote">+ 값: p형에 + 극을 연결 (순방향) · − 값: 반대로 연결 (역방향)</p>
        </div>
        <div class="control" data-modes="iv">
          <div class="control-head"><span>📏 I–V 그래프 만들기</span></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bRec" type="button">📏 이 점 기록하기</button><button class="btn btn-sm" id="bRecClear" type="button">🗑 지우기</button></div>
        </div>
        <!-- ③ 정류 -->
        <div class="control" data-modes="rect">
          <div class="control-head"><span>🔌 정류 회로</span></div>
          <div class="segmented view-seg" id="rmSeg" role="group" aria-label="정류 회로 고르기">
            <button type="button" data-v="half">다이오드 1개</button>
            <button type="button" data-v="bridge">다이오드 4개 (브리지)</button>
          </div>
        </div>
        <div class="control" data-modes="rect">
          <div class="control-head"><span>🔋 부하와 병렬로 축전기</span></div>
          <div class="segmented view-seg" id="capSeg" role="group" aria-label="축전기 연결">
            <button type="button" data-v="off">없음</button>
            <button type="button" data-v="on">연결</button>
          </div>
        </div>
        <div class="control" data-modes="rect" data-sub="half">
          <div class="btn-row"><button class="btn btn-sm" id="bFlip" type="button">🔄 다이오드 방향 뒤집기</button></div>
        </div>
        <div class="control" data-modes="rect" data-sub="bridge">
          <p class="ctrl-note">화면의 다이오드를 눌러 방향을 하나씩 뒤집어요. 전류는 삼각형(▶) 방향으로만 흘러요.</p>
        </div>
        <!-- ④ LED · 태양 전지 -->
        <div class="control" data-modes="led" data-sub="led">
          <div class="control-head"><span>🎨 LED 색 (띠 간격)</span></div>
          <div class="segmented view-seg" id="colSeg" role="group" aria-label="LED 색">
            <button type="button" data-v="red">빨강</button>
            <button type="button" data-v="green">초록</button>
            <button type="button" data-v="blue">파랑</button>
          </div>
        </div>
        <div class="control" data-modes="led" data-sub="led">
          <div class="control-head"><span>🧱 전류 제한 저항 R</span></div>
          <div class="segmented seg-wrap" id="rSeg" role="group" aria-label="저항 고르기"></div>
        </div>
        <div class="control" data-modes="led" data-sub="led">
          <div class="control-head"><span>🔋 전지 연결</span></div>
          <div class="segmented view-seg" id="polSeg" role="group" aria-label="전지 방향">
            <button type="button" data-v="fwd">정방향 (+ → p)</button>
            <button type="button" data-v="rev">반대로</button>
          </div>
        </div>
        <div class="control" data-modes="led" data-sub="sol">
          <div class="control-head"><span>💡 비추는 빛</span></div>
          <div class="segmented view-seg" id="slSeg" role="group" aria-label="빛 고르기">
            <button type="button" data-v="vis">가시광 550 nm</button>
            <button type="button" data-v="ir">적외선 1300 nm</button>
          </div>
        </div>
        <div class="control" data-modes="led" data-sub="sol">
          <div class="control-head"><label for="sInt">☀️ 빛의 세기</label><output id="oInt">50 %</output></div>
          <div class="range-row"><input type="range" id="sInt" min="0" max="100" step="5" value="50" aria-label="빛의 세기 (0부터 100 퍼센트)"></div>
        </div>

      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
