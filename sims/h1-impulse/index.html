<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>충격량과 운동량 | 고1 통합과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--phy); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .seg-wrap { display: flex; flex-wrap: wrap; width: 100%; }
    .seg-wrap button { flex: 1 1 44%; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14.5px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--phy); background: color-mix(in srgb, var(--phy) 14%, white); color: #9a3412; }
    #presetSeg { margin-top: 8px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .match-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .match-row .lab { flex: 1; font-weight: 800; font-size: 14.5px; min-width: 0; line-height: 1.25; }
    .match-row .segmented { flex: none; }
    .match-row .segmented button { min-height: 40px; padding: 4px 10px; font-size: 13.5px; }
    .match-row.ok .lab { color: #0b6b39; }
    .match-row.bad { animation: shakeX .38s; }
    .match-row.bad .lab { color: #a3262b; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar:has(> .segmented[hidden]) { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#h1a">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">통합과학1 · Ⅲ. 시스템과 상호작용</div>
      <h1>충격량과 운동량</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🥚 충격 느끼기</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="cart">
            <button type="button" data-mode="egg" data-feature="egg">🥚 충격 느끼기</button>
            <button type="button" data-mode="cart" data-feature="cart">⚖️ 충격량 측정</button>
            <button type="button" data-mode="time" data-feature="time">⏱️ 시간과 힘</button>
            <button type="button" data-mode="design" data-feature="design">🛡️ 안전 설계</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="달걀 낙하 실험과 힘–시간 그래프, 충돌 수레 실험, 충돌 시간과 힘의 관계, 충돌 보호 장치 설계 시험"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">충돌 시간</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">힘</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">속도 변화</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <!-- ① 달걀 -->
        <div class="control" data-modes="egg">
          <div class="control-head"><span>🧱 바닥 고르기</span></div>
          <div class="segmented view-seg" id="floorSeg" role="group" aria-label="바닥 종류">
            <button type="button" data-floor="concrete">콘크리트</button>
            <button type="button" data-floor="cushion">방석</button>
            <button type="button" data-floor="sponge">스펀지</button>
          </div>
          <div class="btn-row">
            <button class="btn btn-sm btn-primary" id="bDrop" type="button">🥚 떨어뜨리기</button>
            <button class="btn btn-sm" id="bEggReset" type="button">↺ 다시</button>
          </div>
          <p class="ctrl-note">같은 높이(1.0 m)에서 달걀(60 g)을 떨어뜨려요. 힘 센서가 충돌하는 동안의 힘을 재요.</p>
        </div>
        <!-- ② 수레 -->
        <div class="control" data-modes="cart">
          <div class="control-head"><span>🛒 수레 질량</span></div>
          <div class="segmented view-seg" id="massSeg" role="group" aria-label="수레 질량">
            <button type="button" data-m="0.5">0.5 kg</button>
            <button type="button" data-m="1">1.0 kg</button>
          </div>
        </div>
        <div class="control" data-modes="cart">
          <div class="control-head"><label for="sSpeed">➡️ 처음 속력</label><output id="oSpeed">2 m/s</output></div>
          <div class="range-row"><input type="range" id="sSpeed" min="1" max="4" step="1" value="2" aria-label="수레의 처음 속력 (1부터 4 m/s)"></div>
          <div class="btn-row">
            <button class="btn btn-sm btn-primary" id="bMeasure" type="button">📏 측정하기</button>
            <button class="btn btn-sm" id="bCartClear" type="button">🗑 기록 지우기</button>
          </div>
          <p class="ctrl-note">수레가 점토 범퍼에 부딪혀 멈추는 동안 힘 센서가 힘을 재요.</p>
        </div>
        <!-- ③ 시간과 힘 -->
        <div class="control" data-modes="time">
          <div class="control-head"><label for="sDt">⏱️ 충돌 시간 Δt</label><output id="oDt">0.05 s</output></div>
          <div class="range-row">
            <button class="nudge" id="dtMinus" type="button" aria-label="0.01초 줄이기">−</button>
            <input type="range" id="sDt" min="0.01" max="0.5" step="0.01" value="0.05" aria-label="충돌 시간 (0.01초부터 0.5초까지)">
            <button class="nudge" id="dtPlus" type="button" aria-label="0.01초 늘리기">+</button>
          </div>
          <div class="segmented view-seg" id="presetSeg" role="group" aria-label="에어백 켜고 끄기">
            <button type="button" data-p="0.05">에어백 없음 0.05 s</button>
            <button type="button" data-p="0.2">에어백 있음 0.20 s</button>
          </div>
          <div class="btn-row">
            <button class="btn btn-sm btn-primary" id="bTimeRun" type="button">💥 충돌 시험</button>
          </div>
          <p class="ctrl-note">60 kg 인형이 15 m/s(시속 54 km)로 달리다 멈춰요. 멈추는 데 걸리는 시간을 바꿔 보세요.</p>
        </div>
        <div class="control" data-modes="time" data-match>
          <div class="control-head"><span>🔗 시간이 길어지는 방법 고르기</span></div>
          <div id="matchRows"></div>
        </div>
        <!-- ④ 설계 -->
        <div class="control" data-modes="design">
          <div class="control-head"><span>🛡️ 보호 장치 (최대 2가지)</span></div>
          <div class="chips" id="devChips">
            <button type="button" data-dev="belt">🪢 안전벨트 늘어짐</button>
            <button type="button" data-dev="bag">🎈 에어백</button>
            <button type="button" data-dev="crumple">🚗 크럼플 존</button>
          </div>
        </div>
        <div class="control" data-modes="design">
          <div class="control-head"><label for="sCush">🧽 쿠션 두께</label><output id="oCush">0 cm</output></div>
          <div class="range-row"><input type="range" id="sCush" min="0" max="10" step="1" value="0" aria-label="쿠션 두께 (0부터 10센티미터)"></div>
          <div class="btn-row">
            <button class="btn btn-sm btn-primary" id="bTest" type="button">🧪 시험하기</button>
            <button class="btn btn-sm" id="bDesignReset" type="button">↺ 다시</button>
          </div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
