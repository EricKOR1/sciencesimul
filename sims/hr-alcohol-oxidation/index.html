<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#8b5cf6">
  <title>알코올의 산화와 음주 측정기 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍷</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; line-height: 1.4; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .seg-wrap { display: flex; flex-wrap: wrap; width: 100%; }
    .seg-wrap button { flex: 1 1 30%; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14.5px; }
    .seg-wrap.two button { flex-basis: 44%; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 16px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); font-family: inherit; }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .nudge:disabled { opacity: .4; }
    .opt-col { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .opt { min-height: 46px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; padding: 6px 10px; font-family: inherit; line-height: 1.3; text-align: left; }
    .opt.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .opt.ok { border-color: var(--good); background: var(--good-soft); color: #0b6b39; }
    .opt.bad { border-color: var(--bad); background: var(--bad-soft); color: #a3262b; }
    .opt:disabled { opacity: .55; cursor: default; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); font-family: inherit; }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .chips button.done { border-color: var(--good); background: var(--good-soft); }
    .num-in { width: 100%; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 16px var(--font); color: var(--ink); background: #fff; }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .in-grid { display: grid; grid-template-columns: 1fr 104px; gap: 6px 8px; align-items: center; margin-top: 6px; }
    .in-grid .lab { font-weight: 800; font-size: 14px; line-height: 1.25; }
    .in-grid .num-in { min-height: 42px; padding: 2px 8px; font-size: 15px; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .readout .value sup { font-size: .62em; line-height: 0; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    sup { font-size: .7em; line-height: 0; }
    sub { font-size: .7em; line-height: 0; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; white-space: normal; width: max-content; text-align: center; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar:has(> .segmented[hidden]) { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }

    .sci-line { margin-top: 8px; }
    .sci-line .lab { display: block; font-weight: 800; font-size: 14px; line-height: 1.25; margin-bottom: 3px; }
    .sci-in { display: flex; align-items: center; gap: 6px; }
    .sci-in .num-in { min-height: 42px; padding: 2px 8px; font-size: 15px; }
    .sci-in .num-in.c { flex: 1 1 0; }
    .sci-in .num-in.e { flex: 0 0 72px; width: 72px; }
    .sci-in .x { font-weight: 800; font-size: 14px; white-space: nowrap; }
    .row-line { margin-top: 8px; }
    .row-line .lab { display: block; font-weight: 800; font-size: 14px; line-height: 1.25; margin-bottom: 3px; }
    .row-line .in-wrap { display: flex; align-items: center; gap: 6px; }
    .row-line .in-wrap .unit { font-weight: 800; font-size: 14px; color: var(--muted); white-space: nowrap; }
    .row-line .num-in { min-height: 42px; padding: 2px 8px; font-size: 15px; }
    .ord-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .ord-list .opt { position: relative; padding-left: 40px; }
    .ord-list .opt .no { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%; background: var(--line); color: #fff; font-weight: 900; font-size: 14px; display: grid; place-items: center; }
    .ord-list .opt.on .no { background: var(--subject); }
    .tbl-in { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 14px; }
    .chips button.bad { border-color: var(--bad); background: var(--bad-soft); color: #a3262b; }
  
    .in-grid select.sel-in { min-height: 42px; }
  
    .coef-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; margin-top: 6px; }
    .stp-cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .stp-cell .lab { font-weight: 800; font-size: 14px; line-height: 1.2; }
    .stp { display: flex; align-items: center; gap: 4px; }
    .stp output { flex: 1; min-width: 28px; text-align: center; font-weight: 900; font-size: 17px; }
    .stp .nudge:disabled { opacity: .35; }
    .stp-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .stp-row .lab { flex: 1; font-weight: 800; font-size: 14px; line-height: 1.25; }
    .stp-row .stp { flex: none; width: 150px; }
    .hf { margin-top: 8px; padding: 8px; border-radius: 12px; background: var(--surface-2); }
    .hf .lab { display: block; font-weight: 800; font-size: 14px; margin-bottom: 4px; }
    .hf .chips { margin-top: 0; }
    .hf .chips button { flex: 1; }
    .hf .stp { margin-top: 6px; }
    .hf.dis { opacity: .45; pointer-events: none; }
  
    .sel-row { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .sel-row .lab { font-weight: 800; font-size: 14px; line-height: 1.25; }
    .tbl-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; align-items: center; }
    .tbl-row .lab { grid-column: 1 / -1; font-weight: 800; font-size: 14px; }
    .tbl-row .sel-in, .sel-row .sel-in { min-height: 42px; font-size: 14px; }
    .formula-in { display: grid; grid-template-columns: 1fr 96px; gap: 6px 8px; align-items: center; margin-top: 6px; }
    .formula-in .lab { font-weight: 800; font-size: 14px; }
    .chips button.bad { border-color: var(--bad); background: var(--bad-soft); color: #a3262b; }
    .chips button:disabled { opacity: .5; cursor: default; }
    .seg-wrap button { white-space: normal; line-height: 1.2; }
  </style>

</head>
<body class="sim-page" data-subject="chem">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hr">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">화학 반응의 세계 · Ⅲ. 탄소 화합물과 반응</div>
      <h1>알코올의 산화와 음주 측정기</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🍷 작용기 변화 따라가기</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="stages">
            <button type="button" data-mode="stages" data-feature="stages">🍷 변화</button>
            <button type="button" data-mode="ox" data-feature="ox">🔢 산화수</button>
            <button type="button" data-mode="tube" data-feature="tube">🧪 측정기</button>
            <button type="button" data-mode="liver" data-feature="liver">🫀 몸속</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="에탄올이 아세트알데하이드를 거쳐 아세트산으로 산화되는 분자 모형 장면, 작용기 탄소의 산화수와 전자 수를 맞추는 장면, 다이크로뮴산 이온의 색이 주황에서 녹색으로 변하는 음주 측정기 관 장면, 간에서 알코올이 단계적으로 분해되는 장면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="stages">
          <div class="control-head"><span>🍷 산화 단계</span></div>
          <div class="btn-row"><button class="btn btn-sm" id="stBack" type="button">◀ 이전</button><button class="btn btn-sm btn-primary" id="stNext" type="button">산화 ▶</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="stReset" type="button">↺ 에탄올부터 다시</button></div>
          <div class="control-head" style="margin-top:10px"><span>🏷️ 작용기 이름표</span></div>
          <div id="lbSel"></div>
        </div>
        <div class="control" data-modes="ox" data-gate="scale all">
          <div class="control-head"><span>🔢 작용기 탄소의 산화수</span></div>
          <div id="oxBox"></div>
          <p class="ctrl-note">부호를 붙여 써요. 예: +2, −1 (또는 -1)</p>
        </div>
        <div class="control" data-modes="ox" data-gate="bal all">
          <div class="control-head"><span>⚖️ 반응하는 분자 수</span></div>
          <div id="balBox"></div>
          <p class="ctrl-note">잃는 전자 수 = 얻는 전자 수가 되는 가장 작은 수를 찾아요.</p>
        </div>
        <div class="control" data-modes="tube" data-gate="meas all">
          <div class="control-head"><span>🌬️ 날숨의 에탄올 농도</span></div>
          <div class="range-row"><input type="range" id="alcRange" min="0" max="30" step="1" value="15" aria-label="날숨 에탄올 농도"><output id="alcOut" style="min-width:76px;font-weight:800;text-align:right">0.15 mg/L</output></div>
          <div class="chips seg-wrap" id="tbPre" role="group" aria-label="농도 고르기"></div>
        </div>
        <div class="control" data-modes="tube" data-gate="judge all">
          <div class="control-head"><span>🧑 측정 대상</span></div>
          <div class="chips seg-wrap" id="tbPer" role="group" aria-label="사람 고르기"></div>
        </div>
        <div class="control" data-modes="tube" data-gate="meas judge all">
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="tbBlow" type="button">😮‍💨 후~ 불기</button></div>
        </div>
        <div class="control" data-modes="tube" data-gate="judge all">
          <div class="control-head"><span>📋 판정 (기준 0.15 mg/L)</span></div>
          <div id="judgeBox"></div>
        </div>
        <div class="control" data-modes="liver">
          <div class="control-head"><span>🍷 마신 물질</span></div>
          <div class="chips seg-wrap two" id="lvSub" role="group" aria-label="마신 물질 고르기"></div>
          <div class="chips seg-wrap two" id="lvEnz" role="group" aria-label="효소 활성 고르기"></div>
          <div id="lvBox"></div>
          <div class="control-head" style="margin-top:8px"><span>🎯 예측</span></div>
          <div class="chips seg-wrap two" id="lvPred" role="group" aria-label="예측 고르기"></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="lvRun" type="button">먼저 예측을 골라요</button><button class="btn btn-sm" id="lvReset" type="button">↺</button></div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
