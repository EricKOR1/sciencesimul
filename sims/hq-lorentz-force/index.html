<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>로런츠 힘 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .seg-wrap { display: flex; flex-wrap: wrap; width: 100%; }
    .seg-wrap button { flex: 1 1 44%; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .nudge:disabled { opacity: .4; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok, .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad, .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    .numrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .numrow .q { flex: 1 1 100%; font-weight: 800; font-size: 14px; line-height: 1.3; margin-bottom: 2px; }
    .numrow .pre, .numrow .unit { font-weight: 800; font-size: 15px; }
    .num-in { width: 84px; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 16px var(--font); color: var(--ink); background: #fff; text-align: right; }
    select.num-in { width: auto; text-align: left; padding-right: 4px; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .chips button:disabled { opacity: .45; cursor: not-allowed; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar:has(> .segmented[hidden]) { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hq">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">전자기와 양자 · Ⅰ. 전자기적 상호작용</div>
      <h1>로런츠 힘</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🧭 힘의 조건</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="mag">
            <button type="button" data-mode="cond" data-feature="cond">🧭 힘의 조건</button><button type="button" data-mode="mag" data-feature="mag">📐 힘의 크기</button><button type="button" data-mode="orb" data-feature="orb">🌀 원운동</button><button type="button" data-mode="trk" data-feature="trk">🔍 궤적 해석</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="자기장 속에서 움직이는 전하가 받는 로런츠 힘의 조건과 크기, 원운동의 반지름과 주기를 알아보고 거품 상자 궤적 사진에서 정보를 읽는 화면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="cond">
          <div class="control-head"><span>🎯 전하를 쏘는 방향</span></div>
          <div class="segmented seg-wrap" id="caseSeg" role="group" aria-label="🎯 전하를 쏘는 방향"><button type="button" data-v="rest">정지</button><button type="button" data-v="par">B와 나란히</button><button type="button" data-v="perp">B에 수직</button><button type="button" data-v="obl">비스듬히 30°</button></div>
        </div>
        <div class="control" data-modes="cond">
          <div class="segmented view-seg" id="qSeg" role="group" aria-label="전하의 부호"><button type="button" data-v="1">＋ 양전하</button><button type="button" data-v="-1">− 음전하(전자)</button></div>
          <div class="segmented view-seg" id="fieldSeg" role="group" aria-label="장의 종류" style="margin-top:8px"><button type="button" data-v="B">자기장 B</button><button type="button" data-v="E">전기장 E</button></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bLaunch" type="button">▶ 발사</button><button class="btn btn-sm" id="bClear" type="button">↺ 지우기</button></div>
        </div>
        <div class="control" data-modes="cond" data-gate="mc2" id="sel1Host"></div>
        <div class="control" data-modes="mag" data-gate-off="mm1">
          <div class="control-head"><span>🖼️ 화면</span></div>
          <div class="segmented view-seg" id="viewSeg" role="group" aria-label="🖼️ 화면"><button type="button" data-v="vec">힘 벡터</button><button type="button" data-v="run">달리는 입자</button><button type="button" data-v="wire">도선 확대</button></div>
        </div>
        <div class="control" data-modes="mag" data-view="vec run" data-gate-off="mm1">
          <div class="control-head"><span>🔋 전하량 |q|</span></div>
          <div class="segmented view-seg" id="q2Seg" role="group" aria-label="🔋 전하량 |q|"><button type="button" data-v="1">1e</button><button type="button" data-v="2">2e</button></div>
        </div>
        <div class="control" data-modes="mag" data-view="vec run" data-gate-off="mm1">
          <div class="control-head"><label for="sv2">🚀 속력 v</label><output id="osv2"></output></div><div class="range-row"><button class="nudge" id="sv2M" type="button" aria-label="속력 (1부터 4, 단위 10의 6제곱 미터 매 초) 줄이기">−</button><input type="range" id="sv2" min="1" max="4" step="1" value="2" aria-label="속력 (1부터 4, 단위 10의 6제곱 미터 매 초)"><button class="nudge" id="sv2P" type="button" aria-label="속력 (1부터 4, 단위 10의 6제곱 미터 매 초) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="mag" data-gate-off="mm1">
          <div class="control-head"><label for="sB2">🧲 자기장 B</label><output id="osB2"></output></div><div class="range-row"><button class="nudge" id="sB2M" type="button" aria-label="자기장 (0.5밀리테슬라부터 1.5밀리테슬라) 줄이기">−</button><input type="range" id="sB2" min="0.5" max="1.5" step="0.5" value="1" aria-label="자기장 (0.5밀리테슬라부터 1.5밀리테슬라)"><button class="nudge" id="sB2P" type="button" aria-label="자기장 (0.5밀리테슬라부터 1.5밀리테슬라) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="mag" data-view="vec run" data-gate-off="mm1">
          <div class="control-head"><label for="sTh">📐 각도 θ</label><output id="osTh"></output></div><div class="range-row"><button class="nudge" id="sThM" type="button" aria-label="속도와 자기장 사이의 각 (0도부터 90도) 줄이기">−</button><input type="range" id="sTh" min="0" max="90" step="15" value="90" aria-label="속도와 자기장 사이의 각 (0도부터 90도)"><button class="nudge" id="sThP" type="button" aria-label="속도와 자기장 사이의 각 (0도부터 90도) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="mag" data-gate="mm1" id="numFHost"></div>
        <div class="control" data-modes="orb" data-gate-off="mo2">
          <div class="control-head"><span>⚛️ 입자</span></div>
          <div class="segmented view-seg" id="spSeg" role="group" aria-label="⚛️ 입자"><button type="button" data-v="e">전자 −</button><button type="button" data-v="p">양성자 +</button><button type="button" data-v="pos">양전자 +</button></div>
        </div>
        <div class="control" data-modes="orb" data-gate-off="mo2">
          <div class="control-head"><label for="sv3">🚀 속력 v</label><output id="osv3"></output></div><div class="range-row"><button class="nudge" id="sv3M" type="button" aria-label="속력 줄이기">−</button><input type="range" id="sv3" min="1" max="4" step="0.5" value="2" aria-label="속력"><button class="nudge" id="sv3P" type="button" aria-label="속력 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="orb" data-gate-off="mo2">
          <div class="control-head"><label for="sB3">🧲 자기장 B</label><output id="osB3"></output></div><div class="range-row"><button class="nudge" id="sB3M" type="button" aria-label="자기장 줄이기">−</button><input type="range" id="sB3" min="0.5" max="2" step="0.1" value="1" aria-label="자기장"><button class="nudge" id="sB3P" type="button" aria-label="자기장 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="orb" data-gate-off="mo2"><div class="btn-row"><button class="btn btn-sm" id="bTheta" type="button">↗ 입사각</button></div><div class="btn-row"><button class="btn btn-sm btn-primary" id="bCmp" type="button">👥 비교</button></div></div>
        <div class="control" data-modes="orb" data-gate="mo2" id="numTHost"></div>
        <div class="control" data-modes="trk" data-gate-off="mt4">
          <div class="control-head"><span>🖼️ 그림 고르기</span></div>
          <div class="segmented view-seg" id="fig4Seg" role="group" aria-label="🖼️ 그림 고르기"><button type="button" data-v="a">그림 가</button><button type="button" data-v="b">그림 나</button><button type="button" data-v="c">그림 다</button></div>
        </div>
        <div class="control" data-modes="trk" data-gate-off="mt4" id="fastHost"></div>
        <div class="control" data-modes="trk" data-gate="mt4"><div id="sel4Host"></div><div id="numPHost"></div><div id="numVHost"></div></div>

      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
