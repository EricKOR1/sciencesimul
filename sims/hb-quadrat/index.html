<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16a34a">
  <title>방형구법으로 군집 조사 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 58px; }
    .stage-toolbar .segmented { flex-wrap: wrap; }
    .stage-toolbar .segmented button { min-height: 40px; padding: 5px 10px; font-size: 14px; white-space: nowrap; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard [hidden] { display: none !important; }
    .btn-sm { min-height: 44px; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .ctrl-note { margin: 6px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
    .ctrl-note b { color: var(--ink); }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .seg-full { display: flex; width: 100%; }
    .seg-full button { flex: 1 1 0; min-width: 0; min-height: 44px; font-size: 14.5px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 14px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); }
    .chip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    .chip-grid button { min-height: 44px; padding: 6px 8px; border: 2px solid var(--line); background: #fff; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; color: var(--ink); text-align: center; }
    .chip-grid button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); }
    .chip-grid button:active, .chips button:active { transform: scale(.98); }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row:first-of-type { margin-top: 4px; }
    .sel-row .q { font-weight: 800; font-size: 13.5px; margin-bottom: 3px; line-height: 1.25; }
    .num-in { width: 100%; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 16px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: #fff; text-align: right; }
    .num-in:focus { outline: none; border-color: var(--subject); }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .in-grid { display: grid; gap: 6px 8px; align-items: center; margin-top: 6px; }
    .in-grid .lab { font-weight: 800; font-size: 13.5px; line-height: 1.25; }
    .in-grid .hd { font-weight: 800; font-size: 12.5px; color: var(--muted); text-align: center; }
    .in-unit { font-size: 12.5px; color: var(--muted); font-weight: 700; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (max-width: 599px) {
      .readout .value { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar .segmented button { padding: 5px 8px; font-size: 13.5px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
    #modeSeg button.lv-off { display: none; }
    .num-in.sm { padding: 4px 6px; font-size: 15px; min-width: 0; }
    .btn.done { background: var(--good-soft); border-color: var(--good); color: #0b6b39; }

  </style>
</head>
<body class="sim-page" data-subject="bio">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hb">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">생명과학 · Ⅰ. 생명 시스템의 구성</div>
      <h1>방형구법으로 군집 조사</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🗺️ 가상 초지: 방형구 설치</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기">
            <button type="button" data-mode="field" data-lv="1" data-feature="field">🗺️ 초지</button>
            <button type="button" data-mode="zoom" data-lv="1" data-feature="zoom">🔍 방형구 세기</button>
            <button type="button" data-mode="table" data-lv="2" data-feature="table">📋 기록표</button>
            <button type="button" data-mode="iv" data-lv="3" data-feature="iv">👑 중요치</button>
            <button type="button" data-mode="area" data-lv="4" data-feature="area">📈 군집 해석</button>
            <button type="button" data-mode="layer" data-lv="4" data-feature="layer">🌲 수직 분포</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="가상 초지에 방형구를 설치하는 항공 시점 화면, 방형구 확대 식물 세기, 기록표와 밀도 빈도 피도 계산, 중요치 막대그래프, 종 수와 방형구 수 곡선, 종 다양성 비교, 숲의 수직 분포"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="field">
          <div class="control-head"><span>🎲 방형구 설치 방법</span></div>
          <div class="segmented seg-full" id="qmode" role="group" aria-label="방형구 설치 방법">
            <button type="button" data-m="rand">🎲 무작위 좌표</button>
            <button type="button" data-m="free">👆 내가 고르기</button>
          </div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bThrow" type="button">🎲 방형구 던지기</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="bQClear" type="button">↺ 방형구 모두 거두기</button></div>
          <p class="ctrl-note" id="fldNote"></p>
        </div>
        <div class="control" data-modes="zoom">
          <div class="control-head"><span>🔍 방형구 열어 보기</span></div>
          <div class="btn-row"><button class="btn btn-sm" id="bZPrev" type="button">◀ 이전</button><button class="btn btn-sm" id="bZNext" type="button">다음 ▶</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="bZBack" type="button">🗺️ 초지로 돌아가기</button></div>
          <p class="ctrl-note" id="zoomNote"></p>
        </div>
        <div class="control" data-modes="table">
          <div class="control-head"><span>📋 합계와 출현 구하기</span></div>
          <div class="btn-row"><button class="btn btn-sm" id="bSum" type="button">Σ 합계 구하기</button><button class="btn btn-sm" id="bOcc" type="button">출현한 방형구 세기</button></div>
          <div class="control-head" style="margin-top:12px"><span>✍️ 종별 값 입력</span></div>
          <div class="in-grid" id="recIn"></div>
          <p class="ctrl-note" id="recNote"></p>
        </div>
        <div class="control" data-modes="iv">
          <div class="control-head"><span>🧮 상대값(%)과 중요치</span></div>
          <div class="in-grid" id="ivIn"></div>
          <div class="control-head" style="margin-top:10px"><label for="domSel">👑 우점종</label></div>
          <select class="sel-in" id="domSel" aria-label="우점종 고르기"><option value="">— 우점종 고르기 —</option><option value="0">A 토끼풀</option><option value="1">B 질경이</option><option value="2">C 쑥</option><option value="3">D 강아지풀</option></select>
          <p class="ctrl-note" id="ivNote"></p>
        </div>
        <div class="control" data-modes="area">
          <div class="control-head"><label for="sN">📈 방형구 수</label><output id="oN">3개</output></div>
          <div class="range-row"><input type="range" id="sN" min="1" max="10" step="1" value="3" aria-label="방형구 수 (1에서 10개)"></div>
          <div class="sel-row"><div class="q">방형구를 더 늘려야 할까요?</div>
            <select class="sel-in" id="selSuff" aria-label="조사가 충분한지"><option value="">— 고르기 —</option><option value="0">더 늘려야 해요 (아직 종이 늘고 있어요)</option><option value="1">충분해요 (더 늘려도 종이 늘지 않아요)</option></select></div>
          <div class="sel-row"><div class="q">종 다양성이 더 높은 초지는?</div>
            <select class="sel-in" id="selDiv" aria-label="종 다양성이 높은 초지"><option value="">— 고르기 —</option><option value="X">초지 X</option><option value="Y">초지 Y</option><option value="S">같아요</option></select></div>
        </div>
        <div class="control" data-modes="layer">
          <div class="control-head"><span>🌲 숲의 층 이름 붙이기</span></div>
          <p class="ctrl-note">왼쪽 <b>이름표</b>를 누를 때마다 <b>교목층 → 아교목층 → 관목층 → 초본층</b> 순서로 바뀌어요.</p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
