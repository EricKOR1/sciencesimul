<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#64748b">
  <title>지속가능한 삶과 과학기술 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌏</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-toolbar { min-height: 52px; padding: 6px 10px; }
    .toolbar-label { font-weight: 800; color: #3a4456; font-size: 15px; padding-left: 4px; min-width: 0; flex: 1 1 auto;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .toolbar-label small { font-weight: 700; color: var(--muted); }
    #viewSeg button { min-height: 40px; padding: 6px 12px; font-size: 14px; }
    .sim-title { min-width: 0; }

    /* 조작 카드 */
    #ctrlCard { display: flex; flex-direction: column; gap: 8px; }
    .ctrl-title { font-weight: 800; font-size: 15px; color: var(--muted); }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-row[hidden] { display: none; }
    .btn-row .btn { flex: 1 1 auto; min-width: 0; min-height: 48px; padding: 8px 12px; }
    .btn[disabled] { opacity: .5; cursor: not-allowed; }
    .ctrl-note { font-size: 13.5px; color: var(--muted); margin: 0; min-height: 1.2em; }
    .ctrl-note[hidden] { display: none; }
    .mission-figure .fig-big { font-size: 32px; line-height: 1.3; white-space: nowrap; }

    @media (max-width: 599px) {
      .toolbar-label { font-size: 14px; }
      .sim-unit { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #viewSeg button { padding: 6px 8px; font-size: 13px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="sci">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g1">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중1 · Ⅰ. 과학과 인류의 지속가능한 삶</div>
      <h1>지속가능한 삶과 과학기술</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="sceneLabel">🌏 우리 마을의 미래 <small>· 지금처럼 쓴다면</small></span>
          <div class="segmented" id="viewSeg" role="group" aria-label="장면 고르기" hidden>
            <button type="button" data-view="meters">📊 계기판</button>
            <button type="button" data-view="power">⚡ 마을 전기</button>
            <button type="button" data-view="plan">📝 계획</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="우리 마을과 지구 계기판, 하루 전력 그래프, 실천 카드, 나의 실천 계획과 지구 나무를 보여 주는 실험 화면"></canvas>
        </div>
      </section>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="ctrl-title" id="ctrlTitle"></div>
        <div class="btn-row" id="yrRow" hidden>
          <button class="btn btn-primary" id="yrNext" type="button">⏩ 10년 뒤로</button>
          <button class="btn" id="yrReset" type="button">↺ 2025년으로</button>
        </div>
        <div class="btn-row" id="runRow" hidden>
          <button class="btn btn-primary" id="runBtn" type="button">▶ 하루 돌려 보기</button>
          <button class="btn" id="clearBtn" type="button">↺ 처음 상태</button>
        </div>
        <div class="btn-row" id="wxRow" hidden>
          <button class="btn" id="wxBtn" type="button">☀️ 맑은 날 · 눌러서 흐리게</button>
        </div>
        <div class="btn-row" id="saveRow" hidden>
          <button class="btn btn-good" id="saveBtn" type="button">📥 계획표 저장</button>
        </div>
        <p class="ctrl-note" id="ctrlNote"></p>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
