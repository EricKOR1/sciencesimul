<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>소자와 에너지 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔋</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .seg-wrap { display: flex; flex-wrap: wrap; width: 100%; }
    .seg-wrap button { flex: 1 1 44%; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .nudge:disabled { opacity: .4; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok, .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad, .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    .numrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .numrow .q { flex: 1 1 100%; font-weight: 800; font-size: 14px; line-height: 1.3; margin-bottom: 2px; }
    .numrow .pre, .numrow .unit { font-weight: 800; font-size: 15px; }
    .num-in { width: 84px; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 16px var(--font); color: var(--ink); background: #fff; text-align: right; }
    select.num-in { width: auto; text-align: left; padding-right: 4px; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .chips button:disabled { opacity: .45; cursor: not-allowed; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar:has(> .segmented[hidden]) { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hq">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">전자기와 양자 · Ⅰ. 전자기적 상호작용</div>
      <h1>소자와 에너지</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🔥 저항</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="cap">
            <button type="button" data-mode="res" data-feature="res">🔥 저항</button><button type="button" data-mode="cap" data-feature="cap">🔋 축전기</button><button type="button" data-mode="ind" data-feature="ind">🌀 인덕터</button><button type="button" data-mode="dev" data-feature="dev">🧰 장치 분석</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="저항, 축전기, 인덕터가 전기 에너지를 열로 바꾸거나 저장했다가 내놓는 모습을 에너지 흐름으로 비교하고 실제 장치를 분석하는 화면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="res" data-gate-off="mr2">
          <div class="control-head"><span>🔌 전원 전압 V</span></div>
          <div class="segmented view-seg" id="vSeg" role="group" aria-label="🔌 전원 전압 V" ><button type="button" data-v="110">110 V</button><button type="button" data-v="220">220 V</button></div>
        </div>
        <div class="control" data-modes="res" data-gate-off="mr2">
          <div class="control-head"><span>🔥 저항 R</span></div>
          <div class="segmented seg-wrap" id="rSeg" role="group" aria-label="🔥 저항 R" ><button type="button" data-v="22">22 Ω</button><button type="button" data-v="44">44 Ω</button><button type="button" data-v="88">88 Ω</button><button type="button" data-v="176">176 Ω</button></div>
        </div>
        <div class="control" data-modes="res"><div class="btn-row"><button class="btn btn-sm btn-primary" id="bSwR" type="button">⏻ 스위치 켜기</button></div></div>
        <div class="control" data-modes="res" data-gate="mr2" id="numRHost"></div>
        <div class="control" data-modes="cap">
          <div class="control-head"><span>🔁 스위치</span></div>
          <div class="segmented view-seg" id="cModeSeg" role="group" aria-label="🔁 스위치" ><button type="button" data-v="off">⏸ 열림</button><button type="button" data-v="chg">⚡ 충전</button><button type="button" data-v="dis">💡 방전</button></div>
        </div>
        <div class="control" data-modes="cap" data-gate-off="mc2">
          <div class="control-head"><span>🔥 저항 R</span></div>
          <div class="segmented view-seg" id="rcSeg" role="group" aria-label="🔥 저항 R" ><button type="button" data-v="0.5">0.5 kΩ</button><button type="button" data-v="1">1 kΩ</button><button type="button" data-v="2">2 kΩ</button></div>
        </div>
        <div class="control" data-modes="cap" data-gate-off="mc2">
          <div class="control-head"><span>🔋 축전기 C</span></div>
          <div class="segmented view-seg" id="ccSeg" role="group" aria-label="🔋 축전기 C" ><button type="button" data-v="500">500 μF</button><button type="button" data-v="1000">1000 μF</button></div>
        </div>
        <div class="control" data-modes="cap" data-gate-off="mc2"><div class="btn-row"><button class="btn btn-sm" id="bCReset" type="button">↺ 비우고 다시</button></div></div>
        <div class="control" data-modes="cap" data-gate="mc2" id="selCHost"></div>
        <div class="control" data-modes="ind" data-gate-off="mn2">
          <div class="control-head"><span>🌀 인덕턴스 L</span></div>
          <div class="segmented view-seg" id="lSeg" role="group" aria-label="🌀 인덕턴스 L" ><button type="button" data-v="0.5">작음 0.5 H</button><button type="button" data-v="2">큼 2.0 H</button></div>
        </div>
        <div class="control" data-modes="ind" data-gate-off="mn2"><div class="btn-row"><button class="btn btn-sm btn-primary" id="bSwN" type="button">🔌 스위치 닫기</button></div><p class="ctrl-note">화면은 실제보다 10배 느리게 보여 줘요.</p></div>
        <div class="control" data-modes="ind" data-gate="mn2" id="selNHost"></div>
        <div class="control" data-modes="dev" data-gate-off="md2">
          <div class="control-head"><span>🧰 장치 카드</span></div>
          <div class="segmented seg-wrap" id="devSeg" role="group" aria-label="🧰 장치 카드" ><button type="button" data-v="0">전기난로</button><button type="button" data-v="1">카메라 플래시</button><button type="button" data-v="2">점화 코일</button><button type="button" data-v="3">터치 센서</button><button type="button" data-v="4">평활 회로</button><button type="button" data-v="5">형광등 안정기</button></div>
        </div>
        <div class="control" data-modes="dev" data-gate-off="md2">
          <div class="control-head"><span>🔧 이 장치의 핵심 소자는?</span></div>
          <div class="segmented view-seg" id="elSeg" role="group" aria-label="🔧 이 장치의 핵심 소자는?" ><button type="button" data-v="res">🔥 저항</button><button type="button" data-v="cap">🔋 축전기</button><button type="button" data-v="ind">🌀 인덕터</button></div>
        </div>
        <div class="control" data-modes="dev" data-gate="md2" id="selDHost"></div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
