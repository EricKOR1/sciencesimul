<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>저항의 연결 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔌</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .seg-wrap { display: flex; flex-wrap: wrap; width: 100%; }
    .seg-wrap button { flex: 1 1 44%; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .nudge:disabled { opacity: .4; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .chips button.done { border-color: var(--good); background: var(--good-soft); }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar:has(> .segmented[hidden]) { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  </style>
  <style>
    .pred-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .pred-row label { flex: 1; font-weight: 800; font-size: 14.5px; line-height: 1.2; }
    .pred-row input { width: 92px; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 16px var(--font); color: var(--ink); background: #fff; text-align: right; }
    .pred-row input.ok { border-color: var(--good); background: var(--good-soft); }
    .pred-row input.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .pred-row span { width: 22px; font-weight: 800; color: var(--muted); }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hp">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">물리학 · Ⅱ. 전기와 자기</div>
      <h1>저항의 연결</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🔌 직렬 측정</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="parallel">
            <button type="button" data-mode="series" data-feature="series">🔌 직렬 측정</button>
            <button type="button" data-mode="parallel" data-feature="parallel">🔀 병렬 측정</button>
            <button type="button" data-mode="model" data-feature="model">🧩 합성 저항</button>
            <button type="button" data-mode="mixed" data-feature="mixed">🎯 회로 예측</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="전원과 저항 두 개를 직렬 또는 병렬로 연결한 회로, 전류계와 전압계로 재는 위치, 도선 통로 모형, 직렬과 병렬이 섞인 회로"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <!-- ① 직렬 -->
        <div class="control" data-modes="series" data-gate-off="rule1">
          <div class="control-head"><span>🔌 저항 R₂ 고르기</span></div>
          <div class="segmented view-seg" id="r2Seg" role="group" aria-label="저항 R₂의 크기">
            <button type="button" data-v="30">R₂ = 30 Ω</button>
            <button type="button" data-v="60">R₂ = 60 Ω</button>
          </div>
          <p class="ctrl-note">회로 그림의 <b>A</b>(전류계) · <b>V</b>(전압계) 단추를 눌러 측정해요. R₂를 바꾸면 기록표도 따로 써요.</p>
        </div>
        <div class="control" data-modes="series" data-gate="rule1">
          <div class="control-head"><span>✍️ 규칙 문장 완성하기</span></div>
          <div id="ruleRows1"></div>
        </div>
        <!-- ② 병렬 -->
        <div class="control" data-modes="parallel" data-gate-off="rule2">
          <div class="control-head"><span>🔀 가지 스위치</span></div>
          <div class="chips" id="swChips" role="group" aria-label="가지 스위치 켜고 끄기">
            <button type="button" data-v="0">R₁ 가지</button>
            <button type="button" data-v="1">R₂ 가지</button>
            <button type="button" data-v="2">R₃ 가지 (추가)</button>
          </div>
          <p class="ctrl-note">그림의 스위치를 눌러도 돼요. 스위치 조합마다 기록표가 따로 있어요. <b>A</b> · <b>V</b> 단추로 측정해요.</p>
        </div>
        <div class="control" data-modes="parallel" data-gate="rule2">
          <div class="control-head"><span>✍️ 규칙 문장 완성하기</span></div>
          <div id="ruleRows2"></div>
        </div>
        <!-- ③ 합성 저항 -->
        <div class="control" data-modes="model">
          <div class="control-head"><span>🧩 연결 방법</span></div>
          <div class="segmented view-seg" id="connSeg" role="group" aria-label="연결 방법 고르기">
            <button type="button" data-v="series">직렬</button>
            <button type="button" data-v="parallel">병렬</button>
          </div>
        </div>
        <div class="control" data-modes="model">
          <div class="control-head"><span>➕ 저항 하나 더</span></div>
          <div class="segmented view-seg" id="n3Seg" role="group" aria-label="R₃ 추가 여부">
            <button type="button" data-v="0">R₁, R₂만</button>
            <button type="button" data-v="1">R₃(60 Ω) 추가</button>
          </div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bMeasure" type="button">📏 전체 V · I 재서 기록</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="bMClear" type="button">🗑 기록 지우기</button></div>
        </div>
        <!-- ④ 예측 -->
        <div class="control" data-modes="mixed" data-gate="predict">
          <div class="control-head"><span>✍️ 내 예측 쓰기</span></div>
          <div class="pred-row"><label for="pR">① 전체 저항</label><input id="pR" type="text" inputmode="decimal" autocomplete="off" placeholder="0"><span>Ω</span></div>
          <div class="pred-row"><label for="pI">② 전체 전류</label><input id="pI" type="text" inputmode="decimal" autocomplete="off" placeholder="0"><span>A</span></div>
          <div class="pred-row"><label for="pV">③ R₁ 양단 전압</label><input id="pV" type="text" inputmode="decimal" autocomplete="off" placeholder="0"><span>V</span></div>
          <div class="pred-row"><label for="pJ">④ R₂ 가지 전류</label><input id="pJ" type="text" inputmode="decimal" autocomplete="off" placeholder="0"><span>A</span></div>
        </div>
        <div class="control" data-modes="mixed" data-gate-off="predict">
          <div class="control-head"><span>🎯 혼합 회로 확인하기</span></div>
          <p class="ctrl-note" style="margin-top:0">그림의 <b>A</b> · <b>V</b> 단추를 눌러 측정하고, 내 예측과 비교해요.</p>
        </div>

      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
