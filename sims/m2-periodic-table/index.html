<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#8b5cf6">
  <title>주기율표 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-toolbar { min-height: 61px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #resetBtn { font-size: 20px; }
    .segmented button { min-height: 44px; padding: 6px 12px; font-size: 14.5px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    .btn-block { min-height: 52px; font-size: 17px; }
    .ctrl-note { font-size: 13.5px; color: var(--muted); margin: 0; line-height: 1.45; }
    .stage-hint { white-space: normal; text-align: center; max-width: calc(100% - 32px); }
    .rtable { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
    .rtable th, .rtable td { border: 1px solid var(--line); padding: 5px 6px; text-align: center; line-height: 1.25; }
    .rtable thead th { background: var(--surface-2); font-size: 13.5px; }
    .rtable tbody th { text-align: left; background: #fff; font-weight: 800; white-space: nowrap; }
    .rtable tbody th small { color: var(--muted); font-weight: 700; font-size: 12.5px; }
    .rtable td { color: #9aa5b6; font-weight: 800; min-width: 70px; }
    .rtable tr.done td { color: var(--ink); background: #f3effe; }
    .safe-note { background: #fff4dc; color: #7c4a00; border-radius: 12px; padding: 8px 12px; margin: 8px 0; font-size: 14.5px; line-height: 1.45; }
    .concept table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 6px 0; }
    .concept th, .concept td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept th { background: var(--surface-2); }
    @media (max-width: 599px) {
      .stage-toolbar { min-height: 0; }
      .segmented button { padding: 6px 10px; font-size: 13.5px; }
      .toolbar-label { font-size: 13.5px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="chem">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g2">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중2 · Ⅳ. 물질의 구성</div>
      <h1>주기율표</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🗂️ 주기율표</span>
          <span class="spacer"></span>
          <div class="segmented" id="sceneSeg" role="group" aria-label="장면 고르기" hidden>
            <button type="button" data-scene="table">🗂️ 주기율표</button>
            <button type="button" data-scene="lab" data-mode="water">💧 물과 반응</button>
            <button type="button" data-scene="lab" data-mode="gas">🔥 18족 기체</button>
            <button type="button" data-scene="airship">🎈 비행선</button>
          </div>
          <button class="icon-btn" id="resetBtn" type="button" title="처음 상태로" aria-label="처음 상태로">↺</button>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="주기율표 판, 같은 족 원소의 성질 실험대, 안전한 비행선 장면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-sc="table" id="cardResetCtl">
          <button class="btn btn-block" id="cardResetBtn" type="button">↺ 카드 다시 놓기</button>
        </div>
        <p class="ctrl-note" id="tableNote" data-sc="table"></p>
        <div class="control" data-sc="lab" id="tblWater">
          <div class="control-head"><label>📋 관찰 결과 (물 + 금속)</label></div>
          <table class="rtable">
            <thead><tr><th>금속</th><th>기체 발생</th><th>용액 색</th></tr></thead>
            <tbody>
              <tr id="rw-li"><th>리튬 <small>1족</small></th><td class="c1">?</td><td class="c2">?</td></tr>
              <tr id="rw-na"><th>나트륨 <small>1족</small></th><td class="c1">?</td><td class="c2">?</td></tr>
              <tr id="rw-k"><th>칼륨 <small>1족</small></th><td class="c1">?</td><td class="c2">?</td></tr>
              <tr id="rw-mg"><th>마그네슘 <small>2족</small></th><td class="c1">?</td><td class="c2">?</td></tr>
            </tbody>
          </table>
        </div>
        <div class="control" data-sc="lab" id="tblGas">
          <div class="control-head"><label>📋 관찰 결과 (달군 철솜 + 기체)</label></div>
          <table class="rtable">
            <thead><tr><th>기체</th><th>철솜의 변화</th></tr></thead>
            <tbody>
              <tr id="rg-o2"><th>산소 <small>16족</small></th><td class="c1">?</td></tr>
              <tr id="rg-he"><th>헬륨 <small>18족</small></th><td class="c1">?</td></tr>
              <tr id="rg-ne"><th>네온 <small>18족</small></th><td class="c1">?</td></tr>
              <tr id="rg-ar"><th>아르곤 <small>18족</small></th><td class="c1">?</td></tr>
            </tbody>
          </table>
        </div>
        <div class="control" data-sc="lab" id="labResetCtl">
          <button class="btn btn-block" id="labResetBtn" type="button">↺ 새 비커</button>
        </div>
        <div class="control" data-sc="airship" id="lightCtl">
          <button class="btn btn-primary btn-block" id="lightBtn" type="button" disabled>⚡ 번개 시험</button>
          <p class="ctrl-note" id="asNote" style="margin-top:8px"></p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
