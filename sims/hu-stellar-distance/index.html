<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0ea5e9">
  <title>별까지의 거리 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-hint { bottom: auto; top: 12px; }
    .stage-toolbar { min-height: 58px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; }
    .stage-toolbar .segmented button { min-height: 40px; padding: 5px 10px; font-size: 14px; white-space: nowrap; }
    .stage-toolbar .segmented { flex-wrap: wrap; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard [hidden] { display: none !important; }
    .opt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 4px; }
    .opt-grid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .opt-grid.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .opt-grid.c5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    #grpStar { grid-template-columns: minmax(0, 1fr) minmax(0, 1.45fr) minmax(0, 1fr) minmax(0, 1fr); }
    #grpStar .opt { padding-left: 2px; padding-right: 2px; letter-spacing: -0.3px; white-space: nowrap; }
    .opt {
      min-height: 46px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px;
      font-weight: 800; font-size: 14.5px; cursor: pointer; padding: 4px 4px; font-family: inherit; line-height: 1.2;
    }
    .opt.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .opt.done { border-color: var(--good); background: var(--good-soft); color: #0b6b39; }
    .opt:disabled { opacity: .5; cursor: not-allowed; }
    .ctrl-note { margin: 6px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
    .btn-sm { min-height: 44px; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini, table.mini { border-collapse: collapse; margin: 6px 0; font-size: 13px; width: 100%; }
    .concept table.mini th, .concept table.mini td, table.mini th, table.mini td { border: 1px solid var(--line); padding: 4px 5px; text-align: center; }
    .concept table.mini th, table.mini th { background: var(--surface-2); font-weight: 800; }
    .num-in { width: 100%; min-height: 46px; border: 2px solid var(--line); border-radius: 10px; font: inherit; font-weight: 800; font-size: 17px; padding: 0 10px; background: var(--surface); color: var(--ink); text-align: center; }
    .num-in:focus { outline: none; border-color: var(--subject); }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .in-row { display: grid; grid-template-columns: 1fr 104px; gap: 8px; align-items: center; margin-top: 6px; font-weight: 800; font-size: 14.5px; line-height: 1.25; }
    .in-row .num-in { min-height: 42px; font-size: 16px; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .src-note { margin: 4px 0 0; font-size: 12.5px; color: #a16207; background: #fff7e0; border: 1px solid #f2d38a; border-radius: 10px; padding: 6px 9px; line-height: 1.4; }
    @media (max-width: 599px) {
      .readout { min-width: 0; }
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar .spacer { display: none; }
      .stage-toolbar .segmented button { padding: 5px 7px; font-size: 13px; }
    }
    input[type=range] { height: 40px; }
    .ticks { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); font-weight: 700; margin-top: -6px; padding: 0 2px; }
    </style>
</head>
<body class="sim-page" data-subject="earth">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hu">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">행성우주과학 · Ⅱ. 태양과 별의 관측</div>
      <h1>별까지의 거리</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">📐 연주 시차 측정</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="group" aria-label="장면 고르기" hidden></div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="지구 공전과 별의 이동 사진으로 연주 시차를 재는 장면, 거리와 밝기·거리 지수 계산기, 시차 거리와 분광형 거리 비교 막대, 장비별 한계 거리와 별 4개 방법 고르기가 있어요."></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">

        <div class="control" data-modes="par">
          <div class="control-head"><span>⭐ 별 고르기</span></div>
          <div class="opt-grid c4" id="grpStar"><button class="opt" type="button" data-k="0">프록시마</button><button class="opt" type="button" data-k="1">시리우스</button><button class="opt" type="button" data-k="2">알타이르</button><button class="opt" type="button" data-k="3">베가</button><button class="opt" type="button" data-k="4">폴룩스</button><button class="opt" type="button" data-k="5">아르크투루스</button><button class="opt" type="button" data-k="6">카펠라</button><button class="opt" type="button" data-k="7">알데바란</button></div>
        </div>
        <div class="control" data-modes="par">
          <div class="control-head"><label for="sMon">🌍 지구의 위치 (관측 시기)</label><output id="oMon">1월 초</output></div>
          <input type="range" id="sMon" min="0" max="12" step="0.5" value="0" aria-label="관측 시기 (달)">
          <div class="btn-row"><button class="btn btn-sm" id="bShot" type="button">📸 지금 찍기</button><button class="btn btn-sm" id="bClrP" type="button">↺ 사진 지우기</button></div>
        </div>
        <div class="control" data-modes="par" id="calcP" hidden>
          <div class="in-row"><span>시차 p (″)<br>= 이동 Δ ÷ 2</span><input class="num-in" id="inP" type="text" inputmode="decimal" placeholder="예: 0.5" aria-label="연주 시차 p (초각)" autocomplete="off"></div>
        </div>
        <div class="control" data-modes="par" id="calcD" hidden>
          <div class="in-row"><span>거리 d (pc)<br>= 1 / p</span><input class="num-in" id="inD" type="text" inputmode="decimal" placeholder="예: 12" aria-label="거리 d (파섹)" autocomplete="off"></div>
        </div>

        <div class="control" data-modes="inv">
          <div class="control-head"><label for="sRho">↔ 별 ②의 거리 (별 ① = 1)</label><output id="oRho">3.0배</output></div>
          <input type="range" id="sRho" min="1" max="10" step="0.1" value="3" aria-label="별 둘의 거리비 d2 나누기 d1">
        </div>
        <div class="control" data-modes="inv" id="calcBr" hidden>
          <div class="in-row"><span>5등급 차이는<br>밝기 몇 배?</span><input class="num-in" id="inBr" type="text" inputmode="decimal" placeholder="예: 50" aria-label="밝기 비 (배)" autocomplete="off"></div>
        </div>

        <div class="control" data-modes="calc">
          <div class="control-head"><label for="sMa">👁 겉보기 등급 m</label><output id="oMa">5.0등급</output></div>
          <input type="range" id="sMa" min="0" max="12" step="0.1" value="5" aria-label="겉보기 등급 m">
          <div class="control-head" style="margin-top:8px"><label for="sMb">✨ 절대 등급 M</label><output id="oMb">3.0등급</output></div>
          <input type="range" id="sMb" min="-3" max="9" step="0.1" value="3" aria-label="절대 등급 M">
        </div>
        <div class="control" data-modes="calc" id="calcM" hidden>
          <div class="in-row"><span>거리 d (pc)</span><input class="num-in" id="inDc" type="text" inputmode="decimal" placeholder="예: 50" aria-label="거리 지수로 구한 거리 (파섹)" autocomplete="off"></div>
        </div>

        <div class="control" data-modes="cmp">
          <div class="control-head"><span>⭐ 별</span></div>
          <div class="opt-grid" id="grpCm"><button class="opt" type="button" data-k="1">시리우스</button><button class="opt" type="button" data-k="3">베가</button></div>
          <div class="control-head" style="margin-top:8px"><label for="sdM">📏 M의 오차 ΔM</label><output id="odM">±0.5</output></div>
          <input type="range" id="sdM" min="0" max="1" step="0.1" value="0.5" aria-label="절대 등급 추정 오차 ΔM">
        </div>
        <div class="control" data-modes="cmp" id="calcDm" hidden>
          <div class="in-row"><span>③ 거리 지수 거리<br>d (pc)</span><input class="num-in" id="inDm2" type="text" inputmode="decimal" placeholder="예: 3" aria-label="분광형으로 구한 거리 (파섹)" autocomplete="off"></div>
        </div>
        <div class="control" data-modes="cmp" id="calcErr" hidden>
          <div class="in-row"><span>거리가 최대<br>몇 % 커질까?</span><input class="num-in" id="inErr" type="text" inputmode="decimal" placeholder="예: 20" aria-label="거리 오차 최대 퍼센트" autocomplete="off"></div>
        </div>

        <div class="control" data-modes="eval">
          <div class="control-head"><label for="sDe">📍 별의 거리 d</label><output id="oDe">10.0 pc</output></div>
          <input type="range" id="sDe" min="0" max="5" step="0.05" value="1" aria-label="별의 거리 (로그 눈금)">
          <p class="ctrl-note">거리를 바꾸면 장비별 시차 거리 오차(σ_p × d)가 어떻게 커지는지 볼 수 있어요.</p>
        </div>
        <div class="control" data-modes="eval" id="calcG" hidden>
          <div class="in-row"><span>가이아 d_max<br>(pc)</span><input class="num-in" id="inG" type="text" inputmode="decimal" placeholder="예: 1000" aria-label="가이아 위성의 한계 거리 (파섹)" autocomplete="off"></div>
        </div>

      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
