<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>전기력선과 등전위면 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .seg-wrap { display: flex; flex-wrap: wrap; width: 100%; }
    .seg-wrap button { flex: 1 1 44%; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .nudge:disabled { opacity: .4; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok, .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad, .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    .numrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .numrow .q { flex: 1 1 100%; font-weight: 800; font-size: 14px; line-height: 1.3; margin-bottom: 2px; }
    .numrow .pre, .numrow .unit { font-weight: 800; font-size: 15px; }
    .num-in { width: 84px; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 16px var(--font); color: var(--ink); background: #fff; text-align: right; }
    select.num-in { width: auto; text-align: left; padding-right: 4px; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .chips button:disabled { opacity: .45; cursor: not-allowed; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar:has(> .segmented[hidden]) { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hq">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">전자기와 양자 · Ⅰ. 전자기적 상호작용</div>
      <h1>전기력선과 등전위면</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🗺️ 전기력선 읽기</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="equi">
            <button type="button" data-mode="read" data-feature="read">🗺️ 전기력선 읽기</button><button type="button" data-mode="equi" data-feature="equi">🎯 등전위면</button><button type="button" data-mode="plates" data-feature="plates">🔋 균일한 장</button><button type="button" data-mode="fig" data-feature="fig">🔍 그림 해석</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="이미 그려진 전기력선과 등전위선 그림에서 전기장의 방향과 세기, 전위를 읽고 평행판의 균일한 전기장과 전하의 이동을 살펴보는 화면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">

        <!-- ① 전기력선 읽기 -->
        <div class="control" data-modes="read" data-gate-off="m2">
          <div class="control-head"><span>🖼️ 그림 고르기</span></div>
          <div class="segmented view-seg" id="figSeg" role="group" aria-label="전기력선 그림 고르기">
            <button type="button" data-v="1">① 점전하</button>
            <button type="button" data-v="2">② 쌍극자</button>
            <button type="button" data-v="3">③ 두 전하</button>
          </div>
        </div>
        <div class="control" data-modes="read" data-gate-off="m2">
          <div class="control-head"><span>📍 전기장 방향 화살표</span></div>
          <div class="segmented view-seg" id="ptSeg" role="group" aria-label="점 고르기">
            <button type="button" data-v="A">점 A</button>
            <button type="button" data-v="B">점 B</button>
            <button type="button" data-v="C">점 C</button>
          </div>
          <div class="btn-row">
            <button class="btn btn-sm" id="rotL" type="button" aria-label="화살표를 왼쪽으로 15도 돌리기">↺ 15°</button>
            <button class="btn btn-sm" id="rotR" type="button" aria-label="화살표를 오른쪽으로 15도 돌리기">↻ 15°</button>
          </div>
          <p class="ctrl-note">점을 고르고 그림을 눌러 전기장 방향을 가리켜요. 끌어서 돌려도 돼요.</p>
        </div>
        <div class="control" data-modes="read" data-gate="m2" id="selHost1"></div>
        <!-- ② 등전위면 -->
        <div class="control" data-modes="equi" data-gate-off="m2b">
          <div class="control-head"><span>📏 등전위선 사이 구간</span></div>
          <div class="segmented view-seg" id="ivSeg" role="group" aria-label="구간 고르기">
            <button type="button" data-v="0">3~6 cm</button>
            <button type="button" data-v="1">6~9 cm</button>
            <button type="button" data-v="2">9~12 cm</button>
          </div>
          <p class="ctrl-note">구간을 고르면 전위차와 간격으로 E를 구할 수 있어요. 점 X, Y를 끌어 전위를 읽어요.</p>
        </div>
        <div class="control" data-modes="equi" data-gate-off="m2b">
          <div class="control-head"><span>🟡 시험 전하 q = +2.0 nC 옮기기</span></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bArc" type="button">⭕ 등전위선 따라</button><button class="btn btn-sm btn-primary" id="bRad" type="button">↗ 가로질러 바깥으로</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="bTcReset" type="button">↺ 처음 자리로</button></div>
        </div>
        <div class="control" data-modes="equi" data-gate="m2b" id="selHost2"></div>
        <!-- ③ 균일한 장 -->
        <div class="control" data-modes="plates" data-gate-off="num3">
          <div class="control-head"><label for="sV">🔌 판 사이 전압 V</label><output id="oV"></output></div><div class="range-row"><button class="nudge" id="sVM" type="button" aria-label="판 사이 전압 (3볼트부터 12볼트) 줄이기">−</button><input type="range" id="sV" min="3" max="12" step="1" value="6" aria-label="판 사이 전압 (3볼트부터 12볼트)"><button class="nudge" id="sVP" type="button" aria-label="판 사이 전압 (3볼트부터 12볼트) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="plates" data-gate-off="num3">
          <div class="control-head"><label for="sD">↕️ 판 사이 간격 d</label><output id="oD"></output></div><div class="range-row"><button class="nudge" id="sDM" type="button" aria-label="판 사이 간격 (3센티미터부터 6센티미터) 줄이기">−</button><input type="range" id="sD" min="3" max="6" step="0.5" value="6" aria-label="판 사이 간격 (3센티미터부터 6센티미터)"><button class="nudge" id="sDP" type="button" aria-label="판 사이 간격 (3센티미터부터 6센티미터) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="plates">
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bGo" type="button">▶ 전자·양성자 놓기</button><button class="btn btn-sm" id="bBack" type="button">↺ 되돌리기</button></div>
          <p class="ctrl-note">전자는 (−)판에서, 양성자는 (+)판에서 가만히 출발해요. 십자(✚)를 끌어 판 사이 곳곳의 E를 재 봐요.</p>
        </div>
        <div class="control" data-modes="plates" data-gate="num3" id="num3Host"></div>
        <!-- ④ 그림 해석 -->
        <div class="control" data-modes="fig">
          <div class="control-head"><span>🖼️ 처음 보는 그림</span></div>
          <div class="segmented view-seg" id="fig4Seg" role="group" aria-label="그림 고르기">
            <button type="button" data-v="a">그림 가</button>
            <button type="button" data-v="b">그림 나</button>
            <button type="button" data-v="c">그림 다</button>
          </div>
        </div>
        <div class="control" data-modes="fig" id="selHost4"></div>

      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
