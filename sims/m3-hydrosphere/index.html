<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0ea5e9">
  <title>수권의 분포와 물의 가치 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-card { background: #0b1b33; }
    .stage-toolbar .toolbar-label { font-weight: 800; font-size: 15px; }
    .stage-toolbar .icon-btn { min-width: 44px; min-height: 44px; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; white-space: normal; text-align: center; max-width: 88%; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn { min-height: 46px; }
    .ctrl-note { font-size: 13.5px; color: var(--muted); margin: 6px 0 0; line-height: 1.45; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1 1 0; min-width: 0; }
    .readout .value { font-size: 19px; }
    .readout .value small { font-size: 12.5px; }
    .game-foot button { min-height: 44px; }
    .cmp { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0; }
    .cmp th, .cmp td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
    .cmp th { background: var(--surface-2); font-weight: 800; white-space: nowrap; }
    .mission-figure svg { border-radius: 12px; }
    .bar4 { display: flex; height: 26px; border-radius: 8px; overflow: hidden; margin: 6px 0 2px; border: 1px solid var(--line); }
    .bar4 i { display: block; height: 100%; }
    .bar4-note { font-size: 12.5px; color: var(--muted); margin: 0 0 6px; }
    .src { font-size: 12px; color: var(--muted); }
    @media (max-width: 599px) { .stage-toolbar { gap: 6px; padding: 6px 10px; } }
  </style>
</head>
<body class="sim-page" data-subject="earth">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g3">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중3 · Ⅲ. 수권과 해수의 순환</div>
      <h1>수권의 분포와 물의 가치</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="sceneName">🧪 지구의 물 1 L 모형</span>
          <span class="spacer"></span>
          <button class="icon-btn" id="resetBtn" type="button" title="처음 상태로" aria-label="처음 상태로">↺</button>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="지구의 물 분포, 활용 사례, 지하수 단면, 마을 물 관리 계획을 보여 주는 화면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">내 예측</span><span class="value" id="r1">-</span></div>
        <div class="readout"><span class="label" id="l2">실제 담수</span><span class="value" id="r2">-</span></div>
        <div class="readout"><span class="label" id="l3">해수</span><span class="value" id="r3">-</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-feature="flask">
          <div class="cg" data-scene="flask">
            <div class="control-head"><label for="sPred">🔮 담수 예측량</label><output id="oPred"></output></div>
            <input type="range" id="sPred" min="0" max="500" step="5" value="300">
            <div class="btn-row" style="margin-top:8px"><button class="btn btn-primary" id="revealBtn" type="button">🔍 확인하기</button></div>
            <p class="ctrl-note">컵의 노란 손잡이를 끌어도 돼요.</p>
          </div>
        </div>
        <div class="control" data-feature="survey">
          <div class="cg" data-scene="survey" hidden>
            <p class="ctrl-note" style="margin:0">🗂️ 카드를 손가락(마우스)으로 끌어서 알맞은 물 위에 놓아요. 위쪽 ↺로 카드를 다시 놓을 수 있어요.</p>
          </div>
        </div>
        <div class="control" data-feature="pump">
          <div class="cg" data-scene="ground" hidden>
            <div class="control-head"><label for="sP">🚰 양수량 (퍼 올리는 양)</label><output id="oP"></output></div>
            <input type="range" id="sP" min="0" max="6" step="1" value="3">
            <div class="btn-row" style="margin-top:8px"><button class="btn btn-primary" id="runBtn" type="button">⏩ 10년 흘려보기</button></div>
            <p class="ctrl-note">빗물이 채워 주는 양은 해마다 <b>3</b>이에요.</p>
          </div>
        </div>
        <div class="control" data-feature="village">
          <div class="cg" data-scene="village" hidden>
            <div class="btn-row"><button class="btn btn-primary" id="yearBtn" type="button">▶ 1년 돌려 보기</button></div>
            <p class="ctrl-note" id="villageNote">행동 카드를 3장까지 눌러 고르세요.</p>
          </div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
