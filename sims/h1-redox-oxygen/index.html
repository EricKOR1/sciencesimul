<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#8b5cf6">
  <title>산소의 이동과 산화·환원 | 고1 통합과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔩</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-toolbar { min-height: 58px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; }
    .stage-toolbar .segmented button { min-height: 40px; padding: 5px 12px; font-size: 14.5px; white-space: nowrap; }
    .segmented button.on { background: var(--subject); color: #fff; }
    .seg-wide { display: flex; width: 100%; margin-top: 8px; }
    .seg-wide button { flex: 1; min-width: 0; padding: 6px 4px; font-size: 14px; min-height: 44px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard [hidden] { display: none !important; }
    .btn-sm { min-height: 44px; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .btn.done { background: var(--good-soft); border-color: var(--good); color: #0b6b39; }
    .btn.on { background: var(--subject); border-color: var(--subject); color: #fff; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .ctrl-note { margin: 6px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
    .stepper .st .l { white-space: normal; text-align: center; line-height: 1.15; overflow: visible; }
    .readout .value { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .tag-rows { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .tag-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-items: center; font-weight: 800; font-size: 14px; }
    .tag-row select { width: 100%; min-height: 40px; border: 2px dashed #b4bfcf; border-radius: 10px; background: #fff; font-weight: 800; font-size: 13.5px; color: var(--ink); padding: 0 4px; font-family: inherit; }
    .tag-row select:focus { outline: none; border-style: solid; border-color: var(--subject); }
    .tag-row select.ok { border-style: solid; border-color: var(--good); background: var(--good-soft); color: #0b6b39; }
    .tag-row select.bad { border-style: solid; border-color: var(--bad); background: var(--bad-soft); }
    .tag-head { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 12.5px; color: var(--muted); font-weight: 800; margin-top: 8px; }
    sub, sup { font-size: .7em; line-height: 0; }
    .step-intro .si-q { background: #fff; border: 2px solid color-mix(in srgb, var(--subject) 45%, white); border-radius: 12px; padding: 9px 12px; font-weight: 800; font-size: 16px; color: #4c1d95; margin: 4px 0 8px; }
    @media (max-width: 599px) { .readout .value { font-size: 15px; } .stage-toolbar .spacer { display: none; } .stage-toolbar .segmented button { padding: 5px 8px; font-size: 13.5px; } }
  </style>
</head>
<body class="sim-page" data-subject="chem">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#h1b">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">통합과학2 · Ⅰ. 변화와 다양성</div>
      <h1>산소의 이동과 산화·환원</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🔥 산화</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" hidden>
            <button type="button" data-mode="oxid" data-feature="oxid">🔥 산화</button>
            <button type="button" data-mode="reduc" data-feature="reduc">🔬 환원</button>
            <button type="button" data-mode="blast" data-feature="blast">🏭 제련</button>
            <button type="button" data-mode="compare" data-feature="compare">⚖️ 비교</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="구리와 마그네슘의 가열, 산화 구리(Ⅱ)의 환원 실험, 용광로에서 철을 얻는 과정, 연소·광합성·제련을 비교하는 장면과 산소 원자가 옮겨 가는 입자 모형"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1"> </span><span class="value" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2"> </span><span class="value" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3"> </span><span class="value" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-show="oxid">
          <div class="control-head"><span>🧪 시료 고르기</span><output id="oMass">—</output></div>
          <div class="segmented seg-wide" id="metalSeg"><button type="button" data-k="cu">🟠 구리 가루</button><button type="button" data-k="mg">⚪ 마그네슘 리본</button></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bHeat1" type="button">🔥 가열하기</button><button class="btn btn-sm" id="bReset1" type="button">↺ 다시</button></div>
          <p class="ctrl-note" id="note1"></p>
        </div>
        <div class="control" data-show="reduc">
          <div class="control-head"><span>🧪 반응 고르기</span><output id="oRed">대기</output></div>
          <div class="segmented seg-wide" id="redSeg"><button type="button" data-k="h2">수소(H<sub>2</sub>)와</button><button type="button" data-k="c">탄소(C)와</button></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bHeat2" type="button">🔥 가열하기</button><button class="btn btn-sm" id="bReset2" type="button">↺ 다시</button></div>
          <div class="tag-head"><span>물질</span><span>이름표 붙이기</span></div>
          <div class="tag-rows" id="tagRows"></div>
          <p class="ctrl-note" id="note2"></p>
        </div>
        <div class="control" data-show="blast">
          <div class="control-head"><span>🏭 용광로에 넣기</span><output id="oBlast">0 / 3</output></div>
          <div class="btn-row" style="flex-direction:column"><button class="btn btn-sm" id="bOre" type="button">⛏ 철광석 넣기</button><button class="btn btn-sm" id="bCoke" type="button">⚫ 코크스 넣기</button><button class="btn btn-sm" id="bAir" type="button">💨 뜨거운 공기 불어 넣기</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="bReset3" type="button">↺ 다시</button></div>
          <p class="ctrl-note" id="note3"></p>
        </div>
        <div class="control" data-show="compare">
          <div class="control-head"><span>⚖️ 사례 고르기</span><output id="oCmp">0 / 3</output></div>
          <div class="segmented seg-wide" id="cmpSeg"><button type="button" data-k="ch4">🔥 연소</button><button type="button" data-k="ph">🌿 광합성</button><button type="button" data-k="fe">🏭 제련</button></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bPlay4" type="button">▶ 반응 보기</button><button class="btn btn-sm" id="bReset4" type="button">↺ 다시</button></div>
          <div class="tag-head"><span>산화된 물질</span><span>환원된 물질</span></div>
          <div class="tag-rows" id="cmpRows"></div>
          <p class="ctrl-note" id="note4"></p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
