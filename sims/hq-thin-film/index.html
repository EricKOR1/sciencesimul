<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>비누막 간섭 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫧</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .chips button.done { border-color: var(--good); background: var(--good-soft); }
    .chips button:disabled { opacity: .45; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .num-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 17px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: #fff; }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    .sel-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  
    .stage-toolbar .segmented { flex-wrap: wrap; }
    .segmented button { white-space: nowrap; }
    .seg-4 button { flex: 1 1 0; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14px; }
    .tray-note { font-weight: 800; }
    .sub-hl { color: var(--subject); font-weight: 900; }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hq">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">전자기와 양자 · Ⅱ. 빛과 정보 통신</div>
      <h1>비누막 간섭</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🫧 비누막 간섭</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="phase">
            <button type="button" data-mode="phase" data-feature="phase">🧵 반사와 위상</button><button type="button" data-mode="film" data-feature="film">🫧 비누막 관찰</button><button type="button" data-mode="cond" data-feature="cond">📐 간섭 조건</button><button type="button" data-mode="app" data-feature="app">🔍 박막 기술</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="줄 파동과 빛의 반사 위상 변화, 쐐기 모양으로 세워 둔 비누막의 줄무늬와 두께 단면, 막의 앞면과 뒷면에서 반사한 두 빛의 합성, 무반사 코팅의 반사 스펙트럼"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">-</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">-</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">-</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="phase">
          <div class="control-head"><label for="sN1">🔹 위쪽 매질의 굴절률 n₁</label><output id="oN1">1.00</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sN1" data-d="-1" aria-label="위쪽 매질의 굴절률 n₁ (1.00부터 2.00) 줄이기">−</button><input type="range" id="sN1" min="100" max="200" step="5" value="100" aria-label="위쪽 매질의 굴절률 n₁ (1.00부터 2.00)"><button class="nudge" type="button" data-for="sN1" data-d="1" aria-label="위쪽 매질의 굴절률 n₁ (1.00부터 2.00) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="phase">
          <div class="control-head"><label for="sN2">🔸 아래쪽 매질의 굴절률 n₂</label><output id="oN2">1.00</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sN2" data-d="-1" aria-label="아래쪽 매질의 굴절률 n₂ (1.00부터 2.00) 줄이기">−</button><input type="range" id="sN2" min="100" max="200" step="5" value="100" aria-label="아래쪽 매질의 굴절률 n₂ (1.00부터 2.00)"><button class="nudge" type="button" data-for="sN2" data-d="1" aria-label="아래쪽 매질의 굴절률 n₂ (1.00부터 2.00) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="phase">
          <div class="control-head"><span>🧵 줄의 끝 모양</span></div><div class="segmented view-seg" id="ropeSeg" role="group" aria-label="줄의 끝 모양"><button type="button" data-v="fixed">🧱 고정단(벽)</button><button type="button" data-v="free">⭕ 자유단(고리)</button></div><p class="ctrl-note">줄 파동과 빛의 반사를 견주어 봐요. 펄스는 저절로 계속 지나가요.</p>
        </div>
        <div class="control" data-modes="phase" data-match="selA">
          <div class="control-head"><span>✍️ 문장 완성하기</span></div><div id="selA"></div>
        </div>
        <div class="control" data-modes="film">
          <div class="control-head"><span>💡 비추는 빛</span></div><div class="segmented view-seg" id="lgSeg" role="group" aria-label="비추는 빛 고르기"><button type="button" data-v="white">백색광</button><button type="button" data-v="650">빨강 650 nm</button><button type="button" data-v="532">초록 532 nm</button><button type="button" data-v="450">파랑 450 nm</button></div>
        </div>
        <div class="control" data-modes="film">
          <div class="control-head"><span>⏳ 시간 흐름</span><output id="oTau">0 초</output></div><div class="btn-row"><button class="btn btn-sm btn-primary" id="bPlay" type="button">▶ 시간 흐르게</button><button class="btn btn-sm" id="bNew" type="button">↺ 새 막 만들기</button></div><p class="ctrl-note">막대를 끌거나 막을 눌러 탐침 위치를 옮겨 보세요. 시간이 흐르면 막이 아래로 흘러내려 얇아져요.</p>
        </div>
        <div class="control" data-modes="film" data-match="selB">
          <div class="control-head"><span>✍️ 예측 완성하기</span></div><div id="selB"></div>
        </div>
        <div class="control" data-modes="cond">
          <div class="control-head"><label for="sT">🧱 막의 두께 t</label><output id="oT">0 nm</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sT" data-d="-1" aria-label="비눗물 막의 두께 (0부터 600 나노미터) 줄이기">−</button><input type="range" id="sT" min="0" max="600" step="1" value="0" aria-label="비눗물 막의 두께 (0부터 600 나노미터)"><button class="nudge" type="button" data-for="sT" data-d="1" aria-label="비눗물 막의 두께 (0부터 600 나노미터) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="cond">
          <div class="control-head"><span>🌈 빛의 파장</span></div><div class="segmented view-seg" id="lamSeg" role="group" aria-label="빛의 파장 고르기"><button type="button" data-v="450">450 nm</button><button type="button" data-v="532">532 nm</button><button type="button" data-v="600">600 nm</button><button type="button" data-v="650">650 nm</button></div><p class="ctrl-note">그래프를 눌러도 두께를 고를 수 있어요.</p>
        </div>
        <div class="control" data-modes="cond" data-match="num">
          <div class="control-head"><label for="inTmin">✍️ 600 nm 빛이 약해지는 가장 얇은 두께 (nm)</label></div><input class="num-in" id="inTmin" type="number" inputmode="decimal" step="1" placeholder="예) 150" aria-label="600 나노미터 빛이 상쇄되는 가장 얇은 두께 (나노미터)">
        </div>
        <div class="control" data-modes="app">
          <div class="control-head"><span>🔎 보고 싶은 장면</span></div><div class="segmented view-seg" id="apSeg" role="group" aria-label="보고 싶은 장면"><button type="button" data-v="coat">🔍 무반사 코팅</button><button type="button" data-v="ex">🌈 다른 예</button></div>
        </div>
        <div class="control" data-modes="app" data-sub="coat">
          <div class="control-head"><label for="sTc">🧱 코팅 막의 두께 t</label><output id="oTc">40 nm</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sTc" data-d="-1" aria-label="코팅 막의 두께 (0부터 250 나노미터) 줄이기">−</button><input type="range" id="sTc" min="0" max="250" step="1" value="40" aria-label="코팅 막의 두께 (0부터 250 나노미터)"><button class="nudge" type="button" data-for="sTc" data-d="1" aria-label="코팅 막의 두께 (0부터 250 나노미터) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="app" data-match="selC">
          <div class="control-head"><span>✍️ 비교해서 완성하기</span></div><div id="selC"></div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
