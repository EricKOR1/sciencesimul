<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0ea5e9">
  <title>먹이 관계와 생태 피라미드 | 고1 통합과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕸️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 58px; }
    .stage-toolbar .segmented button { min-height: 40px; padding: 5px 10px; font-size: 14px; white-space: nowrap; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard [hidden] { display: none !important; }
    .btn-sm { min-height: 44px; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .btn.done { background: var(--good-soft); border-color: var(--good); color: #0b6b39; }
    .btn.on { background: var(--subject); border-color: var(--subject); color: #fff; }
    .ctrl-note { margin: 6px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
    .ctrl-note b { color: var(--ink); }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .tick-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); font-weight: 700; padding: 0 6px; margin-top: -6px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 18px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .nav-row { display: flex; align-items: center; gap: 8px; }
    .nav-row .mid { flex: 1; text-align: center; font-weight: 800; font-size: 15px; }
    .seg-full { display: flex; width: 100%; }
    .seg-full button { flex: 1 1 0; min-width: 0; min-height: 44px; font-size: 14.5px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 14px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); }
    .chips button.bad { border-color: var(--bad); background: var(--bad-soft); }
    .cat-row { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 8px; }
    .cat-row button { min-height: 44px; border-radius: 12px; border: 2px solid var(--line); background: #fff; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); text-align: left; padding: 6px 12px; }
    .cat-row button.act { border-color: #0ea5e9; } .cat-row button.rea { border-color: #16a34a; } .cat-row button.int { border-color: #ea8a1a; }
    .cat-row button.on.act { background: #e0f2fe; } .cat-row button.on.rea { background: #dcfce7; } .cat-row button.on.int { background: #ffedd5; }
    .cat-row button:active { transform: scale(.98); }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row:first-of-type { margin-top: 4px; }
    .sel-row .q { font-weight: 800; font-size: 13.5px; margin-bottom: 3px; line-height: 1.25; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (max-width: 599px) {
      .readout .value { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar .segmented button { padding: 5px 8px; font-size: 13.5px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="earth">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#h1b">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">통합과학2 · Ⅱ. 환경과 에너지</div>
      <h1>먹이 관계와 생태 피라미드</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🌾 먹이 사슬</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기">
            <button type="button" data-mode="chain" data-feature="chain">🌾 사슬</button>
            <button type="button" data-mode="web" data-feature="web">🕸️ 그물</button>
            <button type="button" data-mode="pyr" data-feature="pyr">🔺 피라미드</button>
            <button type="button" data-mode="flow" data-feature="flow">⚡ 에너지</button>
            <button type="button" data-mode="diet" data-feature="flow">🍚 식단</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="초원의 먹이 사슬과 먹이 그물 연결, 개체 수·생물량·에너지량 생태 피라미드, 에너지 전달, 식단 비교"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <!-- 먹이 사슬 -->
        <div class="control" data-modes="chain">
          <div class="control-head"><span>🌾 먹이 사슬 잇기</span></div>
          <p class="ctrl-note">누가 누구를 먹는지 생각하며 한 생물을 <b>끌어서</b> 다른 생물 위에 놓아 <b>화살표</b>를 이어요. (눌러서 차례로 골라도 돼요.)</p>
          <div class="btn-row"><button class="btn btn-sm" id="bChainReset" type="button">↺ 다시 잇기</button></div>
        </div>
        <!-- 먹이 그물 -->
        <div class="control" data-modes="web">
          <div class="control-head"><span>🕸️ 먹이 그물 완성하기</span></div>
          <p class="ctrl-note">생물을 끌어서 먹는 생물 위에 놓아 화살표를 이어요. 이은 뒤에는 생물을 눌러 <b>그 종이 속한 먹이 사슬</b>을 색으로 볼 수 있어요.</p>
          <div class="btn-row">
            <button class="btn btn-sm" id="bDecomp" type="button">🍄 분해자 연결 보기</button>
            <button class="btn btn-sm" id="bWebReset" type="button">↺ 다시 잇기</button>
          </div>
        </div>
        <!-- 피라미드 -->
        <div class="control" data-modes="pyr">
          <div class="control-head"><span>🌍 생태계</span></div>
          <div class="segmented seg-full" id="ecoSeg" role="group" aria-label="생태계 고르기">
            <button type="button" data-eco="meadow">🌾 초원</button>
            <button type="button" data-eco="oak">🌳 참나무 숲</button>
          </div>
          <div class="control-head" style="margin-top:10px"><span>📊 피라미드 종류</span></div>
          <div class="segmented seg-full" id="typeSeg" role="group" aria-label="피라미드 종류 고르기">
            <button type="button" data-type="num">개체 수</button>
            <button type="button" data-type="bio">생물량</button>
            <button type="button" data-type="en">에너지량</button>
          </div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bBuild" type="button">🧱 블록 쌓기</button></div>
        </div>
        <!-- 에너지 전달 -->
        <div class="control" data-modes="flow">
          <div class="control-head"><label for="sLevels">🔗 먹이 사슬의 단계 수</label><output id="oLevels">3단계</output></div>
          <div class="range-row"><input type="range" id="sLevels" min="2" max="5" step="1" value="3" aria-label="먹이 사슬 단계 수 (2에서 5)"></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bFlow" type="button">▶ 에너지 전달 보기</button></div>
          <div class="control-head" style="margin-top:12px"><span id="ansHead">5단계 생물이 받는 에너지는?</span></div>
          <div class="chips" id="ansChips"></div>
        </div>
        <!-- 식단 -->
        <div class="control" data-modes="diet">
          <div class="control-head"><label for="sDiet">🍚 곡물을 직접 먹는 비율</label><output id="oDiet">50 %</output></div>
          <div class="range-row"><input type="range" id="sDiet" min="0" max="100" step="10" value="50" aria-label="곡물을 직접 먹는 비율 (0에서 100퍼센트)"></div>
          <p class="ctrl-note" id="dietNote"></p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
