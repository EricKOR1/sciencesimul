<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0ea5e9">
  <title>태양 표면과 태양 활동 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-card { background: #070d1f; }
    /* 태블릿: 가로 배치 캔버스 · 휴대폰: 세로 배치 캔버스 */
    .sc-tall { display: none; }
    @media (max-width: 599px) { .sc-wide { display: none; } .sc-tall { display: block; } }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    .is-off { display: none !important; }
    .seg-label { display: block; font-weight: 800; font-size: 14.5px; color: var(--muted); margin-bottom: 6px; }
    .segmented { display: flex; width: 100%; }
    .segmented button { flex: 1 1 auto; min-height: 44px; padding: 6px 8px; font-size: 14.5px; }
    .segmented button.on { color: #075985; }
    .play-row { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; }
    .play-row .btn { min-width: 150px; }
    .ctrl-note { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; flex: 1 1 120px; }
    .btn-sm { min-height: 44px; }
    .btn.on-state { background: #0f766e; border-color: #0f766e; color: #fff; box-shadow: 0 3px 0 #0a4f49; }
    input[type=range] { height: 44px; }
    .game-foot button { min-height: 44px; }
    .mission-figure svg { border-radius: 12px; }
    .note-fig { margin: 6px 0; text-align: center; }
    .note-fig svg { max-width: 100%; height: auto; border-radius: 10px; }
    .cmp { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0; }
    .cmp th, .cmp td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
    .cmp th { background: var(--surface-2); font-weight: 800; }
  </style>
</head>
<body class="sim-page" data-subject="earth">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g1">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중1 · Ⅶ. 태양계</div>
      <h1>태양 표면과 태양 활동</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-canvas sc-wide"><canvas id="cvWide" aria-label="태양 관측 망원경 시야: 광구, 대기, 흑점 수 변화 그래프, 태양 폭풍과 지구"></canvas></div>
        <div class="stage-canvas sc-tall"><canvas id="cvTall" aria-label="태양 관측 망원경 시야: 광구, 대기, 흑점 수 변화 그래프, 태양 폭풍과 지구"></canvas></div>
      </section>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" id="cScene">
          <span class="seg-label">🧭 화면</span>
          <div class="segmented" id="sceneSeg" role="group" aria-label="화면 고르기">
            <button type="button" data-s="photo">☀️ 광구</button><button type="button" data-s="atmo">🌅 대기</button><button type="button" data-s="activity">📈 활동</button><button type="button" data-s="earth">🌍 지구</button>
          </div>
        </div>
        <div class="control" id="cFilter" data-feature="filter">
          <div class="play-row">
            <button class="btn btn-sm" id="filterBtn" type="button" aria-pressed="false">🕶️ 태양 필터 끼우기</button>
            <p class="ctrl-note" id="filterNote">필터가 없으면 태양을 볼 수 없어요.</p>
          </div>
        </div>
        <div class="control" id="cDays" data-feature="days">
          <div class="control-head"><label for="sDay">📅 관측일</label><output id="oDay"></output></div>
          <input type="range" id="sDay" min="1" max="14" step="1" value="1" aria-label="관측일">
        </div>
        <div class="control" id="cYears" data-feature="years">
          <div class="control-head"><label for="sYear">📆 연도</label><output id="oYear"></output></div>
          <input type="range" id="sYear" min="1985" max="2024" step="1" value="2000" aria-label="연도">
        </div>
        <div class="control" id="cStorm" data-feature="storm">
          <div class="play-row">
            <button class="btn btn-sm btn-primary" id="stormBtn" type="button">⚡ 태양 폭풍</button>
            <p class="ctrl-note" id="stormNote">연도를 고른 뒤 눌러요.</p>
          </div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
