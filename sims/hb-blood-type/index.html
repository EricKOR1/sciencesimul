<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16a34a">
  <title>항원-항체와 혈액형 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--bio); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .seg-wrap { display: flex; flex-wrap: wrap; width: 100%; }
    .seg-wrap button { flex: 1 1 44%; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14.5px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--bio); background: color-mix(in srgb, var(--bio) 14%, white); color: #166534; }
    #presetSeg { margin-top: 8px; }
    .ctrl-note b { color: var(--ink); }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .match-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .match-row .lab { flex: 1; font-weight: 800; font-size: 14.5px; min-width: 0; line-height: 1.25; }
    .match-row .segmented { flex: none; }
    .match-row .segmented button { min-height: 40px; padding: 4px 10px; font-size: 13.5px; }
    .match-row.ok .lab { color: #0b6b39; }
    .match-row.bad { animation: shakeX .38s; }
    .match-row.bad .lab { color: #a3262b; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar:has(> .segmented[hidden]) { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
    .chips button.done { border-color: #86d9a6; }
    .chips button.done.on { border-color: var(--bio); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); }
    .ctrl-note { line-height: 1.45; }

    .btn-row.wrap { flex-wrap: wrap; } .btn-row.wrap .btn.full { flex: 1 1 100%; }
    .chips button { font-size: 15px; }
    .chips button.warn { border-color: #f59e0b; background: #fffbeb; }

  </style>
</head>
<body class="sim-page" data-subject="bio">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hb">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">생명과학 · Ⅱ. 항상성과 몸의 조절</div>
      <h1>항원-항체와 혈액형</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🔑 항원-항체</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="ag">
            <button type="button" data-mode="ag" data-feature="ag">🔑 항원-항체</button>
            <button type="button" data-mode="abo" data-feature="abo">🅰 ABO 응집</button>
            <button type="button" data-mode="test" data-feature="test">🧪 혈액형 검사</button>
            <button type="button" data-mode="use" data-feature="use">💉 수혈 적용</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="항원과 Y자 항체의 특이적 결합, 항체가 적혈구를 이어 붙이는 응집 반응, ABO식 적혈구 응집원과 혈장 응집소 구조, 항A·항B 혈청 응집 결과, 항A·항B·항Rh 모의 검사 키트와 시료 판정표, 수혈 응집 시험, 가상 사건 추론"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="segmented view-seg" id="subSeg" role="group" aria-label="화면 안의 보기" hidden></div>

        <div class="control" data-v="ag:match">
          <div class="control-head"><span>🔑 항체를 끌어서 항원에 붙여요</span></div>
          <div class="btn-row"><button class="btn btn-sm" id="bAgReset" type="button">↺ 처음으로</button></div>
          <p class="ctrl-note" id="agNote"></p>
        </div>
        <div class="control" data-v="ag:clump">
          <div class="control-head"><span>🧫 항체 고르기</span></div>
          <div class="chips" id="abChips">
            <button type="button" data-k="tri">▲ 항체</button>
            <button type="button" data-k="ci">● 항체</button>
            <button type="button" data-k="sq">■ 항체</button>
          </div>
          <div class="btn-row wrap">
            <button class="btn btn-sm btn-primary full" id="bAdd" type="button">💧 고른 항체 6개 넣기</button>
            <button class="btn btn-sm full" id="bClReset" type="button">↺ 혈액 새로 받기</button>
          </div>
          <p class="ctrl-note" id="clNote"></p>
        </div>
        <div class="control" data-v="abo:draw">
          <div class="control-head"><span>🧩 그림 완성</span></div>
          <div class="btn-row"><button class="btn btn-sm" id="bDrawReset" type="button">↺ 모두 지우기</button></div>
          <p class="ctrl-note">점선 칸을 눌러 <b>응집원(적혈구 표면)</b>과 <b>응집소(혈장)</b>를 켜고 꺼요. 4가지 혈액형을 모두 완성해요.</p>
        </div>
        <div class="control" data-v="abo:mix">
          <div class="control-head"><span>🩸 모의 혈액 고르기</span></div>
          <div class="chips" id="mixChips">
            <button type="button" data-k="A">A형</button>
            <button type="button" data-k="B">B형</button>
            <button type="button" data-k="AB">AB형</button>
            <button type="button" data-k="O">O형</button>
          </div>
          <div class="btn-row wrap">
            <button class="btn btn-sm btn-primary full" id="bMix" type="button">💧 항A·항B 혈청 섞기</button>
            <button class="btn btn-sm full" id="bMixReset" type="button">↺ 표 지우기</button>
          </div>
          <p class="ctrl-note" id="mixNote"></p>
        </div>
        <div class="control" data-v="test">
          <div class="control-head"><span>🧪 모의 시료 고르기</span></div>
          <div class="chips" id="smpChips">
            <button type="button" data-k="0">시료 ①</button>
            <button type="button" data-k="1">시료 ②</button>
            <button type="button" data-k="2">시료 ③</button>
            <button type="button" data-k="3">시료 ④</button>
            <button type="button" data-k="4">시료 ⑤</button>
          </div>
          <div class="btn-row wrap">
            <button class="btn btn-sm btn-primary full" id="bShake" type="button">🔄 슬라이드 흔들기</button>
            <button class="btn btn-sm full" id="bTestReset" type="button">↺ 처음부터</button>
          </div>
          <p class="ctrl-note" id="testNote"></p>
        </div>
        <div class="control" data-v="use:trans">
          <div class="control-head"><span>💉 수혈 사례</span></div>
          <div class="chips" id="caseChips">
            <button type="button" data-k="0">사례 1</button>
            <button type="button" data-k="1">사례 2</button>
            <button type="button" data-k="2">사례 3</button>
          </div>
          <div class="control-head" style="margin-top:8px"><span>🤔 예측</span></div>
          <div class="chips" id="predChips">
            <button type="button" data-k="yes">응집할 것이다</button>
            <button type="button" data-k="no">응집하지 않는다</button>
          </div>
          <div class="btn-row wrap">
            <button class="btn btn-sm btn-primary full" id="bTrans" type="button">🧪 섞어서 확인하기</button>
          </div>
          <p class="ctrl-note" id="trNote"></p>
        </div>
        <div class="control" data-v="use:case">
          <div class="control-head"><span>🕵️ 가상 사건 추론</span></div>
          <div class="btn-row"><button class="btn btn-sm" id="bCaseReset" type="button">↺ 카드 다시</button></div>
          <p class="ctrl-note">현장 혈흔은 <b>A형</b>이에요. 사람 카드를 끌어서 혈액형만으로 <b>배제할 수 있는지</b> 나눠 보세요. (가상의 상황이에요)</p>
        </div>

      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
