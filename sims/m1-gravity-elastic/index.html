<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>중력과 탄성력 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; }
    .toolbar-label small { font-weight: 700; color: #8a95a6; }
    .stage-toolbar { min-height: 61px; }
    #resetBtn { font-size: 20px; }
    .stage-toolbar .segmented button { min-height: 40px; padding: 6px 12px; }
    .off { display: none !important; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .btn-block { min-height: 52px; font-size: 16.5px; }
    #ctrlCard .btn small { font-weight: 700; opacity: .85; }
    .ctrl-note { font-size: 13.5px; color: var(--muted); margin: 8px 0 0; line-height: 1.45; }
    .kid-row { display: flex; align-items: center; gap: 10px; }
    .kid-row .lbl { font-weight: 800; font-size: 15.5px; flex: 1; }
    .kid-row .n { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 800; font-size: 19px; min-width: 72px; text-align: center; color: #9a3412; }
    .kid-row .icon-btn { width: 48px; height: 48px; font-size: 22px; font-weight: 800; }
    .readout .value small { margin-left: 3px; }

    /* 기록 표 (가로로 납작하게) */
    .data-card { flex: none; padding: 8px 12px; display: flex; align-items: center; gap: 12px; }
    .data-head { flex: none; display: flex; flex-direction: column; gap: 2px; font-size: 14.5px; line-height: 1.25; }
    .data-head .n { font-size: 12.5px; color: var(--muted); font-weight: 700; }
    .data-scroll { flex: 1; min-width: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .data-table { border-collapse: collapse; font-size: 14.5px; }
    .data-table th { text-align: left; white-space: nowrap; padding: 2px 10px 2px 2px; color: var(--muted); font-weight: 800; font-size: 13.5px; }
    .data-table td {
      min-width: 62px; text-align: center; padding: 2px 6px; border-left: 1px solid var(--line);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 800; white-space: nowrap; color: #15803d;
    }
    .data-table td.empty { color: #c3ccd9; font-weight: 600; }

    /* 공책의 작은 표 */
    .mini-table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 6px 0; }
    .mini-table th, .mini-table td { border: 1px solid var(--line); padding: 5px 8px; text-align: center; vertical-align: middle; }
    .mini-table tr:first-child th { background: var(--surface-2); }
    .mini-table th { font-weight: 800; background: #f8fafc; white-space: nowrap; }
    @media (max-width: 599px) {
      .data-card { flex-direction: column; align-items: stretch; gap: 4px; }
      .data-head { flex-direction: row; gap: 8px; align-items: baseline; }
      .data-table td { min-width: 50px; }
      .toolbar-label small { display: none; }
    }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g1">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중1 · Ⅴ. 힘의 작용</div>
      <h1>중력과 탄성력</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="sceneLabel">🌍 지구와 사과</span>
          <span class="spacer"></span>
          <div class="segmented" id="sceneSeg" role="group" aria-label="자유 탐구 장면" hidden>
            <button type="button" data-scene="G">🌍 중력</button>
            <button type="button" data-scene="S">🔩 용수철</button>
            <button type="button" data-scene="W">🌕 질량·무게</button>
          </div>
          <button class="icon-btn" id="resetBtn" type="button" title="처음 상태로" aria-label="처음 상태로">↺</button>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="중력의 방향, 용수철의 탄성력, 질량과 무게를 알아보는 실험 화면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts" id="ro">
        <div class="readout"><span class="label" id="r1L">① 작용점</span><span class="value" id="r1V">—</span></div>
        <div class="readout"><span class="label" id="r2L">② 힘의 방향</span><span class="value" id="r2V">—</span></div>
        <div class="readout"><span class="label" id="r3L">③ 힘의 크기</span><span class="value" id="r3V">—</span></div>
      </div>
      <section class="card data-card off" id="dataCard" data-feature="record">
        <div class="data-head"><b>📋 기록</b><span class="n" id="dataN">기록 0/5</span></div>
        <div class="data-scroll">
          <table class="data-table"><tbody>
            <tr id="rowN"><th>탄성력 (= 추의 무게)</th></tr>
            <tr id="rowC"><th>늘어난 길이</th></tr>
          </tbody></table>
        </div>
      </section>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard" hidden>
        <div id="ctrlS" class="off">
          <button class="btn btn-primary btn-block" id="recBtn" type="button" disabled>📍 기록하기</button>
          <p class="ctrl-note">추를 <b>눌러서</b> 용수철에 매달아요. 출렁임이 멈추면 기록 버튼이 켜져요. 매달린 추를 눌러 내릴 수도 있어요.</p>
        </div>
        <div id="ctrlW" class="off">
          <button class="btn btn-primary btn-block" id="rocketBtn" type="button">🚀 저울을 달로 옮기기</button>
          <p class="ctrl-note">양팔저울을 통째로 달로 옮겨도 여전히 수평일까요?</p>
        </div>
        <div id="ctrlU" class="off">
          <div class="kid-row">
            <span class="lbl">📦 상자의 무게</span>
            <button class="icon-btn" id="wMinus" type="button" aria-label="무게 0.5 N 줄이기">−</button>
            <span class="n" id="wVal">3.0 N</span>
            <button class="icon-btn" id="wPlus" type="button" aria-label="무게 0.5 N 늘리기">+</button>
          </div>
          <p class="ctrl-note">늘어난 길이로 무게를 구해 입력해요. (0.5 N 단위)</p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
