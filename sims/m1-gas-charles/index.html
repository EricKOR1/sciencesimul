<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#8b5cf6">
  <title>온도와 부피 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; }
    .stage-toolbar { min-height: 61px; }
    #resetBtn { font-size: 20px; }
    .tgl {
      display: inline-flex; align-items: center; gap: 6px; min-height: 42px;
      border: 2px solid var(--line); background: var(--surface); color: var(--muted);
      border-radius: 999px; padding: 5px 14px; font-weight: 800; font-size: 15px; cursor: pointer;
    }
    .tgl[aria-pressed="true"] { color: #5b21b6; border-color: #c4b5fd; background: #f3efff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1 1 0; min-width: 0; min-height: 46px; }
    .ctrl-note { font-size: 13.5px; color: var(--muted); margin: 4px 0 0; }
    .temp-scale { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-top: -4px; }
    .temp-scale span:first-child { color: #1d6fd8; }
    .temp-scale span:last-child { color: #d9480f; }
    #sT { --subject: #ef6c2f; }
    .readout .value.word { font-family: var(--font); font-size: 18px; }

    /* 실험 결과 표 (가로로 납작하게) */
    .data-card { flex: none; padding: 8px 12px; display: flex; align-items: center; gap: 12px; }
    .data-head { flex: none; display: flex; flex-direction: column; gap: 2px; font-size: 14.5px; line-height: 1.25; }
    .data-head .n { font-size: 12.5px; color: var(--muted); font-weight: 700; }
    .data-scroll { flex: 1; min-width: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .data-table { border-collapse: collapse; font-size: 14.5px; }
    .data-table th { text-align: left; white-space: nowrap; padding: 3px 10px 3px 2px; color: var(--muted); font-weight: 800; font-size: 13.5px; }
    .data-table td {
      min-width: 54px; text-align: center; padding: 3px 6px; border-left: 1px solid var(--line);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 800; white-space: nowrap;
    }
    .data-table td.empty { color: #c3ccd9; font-weight: 600; }
    .data-table tr:first-child td { color: #c2410c; }
    .data-table tr:last-child td { color: #1d4ed8; }
    .data-table td.fresh { background: #fff4dc; }
    @media (max-width: 599px) {
      .data-card { flex-direction: column; align-items: stretch; gap: 4px; }
      .data-head { flex-direction: row; gap: 8px; align-items: baseline; }
      .tgl { padding: 4px 10px; font-size: 14px; }
      .data-table td { min-width: 44px; }
      .segmented button { padding: 6px 10px; font-size: 14px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="chem">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g1">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중1 · Ⅵ. 기체의 성질</div>
      <h1>온도와 부피</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🔥 추를 올린 피스톤 <small>(압력 일정)</small></span>
          <span class="spacer"></span>
          <div class="segmented" id="sceneSeg" role="tablist" aria-label="실험 장면" hidden>
            <button type="button" data-scene="cyl">🔥 실린더</button>
            <button type="button" data-scene="pong">🏓 탁구공</button>
          </div>
          <button type="button" class="tgl" id="tgParticles" aria-pressed="true" data-sc="cyl" data-need="particles">🔬 입자 모형</button>
          <label class="switch" data-sc="cyl" data-need="hits"><input type="checkbox" id="showHits" checked> 충돌 표시</label>
          <button class="icon-btn" id="resetBtn" type="button" title="처음 상태로" aria-label="처음 상태로">↺</button>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="추를 올린 피스톤 속 기체를 가열하고 냉각하는 실험"></canvas>
          <div class="stage-hint" id="stageHint">🔥 온도를 높여 기체를 가열해 보세요</div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout" data-sc="cyl" data-need="thermo"><span class="label">기체의 온도 (온도계)</span><span class="value" id="rT">20<small>°C</small></span></div>
        <div class="readout" data-sc="cyl"><span class="label">기체의 부피</span><span class="value" id="rV">64<small>mL</small></span></div>
        <div class="readout" data-sc="cyl" data-need="particles"><span class="label">입자 수</span><span class="value" id="rN">30<small>개</small></span></div>
        <div class="readout" data-sc="cyl" data-need="particles"><span class="label">입자의 운동 빠르기</span><span class="value word" id="rS">보통</span></div>
        <div class="readout" data-sc="pong"><span class="label">탁구공 속 공기의 온도</span><span class="value" id="rBT">20<small>°C</small></span></div>
        <div class="readout" data-sc="pong"><span class="label">탁구공의 모양</span><span class="value word" id="rDent">찌그러짐</span></div>
      </div>
      <section class="card data-card" data-sc="cyl" data-need="record">
        <div class="data-head"><b>📋 실험 결과</b><span class="n" id="dataN">기록 0개</span><span class="n">온도가 낮은 것부터</span></div>
        <div class="data-scroll">
          <table class="data-table"><tbody>
            <tr id="rowT"><th>온도 (°C)</th></tr>
            <tr id="rowV"><th>부피 (mL)</th></tr>
          </tbody></table>
        </div>
      </section>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-sc="cyl" data-need="heater">
          <div class="control-head"><label for="sT">🔥 가열·냉각 장치</label><output id="oT"></output></div>
          <input type="range" id="sT" min="-50" max="150" step="5" value="20">
          <div class="temp-scale"><span>❄ 냉각</span><span>가열 🔥</span></div>
        </div>
        <div class="control" data-sc="cyl" data-need="record">
          <div class="btn-row">
            <button class="btn btn-primary" id="recBtn" type="button">📍 기록하기</button>
            <button class="btn" id="clearBtn" type="button">지우기</button>
          </div>
          <p class="ctrl-note">온도계 눈금이 멈추면 온도와 부피를 기록해요.</p>
        </div>
        <div class="control" data-sc="pong">
          <div style="font-weight:800;font-size:15.5px;margin-bottom:4px">🏓 찌그러진 탁구공</div>
          <p class="ctrl-note" style="margin:0">탁구공을 손가락으로 끌어서 뜨거운 물에 넣어 보세요. ↺ 버튼을 누르면 다시 찌그러진 공으로 돌아가요.</p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
