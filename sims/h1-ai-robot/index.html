<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#64748b">
  <title>인공지능 로봇 | 고1 통합과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--sci); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .seg-full { width: 100%; display: flex; }
    .seg-full button { flex: 1; padding-left: 6px; padding-right: 6px; }
    .tgl {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px;
      border: 2px solid var(--line); background: var(--surface); color: var(--muted);
      border-radius: 999px; padding: 6px 10px; font-weight: 800; font-size: 14.5px; cursor: pointer; font-family: inherit;
      transition: background .15s, border-color .15s, color .15s; user-select: none; -webkit-user-select: none;
    }
    .tgl[aria-pressed="true"] { color: #1e293b; border-color: var(--sci); background: #e8edf4; }
    .tgl:active { transform: scale(.97); }
    .num-in {
      width: 100%; min-height: 48px; border: 2px solid var(--line); border-radius: 12px; padding: 6px 12px;
      font: 800 20px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: #fff;
    }
    .num-in:focus { outline: none; border-color: var(--sci); }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar .spacer { display: none; }
    }
    .seg-col { display: flex; flex-direction: column; gap: 6px; }
    .seg-col button {
      min-height: 44px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px;
      padding: 6px 10px; font-weight: 800; font-size: 14px; cursor: pointer; font-family: inherit; text-align: left;
    }
    .seg-col button.on { border-color: var(--sci); background: #e8edf4; }
    .seg-col button.done::after { content: " ✓"; color: var(--good); }
    .seg-col button:disabled { opacity: .5; }

  </style>
</head>
<body class="sim-page" data-subject="sci">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#h1b">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">통합과학2 · Ⅲ. 과학과 미래 사회</div>
      <h1>인공지능 로봇</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🤖 로봇의 구조</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" hidden>
            <button type="button" data-mode="robot">🧹 로봇 구조</button>
            <button type="button" data-mode="learn">🧠 학습하는 AI</button>
            <button type="button" data-mode="table">📋 로봇 분석</button>
            <button type="button" data-mode="design">🛠️ 개선 설계</button>

          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="청소 로봇이 센서로 방을 청소하는 모습, 데이터로 쓰레기 분류를 학습하는 인공지능, 일상 로봇 비교표, 서빙 로봇 개선 설계의 지표를 보여 주는 화면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="robot">
          <div class="control-head"><span>👀 센서 켜기·끄기</span></div>
          <div class="btn-grid" id="senTgl">
            <button class="tgl" type="button" data-i="0" aria-pressed="false">💥 충돌 센서</button>
            <button class="tgl" type="button" data-i="1" aria-pressed="false">🕳️ 낭떠러지 센서</button>
            <button class="tgl" type="button" data-i="2" aria-pressed="false" style="grid-column: 1 / 3">📡 거리 센서 (지도 만들기)</button>
          </div>
        </div>
        <div class="control" data-modes="robot">
          <div class="control-head"><span>⏩ 속도</span><output id="oSpd">보통</output></div>
          <div class="segmented seg-full" id="spdSeg">
            <button type="button" data-v="1" class="on">▶ 보통</button>
            <button type="button" data-v="4">⏩ 4배 빠르게</button>
          </div>
          <div class="btn-row"><button class="btn btn-sm" id="bRbReset" type="button">↺ 처음 위치로</button></div>
        </div>
        <div class="control" data-modes="learn">
          <div class="control-head"><span>📦 샘플 모으기</span><output id="oCnt">0개</output></div>
          <div class="btn-col" id="collBtns">
            <button class="btn btn-sm" id="bEven" type="button">🎯 골고루 +5개</button>
            <button class="btn btn-sm" id="bOne" type="button">📍 한 구역(어두운 쪽)에서만 +5개</button>
            <button class="btn btn-sm" id="bClear" type="button">🧹 샘플 모두 비우기</button>
          </div>
          <p class="ctrl-note">그래프의 쓰레기 그림을 직접 눌러 샘플로 넣거나 뺄 수도 있어요.</p>
        </div>
        <div class="control" data-modes="learn">
          <button class="btn btn-sm btn-primary btn-block" id="bLearn" type="button">🎓 학습하기</button>
        </div>
        <div class="control" data-modes="table">
          <p class="ctrl-note" style="margin-top:0">표의 <b>칸을 눌러</b> 알맞은 내용으로 바꿔요. 한 줄을 모두 맞히면 로봇의 장점과 한계가 열려요.</p>
          <button class="btn btn-sm btn-block" id="bTbReset" type="button" style="margin-top:8px">↺ 표 처음으로</button>
        </div>
        <div class="control" data-modes="design">
          <div class="control-head"><span>🧩 개선 카드 (눌러서 켜고 꺼요)</span></div>
          <div class="btn-grid" id="impTgl">
            <button class="tgl" type="button" data-k="sensor" aria-pressed="false">📷 센서 추가</button>
            <button class="tgl" type="button" data-k="data" aria-pressed="false">📚 학습 데이터 확대</button>
            <button class="tgl" type="button" data-k="speed" aria-pressed="false">🐢 속도 제한</button>
            <button class="tgl" type="button" data-k="human" aria-pressed="false">📞 사람 호출 기능</button>
          </div>
        </div>
        <div class="control" data-modes="design" id="sideCtl">
          <div class="control-head"><span>🗣️ 내 개선안의 부작용 한 가지</span></div>
          <div class="seg-col" id="sideSeg">
            <button type="button" data-v="sensor">📷 카메라에 사람 얼굴이 찍혀 개인정보 위험이 늘어요</button>
            <button type="button" data-v="data">📚 영상을 더 모아야 해서 비용과 개인정보 위험이 늘어요</button>
            <button type="button" data-v="speed">🐢 움직임이 느려져 배달 시간이 길어져요</button>
            <button type="button" data-v="human">📞 호출에 응답할 직원이 필요해 사람의 일이 달라져요</button>
          </div>
        </div>

      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
