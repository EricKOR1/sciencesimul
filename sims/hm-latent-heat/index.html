<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>비열과 잠열 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
<style>
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--phy); color: #fff; }
    #modeSeg { width: 100%; }
    #modeSeg button { flex: 1 1 auto; min-width: 0; padding-left: 8px; padding-right: 8px; font-size: 14.5px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .num-in { width: 100%; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 16px var(--font); color: var(--ink); background: #fff; }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .in-grid { display: grid; grid-template-columns: 1fr 96px; gap: 6px 8px; align-items: center; margin-top: 6px; }
    .in-grid .lab { font-weight: 800; font-size: 14px; line-height: 1.25; }
    .in-grid .num-in { min-height: 40px; padding: 2px 8px; font-size: 15px; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini, table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td, table.mini th, table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th, table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer { display: none; }
      #modeSeg button { font-size: 13.5px; padding-left: 6px; padding-right: 6px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }

    .seg-wrap { border-radius: 20px; display: flex; flex-wrap: wrap; width: 100%; }
    .seg-wrap button { flex: 1 1 auto; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14px; }
    #modeSeg { flex-wrap: wrap; }
    #modeSeg button[hidden] { display: none !important; }

  </style>

</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hm">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">역학과 에너지 · Ⅱ. 열과 에너지</div>
      <h1>비열과 잠열</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기">
            <button type="button" data-mode="spec">🧪 비열</button>
            <button type="button" data-mode="curve">🔥 가열 곡선</button>
            <button type="button" data-mode="calc">🧮 열량 계산</button>
            <button type="button" data-mode="mix">🧊 열평형</button>
            <button type="button" data-mode="pack">🥪 보냉 팩</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="비열과 잠열을 탐구하는 화면. 같은 열을 준 네 물질의 온도 상승 비교, 얼음의 가열 곡선과 입자 모형, 구간별 열량 계산, 열량계와 보냉 팩 설계가 있어요."></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <!-- 비열 -->
        <div class="control" data-modes="spec">
          <div class="control-head"><span>🧪 시료 (0.20 kg)</span></div><div class="segmented seg-wrap" id="spSel" role="group" aria-label="가열할 시료"></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bSpRun" type="button">▶ 500 W로 20초 가열</button><button class="btn btn-sm" id="bSpR" type="button">↺ 식히기</button></div>
          <p class="ctrl-note">같은 열 Q = 500 W × 20 s = 10 000 J를 줘요.</p>
        </div>
        <div class="control" data-modes="spec" data-calc="iron">
          <div class="control-head"><span>📝 철의 비열 c (J/(kg·K))</span></div>
          <input class="num-in" id="iFe" type="number" inputmode="decimal" step="any" aria-label="철의 비열 (줄 매 킬로그램 켈빈)">
        </div>
        <!-- 가열 곡선 -->
        <div class="control" data-modes="curve">
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bCuRun" type="button">▶ 가열 시작</button><button class="btn btn-sm" id="bCuR" type="button">↺ 처음으로</button></div>
          <div class="control-head" style="margin-top:8px"><span>⏩ 시간 빠르기</span></div><div class="segmented seg-wrap" id="cuSpd" role="group" aria-label="시간 빠르기"><button type="button" data-sp="45">보통</button><button type="button" data-sp="120">빠르게</button></div>
        </div>
        <div class="control" data-modes="curve" data-calc="lf">
          <div class="control-head"><span>📝 융해열 L<sub>f</sub> (× 10⁵ J/kg)</span></div>
          <input class="num-in" id="iLf" type="number" inputmode="decimal" step="any" aria-label="융해열 (10의 5제곱 줄 매 킬로그램 단위)">
        </div>
        <!-- 열량 계산 -->
        <div class="control" data-modes="calc" data-lock="seg">
          <div class="control-head"><label for="sMass">⚖️ 얼음의 질량 m</label><output id="oMass">0.10 kg</output></div>
          <div class="range-row"><input type="range" id="sMass" min="0.05" max="0.4" step="0.05" value="0.1" aria-label="얼음의 질량 (킬로그램)"></div>
        </div>
        <div class="control" data-modes="calc" data-calc="seg">
          <div class="control-head"><span>📝 구간별 열량 (m = 0.10 kg)</span></div>
          <div class="in-grid">
            <span class="lab">① 얼음 가열 (J)</span><input class="num-in" id="iQ1" type="number" inputmode="decimal" step="any" aria-label="구간 1 열량 (줄)">
            <span class="lab">② 융해 (J)</span><input class="num-in" id="iQ2" type="number" inputmode="decimal" step="any" aria-label="구간 2 열량 (줄)">
            <span class="lab">③ 물 가열 (J)</span><input class="num-in" id="iQ3" type="number" inputmode="decimal" step="any" aria-label="구간 3 열량 (줄)">
            <span class="lab">④ 기화 (J)</span><input class="num-in" id="iQ4" type="number" inputmode="decimal" step="any" aria-label="구간 4 열량 (줄)">
            <span class="lab">합계 (J)</span><input class="num-in" id="iQt" type="number" inputmode="decimal" step="any" aria-label="전체 열량 합계 (줄)">
          </div>
        </div>
        <div class="control" data-modes="calc" data-calc="tv">
          <div class="control-head"><span>📝 0.10 kg 기화 시간 (s)</span></div>
          <input class="num-in" id="iTv" type="number" inputmode="decimal" step="any" aria-label="기화에 걸리는 시간 (초)">
        </div>
        <!-- 열평형 -->
        <div class="control" data-modes="mix" data-calc="cal">
          <div class="control-head"><span>📝 예상 최종 온도 (°C)</span></div>
          <input class="num-in" id="iTf" type="number" inputmode="decimal" step="any" aria-label="예상 최종 온도 (섭씨)">
        </div>
        <div class="control" data-modes="mix" data-lock="cal">
          <div class="control-head"><label for="sMi">🧊 얼음 질량 (0 °C)</label><output id="oMi">0.050 kg</output></div>
          <div class="range-row"><input type="range" id="sMi" min="0.02" max="0.1" step="0.01" value="0.05" aria-label="얼음의 질량 (킬로그램)"></div>
          <div class="control-head" style="margin-top:8px"><label for="sTw">🌡️ 물 온도 (0.20 kg)</label><output id="oTw">30 °C</output></div>
          <div class="range-row"><input type="range" id="sTw" min="20" max="60" step="5" value="30" aria-label="물의 처음 온도 (섭씨)"></div>
        </div>
        <div class="control" data-modes="mix">
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bMxRun" type="button">▶ 얼음 넣기</button><button class="btn btn-sm" id="bMxR" type="button">↺ 처음으로</button></div>
        </div>
        <!-- 보냉 팩 -->
        <div class="control" data-modes="pack">
          <div class="control-head"><span>🧊 팩 재료</span></div><div class="segmented seg-wrap" id="pkMat" role="group" aria-label="보냉 팩 재료"></div>
          <div class="control-head" style="margin-top:8px"><label for="sPkM">⚖️ 팩 질량</label><output id="oPkM">0.5 kg</output></div>
          <div class="range-row"><input type="range" id="sPkM" min="0.1" max="1" step="0.1" value="0.5" aria-label="보냉 팩의 질량 (킬로그램)"></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bPkRun" type="button">▶ 4시간 시뮬레이션</button><button class="btn btn-sm" id="bPkR" type="button">↺ 처음으로</button></div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
