<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>전류 주위의 자기장 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧲</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .seg-wrap { display: flex; flex-wrap: wrap; width: 100%; }
    .seg-wrap button { flex: 1 1 44%; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .nudge:disabled { opacity: .4; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok, .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad, .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    .numrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .numrow .q { flex: 1 1 100%; font-weight: 800; font-size: 14px; line-height: 1.3; margin-bottom: 2px; }
    .numrow .pre, .numrow .unit { font-weight: 800; font-size: 15px; }
    .num-in { width: 84px; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 16px var(--font); color: var(--ink); background: #fff; text-align: right; }
    select.num-in { width: auto; text-align: left; padding-right: 4px; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .chips button:disabled { opacity: .45; cursor: not-allowed; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar:has(> .segmented[hidden]) { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hq">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">전자기와 양자 · Ⅰ. 전자기적 상호작용</div>
      <h1>전류 주위의 자기장</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🧭 직선 전류</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="loop">
            <button type="button" data-mode="wire" data-feature="wire">🧭 직선 전류</button><button type="button" data-mode="loop" data-feature="loop">⭕ 원형 전류</button><button type="button" data-mode="sol" data-feature="sol">🧲 솔레노이드</button><button type="button" data-mode="fig" data-feature="fig">🔍 그림 해석</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="전류가 흐르는 도선, 고리, 솔레노이드 둘레의 자기력선과 나침반, 센서 값을 보고 자기장의 방향과 세기를 알아보며 완성된 자기력선 그림에서 정보를 읽는 화면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="wire" data-gate-off="mw2">
          <div class="control-head"><label for="wI">⚡ 전류 I</label><output id="owI"></output></div><div class="range-row"><button class="nudge" id="wIM" type="button" aria-label="전류 (0암페어부터 20암페어) 줄이기">−</button><input type="range" id="wI" min="0" max="20" step="1" value="10" aria-label="전류 (0암페어부터 20암페어)"><button class="nudge" id="wIP" type="button" aria-label="전류 (0암페어부터 20암페어) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="wire" data-gate-off="mw2">
          <div class="control-head"><label for="wR">↔️ 도선에서 거리 r</label><output id="owR"></output></div><div class="range-row"><button class="nudge" id="wRM" type="button" aria-label="도선에서 거리 (2센티미터부터 20센티미터) 줄이기">−</button><input type="range" id="wR" min="2" max="20" step="1" value="10" aria-label="도선에서 거리 (2센티미터부터 20센티미터)"><button class="nudge" id="wRP" type="button" aria-label="도선에서 거리 (2센티미터부터 20센티미터) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="wire" data-gate-off="mw2"><div class="btn-row"><button class="btn btn-sm" id="wDir" type="button">🔁 전류 방향 바꾸기</button><button class="btn btn-sm btn-primary" id="wRec" type="button">📋 기록</button></div><p class="ctrl-note">표의 칸에 적힌 I, r로 맞춘 뒤 기록해요. 나침반 바늘은 B의 방향이에요.</p></div>
        <div class="control" data-modes="wire" data-gate="mw2" id="numWHost"></div>
        <div class="control" data-modes="loop" data-gate-off="ml2">
          <div class="control-head"><label for="lI">⚡ 전류 I</label><output id="olI"></output></div><div class="range-row"><button class="nudge" id="lIM" type="button" aria-label="전류 (1암페어부터 8암페어) 줄이기">−</button><input type="range" id="lI" min="1" max="8" step="0.5" value="3" aria-label="전류 (1암페어부터 8암페어)"><button class="nudge" id="lIP" type="button" aria-label="전류 (1암페어부터 8암페어) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="loop" data-gate-off="ml2">
          <div class="control-head"><label for="lR">⭕ 고리 반지름 R</label><output id="olR"></output></div><div class="range-row"><button class="nudge" id="lRM" type="button" aria-label="고리 반지름 (3센티미터부터 8센티미터) 줄이기">−</button><input type="range" id="lR" min="3" max="8" step="0.5" value="6" aria-label="고리 반지름 (3센티미터부터 8센티미터)"><button class="nudge" id="lRP" type="button" aria-label="고리 반지름 (3센티미터부터 8센티미터) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="loop" data-gate-off="ml2">
          <div class="control-head"><label for="lN">🔄 감은 수 N</label><output id="olN"></output></div><div class="range-row"><button class="nudge" id="lNM" type="button" aria-label="감은 수 (1회부터 3회) 줄이기">−</button><input type="range" id="lN" min="1" max="3" step="1" value="1" aria-label="감은 수 (1회부터 3회)"><button class="nudge" id="lNP" type="button" aria-label="감은 수 (1회부터 3회) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="loop" data-gate-off="ml2"><div class="btn-row"><button class="btn btn-sm" id="lDir" type="button">🔁 전류 방향 바꾸기</button></div></div>
        <div class="control" data-modes="loop" data-gate="ml2" id="numLHost"></div>
        <div class="control" data-modes="sol" data-gate-off="sl2">
          <div class="control-head"><label for="sN">🔄 감김 밀도 n</label><output id="osN"></output></div><div class="range-row"><button class="nudge" id="sNM" type="button" aria-label="단위 길이당 감은 수 (500회/m부터 4000회/m) 줄이기">−</button><input type="range" id="sN" min="500" max="4000" step="500" value="2000" aria-label="단위 길이당 감은 수 (500회/m부터 4000회/m)"><button class="nudge" id="sNP" type="button" aria-label="단위 길이당 감은 수 (500회/m부터 4000회/m) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="sol" data-gate-off="sl2">
          <div class="control-head"><label for="sI">⚡ 전류 I</label><output id="osI"></output></div><div class="range-row"><button class="nudge" id="sIM" type="button" aria-label="전류 (0암페어부터 3암페어) 줄이기">−</button><input type="range" id="sI" min="0" max="3" step="0.1" value="1" aria-label="전류 (0암페어부터 3암페어)"><button class="nudge" id="sIP" type="button" aria-label="전류 (0암페어부터 3암페어) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="sol" data-gate-off="sl2"><div class="btn-row"><button class="btn btn-sm btn-primary" id="sIron" type="button">🔩 철심 넣기</button><button class="btn btn-sm" id="sDir" type="button">🔁 전류 방향 바꾸기</button></div></div>
        <div class="control" data-modes="sol" data-gate="sl2" id="polHost"></div>
        <div class="control" data-modes="fig">
          <div class="control-head"><span>🖼️ 그림 고르기</span></div>
          <div class="segmented view-seg" id="figSeg" role="group" aria-label="그림 고르기">
            <button type="button" data-v="a">가</button><button type="button" data-v="b">나</button><button type="button" data-v="c">다</button><button type="button" data-v="d">라</button>
          </div>
        </div>
        <div class="control" data-modes="fig" id="selHost4"></div>

      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
