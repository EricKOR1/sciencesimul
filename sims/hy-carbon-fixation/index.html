<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16a34a">
  <title>탄소 고정 반응 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 58px; }
    .stage-toolbar .segmented { flex-wrap: wrap; }
    .stage-toolbar .segmented button { min-height: 40px; padding: 5px 10px; font-size: 14px; white-space: nowrap; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard [hidden] { display: none !important; }
    .btn-sm { min-height: 44px; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .ctrl-note { margin: 6px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
    .ctrl-note b { color: var(--ink); }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .seg-full { display: flex; width: 100%; }
    .seg-full button { flex: 1 1 0; min-width: 0; min-height: 44px; font-size: 14.5px; }
    .chip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    .chip-grid.three { grid-template-columns: 1fr 1fr 1fr; }
    .chip-grid button { min-height: 44px; padding: 6px 8px; border: 2px solid var(--line); background: #fff; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; color: var(--ink); text-align: center; }
    .chip-grid button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); }
    .chip-grid button.seen:not(.on) { border-color: color-mix(in srgb, var(--subject) 45%, white); }
    .chip-grid button:disabled { opacity: .45; cursor: not-allowed; }
    .chip-grid button:active { transform: scale(.98); }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .num-in { width: 100%; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 16px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: #fff; text-align: right; }
    .num-in:focus { outline: none; border-color: var(--subject); }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .in-unit { font-size: 12.5px; color: var(--muted); font-weight: 700; }
    .in-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; align-items: end; margin-top: 8px; }
    .in-row .lab { font-weight: 800; font-size: 13.5px; margin-bottom: 3px; line-height: 1.25; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    .pk-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .pk-item { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; color: var(--ink); }
    .pk-item:disabled { opacity: .35; cursor: default; }
    .pk-seq { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 46px; border: 2px dashed var(--line); border-radius: 12px; padding: 6px; }
    .pk-chip { min-height: 34px; padding: 3px 10px; border: 2px solid var(--subject); background: color-mix(in srgb, var(--subject) 12%, white); border-radius: 999px; font-weight: 800; font-size: 13.5px; cursor: pointer; color: var(--ink); }
    .pk-chip b { color: var(--subject); margin-right: 2px; }
    .pk-reset { margin-top: 8px; width: 100%; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 6px; }
    .tbl th, .tbl td { border: 1px solid var(--line); padding: 4px 4px; text-align: center; }
    .tbl th { background: var(--surface-2); font-weight: 800; }
    .tbl td.rowh { font-weight: 800; text-align: left; background: var(--surface-2); }
    .tbl select { width: 100%; min-height: 40px; border: 2px solid var(--line); border-radius: 8px; font: 800 13.5px var(--font); background: #fff; color: var(--ink); }
    .tbl select.ok { border-color: var(--good); background: var(--good-soft); }
    .tbl select.bad { border-color: var(--bad); background: var(--bad-soft); }
    .check-list { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; font-weight: 700; }
    .check-list li { display: flex; gap: 6px; align-items: baseline; }
    .check-list li.on { color: var(--good); }
    .btn-col { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    #modeSeg button.lv-off { display: none; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (max-width: 599px) {
      .readout .value { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar .segmented button { padding: 5px 8px; font-size: 13.5px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
    .stage-toolbar .segmented button.lv-off { display: none; }
    .tag-pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-weight: 800; font-size: 12.5px; background: color-mix(in srgb, var(--subject) 14%, white); color: var(--ink); }
    .tbl-in { width: 100%; }

    .org-list { display: grid; gap: 8px; margin-top: 6px; }
    .org-row { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 6px; padding: 6px; border: 2px solid var(--line); border-radius: 12px; }
    .org-row .lab { grid-column: 1 / -1; font-weight: 800; font-size: 13.5px; }
    .org-row .sel-in { font-size: 13px; padding: 4px 4px; }
      .lab-s { font-weight: 800; font-size: 13.5px; color: var(--muted); margin: 8px 0 2px; }
    .chip-grid.four { grid-template-columns: 1fr 1fr 1fr 1fr; }
    .tf-list { display: grid; gap: 6px; margin-top: 6px; }
    .tf-row { display: grid; gap: 3px; }
    .tf-row .lab { font-weight: 800; font-size: 13.5px; line-height: 1.3; }
    .sent { font-size: 13.5px; font-weight: 700; line-height: 1.75; margin-top: 6px; }
    .sent .sel-in { width: auto; display: inline-block; min-width: 120px; max-width: 100%; margin: 2px 0; font-size: 13px; padding: 4px 6px; vertical-align: middle; }
    [data-sub][hidden], [data-asub][hidden] { display: none !important; }
    [data-grp][hidden] { display: none !important; }
    #ctrlCard .control > .control-head { margin-top: 4px; }
    .in-row.three { grid-template-columns: 1fr 1fr 1fr; }
    .srch-list { display: grid; gap: 4px; margin-top: 6px; }
    .srch-list button { text-align: left; min-height: 44px; border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 4px 10px; font: 800 13.5px var(--font); color: var(--ink); cursor: pointer; }
    .srch-list button.on { border-color: var(--good); background: var(--good-soft); }
    .srch-list .sub { display: block; font-weight: 700; font-size: 12px; color: var(--muted); }
    .num-in.tl { text-align: left; font: 700 14px var(--font); margin-bottom: 4px; }
    [hidden] { display: none !important; }
  

    .big-btn { min-height: 54px; font-size: 17px; }
    .pr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    .pr-grid button { min-height: 52px; padding: 4px 6px; border: 2px solid var(--line); background: #fff; border-radius: 12px; font-weight: 800; font-size: 13.5px; cursor: pointer; color: var(--ink); text-align: center; line-height: 1.25; }
    .pr-grid button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); }
    .pr-grid button.ran { border-color: color-mix(in srgb, var(--good) 60%, white); }
    .pr-grid button.ran::after { content: ' ✔'; color: var(--good); }
    .pr-row { display: grid; grid-template-columns: 96px 1fr; gap: 6px; align-items: center; margin-top: 6px; }
    .pr-row .lab { font-weight: 800; font-size: 13.5px; }
    .pr-row select { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 10px; font: 800 14px var(--font); background: #fff; color: var(--ink); }
    .pr-row select.ok { border-color: var(--good); background: var(--good-soft); }
    .pr-row select.bad { border-color: var(--bad); background: var(--bad-soft); }

  </style>

</head>
<body class="sim-page" data-subject="bio">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hy">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">세포와 물질대사 · Ⅲ. 세포호흡과 광합성</div>
      <h1>탄소 고정 반응</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🌱 캘빈 회로</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기">
            <button type="button" data-mode="cal" data-lv="0" data-feature="cal">🔄 캘빈 회로</button>
            <button type="button" data-mode="need" data-lv="1" data-feature="need">🧮 필요량</button>
            <button type="button" data-mode="link" data-lv="2" data-feature="link">🔗 두 반응 연결</button>
            <button type="button" data-mode="pred" data-lv="3" data-feature="pred">🎯 조건 예측</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="스트로마의 캘빈 회로에서 탄소 구슬로 CO₂ 고정 · 환원 · 재생을 따라가고, ATP와 NADPH 필요량을 계산하며, 명반응과 탄소 고정 반응의 순환 관계와 조건에 따른 화합물 양 변화를 예측하는 모형"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="cal">
          <div class="control-head"><span>🔄 캘빈 회로 한 바퀴</span></div>
          <div class="btn-row"><button class="btn btn-primary big-btn" id="cvGo" type="button">CO₂ 넣기 (0 / 3)</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="cvReset" type="button">↺ 이 단계 다시</button></div>
          <p class="ctrl-note" id="cvNote"></p>
          <div data-grp="acc">
            <div class="lab-s">구슬 수를 세어 써요</div>
            <div class="in-row">
              <div><div class="lab"><label for="aG">회로 밖으로 나간 3탄소 당(G3P) 1분자의 탄소 구슬</label></div><input class="num-in" id="aG" type="text" inputmode="numeric" maxlength="3" aria-label="회로 밖으로 나간 G3P의 탄소 구슬 수"></div>
              <div><div class="lab"><label for="aR">5탄소 화합물로 재생에 쓰인 탄소 구슬</label></div><input class="num-in" id="aR" type="text" inputmode="numeric" maxlength="3" aria-label="재생에 쓰인 탄소 구슬 수"></div>
            </div>
          </div>
        </div>
        <div class="control" data-modes="need">
          <div class="control-head"><label for="sN">고정할 CO₂ 분자 수</label><output id="oN">3</output></div>
          <div class="range-row"><input type="range" id="sN" min="3" max="12" step="3" value="3" aria-label="고정할 이산화 탄소 분자 수 (3에서 12, 3씩)"></div>
          <p class="ctrl-note" id="ndNote"></p>
          <div data-grp="calc">
            <div class="lab-s">포도당 1분자를 만들 때 필요한 양</div>
            <div class="in-row three">
              <div><div class="lab"><label for="nC">CO₂ (분자)</label></div><input class="num-in" id="nC" type="text" inputmode="numeric" maxlength="3" aria-label="필요한 CO₂ 분자 수"></div>
              <div><div class="lab"><label for="nA">ATP (개)</label></div><input class="num-in" id="nA" type="text" inputmode="numeric" maxlength="3" aria-label="필요한 ATP 개수"></div>
              <div><div class="lab"><label for="nP">NADPH (개)</label></div><input class="num-in" id="nP" type="text" inputmode="numeric" maxlength="3" aria-label="필요한 NADPH 개수"></div>
            </div>
            <div class="lab-s">명반응이 물 12분자에서 만드는 ATP 18 · NADPH 12와 비교하면?</div>
            <select class="sel-in" id="nCmp" aria-label="명반응 산물과 비교"><option value="">? 고르기</option><option value="same">같다</option><option value="more">필요량이 더 많다</option><option value="less">필요량이 더 적다</option></select>
          </div>
        </div>
        <div class="control" data-modes="link">
          <div class="control-head"><label for="sL">빛 세기</label><output id="oL">6</output></div>
          <div class="range-row"><input type="range" id="sL" min="0" max="10" step="1" value="6" aria-label="빛 세기 (0에서 10)"></div>
          <div class="control-head"><label for="sC">CO₂ 농도</label><output id="oC">6</output></div>
          <div class="range-row"><input type="range" id="sC" min="0" max="10" step="1" value="6" aria-label="이산화 탄소 농도 (0에서 10)"></div>
          <div class="btn-row"><button class="btn btn-sm" id="lkReset" type="button">↺ 카드 다시 모으기</button></div>
          <p class="ctrl-note" id="lkNote"></p>
        </div>
        <div class="control" data-modes="pred">
          <div class="control-head"><span>🎯 시나리오를 골라요</span></div>
          <div class="pr-grid" id="prSc"></div>
          <div class="lab-s">변화를 예측해요 (조건을 바꾼 뒤 20초 동안)</div>
          <div class="pr-row"><span class="lab">ATP · NADPH</span><select id="pr1" aria-label="ATP와 NADPH 양의 예측"><option value="">?</option><option value="up">▲ 증가</option><option value="down">▼ 감소</option><option value="flat">■ 변화 없음</option></select></div>
          <div class="pr-row"><span class="lab">3PG (3탄소)</span><select id="pr2" aria-label="3PG 양의 예측"><option value="">?</option><option value="up">▲ 증가</option><option value="down">▼ 감소</option><option value="flat">■ 변화 없음</option></select></div>
          <div class="pr-row"><span class="lab">RuBP (5탄소)</span><select id="pr3" aria-label="RuBP 양의 예측"><option value="">?</option><option value="up">▲ 증가</option><option value="down">▼ 감소</option><option value="flat">■ 변화 없음</option></select></div>
          <div class="btn-row"><button class="btn btn-primary" id="prGo" type="button">▶ 실행하기</button></div>
          <p class="ctrl-note" id="prNote"></p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
