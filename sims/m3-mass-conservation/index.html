<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#8b5cf6">
  <title>질량 보존 법칙 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-toolbar { min-height: 61px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #resetBtn { font-size: 20px; }
    .segmented button { min-height: 44px; padding: 6px 12px; font-size: 14.5px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; display: flex; flex-direction: column; gap: 10px; }
    .btn-block { min-height: 52px; font-size: 17px; }
    .seg-full { width: 100%; }
    .seg-full button { flex: 1; font-size: 15px; }
    .ctrl-note { font-size: 13.5px; color: var(--muted); margin: 0; line-height: 1.45; }
    .stage-hint { white-space: normal; text-align: center; max-width: calc(100% - 32px); }
    .tgl {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; width: 100%;
      border: 2px solid var(--line); background: var(--surface); color: var(--muted);
      border-radius: 999px; padding: 5px 14px; font-weight: 800; font-size: 16px; cursor: pointer;
    }
    .tgl[aria-pressed="true"] { color: #5b21b6; border-color: #c4b5fd; background: #f3efff; }
    .stepper { display: flex; align-items: center; gap: 8px; }
    .stepper .lab { flex: 1; font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 6px; min-width: 0; }
    .stepper button { width: 48px; height: 48px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-size: 24px; font-weight: 800; color: var(--ink); cursor: pointer; }
    .stepper button:active { transform: scale(.94); }
    .stepper output { min-width: 28px; text-align: center; font-size: 22px; font-weight: 800; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .concept table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 6px 0; }
    .concept th, .concept td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept th { background: var(--surface-2); }
    @media (max-width: 599px) {
      .stage-toolbar { min-height: 0; }
      .segmented button { padding: 6px 10px; font-size: 13.5px; }
      .toolbar-label { font-size: 13.5px; }
    }
    .icon-btn[aria-pressed="true"] { background: #f3efff; border-color: #c4b5fd; }
    .icon-btn[hidden] { display: none; }
  </style>
</head>
<body class="sim-page" data-subject="chem">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g3">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중3 · Ⅰ. 화학 반응의 규칙성</div>
      <h1>질량 보존 법칙</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel"></span>
          <span class="spacer"></span>
          <div class="segmented" id="sceneSeg" role="group" aria-label="장면 고르기" hidden>
            <button type="button" data-scene="ppt" data-feature="ppt">☁️ 앙금</button>
            <button type="button" data-scene="gas" data-feature="gas">🫧 기체</button>
            <button type="button" data-scene="burn" data-feature="burn">🔥 연소</button>
            <button type="button" data-scene="atoms" data-feature="atoms">🔍 원자</button>
          </div>
          <button class="icon-btn" id="lensBtn" type="button" title="입자 돋보기" aria-label="입자 돋보기 켜고 끄기" aria-pressed="true">🔍</button>
          <button class="icon-btn" id="resetBtn" type="button" title="처음 상태로" aria-label="처음 상태로">↺</button>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="전자저울 위의 앙금 생성, 열린 용기와 닫힌 용기의 기체 발생, 연소 실험, 원자 공 모형 장면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-sc="ppt">
          <button class="btn btn-primary btn-block" id="mixBtn" type="button">🧪 두 용액 섞기</button>
          <p class="ctrl-note" id="pptNote"></p>
        </div>
        <div class="control" data-sc="gas">
          <div class="segmented seg-full" id="boxSeg" role="group" aria-label="용기 고르기">
            <button type="button" data-box="open" class="on">열린 용기</button>
            <button type="button" data-box="closed">닫힌 용기</button>
          </div>
          <button class="btn btn-primary btn-block" id="gasBtn" type="button">🧪 반응시키기</button>
          <button class="btn btn-block" id="lidBtn" type="button" hidden>🔓 뚜껑 열기</button>
          <p class="ctrl-note" id="gasNote"></p>
        </div>
        <div class="control" data-sc="burn">
          <div class="segmented seg-full" id="matSeg2" role="group" aria-label="재료 고르기">
            <button type="button" data-mat="wool" class="on">강철 솜</button>
            <button type="button" data-mat="wood">나무</button>
          </div>
          <div class="segmented seg-full" id="ctnSeg" role="group" aria-label="용기 고르기">
            <button type="button" data-ctn="open" class="on">열린 공간</button>
            <button type="button" data-ctn="closed">밀폐 용기</button>
          </div>
          <button class="btn btn-primary btn-block" id="burnBtn" type="button">👉 먼저 예상을 골라요</button>
          <p class="ctrl-note" id="burnNote"></p>
        </div>
        <div class="control" data-sc="atoms">
          <div class="segmented seg-full" id="rxSeg" role="group" aria-label="반응 고르기">
            <button type="button" data-rx="0" class="on">앙금</button>
            <button type="button" data-rx="1">기체 발생</button>
            <button type="button" data-rx="2">연소</button>
          </div>
          <button class="btn btn-primary btn-block" id="playBtn" type="button">▶ 반응 재생</button>
          <p class="ctrl-note" id="atomsNote"></p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
