<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>중첩과 측정 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; white-space: nowrap; }
    .segmented button.on { background: var(--subject); color: #fff; }
    .stage-toolbar .segmented { flex-wrap: wrap; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1 1 40%; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .num-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 17px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: #fff; }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
    #modeSeg button { font-size: 13.5px; padding-left: 8px; padding-right: 8px; }
    .unit-in { display: flex; align-items: center; gap: 6px; }
    .unit-in .u { font-weight: 800; color: var(--muted); white-space: nowrap; }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hq">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">전자기와 양자 · Ⅲ. 양자와 미시세계</div>
      <h1>중첩과 측정</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🪙 중첩과 측정</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="bit">
            <button type="button" data-mode="bit" data-feature="bit">🪙 비트와 큐비트</button><button type="button" data-mode="measure" data-feature="measure">📏 측정</button><button type="button" data-mode="again" data-feature="again">🔁 다시 측정</button><button type="button" data-mode="multi" data-feature="multi">🧮 큐비트 여러 개</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="비트 스위치와 큐비트 평면의 화살표, 0과 1이 나올 확률 막대, 측정 결과 기록과 횟수 막대, 기준을 바꾼 측정의 상태 변화, 큐비트 수에 따라 늘어나는 값의 격자와 3큐비트 확률 막대"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">-</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">-</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">-</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="bit">
          <div class="control-head"><span>💾 비트의 값 (스위치)</span></div>
          <div class="segmented view-seg" id="bitSeg" role="group" aria-label="비트의 값"><button type="button" data-v="0">0</button><button type="button" data-v="1">1</button></div>
        </div>
        <div class="control" data-modes="bit measure">
          <div class="control-head"><label for="sT">🧭 큐비트의 각도 θ</label><output id="oT">0°</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sT" data-d="-1" aria-label="각도 줄이기">−</button><input type="range" id="sT" min="0" max="90" step="1" value="0" aria-label="큐비트의 각도 (0도부터 90도)"><button class="nudge" type="button" data-for="sT" data-d="1" aria-label="각도 늘리기">+</button></div>
          <div class="chips" id="preChips" role="group" aria-label="자주 쓰는 각도"><button type="button" data-t="0">0°</button><button type="button" data-t="30">30°</button><button type="button" data-t="45">45°</button><button type="button" data-t="90">90°</button></div>
        </div>
        <div class="control" data-modes="measure">
          <div class="control-head"><span>🔮 다음 결과 예측하기</span></div>
          <div class="segmented view-seg" id="predSeg" role="group" aria-label="다음 결과 예측"><button type="button" data-v="0">0일 거야</button><button type="button" data-v="1">1일 거야</button></div>
          <p class="ctrl-note" id="predNote">예측을 고르고 “측정 1번”을 누르면 맞았는지 알려 줘요.</p>
        </div>
        <div class="control" data-modes="measure">
          <div class="control-head"><span>📏 측정하기 (같은 상태를 다시 준비해서)</span></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bM1" type="button">측정 1번</button><button class="btn btn-sm btn-primary" id="bM10" type="button">×10</button><button class="btn btn-sm btn-primary" id="bM100" type="button">×100</button><button class="btn btn-sm btn-primary" id="bM1000" type="button">×1000</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="bMClear" type="button">🧹 기록 지우기</button></div>
        </div>
        <div class="control" data-modes="again">
          <div class="control-head"><span>📏 측정하기 (측정 기준 고르기)</span></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bMz" type="button">0/1 기준으로 측정</button><button class="btn btn-sm btn-primary" id="bMx" type="button">대각선 기준으로 측정</button></div>
        </div>
        <div class="control" data-modes="again">
          <div class="control-head"><span>🔄 큐비트 새로 준비하기</span></div>
          <div class="btn-row"><button class="btn btn-sm" id="bP30" type="button">θ = 30°로 준비</button><button class="btn btn-sm" id="bP0" type="button">0 상태(0°)로 준비</button></div>
        </div>
        <div class="control" data-modes="multi">
          <div class="control-head"><label for="sN">🔢 큐비트의 수 n</label><output id="oN">3</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sN" data-d="-1" aria-label="큐비트 수 줄이기">−</button><input type="range" id="sN" min="1" max="10" step="1" value="3" aria-label="큐비트의 수 (1개부터 10개)"><button class="nudge" type="button" data-for="sN" data-d="1" aria-label="큐비트 수 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="multi">
          <div class="control-head"><label for="sU">🧭 3큐비트의 각도 θ (모두 같게)</label><output id="oU">45°</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sU" data-d="-1" aria-label="각도 줄이기">−</button><input type="range" id="sU" min="0" max="90" step="1" value="45" aria-label="3큐비트의 각도 (0도부터 90도)"><button class="nudge" type="button" data-for="sU" data-d="1" aria-label="각도 늘리기">+</button></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bM3" type="button">📏 3큐비트 측정하기</button></div>
        </div>
        <div class="control" data-modes="bit" data-match="selA"><div class="control-head"><span>✍️ 상태와 확률 연결하기</span></div><div id="selA"></div></div>
        <div class="control" data-modes="measure" data-match="selB"><div class="control-head"><span>✍️ 예측의 한계 정리하기</span></div><div id="selB"></div></div>
        <div class="control" data-modes="again" data-match="selC"><div class="control-head"><span>✍️ 결과 예측하기</span></div><div id="selC"></div></div>
        <div class="control" data-modes="multi" data-match="numIn">
          <div class="control-head"><span>✍️ 값의 수 계산하기</span></div>
          <div class="sel-row"><div class="q">큐비트 3개로 만들 수 있는 값(000~111)은 모두 몇 가지?</div><div class="unit-in"><input class="num-in" id="n3" inputmode="numeric" autocomplete="off" aria-label="3큐비트로 만들 수 있는 값의 수"><span class="u">가지</span></div></div>
          <div class="sel-row"><div class="q">큐비트 10개라면 모두 몇 가지?</div><div class="unit-in"><input class="num-in" id="n10" inputmode="numeric" autocomplete="off" aria-label="10큐비트로 만들 수 있는 값의 수"><span class="u">가지</span></div></div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
