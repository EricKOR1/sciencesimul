<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>전압·전류·저항의 관계 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; }
    .stage-toolbar { min-height: 61px; }   /* 도구가 열려도 높이가 그대로 */
    .segmented button { min-height: 44px; }

    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 0; }

    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge {
      flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
      background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer;
      display: grid; place-items: center; color: var(--ink);
    }
    .nudge:active:not([disabled]) { transform: scale(.94); background: var(--surface-2); }
    .nudge[disabled] { opacity: .35; cursor: not-allowed; }
    @media (hover: hover) { .nudge:hover:not([disabled]) { background: var(--surface-2); } }

    /* 저항 고르기 */
    .r-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .r-pick button {
      min-height: 46px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface);
      font-weight: 800; font-size: 16px; cursor: pointer; color: var(--muted);
    }
    .r-pick button.on { color: #fff; border-color: var(--rc, var(--subject)); background: var(--rc, var(--subject)); }
    .r-pick button[disabled]:not(.on) { opacity: .4; cursor: not-allowed; }
    .lock-note {
      margin-top: 4px; font-size: 13px; font-weight: 700; color: #8a5300;
      background: var(--warn-soft); border-radius: 8px; padding: 4px 9px;
    }
    .readout .value.name { font-family: var(--font); font-size: 18px; }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g2">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중2 · Ⅶ. 전기와 자기</div>
      <h1>전압·전류·저항의 관계</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🧺 물질 시험</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="실험 고르기" hidden>
            <button type="button" data-mode="material">🧺 물질 시험</button>
            <button type="button" data-mode="resistor" class="on">📏 저항 실험</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="전원 장치, 전류계, 전압계와 집게 또는 니크롬선 저항으로 이루어진 전기 회로, 물질 상자와 전압–전류 그래프"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout" data-mode="material"><span class="label">집게 속 물질</span><span class="value name" id="rM">없음</span></div>
        <div class="readout" data-mode="resistor" data-feature="voltmeter"><span class="label">전압 (전압계)</span><span class="value" id="rV">0.0<small>V</small></span></div>
        <div class="readout"><span class="label">전류 (전류계)</span><span class="value" id="rI">0.00<small>A</small></span></div>
        <div class="readout" data-mode="resistor"><span class="label">저항 (니크롬선)</span><span class="value" id="rR">10<small>Ω</small></span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-mode="material">
          <p class="ctrl-note">🧺 물질 카드를 회로의 <b>집게</b> 쪽으로 끌어다 놓거나, 카드를 눌러 끼워요.</p>
          <div class="control-row" style="margin-top:8px">
            <button class="btn btn-sm" id="emptyBtn" type="button">✋ 집게 비우기</button>
          </div>
        </div>
        <div class="control" data-mode="resistor" data-feature="voltage">
          <div class="control-head"><label for="sV">🔋 전원 장치의 전압</label><output id="oV"></output></div>
          <div class="range-row">
            <button class="nudge" type="button" data-target="V" data-d="-0.1" aria-label="전압 0.1 V 낮추기">−</button>
            <input type="range" id="sV" min="0" max="10" step="0.1" value="2">
            <button class="nudge" type="button" data-target="V" data-d="0.1" aria-label="전압 0.1 V 높이기">+</button>
          </div>
          <div class="lock-note" id="lockV" hidden></div>
        </div>
        <div class="control" data-mode="resistor" data-feature="resistance">
          <div class="control-head"><span>🧱 니크롬선의 저항</span><output id="oR"></output></div>
          <div class="r-pick" id="rPick">
            <button type="button" data-r="10">10 Ω</button>
            <button type="button" data-r="20">20 Ω</button>
            <button type="button" data-r="30">30 Ω</button>
            <button type="button" data-r="40">40 Ω</button>
          </div>
          <div class="lock-note" id="lockR" hidden></div>
        </div>
        <div class="control" data-mode="resistor" data-feature="graph">
          <div class="control-row">
            <button class="btn btn-sm btn-primary" id="recBtn" type="button">📍 데이터 기록</button>
            <button class="btn btn-sm" id="clearBtn" type="button">지우기</button>
          </div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
