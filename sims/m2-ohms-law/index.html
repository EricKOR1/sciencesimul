<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>전류 조종사 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    /* 스위치 / 보기 전환 버튼 */
    .tgl {
      display: inline-flex; align-items: center; gap: 7px; min-height: 38px;
      border: 2px solid var(--line); background: var(--surface); color: var(--muted);
      border-radius: 999px; padding: 6px 13px; font-weight: 800; font-size: 14px; cursor: pointer;
      transition: background .15s, border-color .15s, color .15s; user-select: none;
    }
    .tgl:hover { background: var(--surface-2); }
    .tgl .ico { width: 14px; height: 14px; border-radius: 50%; background: #cbd5e1; flex: none; display: grid; place-items: center; color: #fff; font-size: 11px; line-height: 1; font-weight: 900; }
    .tgl.tgl-e[aria-pressed="true"] { color: #1d4ed8; border-color: #93b4ff; background: #eaf0ff; }
    .tgl.tgl-e[aria-pressed="true"] .ico { background: #2563eb; }
    .tgl.tgl-i .ico { border-radius: 3px; clip-path: polygon(0 25%, 55% 25%, 55% 0, 100% 50%, 55% 100%, 55% 75%, 0 75%); }
    .tgl.tgl-i[aria-pressed="true"] { color: #c2410c; border-color: #fdba8c; background: #fff2e9; }
    .tgl.tgl-i[aria-pressed="true"] .ico { background: #f97316; }
    .sw-btn { color: #9a3412; border-color: #fdba8c; background: #fff7ed; }
    .sw-btn.closed { color: #0b6b39; border-color: #86d9ab; background: var(--good-soft); }

    /* 슬라이더 + 미세 조정 */
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; }
    .nudge {
      flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
      background: var(--surface); font-weight: 900; font-size: 18px; line-height: 1; cursor: pointer;
      display: grid; place-items: center; color: var(--ink);
    }
    .nudge:hover:not([disabled]) { background: var(--surface-2); }
    .nudge:active:not([disabled]) { transform: scale(.94); }
    .nudge[disabled] { opacity: .35; cursor: not-allowed; }
    input[type=range][disabled] { opacity: .45; cursor: not-allowed; }
    .lock-note {
      margin-top: 4px; font-size: 12.5px; font-weight: 700; color: #8a5300;
      background: var(--warn-soft); border-radius: 8px; padding: 4px 9px;
    }
    @media (max-width: 480px) {
      .stage-toolbar { gap: 6px; padding: 8px 10px; }
      .stage-toolbar .spacer { display: none; }
      .tgl { padding: 5px 10px; font-size: 13px; gap: 5px; min-height: 36px; }
      .tgl .opt { display: none; }
    }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g2">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중2 · Ⅶ. 전기와 자기</div>
      <h1>전류 조종사</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card" id="stageCard">
        <div class="stage-toolbar">
          <button type="button" class="tgl sw-btn" id="swBtn" aria-pressed="false">🔌 스위치 닫기</button>
          <span class="spacer"></span>
          <button type="button" class="tgl tgl-e" id="tgE" aria-pressed="true"><span class="ico">−</span>전자 흐름<span class="opt"> 보기</span></button>
          <button type="button" class="tgl tgl-i" id="tgI" aria-pressed="false"><span class="ico"></span>전류 방향<span class="opt"> 보기</span></button>
        </div>
        <canvas id="cv" aria-label="전원 장치, 전구, 전류계, 전압계, 스위치로 이루어진 전기 회로 시뮬레이션"></canvas>
        <div class="stage-hint" id="stageHint">👆 스위치를 눌러 회로를 닫아 보세요</div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label">전압 (전압계)</span><span class="value" id="rV">0.0<small>V</small></span></div>
        <div class="readout"><span class="label">전류 (전류계)</span><span class="value" id="rI">0.00<small>A</small></span></div>
        <div class="readout"><span class="label">저항 (전구)</span><span class="value" id="rR">10<small>Ω</small></span></div>
        <div class="readout"><span class="label">소비 전력</span><span class="value" id="rP">0.00<small>W</small></span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad">
        <div class="control" id="ctrlV">
          <div class="control-head"><label for="sV">🔋 전원 장치의 전압</label><output id="oV"></output></div>
          <div class="range-row">
            <button class="nudge" type="button" data-target="V" data-d="-0.1" aria-label="전압 0.1 V 낮추기">−</button>
            <input type="range" id="sV" min="0" max="12" step="0.1" value="3">
            <button class="nudge" type="button" data-target="V" data-d="0.1" aria-label="전압 0.1 V 높이기">+</button>
          </div>
          <div class="lock-note" id="lockV" hidden></div>
        </div>
        <div class="control" id="ctrlR">
          <div class="control-head"><label for="sR">💡 전구의 저항</label><output id="oR"></output></div>
          <div class="range-row">
            <button class="nudge" type="button" data-target="R" data-d="-5" aria-label="저항 5 Ω 줄이기">−</button>
            <input type="range" id="sR" min="5" max="40" step="5" value="10">
            <button class="nudge" type="button" data-target="R" data-d="5" aria-label="저항 5 Ω 늘리기">+</button>
          </div>
          <div class="lock-note" id="lockR" hidden></div>
        </div>
        <div class="control">
          <div class="control-row">
            <button class="btn btn-sm btn-primary" id="recBtn" type="button">📍 데이터 기록</button>
            <button class="btn btn-sm" id="clearBtn" type="button">지우기</button>
            <span class="spacer" style="flex:1"></span>
            <button class="btn btn-sm btn-ghost" id="resetBtn" type="button">↺ 초기화</button>
          </div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="sim.js"></script>
</body>
</html>
