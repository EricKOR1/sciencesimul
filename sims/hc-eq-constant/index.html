<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#8b5cf6">
  <title>평형 상수 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; line-height: 1.4; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .nudge:disabled { opacity: .4; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { flex: 1 1 auto; min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .chips button.done { border-color: var(--good); background: var(--good-soft); }
    .chips button.done.on { background: color-mix(in srgb, var(--good) 22%, white); }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.3; }
    .in-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .in-row label { flex: 1; font-weight: 800; font-size: 14.5px; line-height: 1.25; }
    .in-row input { width: 100px; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 16px var(--font); color: var(--ink); background: #fff; text-align: right; }
    .in-row input.ok { border-color: var(--good); background: var(--good-soft); }
    .in-row input.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .in-row span.u { min-width: 34px; font-weight: 800; color: var(--muted); font-size: 14px; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 16px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td, .note-step table.mini th, .note-step table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .note-step table.mini { border-collapse: collapse; margin: 6px 0; font-size: 13.5px; width: 100%; }
    table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 14px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .segmented button { padding-left: 8px; padding-right: 8px; font-size: 13.5px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; white-space: normal; }
    }
    .in-row label { font-size: 14px; }
    .in-row input { width: 92px; }
    table.ice { width: 100%; border-collapse: collapse; margin-top: 4px; }
    table.ice th { font-size: 12.5px; color: var(--muted); font-weight: 800; padding: 2px 2px; text-align: center; }
    table.ice td { padding: 3px 2px; text-align: center; font-weight: 800; font-size: 14px; }
    table.ice td.nm { text-align: left; font-size: 14px; }
    table.ice input { width: 100%; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 10px; padding: 2px 4px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; text-align: right; }
    table.ice input.ok { border-color: var(--good); background: var(--good-soft); }
    table.ice input.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    table.ice td.giv { color: var(--muted); background: var(--surface-2); border-radius: 8px; }
    .k-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-weight: 800; }
    .k-row input { flex: 1; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 10px; padding: 2px 8px; font: 800 15px var(--font); color: var(--ink); background: #fff; text-align: right; }
    .k-row input.ok { border-color: var(--good); background: var(--good-soft); }
    .k-row input.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
  </style>
</head>
<body class="sim-page" data-subject="chem">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hc">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">화학 · Ⅲ. 화학 평형</div>
      <h1>평형 상수</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">📋 농도 변화표</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기">
            <button type="button" data-mode="ice" data-feature="ice">📋 농도 변화표</button>
            <button type="button" data-mode="size" data-feature="size">📏 K의 크기</button>
            <button type="button" data-mode="temp" data-feature="temp">🌡 온도와 K</button>
            <button type="button" data-mode="flip" data-feature="flip">🔄 K 뒤집기</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="처음 변화 평형 농도 표와 막대, K 슬라이더에 따라 바뀌는 평형 조성 막대, 온도에 따라 색이 진해지는 NO₂ 플라스크와 K 기록, 정반응과 역반응의 K 카드 뒤집기"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <!-- ① 농도 변화표 -->
        <div class="control" data-modes="ice">
          <div class="control-head"><span>⚗️ 예제 고르기</span></div>
          <div class="chips" id="exChips" role="group" aria-label="예제 고르기"></div>
        </div>
        <div class="control" data-modes="ice">
          <div class="control-head"><span>✍️ 표 채우기 (mol/L)</span></div>
          <div id="iceBox"></div>
          <div class="btn-row">
            <button class="btn btn-sm" id="bIceChk" type="button">🔎 칸 확인</button>
            <button class="btn btn-sm btn-primary" id="bIcePlay" type="button">▶ 평형까지 보기</button>
          </div>
        </div>
        <!-- ② K의 크기 -->
        <div class="control" data-modes="size">
          <div class="control-head"><span>🔭 살펴볼 장면</span></div>
          <div class="segmented view-seg" id="subSeg" role="group" aria-label="장면 고르기">
            <button type="button" data-v="slider">🎚 K 바꾸기</button>
            <button type="button" data-v="rxn">⚖️ 세 반응</button>
            <button type="button" data-v="speed">⏱ 속도와 K</button>
          </div>
        </div>
        <div class="control" data-modes="size" data-sub="slider">
          <div class="control-head"><span>🎚 평형 상수 K</span><output id="kOut">1</output></div>
          <div class="range-row">
            <button class="nudge" id="kMinus" type="button" aria-label="K 10배 줄이기">−</button>
            <input type="range" id="kRange" min="-3" max="3" step="1" value="0" aria-label="평형 상수 K의 거듭제곱">
            <button class="nudge" id="kPlus" type="button" aria-label="K 10배 늘이기">+</button>
          </div>
          <p class="ctrl-note">A ⇌ B에서 처음 [A] = 1.0 mol/L예요. K는 10⁻³ ~ 10³까지 바꿀 수 있어요.</p>
        </div>
        <div class="control" data-modes="size" data-sub="speed">
          <div class="control-head"><span>⏱ 같은 K, 다른 속도</span></div>
          <div class="btn-row">
            <button class="btn btn-sm btn-primary" id="bSpRun" type="button">▶ 두 반응 시작</button>
            <button class="btn btn-sm" id="bSpAgain" type="button">↺ 다시</button>
          </div>
          <p class="ctrl-note">두 반응 모두 A ⇌ B이고 K = 4예요. 반응이 빠르고 느린 정도만 달라요.</p>
        </div>
        <!-- ③ 온도와 K -->
        <div class="control" data-modes="temp">
          <div class="control-head"><span>🧪 처음 N₂O₄ 농도</span></div>
          <div class="chips" id="c0Chips" role="group" aria-label="처음 농도 고르기"></div>
        </div>
        <div class="control" data-modes="temp">
          <div class="control-head"><span>🌡 온도</span></div>
          <div class="segmented view-seg" id="tSeg" role="group" aria-label="온도 고르기">
            <button type="button" data-v="25">❄️ 25 °C</button>
            <button type="button" data-v="100">🔥 100 °C</button>
          </div>
          <div class="btn-row">
            <button class="btn btn-sm btn-primary" id="bTRun" type="button">▶ 평형까지</button>
            <button class="btn btn-sm" id="bTRec" type="button">📏 K 기록</button>
          </div>
          <div class="btn-row"><button class="btn btn-sm" id="bTClear" type="button">🗑 기록 지우기</button></div>
        </div>
        <!-- ④ K 뒤집기 -->
        <div class="control" data-modes="flip">
          <div class="control-head"><span>🔄 반응 고르기</span></div>
          <div class="chips" id="fpChips" role="group" aria-label="반응 고르기"></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bFlip" type="button">🔄 반응식 뒤집기</button></div>
        </div>
        <div class="control" data-modes="flip" data-gate="kp">
          <div class="control-head"><span>✍️ 역반응의 K′ 구하기</span></div>
          <div class="in-row"><label for="kp1">2NO₂ ⇌ N₂O₄ (정반응 K = 0.0060)</label><input id="kp1" type="text" inputmode="decimal" autocomplete="off" placeholder="0"></div>
          <div class="in-row"><label for="kp2">2HI ⇌ H₂ + I₂ (정반응 K = 25)</label><input id="kp2" type="text" inputmode="decimal" autocomplete="off" placeholder="0.000"></div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
