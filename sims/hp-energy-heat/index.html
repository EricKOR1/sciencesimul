<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>역학적 에너지의 열 전환 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--phy); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; line-height: 1.4; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .seg-wrap { display: flex; flex-wrap: wrap; width: 100%; border-radius: 20px; }
    .seg-wrap button { flex: 1 1 44%; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14.5px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .nudge:disabled { opacity: .4; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); font-family: inherit; }
    .chips button.on { border-color: var(--phy); background: color-mix(in srgb, var(--phy) 14%, white); color: #9a3412; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.3; }
    .num-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .num-row input { flex: 1; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 17px var(--font); color: var(--ink); background: #fff; }
    .num-row input.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .num-row .unit { font-weight: 800; color: var(--muted); font-size: 15px; white-space: nowrap; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini, table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td, table.mini th, table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th, table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }

    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar:has(> .segmented[hidden]) { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hp">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">물리학 · Ⅰ. 힘과 에너지</div>
      <h1>역학적 에너지의 열 전환</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🧱 멈추는 이유</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="ledger">
            <button type="button" data-mode="stop" data-feature="stop">🧱 멈추는 이유</button>
            <button type="button" data-mode="ledger" data-feature="ledger">📒 에너지 장부</button>
            <button type="button" data-mode="phenom" data-feature="phenom">🌡️ 열 현상</button>
            <button type="button" data-mode="argue" data-feature="argue">⚖️ 총량 논증</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="마찰로 멈추는 장면과 열화상 카메라, 마찰 비탈·충돌·줄의 실험 에너지 장부, 열 현상 카드, 사라진 에너지 찾기 시나리오"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">-</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">-</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">-</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">

        <!-- ① 멈추는 이유 -->
        <div class="control" data-modes="stop">
          <div class="control-head"><span>🎬 장면 고르기</span></div>
          <div class="segmented seg-wrap" id="spSeg" role="group" aria-label="장면 고르기">
            <button type="button" data-s="box">🧱 상자</button><button type="button" data-s="hands">🖐️ 손바닥</button><button type="button" data-s="nail">🔨 못</button>
          </div>
        </div>
        <div class="control" data-modes="stop">
          <div class="control-head"><span>📷 카메라</span></div>
          <div class="segmented view-seg" id="camSeg" role="group" aria-label="카메라 종류">
            <button type="button" data-c="0">📷 일반</button><button type="button" data-c="1">🌡️ 열화상</button>
          </div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bStop" type="button">▶ 밀어 보내기</button></div>
        </div>
        <!-- ② 에너지 장부 -->
        <div class="control" data-modes="ledger">
          <div class="control-head"><span>📒 실험 고르기</span></div>
          <div class="segmented view-seg" id="lgSub" role="group" aria-label="장부 실험 고르기">
            <button type="button" data-s="slope">🏔️ 마찰 비탈</button><button type="button" data-s="crash">💥 충돌</button><button type="button" data-s="joule">🌀 줄의 실험</button>
          </div>
        </div>
        <div class="control" data-modes="ledger" data-sub="slope crash">
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bLgRun" type="button">▶ 내려 보내기</button></div>
          <div class="control-head" style="margin-top:8px"><label for="qInput">✏️ 장부의 열 Q</label></div>
          <div class="num-row"><input id="qInput" type="text" inputmode="decimal" autocomplete="off" placeholder="예: 10" aria-label="열 Q (줄)"><span class="unit">J</span></div>
          <div class="btn-row"><button class="btn btn-sm" id="bQWrite" type="button">🖊️ 장부에 적기</button></div>
          <p class="ctrl-note">끝까지 실행한 뒤, 줄어든 에너지를 열 Q로 적어 합을 맞춰요.</p>
        </div>
        <div class="control" data-modes="ledger" data-sub="joule">
          <div class="control-head"><span>🔩 추 떨어뜨리기</span><output id="oJn">0번</output></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bJ1" type="button">⬇️ 1번</button><button class="btn btn-sm btn-primary" id="bJ20" type="button">⏩ 20번 빠르게</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="bJReset" type="button">↺ 처음부터</button></div>
          <p class="ctrl-note">추 10 kg이 2.0 m 내려갈 때마다 물 1.0 kg을 저어요.</p>
        </div>
        <div class="control" data-modes="ledger" data-sub="joule" data-tin>
          <div class="control-head"><label for="tInput">✏️ 물의 온도 상승</label></div>
          <div class="num-row"><input id="tInput" type="text" inputmode="decimal" autocomplete="off" placeholder="예: 0.50" aria-label="물의 온도 상승 (섭씨)"><span class="unit">°C</span></div>
        </div>
        <!-- ③ 열 현상 -->
        <div class="control" data-modes="phenom">
          <div class="control-head"><span>🧩 카드와 개념 연결하기</span></div>
          <div id="phRows"></div>
        </div>
        <!-- ④ 총량 논증 -->
        <div class="control" data-modes="argue">
          <div class="control-head"><span>🎬 시나리오</span></div>
          <div class="segmented view-seg" id="arSeg" role="group" aria-label="시나리오 고르기">
            <button type="button" data-s="ball">⚽ 공</button><button type="button" data-s="clay">🟤 점토</button><button type="button" data-s="car">🚗 자동차</button>
          </div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bArRun" type="button">▶ 실행</button></div>
        </div>
        <div class="control" data-modes="argue">
          <div class="control-head"><label for="eaInput">① 처음 역학적 에너지</label></div>
          <div class="num-row"><input id="eaInput" type="text" inputmode="decimal" autocomplete="off" placeholder="숫자" aria-label="처음 역학적 에너지"><span class="unit" id="arU1">J</span></div>
          <div class="control-head" style="margin-top:6px"><label for="ebInput">② 멈춘 뒤 역학적 에너지</label></div>
          <div class="num-row"><input id="ebInput" type="text" inputmode="decimal" autocomplete="off" placeholder="숫자" aria-label="나중 역학적 에너지"><span class="unit" id="arU2">J</span></div>
          <div class="control-head" style="margin-top:6px"><label for="ecInput">③ 발생한 열 Q</label></div>
          <div class="num-row"><input id="ecInput" type="text" inputmode="decimal" autocomplete="off" placeholder="숫자" aria-label="발생한 열"><span class="unit" id="arU3">J</span></div>
        </div>

      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
