<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>로런츠 힘의 활용 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .seg-wrap { display: flex; flex-wrap: wrap; width: 100%; }
    .seg-wrap button { flex: 1 1 44%; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .nudge:disabled { opacity: .4; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok, .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad, .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    .numrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .numrow .q { flex: 1 1 100%; font-weight: 800; font-size: 14px; line-height: 1.3; margin-bottom: 2px; }
    .numrow .pre, .numrow .unit { font-weight: 800; font-size: 15px; }
    .num-in { width: 84px; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 16px var(--font); color: var(--ink); background: #fff; text-align: right; }
    select.num-in { width: auto; text-align: left; padding-right: 4px; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .chips button:disabled { opacity: .45; cursor: not-allowed; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar:has(> .segmented[hidden]) { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hq">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">전자기와 양자 · Ⅰ. 전자기적 상호작용</div>
      <h1>로런츠 힘의 활용</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">⚛️ 가속기</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="mass">
            <button type="button" data-mode="cyc" data-feature="cyc">⚛️ 가속기</button><button type="button" data-mode="mass" data-feature="mass">🧪 질량 분석</button><button type="button" data-mode="tok" data-feature="tok">🍩 토카막</button><button type="button" data-mode="van" data-feature="van">🌍 밴앨런대</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="사이클로트론, 질량 분석기, 토카막, 밴앨런대에서 로런츠 힘이 입자를 가속하고 가두는 모습을 살펴보는 화면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="cyc" data-gate-off="mc1">
          <div class="control-head"><label for="sCB">🧲 자기장 B</label><output id="osCB"></output></div><div class="range-row"><button class="nudge" id="sCBM" type="button" aria-label="자기장 (0.6테슬라부터 1.2테슬라) 줄이기">−</button><input type="range" id="sCB" min="0.6" max="1.2" step="0.1" value="0.8" aria-label="자기장 (0.6테슬라부터 1.2테슬라)"><button class="nudge" id="sCBP" type="button" aria-label="자기장 (0.6테슬라부터 1.2테슬라) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="cyc" data-gate-off="mc1">
          <div class="control-head"><label for="sCf">〰️ 전원 진동수 f</label><output id="osCf"></output></div><div class="range-row"><button class="nudge" id="sCfM" type="button" aria-label="전원 진동수 (10메가헤르츠부터 20메가헤르츠) 줄이기">−</button><input type="range" id="sCf" min="10" max="20" step="0.1" value="12" aria-label="전원 진동수 (10메가헤르츠부터 20메가헤르츠)"><button class="nudge" id="sCfP" type="button" aria-label="전원 진동수 (10메가헤르츠부터 20메가헤르츠) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="cyc" data-gate-off="mc1"><div class="btn-row"><button class="btn btn-sm btn-primary" id="bCyGo" type="button">▶ 가속 시작</button><button class="btn btn-sm" id="bCyReset" type="button">↺ 처음으로</button></div></div>
        <div class="control" data-modes="cyc" data-gate="mc1" id="numFHost"></div>
        <div class="control" data-modes="mass" data-gate-off="mm2">
          <div class="control-head"><label for="sME">⚡ 전기장 E</label><output id="osME"></output></div><div class="range-row"><button class="nudge" id="sMEM" type="button" aria-label="전기장 (3부터 7, 단위 10의 4제곱 볼트 매 미터) 줄이기">−</button><input type="range" id="sME" min="3" max="7" step="0.5" value="4" aria-label="전기장 (3부터 7, 단위 10의 4제곱 볼트 매 미터)"><button class="nudge" id="sMEP" type="button" aria-label="전기장 (3부터 7, 단위 10의 4제곱 볼트 매 미터) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="mass" data-gate-off="mm2">
          <div class="control-head"><label for="sMB">🧲 자기장 B₁</label><output id="osMB"></output></div><div class="range-row"><button class="nudge" id="sMBM" type="button" aria-label="속도 선택기 자기장 (0.3테슬라부터 0.7테슬라) 줄이기">−</button><input type="range" id="sMB" min="0.3" max="0.7" step="0.05" value="0.5" aria-label="속도 선택기 자기장 (0.3테슬라부터 0.7테슬라)"><button class="nudge" id="sMBP" type="button" aria-label="속도 선택기 자기장 (0.3테슬라부터 0.7테슬라) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="mass" data-gate-off="mm2">
          <div class="control-head"><span>🧪 시료 이온</span></div>
          <div class="segmented seg-wrap" id="setSeg" role="group" aria-label="🧪 시료 이온"><button type="button" data-v="mix">탄소-12 + 탄소-14</button><button type="button" data-v="dbl">탄소-12 (+2e)</button><button type="button" data-v="x">시료 X</button></div>
        </div>
        <div class="control" data-modes="mass" data-gate-off="mm2"><div class="btn-row"><button class="btn btn-sm" id="bMsClear" type="button">↺ 기록 지우기</button></div></div>
        <div class="control" data-modes="mass" data-gate="mm2" id="numMHost"></div>
        <div class="control" data-modes="tok" data-gate-off="mt2">
          <div class="control-head"><label for="sTB">🧲 자기장 B</label><output id="osTB"></output></div><div class="range-row"><button class="nudge" id="sTBM" type="button" aria-label="도넛 방향 자기장 (0테슬라부터 4테슬라) 줄이기">−</button><input type="range" id="sTB" min="0" max="4" step="0.1" value="0.5" aria-label="도넛 방향 자기장 (0테슬라부터 4테슬라)"><button class="nudge" id="sTBP" type="button" aria-label="도넛 방향 자기장 (0테슬라부터 4테슬라) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="tok" data-gate-off="mt2"><div class="btn-row"><button class="btn btn-sm btn-primary" id="bIp" type="button">⚡ 플라스마 전류 켜기</button><button class="btn btn-sm" id="bTkRe" type="button">🔥 플라스마 다시 채우기</button></div></div>
        <div class="control" data-modes="tok" data-gate="mt2" id="numRHost"></div>
        <div class="control" data-modes="van" data-gate-off="mv2">
          <div class="control-head"><span>⚛️ 입자</span></div>
          <div class="segmented view-seg" id="vsSeg" role="group" aria-label="⚛️ 입자"><button type="button" data-v="p">양성자 (+)</button><button type="button" data-v="e">전자 (−)</button></div>
        </div>
        <div class="control" data-modes="van" data-gate-off="mv2">
          <div class="control-head"><span>↗ 적도에서 피치각</span></div>
          <div class="segmented view-seg" id="paSeg" role="group" aria-label="↗ 적도에서 피치각"><button type="button" data-v="70">큰 각 70°</button><button type="button" data-v="40">중간 40°</button><button type="button" data-v="3">작은 각 3°</button></div>
        </div>
        <div class="control" data-modes="van" data-gate-off="mv2"><div class="btn-row"><button class="btn btn-sm btn-primary" id="bVaGo" type="button">▶ 입자 넣기</button><button class="btn btn-sm" id="bStorm" type="button">☀️ 태양 폭풍 켜기</button></div></div>
        <div class="control" data-modes="van" data-gate="mv2" id="sat4Host"></div>

      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
