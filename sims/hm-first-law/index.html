<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>열역학 제1법칙 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
<style>
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--phy); color: #fff; }
    #modeSeg { width: 100%; }
    #modeSeg button { flex: 1 1 auto; min-width: 0; padding-left: 8px; padding-right: 8px; font-size: 14.5px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .num-in { width: 100%; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 16px var(--font); color: var(--ink); background: #fff; }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .in-grid { display: grid; grid-template-columns: 1fr 96px; gap: 6px 8px; align-items: center; margin-top: 6px; }
    .in-grid .lab { font-weight: 800; font-size: 14px; line-height: 1.25; }
    .in-grid .num-in { min-height: 40px; padding: 2px 8px; font-size: 15px; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini, table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td, table.mini th, table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th, table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer { display: none; }
      #modeSeg button { font-size: 13.5px; padding-left: 6px; padding-right: 6px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }

    .seg-wrap { border-radius: 20px; display: flex; flex-wrap: wrap; width: 100%; }
    .seg-wrap button { flex: 1 1 auto; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14px; }
    #modeSeg { flex-wrap: wrap; }
    #modeSeg button[hidden] { display: none !important; }

    .proc-sel { margin-top: 6px; }
    .cls-row { margin-top: 6px; }
  </style>

</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hm">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">역학과 에너지 · Ⅱ. 열과 에너지</div>
      <h1>열역학 제1법칙</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기">
            <button type="button" data-mode="piston">🔥 열과 일</button>
            <button type="button" data-mode="pv">📈 P–V 그래프</button>
            <button type="button" data-mode="proc">🔀 네 가지 과정</button>
            <button type="button" data-mode="life">🌍 생활 속 예</button>
            <button type="button" data-mode="pump">🚲 펌프 설계</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="열역학 제1법칙을 탐구하는 화면. 피스톤 속 기체에 열을 주어 내부 에너지와 일의 변화를 보고, P–V 그래프의 넓이로 일을 읽고, 등적·등압·등온·단열 과정의 열과 일과 내부 에너지를 비교하고, 생활 속 예와 자전거 펌프 설계를 살펴봐요."></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <!-- 열과 일 -->
        <div class="control" data-modes="piston">
          <div class="control-head"><span>🧪 실험</span></div><div class="segmented seg-wrap" id="piMode" role="group" aria-label="피스톤 실험 종류">
            <button type="button" data-pm="fix">🔒 고정</button><button type="button" data-pm="free">🔓 자유</button><button type="button" data-pm="press">🖐️ 눌러 압축</button></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bPiRun" type="button">▶ 열 2 078 J 주기</button><button class="btn btn-sm" id="bPiR" type="button">↺ 처음으로</button></div>
          <p class="ctrl-note" id="nPi">열 Q = 2 078 J을 같은 양만큼 줘요.</p>
        </div>
        <!-- P-V 그래프 -->
        <div class="control" data-modes="pv">
          <div class="control-head"><span>📈 과정</span></div><div class="segmented seg-wrap" id="pvKind" role="group" aria-label="과정 고르기">
            <button type="button" data-k="ib">등압 (P 일정)</button><button type="button" data-k="it">등온 (T 일정)</button></div>
        </div>
        <div class="control" data-modes="pv" data-kind="ib">
          <div class="control-head"><label for="sPvT">🌡️ 나중 온도 T₂</label><output id="oPvT">400 K</output></div>
          <div class="range-row"><input type="range" id="sPvT" min="200" max="500" step="10" value="400" aria-label="나중 온도 (켈빈)"></div>
        </div>
        <div class="control" data-modes="pv" data-kind="it">
          <div class="control-head"><label for="sPvV">📏 나중 부피 V₂</label><output id="oPvV">50 L</output></div>
          <div class="range-row"><input type="range" id="sPvV" min="13" max="60" step="1" value="50" aria-label="나중 부피 (리터)"></div>
        </div>
        <div class="control" data-modes="pv">
          <div class="btn-row"><button class="btn btn-sm" id="bPvGrid" type="button">🔢 격자 세기 켜기</button></div>
        </div>
        <div class="control" data-modes="pv" data-calc="w1">
          <div class="control-head"><span>📝 등압 팽창 일 W (J)</span></div>
          <input class="num-in" id="iW1" type="number" inputmode="decimal" step="any" aria-label="등압 팽창에서 계가 한 일 (줄)">
        </div>
        <div class="control" data-modes="pv" data-calc="w2">
          <div class="control-head"><span>📝 등온 팽창 일 W (kJ)</span></div>
          <input class="num-in" id="iW2" type="number" inputmode="decimal" step="any" aria-label="등온 팽창에서 계가 한 일 (킬로줄)">
        </div>
        <!-- 네 가지 과정 -->
        <div class="control" data-modes="proc">
          <div class="control-head"><span>🔀 과정 고르기</span></div><div class="segmented seg-wrap" id="prKind" role="group" aria-label="열역학 과정 고르기">
            <button type="button" data-k="iv">등적</button><button type="button" data-k="ib">등압</button><button type="button" data-k="it">등온</button><button type="button" data-k="ia">단열</button></div>
          <div class="control-head" style="margin-top:8px"><label for="sPr" id="lPr">나중 온도 T₂</label><output id="oPr">400 K</output></div>
          <div class="range-row"><input type="range" id="sPr" min="200" max="500" step="10" value="400" aria-label="과정의 크기"></div>
        </div>
        <div class="control" data-modes="proc" data-calc="tab">
          <div class="control-head"><span>📝 표의 ? 채우기 (J)</span></div>
          <div class="in-grid">
            <span class="lab">등적 Q</span><input class="num-in" id="iP1" type="number" inputmode="decimal" step="any" aria-label="등적 과정의 열 Q (줄)">
            <span class="lab">등압 Q</span><input class="num-in" id="iP2" type="number" inputmode="decimal" step="any" aria-label="등압 과정의 열 Q (줄)">
            <span class="lab">등온 Q</span><input class="num-in" id="iP3" type="number" inputmode="decimal" step="any" aria-label="등온 과정의 열 Q (줄)">
            <span class="lab">단열 ΔU</span><input class="num-in" id="iP4" type="number" inputmode="decimal" step="any" aria-label="단열 과정의 내부 에너지 변화 (줄)">
          </div>
        </div>
        <div class="control" data-modes="proc" data-calc="dt">
          <div class="control-head"><span>📝 단열 압축의 온도 상승 ΔT (K)</span></div>
          <input class="num-in" id="iDT" type="number" inputmode="decimal" step="any" aria-label="단열 압축의 온도 상승 (켈빈)">
        </div>
        <!-- 생활 속 예 -->
        <div class="control" data-modes="life" data-calc="cls">
          <div class="control-head"><span>🗂️ 어떤 과정일까요?</span></div>
          <div id="clsBox"></div>
        </div>
        <div class="control" data-modes="life" data-lock="cls">
          <p class="ctrl-note">카드를 눌러 제1법칙의 부호를 확인해 보세요.</p>
        </div>
        <!-- 펌프 -->
        <div class="control" data-modes="pump">
          <div class="control-head"><label for="sPf">🌬️ 열이 주위로 빠지는 정도</label><output id="oPf">0 %</output></div>
          <div class="range-row"><input type="range" id="sPf" min="0" max="100" step="10" value="0" aria-label="열이 주위로 빠지는 정도 (퍼센트)"></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bPuRun" type="button">▶ 500 J로 누르기</button><button class="btn btn-sm" id="bPuR" type="button">↺ 처음으로</button></div>
          <p class="ctrl-note" id="nPu">0 % = 완전 단열, 100 % = 열이 모두 빠져 온도 일정</p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
