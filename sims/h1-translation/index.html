<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16a34a">
  <title>번역: mRNA에서 단백질로 | 고1 통합과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏭</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-toolbar { min-height: 58px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; }
    .stage-toolbar .segmented button { min-height: 40px; padding: 5px 12px; font-size: 14.5px; white-space: nowrap; }
    .segmented button.on { background: var(--subject); color: #fff; }
    .seg-wide { display: flex; width: 100%; }
    .seg-wide button { flex: 1; min-width: 0; padding: 6px 4px; font-size: 14.5px; min-height: 44px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard [hidden] { display: none !important; }
    .btn-sm { min-height: 44px; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    .btn-row .btn { flex: 1; padding-left: 6px; padding-right: 6px; }
    .ctrl-note { margin: 6px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
    .stepper .st .l { white-space: normal; text-align: center; line-height: 1.15; overflow: visible; }
    .readout .value.txt { font-family: var(--font); font-size: 16px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 14px; }
      .stage-toolbar .spacer { display: none; }
      .stage-toolbar .segmented button { padding: 5px 8px; font-size: 13.5px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="bio">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#h1a">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">통합과학1 · Ⅲ. 시스템과 상호작용</div>
      <h1>번역: mRNA에서 단백질로</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🏭 리보솜</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" hidden>
            <button type="button" data-mode="ribo">🏭 리보솜</button>
            <button type="button" data-mode="table">📖 코돈표</button>
            <button type="button" data-mode="synth">🧶 단백질 합성</button>
            <button type="button" data-mode="mut">🧬 변이와 흐름</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="리보솜이 mRNA의 코돈을 읽는 장면, 코돈표로 아미노산 서열 쓰기, tRNA가 아미노산을 운반해 사슬을 만드는 단백질 합성, 염기 하나의 변이와 정보 흐름 정리"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1"> </span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2"> </span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3"> </span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" id="mutSegBox" data-show="mut:change mut:flow">
          <div class="segmented seg-wide" id="mutSeg"><button type="button" data-s="change">✏ 염기 바꾸기</button><button type="button" data-s="flow">🧭 흐름 정리</button></div>
        </div>
        <div class="control" data-show="ribo">
          <div class="control-head"><span>🏭 mRNA를 리보솜에</span><output id="oRb">—</output></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary btn-block" id="bLoad" type="button">📎 mRNA 장착하기</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="bLeft" type="button">◀ 한 칸</button><button class="btn btn-sm" id="bRight" type="button">▶ 한 칸</button></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary btn-block" id="bLock" type="button">🔒 여기서 읽기 시작</button></div>
          <div class="btn-row"><button class="btn btn-sm btn-block" id="bRbReset" type="button">↺ 다시 하기</button></div>
          <p class="ctrl-note" id="rbNote">mRNA를 끌어다 리보솜 틈에 끼워요. (버튼으로도 장착할 수 있어요.)</p>
        </div>
        <div class="control" data-show="table">
          <div class="segmented seg-wide" id="sqSeg"><button type="button" data-q="0">서열 1</button><button type="button" data-q="1">서열 2</button></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bCut" type="button">✂ 3개씩 끊기</button><button class="btn btn-sm" id="bTbReset" type="button">↺ 다시 하기</button></div>
          <p class="ctrl-note" id="tbNote">mRNA를 3개씩 끊은 뒤, 코돈표를 보고 코돈마다 아미노산을 골라요.</p>
        </div>
        <div class="control" data-show="synth">
          <div class="control-head"><span>🧶 단백질 합성</span><output id="oSy">0 / 4</output></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bEnd" type="button">🛑 합성 끝내기</button><button class="btn btn-sm btn-primary" id="bFold" type="button">🧶 사슬 접기</button></div>
          <div class="btn-row"><button class="btn btn-sm btn-block" id="bSyReset" type="button">↺ 다시 하기</button></div>
          <p class="ctrl-note" id="syNote">코돈에 안티코돈이 맞는 tRNA를 끌어다 A 자리(점선)에 놓아요.</p>
        </div>
        <div class="control" data-show="mut:change">
          <div class="segmented seg-wide" id="exSeg"><button type="button" data-x="0">① 같은 아미노산</button><button type="button" data-x="1">② 바뀐 아미노산</button><button type="button" data-x="2">③ 종결 코돈</button></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary btn-block" id="bMut" type="button">✏ 염기 하나 바꾸기</button></div>
          <p class="ctrl-note" id="mtNote">염기를 하나 바꾸고 단백질이 어떻게 달라지는지 비교해요.</p>
        </div>
        <div class="control" data-show="mut:flow">
          <div class="control-head"><span>🧭 흐름 완성</span><output id="oFl">0 / 7</output></div>
          <div class="btn-row"><button class="btn btn-sm btn-block" id="bFlReset" type="button">↺ 다시 하기</button></div>
          <p class="ctrl-note">오른쪽 카드를 눌러 왼쪽 칸을 위에서부터 채워요. 칸을 누르면 카드가 돌아와요.</p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
