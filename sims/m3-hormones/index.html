<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16a34a">
  <title>호르몬과 항상성 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-card { background: #eef4ef; }
    .stage-toolbar { min-height: 61px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #sceneSeg button { min-height: 44px; padding: 6px 11px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard [hidden] { display: none !important; }
    .cgrp { display: flex; flex-direction: column; gap: 10px; }
    .cgrp .btn { min-height: 48px; font-size: 16px; }
    .cgrp .btn[disabled] { opacity: .45; cursor: default; }
    .cgrp .segmented { display: flex; }
    .cgrp .segmented button { flex: 1; min-height: 44px; padding: 6px 8px; font-size: 14.5px; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-row .btn { min-height: 62px; line-height: 1.25; }
    .btn-row .btn small { font-weight: 700; opacity: .9; font-size: 12.5px; }
    #envSeg button, #dsSeg button, #scSeg button { font-size: 13.5px; padding: 6px 4px; }
    .ctrl-note { font-size: 13.5px; color: var(--muted); margin: 2px 0 0; line-height: 1.4; }
    .mission-figure svg { border-radius: 12px; }
    @media (max-width: 599px) {
      #sceneSeg { flex-wrap: nowrap; }
      #sceneSeg button { padding: 6px 10px; font-size: 14px; }
      #sceneSeg button:not(.on) .t { display: none; }
    }
  </style>
</head>
<body class="sim-page" data-subject="bio">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g3">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중3 · Ⅴ. 자극과 반응</div>
      <h1>호르몬과 항상성</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="sceneLabel">🩸 호르몬을 내보내는 내분비샘</span>
          <span class="spacer"></span>
          <button class="btn btn-sm" type="button" id="autoBtn" hidden style="min-height:44px">🤖 건강한 몸의 자동 조절</button>
          <div class="segmented" id="sceneSeg" role="tablist" aria-label="학습 장면">
            <button type="button" data-scene="glands" data-feature="glands" title="호르몬" aria-label="호르몬">🩸<span class="t"> 호르몬</span></button>
            <button type="button" data-scene="glucose" data-feature="glucose" title="혈당량" aria-label="혈당량">🍬<span class="t"> 혈당량</span></button>
            <button type="button" data-scene="temp" data-feature="temp" title="체온" aria-label="체온">🌡️<span class="t"> 체온</span></button>
            <button type="button" data-scene="disease" data-feature="disease" title="질병" aria-label="질병">📊<span class="t"> 질병</span></button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="호르몬과 항상성: 내분비샘과 호르몬의 이동, 혈당량 조절 게임, 체온 조절, 호르몬과 질병 자료를 살펴보는 화면"></canvas>
        </div>
      </section>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="cgrp" data-scene="glands">
          <div class="segmented" id="gvSeg" role="tablist" aria-label="보기">
            <button type="button" data-v="body" class="on">🧍 내분비샘</button>
            <button type="button" data-v="compare">⚡ 신경 vs 호르몬</button>
          </div>
          <button class="btn btn-subject" type="button" id="btnRelease">🧪 호르몬 내보내기</button>
          <p class="ctrl-note" id="gNote">내분비샘을 눌러 호르몬이 혈액을 따라 표적 기관으로 가는 모습을 봐요.</p>
        </div>
        <div class="cgrp" data-scene="glucose" hidden>
          <div class="segmented" id="scSeg" role="tablist" aria-label="상황">
            <button type="button" data-v="meal">🍚 식사</button>
            <button type="button" data-v="exercise">🏃 운동</button>
            <button type="button" data-v="fast">😴 공복</button>
          </div>
          <div class="btn-row">
            <button class="btn btn-subject" type="button" id="btnIns" style="background:#2f7de1;border-color:#2f7de1;box-shadow:0 3px 0 #1f5cb0">💉 인슐린<br><small>혈당량 ↓</small></button>
            <button class="btn btn-subject" type="button" id="btnGlu" style="background:#d9a400;border-color:#d9a400;box-shadow:0 3px 0 #a67c00">🍬 글루카곤<br><small>혈당량 ↑</small></button>
          </div>
          <p class="ctrl-note">혈당량을 초록색 정상 범위(70~110 mg/dL)에 머물게 해요.</p>
        </div>
        <div class="cgrp" data-scene="temp" hidden>
          <div class="segmented" id="envSeg" role="tablist" aria-label="날씨">
            <button type="button" data-v="cold">🥶 추운 날</button>
            <button type="button" data-v="normal" class="on">🙂 보통</button>
            <button type="button" data-v="hot">☀️ 더운 날</button>
          </div>
          <button class="btn btn-subject" type="button" id="btnReg">🧠 간뇌 조절 : 켜짐</button>
          <p class="ctrl-note">간뇌 조절을 끄면 체온이 어떻게 되는지도 살펴봐요.</p>
        </div>
        <div class="cgrp" data-scene="disease" hidden>
          <div class="segmented" id="dsSeg" role="tablist" aria-label="자료 보기">
            <button type="button" data-v="match" class="on">🧩 짝짓기</button>
            <button type="button" data-v="dm">📊 당뇨병</button>
            <button type="button" data-v="th">📊 갑상샘</button>
          </div>
          <p class="ctrl-note">그래프는 경향을 단순화한 예시 자료예요. 막대를 눌러 값을 읽어 봐요.</p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
