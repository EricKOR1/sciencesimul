<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>빛의 입자성 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .chips button.done { border-color: var(--good); background: var(--good-soft); }
    .chips button:disabled { opacity: .45; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .num-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 17px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: #fff; }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    .sel-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hp">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">물리학 · Ⅲ. 빛과 물질</div>
      <h1>빛의 입자성</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">💡 빛의 입자성</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="graph">
            <button type="button" data-mode="exp" data-feature="exp">💡 광전 효과</button>
            <button type="button" data-mode="graph" data-feature="graph">📈 진동수·세기</button>
            <button type="button" data-mode="model" data-feature="model">🔬 광자 모형</button>
            <button type="button" data-mode="sensor" data-feature="sensor">📷 이미지 센서</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="금속판에 빛을 비추면 전자가 튀어나오는 광전 효과 실험 장치와 전류계·전압계, 세기와 진동수에 따른 그래프, 광자와 전자의 에너지 막대, 8×8 이미지 센서의 화소 값"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">-</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">-</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">-</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="exp graph model">
          <div class="control-head"><label for="sLam">🎨 빛의 파장</label><output id="oLam">400 nm</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sLam" data-d="-1" aria-label="빛의 파장 (200부터 700 나노미터) 줄이기">−</button><input type="range" id="sLam" min="200" max="700" step="10" value="400" aria-label="빛의 파장 (200부터 700 나노미터)"><button class="nudge" type="button" data-for="sLam" data-d="1" aria-label="빛의 파장 (200부터 700 나노미터) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="exp graph model">
          <div class="control-head"><label for="sInt">🔆 빛의 세기</label><output id="oInt">5</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sInt" data-d="-1" aria-label="빛의 세기 (1부터 10) 줄이기">−</button><input type="range" id="sInt" min="1" max="10" step="1" value="5" aria-label="빛의 세기 (1부터 10)"><button class="nudge" type="button" data-for="sInt" data-d="1" aria-label="빛의 세기 (1부터 10) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="exp">
          <div class="control-head"><span>🌈 빛의 색 고르기</span></div>
          <div class="chips" id="coSeg" role="group" aria-label="빛의 색">
            <button type="button" data-v="650">🔴 빨강 650 nm</button>
            <button type="button" data-v="510">🟢 초록 510 nm</button>
            <button type="button" data-v="400">🟣 보라 400 nm</button>
          </div>
        </div>
        <div class="control" data-modes="exp" data-match="cmp">
          <div class="control-head"><span>✍️ 예측과 실험 결과 비교하기</span></div>
          <div id="cmpRows"></div>
        </div>
        <div class="control" data-modes="graph model" data-feature="metal">
          <div class="control-head"><span>🧪 금속판</span></div>
          <div class="segmented view-seg" id="mtSeg" role="group" aria-label="🧪 금속판"><button type="button" data-v="Na">나트륨(Na)</button><button type="button" data-v="Zn">아연(Zn)</button></div>
        </div>
        <div class="control" data-modes="graph">
          <div class="btn-row">
            <button class="btn btn-sm btn-primary" id="bPtA" type="button">📍 세기–전류 점 찍기</button>
            <button class="btn btn-sm btn-primary" id="bPtB" type="button">📍 진동수–에너지 점 찍기</button>
          </div>
          <div class="btn-row">
            <button class="btn btn-sm" id="bPtClr" type="button">🗑 점 지우기</button>
          </div>
          <p class="ctrl-note">왼쪽 그래프는 <b>파장을 고정</b>하고 세기만 바꿔 점을 찍어요. 오른쪽 그래프는 세기를 두고 <b>파장을 바꿔</b> 점을 찍어요. 오른쪽 그래프의 세로 표지(주황색)는 끌어서 옮길 수 있어요.</p>
        </div>
        <div class="control" data-modes="model" data-match="ek">
          <div class="control-head"><label for="inEk">🧮 전자의 운동 에너지 E<sub>k</sub> (eV)</label></div>
          <input class="num-in" id="inEk" type="number" inputmode="decimal" step="0.01" placeholder="예) 0.50" aria-label="전자의 운동 에너지 (전자볼트)">
        </div>
        <div class="control" data-modes="model" data-match="lam3">
          <div class="control-head"><label for="inLam3">🧮 전자가 나오는 가장 긴 파장 (nm)</label></div>
          <input class="num-in" id="inLam3" type="number" inputmode="decimal" step="10" placeholder="예) 450" aria-label="전자가 튀어나오는 가장 긴 파장 (나노미터)">
          <p class="ctrl-note">파장 슬라이더는 10 nm씩 움직여요. 나트륨(Na)에서 확인해요.</p>
        </div>
        <div class="control" data-modes="sensor">
          <div class="control-head"><label for="sEx">⏱️ 노출 시간</label><output id="oEx">8 ms</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sEx" data-d="-1" aria-label="노출 시간 (1부터 64 밀리초) 줄이기">−</button><input type="range" id="sEx" min="0" max="6" step="1" value="3" aria-label="노출 시간 (1부터 64 밀리초)"><button class="nudge" type="button" data-for="sEx" data-d="1" aria-label="노출 시간 (1부터 64 밀리초) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="sensor">
          <div class="control-head"><span>🖼️ 장면의 밝기</span></div>
          <div class="segmented view-seg" id="seSeg" role="group" aria-label="🖼️ 장면의 밝기"><button type="button" data-v="bright">☀️ 밝은 장면</button><button type="button" data-v="dark">🌙 어두운 장면</button></div>
        </div>
        <div class="control" data-modes="sensor">
          <div class="btn-row">
            <button class="btn btn-sm btn-primary" id="bShot" type="button">📸 다시 찍기</button>
            <button class="btn btn-sm" id="bBayer" type="button">🎨 색 필터 보기</button>
          </div>
          <p class="ctrl-note" id="seNote">찍힌 사진의 화소를 누르면 그 화소의 값이 2진수로 어떻게 저장되는지 보여 줘요.</p>
        </div>

      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
