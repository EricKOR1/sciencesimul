<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>힘의 평형과 장치 설계 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .toolbar-label small { font-weight: 700; color: #8a95a6; }
    .stage-toolbar { min-height: 61px; flex-wrap: nowrap; }
    #resetBtn { font-size: 20px; }
    .off { display: none !important; }

    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    .grp { display: flex; flex-direction: column; gap: 10px; }
    .grp-title { font-weight: 800; font-size: 15.5px; display: flex; align-items: center; gap: 6px; }
    .ctrl-note { font-size: 13.5px; color: var(--muted); margin: 0; line-height: 1.45; }
    .ctrl-note b { color: #0f766e; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1 1 0; min-width: 0; min-height: 48px; }
    .btn-run { font-size: 17px; }
    .btn[disabled] { opacity: .5; cursor: not-allowed; }
    .chip-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .chip-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .chip-btn {
      min-height: 48px; border: 2px solid var(--line); border-radius: 12px; background: #fff; cursor: pointer;
      font-weight: 800; font-size: 14.5px; color: #334155; padding: 6px 8px; line-height: 1.2;
      display: flex; align-items: center; justify-content: center; gap: 4px; text-align: center;
      transition: border-color .15s, background .15s, transform .08s;
    }
    .chip-btn:active { transform: scale(.97); }
    .chip-btn.on { border-color: #14b8a6; background: #e6fbf8; color: #0f766e; box-shadow: 0 0 0 3px rgba(20,184,166,.18); }
    .chip-btn[disabled] { opacity: .5; cursor: not-allowed; }

    @media (max-width: 1100px) { .toolbar-label { font-size: 14px; } }
    @media (max-width: 599px) {
      .readouts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .readout .label { font-size: 11.5px; }
      .toolbar-label small { display: none; }
    }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g1">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중1 · Ⅴ. 힘의 작용</div>
      <h1>힘의 평형과 장치 설계</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="sceneLabel">📚 책상 위의 책</span>
          <span class="spacer"></span>
          <button class="icon-btn" id="resetBtn" type="button" title="처음 상태로" aria-label="처음 상태로">↺</button>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="바닥이 물체를 떠받치는 힘과 힘의 평형을 알아보고 장치를 설계하는 실험 화면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="rL1">중력</span><span class="value" id="rV1">0<small>N</small></span></div>
        <div class="readout"><span class="label" id="rL2">떠받치는 힘</span><span class="value" id="rV2">0<small>N</small></span></div>
        <div class="readout"><span class="label" id="rL3">알짜힘</span><span class="value" id="rV3">0<small>N</small></span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="grp off" id="grpFree">
          <div class="grp-title">🔓 자유 탐구: 실험 고르기</div>
          <div class="chip-grid two" id="freeGrid">
            <button type="button" class="chip-btn" data-free="desk">📚 책상 위의 책</button>
            <button type="button" class="chip-btn" data-free="fbd">✏️ 힘 그림 그리기</button>
            <button type="button" class="chip-btn" data-free="boat">🚤 짐 실은 배</button>
            <button type="button" class="chip-btn" data-free="shop">🛠️ 설계 공방</button>
          </div>
        </div>
        <div class="grp off" id="grpDesk" data-feature="table">
          <div class="grp-title">📚 책상 위의 책</div>
          <div class="btn-row">
            <button class="btn btn-primary btn-run" id="deskBtn" type="button">🪑 책상 치우기</button>
          </div>
          <div class="btn-row" data-feature="stack">
            <button class="btn" id="bookAdd" type="button">📚 책 올리기</button>
            <button class="btn" id="bookSub" type="button">내리기</button>
          </div>
          <p class="ctrl-note" id="deskNote">책 한 권의 무게는 <b>5 N</b>이에요.</p>
        </div>
        <div class="grp off" id="grpFbd" data-feature="fbd">
          <div class="grp-title">✏️ 힘 그림 그리기</div>
          <div class="chip-grid off" id="fbCases">
            <button type="button" class="chip-btn" data-case="A">🔩 매달린 추</button>
            <button type="button" class="chip-btn" data-case="B">🦆 오리 튜브</button>
            <button type="button" class="chip-btn" data-case="C">📦 상자</button>
          </div>
          <p class="ctrl-note" id="fbNote">힘 칩을 <b>끌어다 물체 위에 놓고</b>, 생긴 화살표의 끝을 끌어 크기를 정해요. (1 N 단위)</p>
          <div class="btn-row">
            <button class="btn" id="fbClear" type="button">↺ 내가 그린 힘 지우기</button>
          </div>
        </div>
        <div class="grp off" id="grpBoat" data-feature="boat">
          <div class="grp-title">🚤 짐 실은 배</div>
          <p class="ctrl-note">짐 상자(<b>5 N</b>)를 끌어다 배에 실어요. 배 위의 상자를 누르면 내려요.</p>
          <div class="btn-row">
            <button class="btn" id="boatClear" type="button">↺ 짐 모두 내리기</button>
          </div>
        </div>
        <div class="grp off" id="grpShop" data-feature="workshop">
          <div class="grp-title" id="shopTitle">🛠️ 설계 공방</div>
          <div class="chip-grid off" id="shopTasks">
            <button type="button" class="chip-btn" data-task="scale">⚖️ 저울</button>
            <button type="button" class="chip-btn" data-task="buoy">🛟 부표</button>
            <button type="button" class="chip-btn" data-task="wheel">🛞 바퀴</button>
          </div>
          <p class="ctrl-note" id="shopNote">아래 부품 카드를 <b>눌러 고르고</b>, <b>🧪 시험하기</b>로 확인해요.</p>
          <div class="btn-row">
            <button class="btn btn-primary btn-run" id="shopTest" type="button">🧪 시험하기</button>
          </div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
