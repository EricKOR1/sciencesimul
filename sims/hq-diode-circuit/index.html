<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>다이오드 회로 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔺</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .seg-wrap { display: flex; flex-wrap: wrap; width: 100%; }
    .seg-wrap button { flex: 1 1 44%; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .nudge:disabled { opacity: .4; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok, .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad, .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    .numrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .numrow .q { flex: 1 1 100%; font-weight: 800; font-size: 14px; line-height: 1.3; margin-bottom: 2px; }
    .numrow .pre, .numrow .unit { font-weight: 800; font-size: 15px; }
    .num-in { width: 84px; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 16px var(--font); color: var(--ink); background: #fff; text-align: right; }
    select.num-in { width: auto; text-align: left; padding-right: 4px; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .chips button:disabled { opacity: .45; cursor: not-allowed; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar:has(> .segmented[hidden]) { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
    .tt { width: 100%; border-collapse: collapse; margin-top: 6px; }
    .tt th { font-size: 13px; color: var(--muted); font-weight: 800; padding: 2px 3px; }
    .tt td { text-align: center; font-weight: 800; padding: 3px; font-size: 15px; }
    .tt select.sel-in { min-height: 44px; font-size: 14px; padding: 2px 4px; }
    .tt-title { font-weight: 800; font-size: 14px; line-height: 1.3; }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hq">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">전자기와 양자 · Ⅰ. 전자기적 상호작용</div>
      <h1>다이오드 회로</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🔺 전류의 길</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="bridge">
            <button type="button" data-mode="path" data-feature="path">🔺 전류의 길</button><button type="button" data-mode="bridge" data-feature="bridge">🔀 브리지</button><button type="button" data-mode="supply" data-feature="supply">🔌 전원 장치</button><button type="button" data-mode="led" data-feature="led">💡 LED·논리</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="다이오드가 있는 회로에서 전류가 흐르는 길을 따라가고 정류 회로, 전원 장치, LED와 다이오드 논리회로를 분석하는 화면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="path" data-gate-off="mp2">
          <div class="control-head"><span>🔌 회로 고르기</span></div>
          <div class="segmented seg-wrap" id="cirSeg" role="group" aria-label="🔌 회로 고르기"><button type="button" data-v="0">① 다이오드 1개</button><button type="button" data-v="1">② 같은 방향 2개</button><button type="button" data-v="2">③ 반대 방향 2개</button><button type="button" data-v="3">④ 맞서 병렬</button><button type="button" data-v="4">⑤ 전구 2개</button></div>
        </div>
        <div class="control" data-modes="path" data-gate-off="mp2"><div class="btn-row"><button class="btn btn-sm btn-primary" id="bFlip" type="button">🔄 전지 뒤집기</button></div></div>
        <div class="control" data-modes="path" data-gate="mp2" id="selPHost"></div>
        <div class="control" data-modes="bridge" data-gate-off="mb2">
          <div class="control-head"><span>⚡ 정류 회로</span></div>
          <div class="segmented view-seg" id="rectSeg" role="group" aria-label="⚡ 정류 회로"><button type="button" data-v="half">반파 (다이오드 1개)</button><button type="button" data-v="bridge">브리지 (4개)</button></div>
        </div>
        <div class="control" data-modes="bridge" data-gate-off="mb2" data-sub="bridge"><div class="btn-row"><button class="btn btn-sm" id="bBrReset" type="button">↺ 배선 처음으로</button></div><p class="ctrl-note">회로 그림의 다이오드(D₁~D₄)를 눌러 방향을 뒤집어요.</p></div>
        <div class="control" data-modes="bridge" data-gate="mb2" id="numBHost"></div>
        <div class="control" data-modes="supply" data-gate-off="ms2">
          <div class="control-head"><span>⚡ 정류 방식</span></div>
          <div class="segmented view-seg" id="formSeg" role="group" aria-label="⚡ 정류 방식"><button type="button" data-v="half">반파</button><button type="button" data-v="bridge">전파 (브리지)</button></div>
        </div>
        <div class="control" data-modes="supply" data-gate-off="ms2">
          <div class="control-head"><label for="sC">🔋 평활 축전기 C</label><output id="osC"></output></div><div class="range-row"><button class="nudge" id="sCM" type="button" aria-label="평활 축전기 용량 100마이크로패럿부터 10000마이크로패럿 줄이기">−</button><input type="range" id="sC" min="0" max="6" step="1" value="3" aria-label="평활 축전기 용량 100마이크로패럿부터 10000마이크로패럿"><button class="nudge" id="sCP" type="button" aria-label="평활 축전기 용량 100마이크로패럿부터 10000마이크로패럿 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="supply" data-gate-off="ms2">
          <div class="control-head"><label for="sI">💡 부하 전류 I</label><output id="osI"></output></div><div class="range-row"><button class="nudge" id="sIM" type="button" aria-label="부하 전류 0.05암페어부터 0.50암페어 줄이기">−</button><input type="range" id="sI" min="5" max="50" step="5" value="10" aria-label="부하 전류 0.05암페어부터 0.50암페어"><button class="nudge" id="sIP" type="button" aria-label="부하 전류 0.05암페어부터 0.50암페어 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="supply" data-gate="ms2" id="numSHost"></div>
        <div class="control" data-modes="led">
          <div class="control-head"><span>🔧 고르기</span></div>
          <div class="segmented view-seg" id="subSeg" role="group" aria-label="🔧 고르기"><button type="button" data-v="led">💡 LED</button><button type="button" data-v="or">🔀 OR</button><button type="button" data-v="and">🔀 AND</button></div>
        </div>
        <div class="control" data-modes="led" data-gate-off="mL3" data-sub="led">
          <div class="control-head"><span>🔥 보호 저항 R</span></div>
          <div class="segmented seg-wrap" id="rLSeg" role="group" aria-label="🔥 보호 저항 R"><button type="button" data-v="15">15 Ω</button><button type="button" data-v="47">47 Ω</button><button type="button" data-v="100">100 Ω</button><button type="button" data-v="150">150 Ω</button><button type="button" data-v="330">330 Ω</button></div>
        </div>
        <div class="control" data-modes="led" data-gate-off="mL3" data-sub="led"><div class="btn-row"><button class="btn btn-sm" id="bFlipL" type="button">🔄 전원 뒤집기</button><button class="btn btn-sm" id="bRepl" type="button">🔧 LED 새로 끼우기</button></div></div>
        <div class="control" data-modes="led" data-sub="or and"><div class="control-head"><span>🎚 입력 스위치 (눌러서 바꿔요)</span></div><div class="btn-row"><button class="btn btn-sm" id="bInA" type="button">A: LOW</button><button class="btn btn-sm" id="bInB" type="button">B: LOW</button></div></div>
        <div class="control" data-modes="led" data-gate="mL2" id="tblHost"></div>
        <div class="control" data-modes="led" data-gate="mL3" id="selLHost"></div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
