<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16a34a">
  <title>세포의 구조와 기능 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-card { background: #eef4ef; }
    .stage-toolbar { min-height: 61px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #sceneSeg button { min-height: 44px; padding: 6px 13px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #magSeg { display: flex; width: 100%; }
    #magSeg button { flex: 1; min-height: 44px; padding: 6px 8px; font-size: 15.5px; }
    .ctrl-note { font-size: 13.5px; color: var(--muted); margin: 2px 0 0; line-height: 1.4; }
    .knob-row .control-head { margin-bottom: 0; }
    .knob-row small { font-weight: 700; color: var(--muted); font-size: 13px; }
    input[type=range] { height: 44px; }
    .mission-figure svg { border-radius: 12px; }
    .fig-cells { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .fig-cells figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .fig-cells figcaption { font-size: 13.5px; font-weight: 700; color: var(--muted); }
    @media (max-width: 599px) {
      #sceneSeg { flex-wrap: nowrap; }
      #sceneSeg button { padding: 6px 12px; font-size: 14px; }
      #sceneSeg button:not(.on) .t { display: none; }
    }
  </style>
</head>
<body class="sim-page" data-subject="bio">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g1">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중1 · Ⅱ. 생물의 구성과 다양성</div>
      <h1>세포의 구조와 기능</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="sceneLabel">🔬 광학 현미경으로 세포 관찰하기</span>
          <span class="spacer"></span>
          <div class="segmented" id="sceneSeg" role="tablist" aria-label="실험 장면" data-feature="model">
            <button type="button" data-scene="scope" data-feature="scope" title="현미경" aria-label="현미경">🔬<span class="t"> 현미경</span></button>
            <button type="button" data-scene="model" data-feature="model" title="세포 구조" aria-label="세포 구조">🧫<span class="t"> 세포 구조</span></button>
            <button type="button" data-scene="func" data-feature="func" title="구조와 기능" aria-label="구조와 기능">⚙️<span class="t"> 구조와 기능</span></button>
            <button type="button" data-scene="shape" data-feature="shape" title="모양과 기능" aria-label="모양과 기능">🩸<span class="t"> 모양과 기능</span></button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="광학 현미경과 세포 모형: 현미경 시야, 식물 세포와 동물 세포, 여러 가지 모양의 세포"></canvas>
        </div>
      </section>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-feature="scope">
          <div class="control-head"><label>🔭 배율 <small style="font-weight:700;color:var(--muted)">(대물렌즈 돌리기)</small></label><output id="oMag">40배</output></div>
          <div class="segmented" id="magSeg" role="group" aria-label="배율">
            <button type="button" data-mag="40" class="on">40배</button>
            <button type="button" data-mag="100">100배</button>
            <button type="button" data-mag="400">400배</button>
          </div>
        </div>
        <div class="control knob-row" data-feature="focus">
          <div class="control-head"><label for="sCoarse">⚙️ 조동 나사 <small>크게 움직이기</small></label></div>
          <input type="range" id="sCoarse" min="0" max="40" step="1" value="8" aria-label="조동 나사">
          <div class="control-head"><label for="sFine">🔩 미동 나사 <small>조금씩 움직이기</small></label></div>
          <input type="range" id="sFine" min="-10" max="10" step="0.5" value="0" aria-label="미동 나사">
          <p class="ctrl-note">현미경 그림의 나사를 위아래로 끌어 돌려도 돼요.</p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
