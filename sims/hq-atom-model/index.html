<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>불확정성과 원자 모형 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .chips button.done { border-color: var(--good); background: var(--good-soft); }
    .chips button:disabled { opacity: .45; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .num-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 17px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: #fff; }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    .sel-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  
    .stage-toolbar .segmented { flex-wrap: wrap; }
    .segmented button { white-space: nowrap; }
    .seg-4 button { flex: 1 1 0; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14px; }
    .tray-note { font-weight: 800; }
    .sub-hl { color: var(--subject); font-weight: 900; }

    .chips button small { font-weight: 700; opacity: .8; }
    .chips.tight button { padding: 4px 9px; font-size: 13.5px; }
    .btn-row.one .btn { flex: 1 1 100%; }
    .tick-note { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .chips.col button { flex: 1 1 100%; text-align: left; border-radius: 12px; font-size: 13.5px; line-height: 1.25; padding: 8px 12px; }

  
    .num-row { margin-top: 8px; }
    .num-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.3; }
    .num-line { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14.5px; flex-wrap: wrap; }
    .num-line .num-in { width: 110px; flex: none; }
    .num-line .un { color: var(--muted); }
    .fx-note { font-size: 13.5px; color: var(--muted); margin: 4px 0 0; line-height: 1.35; }
    .btn-row.four .btn { flex: 1 1 22%; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14px; }
    .tight-seg button { font-size: 13.5px; padding-left: 3px; padding-right: 3px; }

  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hq">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">전자기와 양자 · Ⅲ. 양자와 미시세계</div>
      <h1>불확정성과 원자 모형</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">☁️ 불확정성과 원자 모형</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="unc">
            <button type="button" data-mode="unc" data-feature="unc">🎚️ 불확정성</button><button type="button" data-mode="bohr" data-feature="bohr">🪐 보어 모형</button><button type="button" data-mode="cloud" data-feature="cloud">☁️ 확률 구름</button><button type="button" data-mode="cmp" data-feature="cmp">⚖️ 모형 비교</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="슬릿 폭에 따른 전자 파동의 퍼짐과 불확정성 그래프, 보어 모형의 궤도와 에너지 준위 도표, 수소 바닥 상태의 전자 구름과 거리별 히스토그램, 보어 모형과 현대 원자 모형 비교표"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">-</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">-</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">-</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="unc">
          <div class="control-head"><label for="sX">🔧 슬릿 폭 Δx</label><output id="oX">0.50 nm</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sX" data-d="-1" aria-label="슬릿 폭 Δx (0.10에서 1.00 나노미터) 줄이기">−</button><input type="range" id="sX" min="10" max="100" step="5" value="50" aria-label="슬릿 폭 Δx (0.10에서 1.00 나노미터)"><button class="nudge" type="button" data-for="sX" data-d="1" aria-label="슬릿 폭 Δx (0.10에서 1.00 나노미터) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="unc">
          <div class="btn-row "><button class="btn btn-sm btn-primary" id="bShot" type="button">⚡ 전자 10개 쏘기</button></div><p class="ctrl-note">전자는 한 알씩 날아가 스크린에 점으로 찍혀요.</p>
        </div>
        <div class="control" data-modes="unc" data-match="numA">
          <div class="control-head"><span>🧮 크기 어림하기</span></div><div id="numA"></div>
        </div>
        <div class="control" data-modes="bohr">
          <div class="control-head"><span>🔎 전이 고르기 (골라서 바로 시연)</span></div><div class="segmented view-seg tight-seg" id="trSeg" role="group" aria-label="🔎 전이 고르기 (골라서 바로 시연)"><button type="button" data-v="3-2">3→2</button><button type="button" data-v="4-2">4→2</button><button type="button" data-v="5-2">5→2</button><button type="button" data-v="2-1">2→1</button></div>
        </div>
        <div class="control" data-modes="bohr">
          <div class="btn-row "><button class="btn btn-sm " id="bClrSp" type="button">↺ 스펙트럼 지우기</button></div>
        </div>
        <div class="control" data-modes="bohr" data-match="selB">
          <div class="control-head"><span>✍️ 맞는 점과 한계 나누기</span></div><div id="selB"></div>
        </div>
        <div class="control" data-modes="cloud">
          <div class="btn-row four"><button class="btn btn-sm btn-primary" id="bM1" type="button">+1</button><button class="btn btn-sm btn-primary" id="bM100" type="button">+100</button><button class="btn btn-sm btn-primary" id="bM1k" type="button">+1000</button><button class="btn btn-sm btn-primary" id="bM10k" type="button">+10000</button></div><p class="ctrl-note">한 번 측정할 때마다 점이 하나 찍혀요.</p>
        </div>
        <div class="control" data-modes="cloud">
          <div class="btn-row "><button class="btn btn-sm " id="bRing" type="button">⭕ 보어 반지름 원</button><button class="btn btn-sm " id="bClrC" type="button">↺ 지우기</button></div>
        </div>
        <div class="control" data-modes="cloud" data-match="selC">
          <div class="control-head"><span>✍️ 히스토그램 읽기</span></div><div id="selC"></div>
        </div>
        <div class="control" data-modes="cmp" data-match="selT">
          <div class="control-head"><span>✍️ 표 완성하기</span></div><div id="selT"></div>
        </div>
        <div class="control" data-modes="cmp" data-match="selK">
          <div class="control-head"><span>🗂️ 문장 카드 나누기</span></div><div id="selK"></div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
  <script src="../../assets/js/sim3d.js"></script>
  <script src="v3d.js"></script>
</body>
</html>
