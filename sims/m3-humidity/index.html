<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0ea5e9">
  <title>포화 수증기량과 상대 습도 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌫️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-toolbar { min-height: 61px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #resetBtn { font-size: 20px; }
    .stage-toolbar .segmented button { min-height: 44px; padding: 6px 12px; font-size: 14.5px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    .ctrl-note { font-size: 13.5px; color: var(--muted); margin: 8px 0 0; line-height: 1.45; }
    .btn-block { min-height: 52px; font-size: 17px; }
    .opt-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .opt-seg button {
      min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink);
      font-weight: 800; font-size: 15.5px; cursor: pointer; padding: 6px 8px; line-height: 1.25;
    }
    .opt-seg button small { display: block; font-size: 12px; font-weight: 700; color: var(--muted); }
    .opt-seg button[aria-pressed="true"] { border-color: var(--subject); background: #e8f6ff; color: #075985; box-shadow: 0 0 0 3px color-mix(in srgb, var(--subject) 18%, transparent); }
    .btn-on { background: #0369a1 !important; border-color: #0369a1 !important; color: #fff !important; }
    .mission-figure svg { border-radius: 12px; }
    .row2 { display: flex; flex-direction: column; gap: 10px; }
    @media (max-width: 599px) {
      .stage-toolbar { min-height: 0; }
      .stage-toolbar .segmented { width: 100%; }
      .stage-toolbar .segmented button { flex: 1 1 auto; padding: 6px 6px; font-size: 13.5px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="earth">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g3">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중3 · Ⅱ. 날씨와 기후변화</div>
      <h1>포화 수증기량과 상대 습도</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">📦 밀폐 용기 속 수증기</span>
          <span class="spacer"></span>
          <div class="segmented" id="sceneSeg" role="group" aria-label="실험 장면" data-feature="dew">
            <button type="button" data-scene="box">📦 포화</button>
            <button type="button" data-scene="cup" data-feature="dew">🧊 이슬점</button>
            <button type="button" data-scene="rh" data-feature="rh">💧 상대 습도</button>
            <button type="button" data-scene="app" data-feature="app">🌿 적용</button>
          </div>
          <button class="icon-btn" id="resetBtn" type="button" title="처음 상태로" aria-label="처음 상태로">↺</button>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="밀폐 용기 속 물 분자의 증발과 응결, 포화 수증기량 곡선, 차가운 컵의 이슬, 상대 습도를 알아보는 실험 화면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts" id="readouts">
        <div class="readout"><span class="label" id="rl1">수증기량</span><span class="value" id="r1">0.0<small>g/kg</small></span></div>
        <div class="readout"><span class="label" id="rl2">포화 수증기량</span><span class="value" id="r2">0.0<small>g/kg</small></span></div>
        <div class="readout"><span class="label" id="rl3">포화 정도</span><span class="value" id="r3">0<small>%</small></span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" id="ctlBox">
          <div class="control-head"><label for="boxR">🌡️ 물의 온도</label><output id="boxO">20 °C</output></div>
          <input type="range" id="boxR" min="0" max="35" step="5" value="20" aria-label="물의 온도">
          <p class="ctrl-note">온도를 바꾸면 증발하는 물 분자 수가 달라져요. 수증기가 더 늘지 않을 때까지 지켜봐요.</p>
        </div>
        <div class="control" id="ctlCup" hidden>
          <button class="btn btn-primary btn-block" id="iceBtn" type="button">🧊 얼음물 넣기</button>
          <div class="control-head" style="margin-top:12px"><label for="cupR">🌡️ 컵 표면 온도</label><output id="cupO">25.0 °C</output></div>
          <input type="range" id="cupR" min="2" max="25" step="0.1" value="25" aria-label="컵 표면 온도">
          <div class="opt-seg" id="airSeg" role="group" aria-label="공기 고르기" hidden>
            <button type="button" data-air="humid" aria-pressed="true">습한 공기<small>14.7 g/kg</small></button>
            <button type="button" data-air="dry" aria-pressed="false">건조한 공기<small>7.6 g/kg</small></button>
          </div>
        </div>
        <div class="control" id="ctlRH" hidden>
          <div class="control-head"><label for="rhTR">🌡️ 기온</label><output id="rhTO">20 °C</output></div>
          <input type="range" id="rhTR" min="0" max="35" step="1" value="20" aria-label="기온">
          <div class="control-head" style="margin-top:10px"><label for="rhWR">💧 수증기량</label><output id="rhWO">14.7 g/kg</output></div>
          <input type="range" id="rhWR" min="0" max="36" step="0.2" value="14.7" aria-label="공기 속 수증기량">
          <button class="btn btn-block" id="dayBtn" type="button" style="margin-top:12px">☀️ 하루 보기</button>
        </div>
        <div class="control" id="ctlApp" hidden>
          <div class="control-head"><label for="appR">🌡️ 공기의 온도 (식히기)</label><output id="appO">30 °C</output></div>
          <input type="range" id="appR" min="5" max="30" step="1" value="30" aria-label="공기의 온도">
          <p class="ctrl-note">수증기량 <b>20.0 g/kg</b>인 30 °C 공기를 천천히 식혀 봐요.</p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
