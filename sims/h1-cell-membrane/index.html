<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16a34a">
  <title>세포막과 물질 출입 | 고1 통합과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫧</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--bio); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .seg-wrap { display: flex; flex-wrap: wrap; width: 100%; }
    .seg-wrap button { flex: 1 1 44%; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14.5px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--bio); background: color-mix(in srgb, var(--bio) 14%, white); color: #166534; }
    #presetSeg { margin-top: 8px; }
    .ctrl-note b { color: var(--ink); }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .match-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .match-row .lab { flex: 1; font-weight: 800; font-size: 14.5px; min-width: 0; line-height: 1.25; }
    .match-row .segmented { flex: none; }
    .match-row .segmented button { min-height: 40px; padding: 4px 10px; font-size: 13.5px; }
    .match-row.ok .lab { color: #0b6b39; }
    .match-row.bad { animation: shakeX .38s; }
    .match-row.bad .lab { color: #a3262b; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar:has(> .segmented[hidden]) { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="bio">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#h1a">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">통합과학1 · Ⅲ. 시스템과 상호작용</div>
      <h1>세포막과 물질 출입</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🫧 살아 있는 세포</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="model">
            <button type="button" data-mode="cell" data-feature="cell">🫧 살아 있는 세포</button>
            <button type="button" data-mode="model" data-feature="model">🔍 막 모형</button>
            <button type="button" data-mode="lab" data-feature="lab">🧪 막 통과 실험</button>
            <button type="button" data-mode="rbc" data-feature="rbc">🩸 삼투 적용</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="세포로 들어오고 나가는 물질 분류, 세포막 단면의 입자 모형, 셀로판 튜브와 감자 삼투 실험, 적혈구와 삼투 현상"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <!-- ① 살아 있는 세포 -->
        <div class="control" data-modes="cell">
          <div class="control-head"><span>🧬 세포막 실험</span></div>
          <div class="btn-row">
            <button class="btn btn-sm btn-primary" id="bMem" type="button">🚫 세포막 없애기</button>
            <button class="btn btn-sm" id="bCellReset" type="button" data-sort>↺ 카드 다시</button>
          </div>
          <p class="ctrl-note" id="cellNote">카드를 끌어서 세포 안으로 들어오는 물질은 <b>세포</b>에, 나가는 물질은 <b>세포 밖 칸</b>에 놓아요.</p>
        </div>
        <!-- ② 막 모형 -->
        <div class="control" data-modes="model">
          <div class="control-head"><span>🧩 시험할 입자</span></div>
          <div class="chips" id="typeChips">
            <button type="button" data-t="water">💧 물</button>
            <button type="button" data-t="oxygen">🔴 산소</button>
            <button type="button" data-t="ion">➕ 이온</button>
            <button type="button" data-t="starch">🟡 녹말</button>
            <button type="button" data-t="protein">🟤 단백질</button>
          </div>
        </div>
        <div class="control" data-modes="model">
          <div class="control-head"><label for="sOut">⬆ 세포 밖 입자 수</label><output id="oOut">20</output></div>
          <div class="range-row"><input type="range" id="sOut" min="0" max="40" step="1" value="20" aria-label="세포 밖 입자 수"></div>
          <div class="control-head" style="margin-top:6px"><label for="sIn">⬇ 세포 안 입자 수</label><output id="oIn">0</output></div>
          <div class="range-row"><input type="range" id="sIn" min="0" max="40" step="1" value="0" aria-label="세포 안 입자 수"></div>
        </div>
        <div class="control" data-modes="model" data-pred>
          <div class="control-head"><span>🎯 산소는 어느 쪽으로 이동할까요?</span></div>
          <div class="segmented view-seg" id="predSeg" role="group" aria-label="예측하기">
            <button type="button" data-pred="down">⬇ 세포 안으로</button>
            <button type="button" data-pred="up">⬆ 세포 밖으로</button>
          </div>
        </div>
        <!-- ③ 막 통과 실험 -->
        <div class="control" data-modes="lab">
          <div class="control-head"><span>🧪 실험 고르기</span></div>
          <div class="segmented view-seg" id="expSeg" role="group" aria-label="실험 고르기">
            <button type="button" data-exp="iodine">녹말 · 아이오딘</button>
            <button type="button" data-exp="potato">감자 삼투</button>
          </div>
        </div>
        <div class="control" data-modes="lab" data-sub="potato">
          <div class="control-head"><span>🥔 담글 용액</span></div>
          <div class="segmented view-seg" id="solSeg" role="group" aria-label="용액 고르기">
            <button type="button" data-sol="dw">증류수</button>
            <button type="button" data-sol="ns">0.9 %</button>
            <button type="button" data-sol="hs">10 %</button>
          </div>
        </div>
        <div class="control" data-modes="lab">
          <div class="btn-row">
            <button class="btn btn-sm btn-primary" id="bLabRun" type="button">▶ 30분 지나기</button>
            <button class="btn btn-sm" id="bLabReset" type="button">↺ 다시</button>
          </div>
          <p class="ctrl-note" id="labNote"></p>
        </div>
        <!-- ④ 삼투 적용 -->
        <div class="control" data-modes="rbc">
          <div class="control-head"><label for="sConc">🧂 소금물 농도</label><output id="oConc">0.9 %</output></div>
          <div class="range-row"><input type="range" id="sConc" min="0" max="3" step="0.1" value="0.9" aria-label="소금물 농도 (0부터 3퍼센트)"></div>
          <div class="chips" id="concChips">
            <button type="button" data-c="0">증류수 0 %</button>
            <button type="button" data-c="0.9">생리식염수 0.9 %</button>
            <button type="button" data-c="3">농축 소금물 3 %</button>
          </div>
          <p class="ctrl-note">적혈구 안의 용액 농도는 약 0.9 %예요.</p>
        </div>
        <div class="control" data-modes="rbc" data-match>
          <div class="control-head"><span>🔗 물은 어느 쪽으로 이동할까요?</span></div>
          <div id="matchRows"></div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
