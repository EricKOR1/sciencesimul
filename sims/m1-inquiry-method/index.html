<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#64748b">
  <title>과학적 탐구 방법 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-card { background: #f6efe4; }
    .stage-toolbar { min-height: 52px; padding: 6px 10px; }
    .toolbar-label { font-weight: 800; color: #3a4456; font-size: 15px; padding-left: 4px; min-width: 0; flex: 1 1 auto;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .toolbar-label small { font-weight: 700; color: var(--muted); }
    .stage-hint { white-space: normal; width: max-content; max-width: calc(100% - 24px); text-align: center; }
    #sceneSeg button { min-height: 40px; padding: 6px 12px; font-size: 14.5px; }

    /* 조작 카드 */
    #ctrlCard { display: flex; flex-direction: column; gap: 8px; }
    .ctrl-title { font-weight: 800; font-size: 15px; color: var(--muted); }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1 1 auto; min-width: 0; min-height: 48px; padding: 8px 12px; }
    .ctrl-note { font-size: 13.5px; color: var(--muted); margin: 0; min-height: 1.2em; }
    .ctrl-note:empty { display: none; }
    .btn.pulse { animation: recPulse 1.1s ease-in-out infinite; }
    @keyframes recPulse {
      0%, 100% { box-shadow: 0 3px 0 #0b7a41, 0 0 0 0 rgba(20, 160, 88, .0); }
      50% { box-shadow: 0 3px 0 #0b7a41, 0 0 0 7px rgba(20, 160, 88, .28); }
    }

    /* 조건 비교표 · 실험 결과 표 (가로로 납작하게) */
    .data-card { flex: none; padding: 8px 12px; display: flex; align-items: center; gap: 12px; }
    .data-head { flex: none; display: flex; flex-direction: column; gap: 2px; font-size: 14.5px; line-height: 1.25; }
    .data-head .n { font-size: 12.5px; color: var(--muted); font-weight: 700; }
    .data-scroll { flex: 1; min-width: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .data-table, .cond-table { border-collapse: collapse; font-size: 14.5px; }
    .data-table th, .cond-table th { text-align: left; white-space: nowrap; padding: 2px 10px 2px 2px; color: var(--muted); font-weight: 800; font-size: 13.5px; }
    .data-table td {
      min-width: 50px; text-align: center; padding: 2px 6px; border-left: 1px solid var(--line);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 800; white-space: nowrap;
      transition: background .4s;
    }
    .data-table td.empty { color: #c3ccd9; font-weight: 600; }
    .data-table tr.ta td { color: #c2410c; }
    .data-table tr.tb td { color: #1d4ed8; }
    .data-table td.fresh { background: #fff1c2; }
    .data-table td.now { box-shadow: inset 0 -3px 0 #14a058; }
    .cond-table thead th { font-size: 12.5px; text-align: center; padding: 0 6px 2px; }
    .cond-table td {
      text-align: center; padding: 3px 6px; border-left: 1px solid var(--line); white-space: nowrap; font-weight: 800; font-size: 14px;
      transition: background .3s;
    }
    .cond-table td.flash { background: #fff1c2; }
    .cond-table .j { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 800; }
    .cond-table .j.same { background: var(--good-soft); color: #0b6b39; }
    .cond-table .j.diff { background: var(--bad-soft); color: #b91c1c; }
    .cond-table .j.iv { background: #efe8ff; color: #6d28d9; }
    .cond-line { flex: 1; font-weight: 800; font-size: 15px; color: #3a4456; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .cond-line .pill { font-size: 13px; font-weight: 800; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
    .cond-line .pill.iv { background: #efe8ff; color: #6d28d9; border-color: #ddd0fb; }
    .cond-line .pill.bad { background: var(--bad-soft); color: #b91c1c; border-color: #f3c3c5; }
    #condCard.line { padding: 7px 12px; }

    .sim-title { min-width: 0; }
    .mission-figure .fig-big { font-size: 38px; line-height: 1.3; letter-spacing: 2px; }
    .mission-figure .fig-big .vs { font-size: 22px; color: #9aa5b6; font-weight: 800; margin: 0 8px; letter-spacing: 0; vertical-align: middle; }

    @media (max-width: 1100px) {
      .cond-table td { padding: 3px 4px; font-size: 13.5px; }
      .cond-table thead th { padding: 0 4px 2px; font-size: 12px; }
    }
    @media (max-width: 599px) {
      .data-card { flex-direction: column; align-items: stretch; gap: 4px; }
      .data-head { flex-direction: row; gap: 8px; align-items: baseline; }
      .data-table td { min-width: 40px; padding: 2px 4px; }
      .toolbar-label { font-size: 14px; }
      #condCard .cond-full { display: none; }
      .sim-unit { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .stage-hint { font-size: 12.5px; padding: 5px 12px; bottom: 6px; max-width: 94%; }
    }
  </style>
</head>
<body class="sim-page" data-subject="sci">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g1">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중1 · Ⅰ. 과학과 인류의 지속가능한 삶</div>
      <h1>과학적 탐구 방법</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="sceneLabel">🏠 우리 집 빨래 건조대</span>
          <div class="segmented" id="sceneSeg" role="group" aria-label="장면 고르기" hidden>
            <button type="button" data-scene="home">🏠 집</button>
            <button type="button" data-scene="bench">🧪 실험대</button>
            <button type="button" data-scene="plan">📝 계획서</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="장마철 빨래가 마르는 빠르기를 탐구하는 집, 실험대, 탐구 계획서 장면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>

      <section class="card data-card" id="condCard" data-feature="table">
        <div class="cond-full" id="condFull" style="display:contents">
          <div class="data-head"><b>📋 조건 비교표</b><span class="n">A와 B를 비교해요</span></div>
          <div class="data-scroll">
            <table class="cond-table">
              <thead><tr><th></th><th>🌬️ 바람(선풍기)</th><th>🧺 수건의 종류</th><th>💧 적신 물의 양</th><th>📐 펼친 모양</th><th>🌡️ 방의 온도</th></tr></thead>
              <tbody>
                <tr id="condA"><th>A</th></tr>
                <tr id="condB"><th>B</th></tr>
                <tr id="condJ"><th>판정</th></tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="cond-line" id="condLine" hidden>⚖️ 공정한 실험: 바람만 다름 <span class="pill iv">🎛️ 바람</span><span class="pill">🔒 수건 · 물 30 g · 펼침 · 25 °C</span></div>
      </section>

      <section class="card data-card" id="recCard" data-feature="record">
        <div class="data-head"><b>📋 실험 결과</b><span class="n" id="dataN">기록 0 / 7</span></div>
        <div class="data-scroll">
          <table class="data-table"><tbody>
            <tr id="rowT"><th>시간 (분)</th></tr>
            <tr id="rowA" class="ta"><th>A 질량 (g)</th></tr>
            <tr id="rowB" class="tb"><th>B 질량 (g)</th></tr>
          </tbody></table>
        </div>
      </section>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="ctrl-title" id="ctrlTitle">🏠 집</div>
        <div class="btn-row">
          <button class="btn btn-primary" id="hourBtn" type="button">⏩ 1시간 지나기</button>
          <button class="btn" id="rehangBtn" type="button">↺ 다시 널기</button>
          <button class="btn" id="benchResetBtn" type="button">↺ 처음 상태</button>
          <button class="btn btn-primary" id="tenBtn" type="button">⏩ 10분 지나기</button>
          <button class="btn btn-good" id="recBtn" type="button">📍 기록하기</button>
          <button class="btn" id="redoBtn" type="button">↺ 다시 실험</button>
        </div>
        <p class="ctrl-note" id="ctrlNote"></p>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
