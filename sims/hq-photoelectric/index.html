<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>광전효과와 기술 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .chips button.done { border-color: var(--good); background: var(--good-soft); }
    .chips button:disabled { opacity: .45; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .num-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 17px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: #fff; }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    .sel-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  
    .stage-toolbar .segmented { flex-wrap: wrap; }
    .segmented button { white-space: nowrap; }
    .seg-4 button { flex: 1 1 0; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14px; }
    .tray-note { font-weight: 800; }
    .sub-hl { color: var(--subject); font-weight: 900; }
    #lgSeg button, #lamSeg button { font-size: 13.5px; padding-left: 3px; padding-right: 3px; }

    .chips button small { font-weight: 700; opacity: .8; }
    .chips.tight button { padding: 4px 9px; font-size: 13.5px; }
    .btn-row.one .btn { flex: 1 1 100%; }
    .tick-note { font-size: 13px; color: var(--muted); margin-top: 2px; }

  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hq">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">전자기와 양자 · Ⅱ. 빛과 정보 통신</div>
      <h1>광전효과와 기술</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">☀️ 광전효과와 기술</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="tube">
            <button type="button" data-mode="tube" data-feature="tube">🔦 정지 전압</button><button type="button" data-mode="graph" data-feature="graph">📈 그래프 분석</button><button type="button" data-mode="photon" data-feature="photon">🧮 광자와 전류</button><button type="button" data-mode="tech" data-feature="tech">📷 광전 기술</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="광전관의 광전자와 역전압, 진동수와 정지 전압의 직선 그래프, 광자 수와 광전류 계산, 이미지 센서와 광센서와 태양전지"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">-</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">-</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">-</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="tube">
          <div class="control-head"><label for="sL">🌈 빛의 파장</label><output id="oL">400 nm</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sL" data-d="-1" aria-label="빛의 파장 (300나노미터부터 600나노미터) 줄이기">−</button><input type="range" id="sL" min="300" max="600" step="10" value="400" aria-label="빛의 파장 (300나노미터부터 600나노미터)"><button class="nudge" type="button" data-for="sL" data-d="1" aria-label="빛의 파장 (300나노미터부터 600나노미터) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="tube">
          <div class="control-head"><label for="sR">🔋 역전압 V</label><output id="oR">0.00 V</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sR" data-d="-1" aria-label="역전압 (0볼트부터 2.5볼트) 줄이기">−</button><input type="range" id="sR" min="0" max="250" step="1" value="0" aria-label="역전압 (0볼트부터 2.5볼트)"><button class="nudge" type="button" data-for="sR" data-d="1" aria-label="역전압 (0볼트부터 2.5볼트) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="tube" data-match="int">
          <div class="control-head"><label for="sK">💡 광원의 세기</label><output id="oK">×1.0</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sK" data-d="-1" aria-label="광원의 세기 (1배부터 4배) 줄이기">−</button><input type="range" id="sK" min="10" max="40" step="5" value="10" aria-label="광원의 세기 (1배부터 4배)"><button class="nudge" type="button" data-for="sK" data-d="1" aria-label="광원의 세기 (1배부터 4배) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="tube" data-match="rec">
          <button class="btn btn-sm btn-primary" id="bRec" type="button">📝 정지 전압 V₀ 기록하기</button><p class="ctrl-note">전류가 처음 0이 되는 가장 작은 역전압에서 눌러요.</p>
        </div>
        <div class="control" data-modes="tube" data-match="selA">
          <div class="control-head"><span>✍️ 문장 완성하기</span></div><div id="selA"></div>
        </div>
        <div class="control" data-modes="graph">
          <div class="control-head"><span>📍 점 찍기 (파장을 눌러요)</span></div><div class="chips tight" id="ptChips" role="group" aria-label="그래프에 찍을 파장 고르기"><button type="button" data-i="0">300 nm</button><button type="button" data-i="1">350 nm</button><button type="button" data-i="2">400 nm</button><button type="button" data-i="3">450 nm</button><button type="button" data-i="4">500 nm</button><button type="button" data-i="5">550 nm</button></div>
        </div>
        <div class="control" data-modes="graph" data-match="metal">
          <div class="control-head"><span>🔩 금속 비교</span></div><div class="segmented view-seg" id="metalSeg" role="group" aria-label="금속 비교"><button type="button" data-v="Cs">세슘 2.1</button><button type="button" data-v="Na">나트륨 2.3</button><button type="button" data-v="Zn">아연 4.3</button></div><p class="ctrl-note">일함수 W(eV)가 다른 금속의 직선을 견주어 봐요.</p>
        </div>
        <div class="control" data-modes="graph" data-match="inH">
          <div class="control-head"><span>🧮 h와 W 구하기</span></div><label class="tick-note" for="inH">플랑크 상수 h (×10⁻³⁴ J·s)</label><input class="num-in" id="inH" type="number" inputmode="decimal" step="0.1" placeholder="예) 6.6" aria-label="플랑크 상수 h (10의 마이너스 34제곱 줄초 단위의 앞 숫자)"><label class="tick-note" for="inW" style="display:block;margin-top:8px">일함수 W (eV)</label><input class="num-in" id="inW" type="number" inputmode="decimal" step="0.1" placeholder="예) 2.3" aria-label="일함수 W (전자볼트)">
        </div>
        <div class="control" data-modes="photon">
          <div class="control-head"><label for="sL2">🌈 빛의 파장</label><output id="oL2">400 nm</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sL2" data-d="-1" aria-label="빛의 파장 (300나노미터부터 600나노미터) 줄이기">−</button><input type="range" id="sL2" min="300" max="600" step="10" value="400" aria-label="빛의 파장 (300나노미터부터 600나노미터)"><button class="nudge" type="button" data-for="sL2" data-d="1" aria-label="빛의 파장 (300나노미터부터 600나노미터) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="photon">
          <div class="control-head"><label for="sP">🔆 광원의 출력</label><output id="oP">1.0 mW</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sP" data-d="-1" aria-label="광원의 출력 (0.2밀리와트부터 2.0밀리와트) 줄이기">−</button><input type="range" id="sP" min="2" max="20" step="1" value="10" aria-label="광원의 출력 (0.2밀리와트부터 2.0밀리와트)"><button class="nudge" type="button" data-for="sP" data-d="1" aria-label="광원의 출력 (0.2밀리와트부터 2.0밀리와트) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="photon" data-match="inN">
          <div class="control-head"><label for="inN">🧮 초당 광자 수 N (×10¹⁵ 개/s)</label></div><input class="num-in" id="inN" type="number" inputmode="decimal" step="0.1" placeholder="예) 2.5" aria-label="초당 광자 수 (10의 15제곱 개 단위의 앞 숫자)">
        </div>
        <div class="control" data-modes="tech">
          <div class="control-head"><span>🔎 기술 고르기</span></div><div class="segmented view-seg" id="teSeg" role="group" aria-label="기술 고르기"><button type="button" data-v="sensor">📷 이미지 센서</button><button type="button" data-v="lamp">💡 광센서</button><button type="button" data-v="solar">☀️ 태양전지</button></div>
        </div>
        <div class="control" data-modes="tech" data-sub="sensor">
          <div class="control-head"><span>🌗 장면의 밝기</span></div><div class="segmented view-seg" id="daySeg" role="group" aria-label="장면의 밝기"><button type="button" data-v="day">☀️ 밝은 낮</button><button type="button" data-v="night">🌙 어두운 밤</button></div>
        </div>
        <div class="control" data-modes="tech" data-sub="sensor">
          <div class="control-head"><label for="sT">⏱️ 노출 시간</label><output id="oT">1.0 ms</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sT" data-d="-1" aria-label="노출 시간 (0.5밀리초부터 250밀리초) 줄이기">−</button><input type="range" id="sT" min="0" max="18" step="1" value="2" aria-label="노출 시간 (0.5밀리초부터 250밀리초)"><button class="nudge" type="button" data-for="sT" data-d="1" aria-label="노출 시간 (0.5밀리초부터 250밀리초) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="tech" data-sub="lamp">
          <div class="control-head"><label for="sX">🌤️ 주변 조도</label><output id="oX">600 lx</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sX" data-d="-1" aria-label="주변 조도 (0럭스부터 1000럭스) 줄이기">−</button><input type="range" id="sX" min="0" max="1000" step="10" value="600" aria-label="주변 조도 (0럭스부터 1000럭스)"><button class="nudge" type="button" data-for="sX" data-d="1" aria-label="주변 조도 (0럭스부터 1000럭스) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="tech" data-sub="lamp">
          <div class="control-head"><label for="sH">🎚️ 켜지는 문턱 조도</label><output id="oH">200 lx</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sH" data-d="-1" aria-label="점멸등이 켜지는 문턱 조도 (50럭스부터 500럭스) 줄이기">−</button><input type="range" id="sH" min="50" max="500" step="10" value="200" aria-label="점멸등이 켜지는 문턱 조도 (50럭스부터 500럭스)"><button class="nudge" type="button" data-for="sH" data-d="1" aria-label="점멸등이 켜지는 문턱 조도 (50럭스부터 500럭스) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="tech" data-sub="solar">
          <div class="control-head"><label for="sS">🌈 빛의 파장</label><output id="oS">700 nm</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sS" data-d="-1" aria-label="빛의 파장 (300나노미터부터 2000나노미터) 줄이기">−</button><input type="range" id="sS" min="300" max="2000" step="20" value="700" aria-label="빛의 파장 (300나노미터부터 2000나노미터)"><button class="nudge" type="button" data-for="sS" data-d="1" aria-label="빛의 파장 (300나노미터부터 2000나노미터) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="tech" data-match="selB">
          <div class="control-head"><span>✍️ 문장 완성하기</span></div><div id="selB"></div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
