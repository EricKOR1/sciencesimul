<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>물질파와 전자 현미경 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .chips button.done { border-color: var(--good); background: var(--good-soft); }
    .chips button:disabled { opacity: .45; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .num-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 17px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: #fff; }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    .sel-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hp">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">물리학 · Ⅲ. 빛과 물질</div>
      <h1>물질파와 전자 현미경</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🔬 물질파와 전자 현미경</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="wave">
            <button type="button" data-mode="dbl" data-feature="dbl">⚛️ 전자의 무늬</button>
            <button type="button" data-mode="wave" data-feature="wave">〰️ 물질파</button>
            <button type="button" data-mode="res" data-feature="res">🔬 분해능</button>
            <button type="button" data-mode="app" data-feature="app">💿 응용</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="전자를 한 알씩 이중 슬릿에 쏘아 스크린에 점이 쌓여 간섭 무늬가 생기는 모습, 전자와 야구공의 물질파 파장, 광학 현미경과 전자 현미경의 분해능 비교, 광디스크의 홈과 레이저 점"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">-</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">-</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">-</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="dbl">
          <div class="control-head"><span>🎯 쏠 전자의 수</span></div>
          <div class="segmented view-seg" id="tgSeg" role="group" aria-label="🎯 쏠 전자의 수"><button type="button" data-v="10">10개</button><button type="button" data-v="100">100개</button><button type="button" data-v="1000">1000개</button><button type="button" data-v="10000">1만 개</button></div>
        </div>
        <div class="control" data-modes="dbl">
          <div class="btn-row">
            <button class="btn btn-sm btn-primary" id="bFire" type="button">▶ 전자 쏘기</button>
            <button class="btn btn-sm" id="bClear" type="button">↺ 스크린 지우기</button>
          </div>
          <div class="btn-row">
            <button class="btn btn-sm" id="bBlock" type="button">🚧 슬릿 하나 막기</button>
          </div>
          <p class="ctrl-note" id="dbNote">전자를 한 알씩 쏘면 스크린에 점이 하나씩 찍혀요. 점이 쌓이면 어떤 모양이 될까요?</p>
        </div>
        <div class="control" data-modes="wave">
          <div class="control-head"><span>🧩 어떤 물체의 물질파?</span></div>
          <div class="segmented view-seg" id="ptSeg" role="group" aria-label="🧩 어떤 물체의 물질파?"><button type="button" data-v="e">⚛️ 전자</button><button type="button" data-v="b">⚾ 야구공</button></div>
        </div>
        <div class="control" data-modes="wave" data-sub="e">
          <div class="control-head"><label for="sV">⚡ 전자의 가속 전압 V</label><output id="oV">100 V</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sV" data-d="-1" aria-label="전자의 가속 전압 (100볼트부터 10만 볼트) 줄이기">−</button><input type="range" id="sV" min="0" max="60" step="1" value="0" aria-label="전자의 가속 전압 (100볼트부터 10만 볼트)"><button class="nudge" type="button" data-for="sV" data-d="1" aria-label="전자의 가속 전압 (100볼트부터 10만 볼트) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="wave" data-sub="b">
          <div class="control-head"><label for="sVb">💨 야구공의 속력</label><output id="oVb">40 m/s</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sVb" data-d="-1" aria-label="야구공의 속력 (1부터 60 미터 매 초) 줄이기">−</button><input type="range" id="sVb" min="1" max="60" step="1" value="40" aria-label="야구공의 속력 (1부터 60 미터 매 초)"><button class="nudge" type="button" data-for="sVb" data-d="1" aria-label="야구공의 속력 (1부터 60 미터 매 초) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="wave" data-match="ball">
          <div class="control-head"><span>🧮 야구공(0.145 kg, 40 m/s)의 물질파</span></div>
          <div class="control-head"><label for="inP">운동량 p = mv (kg·m/s)</label></div>
          <input class="num-in" id="inP" type="number" inputmode="decimal" step="0.1" placeholder="예) 3.0" aria-label="야구공의 운동량 (킬로그램 미터 매 초)">
          <div class="control-head" style="margin-top:8px"><label for="inExp">파장 λ = h/p ≈ 10<sup>□</sup> m 의 □</label></div>
          <input class="num-in" id="inExp" type="number" inputmode="numeric" step="1" placeholder="예) -20" aria-label="파장의 10의 거듭제곱 지수">
        </div>
        <div class="control" data-modes="res">
          <div class="control-head"><span>🔭 어떤 현미경으로 볼까요?</span></div>
          <div class="segmented view-seg" id="mcSeg" role="group" aria-label="🔭 어떤 현미경으로 볼까요?"><button type="button" data-v="light">🔆 광학 현미경</button><button type="button" data-v="elec">⚛️ 전자 현미경</button></div>
        </div>
        <div class="control" data-modes="res" data-feature="spec">
          <div class="control-head"><span>🧫 관찰할 시료</span></div>
          <div class="segmented view-seg" id="spSeg" role="group" aria-label="🧫 관찰할 시료"><button type="button" data-v="two">두 점</button><button type="button" data-v="virus">🦠 바이러스</button><button type="button" data-v="dna">🧬 DNA</button></div>
        </div>
        <div class="control" data-modes="res" data-sub="two">
          <div class="control-head"><label for="sSep">↔️ 두 점 사이의 거리</label><output id="oSep">215 nm</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sSep" data-d="-1" aria-label="두 점 사이의 거리 (0.1 나노미터부터 1000 나노미터) 줄이기">−</button><input type="range" id="sSep" min="0" max="60" step="1" value="50" aria-label="두 점 사이의 거리 (0.1 나노미터부터 1000 나노미터)"><button class="nudge" type="button" data-for="sSep" data-d="1" aria-label="두 점 사이의 거리 (0.1 나노미터부터 1000 나노미터) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="app">
          <div class="control-head"><span>💿 디스크 종류</span></div>
          <div class="segmented view-seg" id="dsSeg" role="group" aria-label="💿 디스크 종류"><button type="button" data-v="cd">CD</button><button type="button" data-v="dvd">DVD</button><button type="button" data-v="bd">블루레이</button></div>
        </div>
        <div class="control" data-modes="app">
          <div class="control-head"><span>🔴 읽는 레이저</span></div>
          <div class="segmented view-seg" id="lsSeg" role="group" aria-label="🔴 읽는 레이저"><button type="button" data-v="780">780 nm</button><button type="button" data-v="650">650 nm</button><button type="button" data-v="405">405 nm</button></div>
        </div>
        <div class="control" data-modes="app" data-match="tool">
          <div class="control-head"><span>✍️ 알맞은 현미경 고르기</span></div>
          <div id="toolRows"></div>
        </div>

      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
