<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>탄성파의 반사와 투과 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔁</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
<style>
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--phy); color: #fff; }
    #modeSeg { width: 100%; flex-wrap: wrap; }
    #modeSeg button { flex: 1 1 auto; min-width: 0; padding-left: 8px; padding-right: 8px; font-size: 14.5px; }
    #modeSeg button[hidden] { display: none !important; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; line-height: 1.4; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .seg-wrap { border-radius: 20px; display: flex; flex-wrap: wrap; width: 100%; }
    .seg-wrap button { flex: 1 1 auto; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .num-in { width: 100%; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 16px var(--font); color: var(--ink); background: #fff; }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .in-grid { display: grid; grid-template-columns: 96px 1fr; gap: 6px 8px; align-items: center; margin-top: 6px; }
    .in-grid .lab { font-weight: 800; font-size: 14px; line-height: 1.25; }
    .in-grid .sel-in { min-height: 44px; padding: 2px 6px; font-size: 14px; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); font-family: inherit; }
    .chips button.on { border-color: var(--phy); background: color-mix(in srgb, var(--phy) 14%, white); color: #9a3412; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini, table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td, table.mini th, table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th, table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer { display: none; }
      #modeSeg button { font-size: 13.5px; padding-left: 6px; padding-right: 6px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hm">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">역학과 에너지 · Ⅲ. 탄성파와 소리</div>
      <h1>탄성파의 반사와 투과</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기">
            <button type="button" data-mode="end">🔁 끝에서 반사</button>
            <button type="button" data-mode="bd">🧵 경계 통과</button>
            <button type="button" data-mode="echo">📡 에코 거리</button>
            <button type="button" data-mode="img">🩺 초음파 영상</button>
            <button type="button" data-mode="ndt">🔩 비파괴 검사</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="줄의 고정단과 자유단에서의 반사, 두 줄의 경계에서의 반사와 투과, 에코로 거리를 재는 소나, 초음파 영상과 비파괴 검사를 탐구하는 화면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <!-- ① 끝에서 반사 -->
        <div class="control" data-modes="end">
          <div class="control-head"><span>🧱 줄의 오른쪽 끝</span></div>
          <div class="segmented seg-wrap" id="endSeg" role="group" aria-label="줄의 오른쪽 끝 종류">
            <button type="button" data-e="fixed">🧱 고정단 (벽)</button><button type="button" data-e="free">⭕ 자유단 (고리)</button></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bSend1" type="button">👆 펄스 보내기</button><button class="btn btn-sm" id="bWave1" type="button">〰 연속파 보내기 (5 Hz)</button></div>
          <div class="btn-row"><button class="btn btn-sm slow-btn" type="button">🐢 더 느리게 (×1/10)</button></div>
          <p class="ctrl-note" id="nEnd"></p>
        </div>
        <div class="control" data-modes="end" data-calc="judge">
          <div class="control-head"><span>🔎 반사된 펄스는 입사 펄스와?</span></div>
          <div class="btn-row"><button class="btn btn-sm" id="bJ1s" type="button">⬆ 같은 방향 (위상 그대로)</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="bJ1i" type="button">⬇ 뒤집힘 (위상 반전)</button></div>
        </div>
        <!-- ② 경계 통과 -->
        <div class="control" data-modes="bd">
          <div class="control-head"><span>🧵 파동이 가는 방향</span></div>
          <div class="segmented seg-wrap" id="bdSeg" role="group" aria-label="파동이 가는 방향">
            <button type="button" data-d="LH">가벼운 → 무거운</button><button type="button" data-d="HL">무거운 → 가벼운</button></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bSend2" type="button">👆 펄스 보내기</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="bWave2" type="button">〰 주기파 보내기 (20 Hz)</button></div>
          <div class="btn-row"><button class="btn btn-sm slow-btn" type="button">🐢 더 느리게 (×1/10)</button></div>
          <p class="ctrl-note" id="nBd"></p>
        </div>
        <div class="control" data-modes="bd" data-calc="judge2">
          <div class="control-head"><span>🔎 센서 A의 반사 펄스는?</span></div>
          <div class="btn-row"><button class="btn btn-sm" id="bJ2s" type="button">⬆ 같은 방향 (위상 그대로)</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="bJ2i" type="button">⬇ 뒤집힘 (위상 반전)</button></div>
        </div>
        <div class="control" data-modes="bd" data-calc="lam">
          <div class="control-head"><span>📝 f = 20 Hz인 주기파의 파장 (m)</span></div>
          <div class="in-grid">
            <span class="lab">왼쪽 λ₁</span><input class="num-in" id="iL1" type="number" inputmode="decimal" step="any" aria-label="경계 왼쪽 가벼운 줄의 파장 (미터)">
            <span class="lab">오른쪽 λ₂</span><input class="num-in" id="iL2" type="number" inputmode="decimal" step="any" aria-label="경계 오른쪽 무거운 줄의 파장 (미터)">
          </div>
        </div>
        <!-- ③ 에코 거리 -->
        <div class="control scen-wrap" data-modes="echo">
          <div class="control-head"><span>🌍 장면 고르기</span></div>
          <div class="segmented seg-wrap" id="scenSeg" role="group" aria-label="에코 장면">
            <button type="button" data-s="A">🚢 바다 (밑바닥)</button><button type="button" data-s="B">🐟 층이 있는 바다</button><button type="button" data-s="bat">🦇 박쥐</button></div>
        </div>
        <div class="control" data-modes="echo">
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bPing" type="button">📡 신호 보내기</button></div>
          <div class="btn-row"><button class="btn btn-sm slow-btn" type="button">🐢 느리게 보기</button></div>
          <p class="ctrl-note" id="nEcho"></p>
        </div>
        <div class="control" data-modes="echo" data-calc="echoA">
          <div class="control-head"><span>📝 바다 깊이 (m)</span></div>
          <input class="num-in" id="iDep" type="number" inputmode="decimal" step="any" aria-label="구한 바다의 깊이 (미터)">
        </div>
        <div class="control" data-modes="echo" data-calc="echoB">
          <div class="control-head"><span>📝 두 층 (m)</span></div>
          <div class="in-grid">
            <span class="lab">첫 층 깊이</span><input class="num-in" id="iD1" type="number" inputmode="decimal" step="any" aria-label="첫 번째 층의 깊이 (미터)">
            <span class="lab">층 사이 간격</span><input class="num-in" id="iGap" type="number" inputmode="decimal" step="any" aria-label="두 층 사이의 간격 (미터)">
          </div>
        </div>
        <!-- ④ 초음파 영상 -->
        <div class="control" data-modes="img">
          <div class="control-head"><label for="sPos">↔ 탐촉자 위치</label><output id="oPos">4.0 cm</output></div>
          <div class="range-row"><input type="range" id="sPos" min="0" max="40" step="1" value="20" aria-label="탐촉자의 가로 위치 (0센티미터부터 8센티미터까지)"></div>
          <div class="control-head" style="margin-top:6px"><span>📡 탐촉자 진동수</span></div>
          <div class="segmented seg-wrap" id="freqSeg" role="group" aria-label="초음파 진동수">
            <button type="button" data-f="0">2 MHz</button><button type="button" data-f="1">3.5 MHz</button><button type="button" data-f="2">7 MHz</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="bGel" type="button">🧴 젤 바름 (눌러서 닦기)</button></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bPing4" type="button">📡 신호 보내기</button><button class="btn btn-sm" id="bScan" type="button">▶ 자동 스캔</button></div>
          <p class="ctrl-note" id="nImg"></p>
        </div>
        <div class="control" data-modes="img" data-calc="usOK">
          <div class="control-head"><span>📝 경계의 깊이 (cm)</span></div>
          <input class="num-in" id="iUs" type="number" inputmode="decimal" step="any" aria-label="에코 65마이크로초에서 구한 깊이 (센티미터)">
        </div>
        <!-- ④ 비파괴 검사 -->
        <div class="control" data-modes="ndt">
          <div class="control-head"><label for="sNd">↔ 탐촉자 위치</label><output id="oNd">2.0 cm</output></div>
          <div class="range-row"><input type="range" id="sNd" min="0" max="40" step="1" value="4" aria-label="탐촉자의 가로 위치 (0센티미터부터 20센티미터까지)"></div>
          <div class="control-head"><label for="sCur">📍 읽을 에코 시간 (보라색 줄)</label><output id="oCur">12.0 μs</output></div>
          <div class="range-row"><input type="range" id="sCur" min="0" max="200" step="1" value="120" aria-label="에코 그래프의 읽을 시간 (0마이크로초부터 20마이크로초까지)"></div>
          <p class="ctrl-note" id="nNd"></p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
