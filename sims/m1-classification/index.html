<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16a34a">
  <title>종과 생물의 분류 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-card { background: #eef4ef; }
    .stage-toolbar { min-height: 61px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #sceneSeg button { min-height: 44px; padding: 6px 13px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .btn-row .btn { flex: 1 1 0; min-width: 0; min-height: 50px; font-size: 16px; }
    .btn[disabled] { opacity: .5; cursor: default; }
    #expSeg { display: flex; width: 100%; margin-top: 4px; }
    #expSeg button { flex: 1; min-height: 46px; padding: 6px 6px; font-size: 14.5px; }
    .ctrl-note { font-size: 13.5px; color: var(--muted); margin: 8px 0 0; line-height: 1.4; }
    .mission-figure svg { border-radius: 12px; display: block; max-width: 100%; height: auto; }
    @media (max-width: 599px) {
      #sceneSeg { flex-wrap: nowrap; }
      #sceneSeg button { padding: 6px 12px; font-size: 14px; }
      #sceneSeg button:not(.on) .t { display: none; }
    }
  </style>
</head>
<body class="sim-page" data-subject="bio">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g1">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중1 · Ⅱ. 생물의 구성과 다양성</div>
      <h1>종과 생물의 분류</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="sceneLabel">🧬 짝짓기 실험으로 종의 뜻 알아보기</span>
          <span class="spacer"></span>
          <div class="segmented" id="sceneSeg" role="tablist" aria-label="학습 장면" data-feature="ranks">
            <button type="button" data-scene="sp" data-feature="species" title="종의 뜻" aria-label="종의 뜻">🧬<span class="t"> 종의 뜻</span></button>
            <button type="button" data-scene="ranks" data-feature="ranks" title="분류 단계" aria-label="분류 단계">📦<span class="t"> 분류 단계</span></button>
            <button type="button" data-scene="key" data-feature="key" title="5계 기준" aria-label="5계 기준">🌳<span class="t"> 5계 기준</span></button>
            <button type="button" data-scene="sort" data-feature="sort" title="계 분류" aria-label="계 분류">🗂️<span class="t"> 계 분류</span></button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="종과 생물의 분류: 말과 당나귀, 진돗개와 삽살개의 짝짓기 실험, 호랑이가 속한 분류 단계 상자, 5계 검색표, 생물 카드를 5계 상자로 분류하는 화면"></canvas>
        </div>
      </section>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard" hidden>
        <div class="control" id="ctrlSp" hidden>
          <div class="control-head"><label>🧪 짝짓기 실험</label><output id="oSp">① 말 × 당나귀</output></div>
          <div class="segmented" id="expSeg" role="group" aria-label="실험 고르기">
            <button type="button" data-exp="0" class="on">① 말 × 당나귀</button>
            <button type="button" data-exp="1">② 진돗개 × 삽살개</button>
          </div>
          <div class="btn-row"><button class="btn btn-primary" id="btnMate" type="button">💞 짝짓기 시키기</button></div>
          <p class="ctrl-note" id="spNote">짝짓기를 시키면 자손이 태어나요. 그 자손이 새끼를 낳는지도 확인해 봐요.</p>
        </div>
        <div class="control" id="ctrlRk" hidden>
          <div class="control-head"><label>📦 분류 단계</label><output id="oRk">종 · 호랑이</output></div>
          <div class="btn-row">
            <button class="btn" id="btnRkDown" type="button">⬇ 좁히기</button>
            <button class="btn btn-primary" id="btnRkUp" type="button">⬆ 넓히기</button>
          </div>
          <p class="ctrl-note">상자가 한 단계씩 커져요. 그림을 누르거나 오른쪽 단계 칩을 눌러도 돼요.</p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
