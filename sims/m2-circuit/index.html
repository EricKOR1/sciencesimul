<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>전류의 모형 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔌</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; }
    .stage-toolbar { min-height: 61px; }   /* 도구가 열려도 높이가 그대로 */

    /* 보기 전환 버튼 (전자 흐름 / 전류 방향) */
    .tgl {
      display: inline-flex; align-items: center; gap: 7px; min-height: 44px;
      border: 2px solid var(--line); background: var(--surface); color: var(--muted);
      border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 15px; cursor: pointer;
      transition: background .15s, border-color .15s, color .15s; user-select: none; -webkit-user-select: none;
    }
    .tgl .ico { width: 16px; height: 16px; border-radius: 50%; background: #cbd5e1; flex: none; display: grid; place-items: center; color: #fff; font-size: 12px; line-height: 1; font-weight: 900; }
    .tgl.tgl-e[aria-pressed="true"] { color: #1d4ed8; border-color: #93b4ff; background: #eaf0ff; }
    .tgl.tgl-e[aria-pressed="true"] .ico { background: #2563eb; }
    .tgl.tgl-i .ico { border-radius: 3px; clip-path: polygon(0 25%, 55% 25%, 55% 0, 100% 50%, 55% 100%, 55% 75%, 0 75%); }
    .tgl.tgl-i[aria-pressed="true"] { color: #c2410c; border-color: #fdba8c; background: #fff2e9; }
    .tgl.tgl-i[aria-pressed="true"] .ico { background: #f97316; }
    @media (hover: hover) { .tgl:hover { background: var(--surface-2); } }

    /* 조작 카드 */
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    .sw-row { display: flex; gap: 8px; align-items: center; }
    .sw-btn { flex: 1; min-height: 52px; font-size: 17px; color: #9a3412; border: 2px solid #fdba8c; background: #fff7ed; }
    .sw-btn.closed { color: #0b6b39; border-color: #86d9ab; background: var(--good-soft); }
    @media (hover: hover) { .sw-btn:hover { background: #ffedd5; border-color: #fb923c; } .sw-btn.closed:hover { background: #d3f1e0; border-color: #4cc483; } }

    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge {
      flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
      background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer;
      display: grid; place-items: center; color: var(--ink);
    }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    @media (hover: hover) { .nudge:hover { background: var(--surface-2); } }
    .ctrl-note { font-size: 13.5px; color: var(--muted); margin: 2px 0 0; }

    .readout .value.state { font-family: var(--font); font-size: 19px; }
    .readout .value.state.on { color: #0b7a41; }
    .readout .value.state.off { color: #c2410c; }

    @media (max-width: 599px) {
      .tgl { padding: 5px 11px; font-size: 14px; gap: 5px; }
      .stage-toolbar .spacer { display: none; }
    }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g2">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중2 · Ⅶ. 전기와 자기</div>
      <h1>전류의 모형</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label">⚡ 전기 회로</span>
          <span class="spacer"></span>
          <button type="button" class="tgl tgl-e" id="tgE" aria-pressed="false" data-feature="electrons"><span class="ico">−</span>전자 흐름 보기</button>
          <button type="button" class="tgl tgl-i" id="tgI" aria-pressed="false" data-feature="current"><span class="ico"></span>전류 방향 보기</button>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="전원 장치, 스위치, 전구로 이루어진 전기 회로와 물의 흐름 모형"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label">회로 (스위치)</span><span class="value state off" id="rC">열린 회로</span></div>
        <div class="readout"><span class="label">전구</span><span class="value state off" id="rB">꺼짐</span></div>
        <div class="readout" data-feature="voltage"><span class="label">전압 (전원 장치)</span><span class="value" id="rV">3.0<small>V</small></span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control sw-row" data-feature="switch">
          <button type="button" class="btn sw-btn" id="swBtn" aria-pressed="false">🔌 스위치 닫기</button>
          <button class="btn btn-sm btn-ghost" id="resetBtn" type="button">↺ 초기화</button>
        </div>
        <div class="control" data-feature="voltage">
          <div class="control-head"><label for="sV">🔋 전원 장치의 전압</label><output id="oV"></output></div>
          <div class="range-row">
            <button class="nudge" type="button" data-d="-0.5" aria-label="전압 0.5 V 낮추기">−</button>
            <input type="range" id="sV" min="0.5" max="6" step="0.5" value="3">
            <button class="nudge" type="button" data-d="0.5" aria-label="전압 0.5 V 높이기">+</button>
          </div>
          <p class="ctrl-note">전원 장치의 손잡이를 끌어도 돼요.</p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
