<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0ea5e9">
  <title>온실 효과 강화와 열수지 | 고1 통합과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌡️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-hint { bottom: auto; top: 12px; }
    .stage-toolbar { min-height: 58px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; }
    .stage-toolbar .segmented button { min-height: 40px; padding: 5px 12px; font-size: 14.5px; white-space: nowrap; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard [hidden] { display: none !important; }
    .opt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 4px; }
    .opt-grid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .opt {
      min-height: 46px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px;
      font-weight: 800; font-size: 15px; cursor: pointer; padding: 4px 6px; font-family: inherit; line-height: 1.2;
    }
    .opt.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .opt.bad { border-color: #e2464b; background: #fff1f1; }
    .opt .ok { color: var(--good); margin-left: 3px; }
    .ctrl-note { margin: 6px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
    .btn-sm { min-height: 44px; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini, table.mini { border-collapse: collapse; margin: 6px 0; font-size: 13px; width: 100%; }
    .concept table.mini th, .concept table.mini td, table.mini th, table.mini td { border: 1px solid var(--line); padding: 4px 5px; text-align: center; }
    .concept table.mini th, table.mini th { background: var(--surface-2); font-weight: 800; }
    table.mini td.now { background: color-mix(in srgb, var(--subject) 12%, white); font-weight: 800; }
    table.mini td.none { color: var(--muted); }
    @media (max-width: 599px) {
      .readout { min-width: 0; }
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar .spacer { display: none; }
      .stage-toolbar .segmented button { padding: 5px 8px; font-size: 13.5px; }
    }
    input[type=range] { height: 40px; }
    .ticks { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); font-weight: 700; margin-top: -6px; padding: 0 2px; }
    .act-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .act-list .opt { text-align: left; padding: 8px 10px; font-size: 14px; min-height: 46px; font-weight: 700; }
  </style>
</head>
<body class="sim-page" data-subject="earth">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#h1b">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">통합과학2 · Ⅱ. 환경과 에너지</div>
      <h1>온실 효과 강화와 열수지</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🌍 지구 열수지</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="group" aria-label="장면 고르기" hidden>
            <button type="button" data-mode="budget">🌍 열수지</button>
            <button type="button" data-mode="gh">☁️ 온실 강화</button>
            <button type="button" data-mode="fb">🔁 되먹임</button>
            <button type="button" data-mode="emit">🏭 배출·흡수</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="지구 열수지 화살표 다이어그램, 온실 기체 농도에 따른 열수지 변화, 되먹임 비교, 이산화 탄소 배출과 흡수에 따른 2100년까지의 농도와 기온 그래프"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="budget">
          <p class="ctrl-note" style="margin-top:0">숫자 카드를 <b>끌어서</b> 빈칸에 놓아요. (카드를 누른 뒤 빈칸을 눌러도 돼요.) 놓은 숫자로 <b>합계 확인</b>이 바로 계산돼요.</p>
          <button class="btn btn-sm btn-block" id="bResetCards" type="button" style="margin-top:8px">↺ 카드 모으기</button>
        </div>
        <div class="control" data-modes="gh">
          <div class="control-head"><span>🏭 이산화 탄소 농도</span><output id="oCo2">280 ppm</output></div>
          <input type="range" id="sCo2" min="280" max="560" step="10" value="280" aria-label="대기 중 이산화 탄소 농도">
          <div class="ticks"><span>280 산업화 이전</span><span>420 현재</span><span>560 두 배</span></div>
          <div class="opt-grid c3" id="presets">
            <button class="opt" type="button" data-c="280">280</button>
            <button class="opt" type="button" data-c="420">420</button>
            <button class="opt" type="button" data-c="560">560</button>
          </div>
          <button class="btn btn-sm btn-block" id="bRestart" type="button" style="margin-top:8px">↺ 280 ppm 평형에서 다시 시작</button>
        </div>
        <div class="control" data-modes="fb">
          <div class="control-head"><span>🔁 되먹임 켜고 끄기</span><output>560 ppm</output></div>
          <div class="opt-grid" id="fbBtns">
            <button class="opt" type="button" data-fb="vap">💧 수증기 증가</button>
            <button class="opt" type="button" data-fb="ice">🧊 빙하 감소</button>
          </div>
          <div class="btn-row">
            <button class="btn btn-sm" id="bFbRestart" type="button">↺ 처음부터</button>
            <button class="btn btn-sm btn-primary" id="bRecord" type="button">📝 평형 기록</button>
          </div>
          <div id="fbTable"></div>
        </div>
        <div class="control" data-modes="emit">
          <div class="control-head"><span>🏭 연간 배출량</span><output id="oEmit">40 Gt/년</output></div>
          <input type="range" id="sEmit" min="0" max="60" step="5" value="40" aria-label="이산화 탄소 연간 배출량">
          <div class="control-head" style="margin-top:6px"><span>🌳 숲·습지 복원 흡수</span><output id="oForest">0 Gt/년</output></div>
          <input type="range" id="sForest" min="0" max="6" step="1" value="0" aria-label="숲과 습지를 늘려 더 흡수하는 이산화 탄소의 양">
          <button class="btn btn-sm btn-block" id="bReplay" type="button" style="margin-top:6px">▶ 2025년부터 다시 보기</button>
        </div>
        <div class="control" data-modes="emit" id="actBox" hidden>
          <div class="control-head"><span>🌱 내가 할 수 있는 일 (3개 이상)</span></div>
          <div class="act-list" id="actList"></div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
