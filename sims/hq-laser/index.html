<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>레이저와 광통신 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔴</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .chips button.done { border-color: var(--good); background: var(--good-soft); }
    .chips button:disabled { opacity: .45; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .num-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 17px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: #fff; }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    .sel-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  
    .stage-toolbar .segmented { flex-wrap: wrap; }
    .segmented button { white-space: nowrap; }
    .seg-4 button { flex: 1 1 0; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14px; }
    .tray-note { font-weight: 800; }
    .sub-hl { color: var(--subject); font-weight: 900; }
    #lgSeg button, #lamSeg button { font-size: 13.5px; padding-left: 3px; padding-right: 3px; }

    .chips button small { font-weight: 700; opacity: .8; }
    .chips.tight button { padding: 4px 9px; font-size: 13.5px; }
    .btn-row.one .btn { flex: 1 1 100%; }
    .tick-note { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .chips.col button { flex: 1 1 100%; text-align: left; border-radius: 12px; font-size: 13.5px; line-height: 1.25; padding: 8px 12px; }

  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hq">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">전자기와 양자 · Ⅱ. 빛과 정보 통신</div>
      <h1>레이저와 광통신</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🔴 레이저와 광통신</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="atom">
            <button type="button" data-mode="atom" data-feature="atom">⚛️ 흡수와 방출</button><button type="button" data-mode="invert" data-feature="invert">📦 밀도 반전</button><button type="button" data-mode="cavity" data-feature="cavity">🔴 공진기</button><button type="button" data-mode="apps" data-feature="apps">🌐 특징과 활용</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="두 준위 원자의 흡수와 자발 방출과 유도 방출, 원자 100개 상자의 밀도 반전과 광자 증폭, 두 거울 공진기와 출력 그래프, 레이저와 전구 비교와 광통신 광섬유와 안전 점검"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">-</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">-</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">-</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="atom">
          <div class="control-head"><span>🔎 과정 고르기</span></div><div class="segmented view-seg" id="procSeg" role="group" aria-label="과정 고르기"><button type="button" data-v="abs">흡수</button><button type="button" data-v="spon">자발 방출</button><button type="button" data-v="stim">유도 방출</button></div>
        </div>
        <div class="control" data-modes="atom">
          <button class="btn btn-sm btn-primary" id="bRun" type="button">▶ 시연 다시 보기</button>
        </div>
        <div class="control" data-modes="atom" data-match="selA">
          <div class="control-head"><span>✍️ 문장 완성하기</span></div><div id="selA"></div>
        </div>
        <div class="control" data-modes="invert">
          <div class="control-head"><label for="sP">⚡ 펌핑 세기</label><output id="oP">0</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sP" data-d="-1" aria-label="펌핑 세기 (0부터 100) 줄이기">−</button><input type="range" id="sP" min="0" max="100" step="1" value="0" aria-label="펌핑 세기 (0부터 100)"><button class="nudge" type="button" data-for="sP" data-d="1" aria-label="펌핑 세기 (0부터 100) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="invert">
          <button class="btn btn-sm btn-primary" id="bShot" type="button">💡 광자 5개 넣기</button><p class="ctrl-note">왼쪽에서 광자 5개를 상자에 보내요.</p>
        </div>
        <div class="control" data-modes="invert">
          <div class="control-head"><span>📈 준위 도식 보기</span></div><div class="segmented view-seg" id="diagSeg" role="group" aria-label="준위 도식 보기"><button type="button" data-v="3">3준위</button><button type="button" data-v="4">4준위</button></div>
        </div>
        <div class="control" data-modes="invert" data-match="selB">
          <div class="control-head"><span>✍️ 문장 완성하기</span></div><div id="selB"></div>
        </div>
        <div class="control" data-modes="cavity">
          <button class="btn btn-sm btn-primary" id="bPump" type="button">⚡ 펌핑 켜기 (레이저 켜기)</button>
        </div>
        <div class="control" data-modes="cavity">
          <div class="control-head"><label for="sQ">🔆 펌핑 세기</label><output id="oQ">90</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sQ" data-d="-1" aria-label="펌핑 세기 (0부터 100) 줄이기">−</button><input type="range" id="sQ" min="0" max="100" step="1" value="90" aria-label="펌핑 세기 (0부터 100)"><button class="nudge" type="button" data-for="sQ" data-d="1" aria-label="펌핑 세기 (0부터 100) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="cavity">
          <div class="control-head"><span>🪞 출력 거울의 투과율</span></div><div class="segmented view-seg" id="tmSeg" role="group" aria-label="출력 거울의 투과율"><button type="button" data-v="1">1 %</button><button type="button" data-v="5">5 %</button><button type="button" data-v="10">10 %</button><button type="button" data-v="none">거울 없음</button></div><p class="ctrl-note">그래프를 눌러도 펌핑 세기를 고를 수 있어요.</p>
        </div>
        <div class="control" data-modes="cavity" data-match="selC">
          <div class="control-head"><span>✍️ 문장 완성하기</span></div><div id="selC"></div>
        </div>
        <div class="control" data-modes="apps">
          <div class="control-head"><span>🔎 장면 고르기</span></div><div class="segmented view-seg" id="apSeg" role="group" aria-label="장면 고르기"><button type="button" data-v="compare">🔍 특징 비교</button><button type="button" data-v="fiber">🌐 광통신</button><button type="button" data-v="safety">🛡️ 안전 점검</button></div>
        </div>
        <div class="control" data-modes="apps" data-sub="compare">
          <div class="control-head"><label for="sD">📏 레이저를 보낸 거리</label><output id="oD">100 m</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sD" data-d="-1" aria-label="레이저를 보낸 거리 (0미터부터 100미터) 줄이기">−</button><input type="range" id="sD" min="0" max="100" step="5" value="100" aria-label="레이저를 보낸 거리 (0미터부터 100미터)"><button class="nudge" type="button" data-for="sD" data-d="1" aria-label="레이저를 보낸 거리 (0미터부터 100미터) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="apps" data-sub="fiber">
          <div class="control-head"><label for="sA">📡 광 증폭기의 위치</label><output id="oA">없음</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sA" data-d="-1" aria-label="광 증폭기의 위치 (0은 없음, 5킬로미터부터 95킬로미터) 줄이기">−</button><input type="range" id="sA" min="0" max="95" step="5" value="0" aria-label="광 증폭기의 위치 (0은 없음, 5킬로미터부터 95킬로미터)"><button class="nudge" type="button" data-for="sA" data-d="1" aria-label="광 증폭기의 위치 (0은 없음, 5킬로미터부터 95킬로미터) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="apps" data-sub="fiber">
          <div class="control-head"><span>🌈 실어 보내는 레이저 수 (파장 분할 다중화)</span></div><div class="segmented view-seg" id="chSeg" role="group" aria-label="실어 보내는 레이저 수 (파장 분할 다중화)"><button type="button" data-v="1">1개</button><button type="button" data-v="10">10개</button><button type="button" data-v="20">20개</button><button type="button" data-v="40">40개</button></div>
        </div>
        <div class="control" data-modes="apps" data-sub="safety" data-match="safe">
          <div class="control-head"><span>✅ 지켜야 하는 규칙만 골라요</span></div><div class="chips col" id="safeChips" role="group" aria-label="안전 수칙 고르기"><button type="button" data-i="r1">빔 높이를 눈보다 낮게 해요</button><button type="button" data-i="w1">약한 포인터는 사람 눈에 잠깐 비춰도 괜찮아요</button><button type="button" data-i="r2">거울·유리·금속 같은 반사면은 향하지 않거나 치워요</button><button type="button" data-i="w2">거울에 비추면 빛이 약해지니 안전해요</button><button type="button" data-i="r3">보호 안경을 쓰고 경고 표지를 붙여요</button><button type="button" data-i="w3">선글라스를 쓰면 보호 안경은 필요 없어요</button><button type="button" data-i="r4">쓰지 않을 때는 전원을 꺼요</button></div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
