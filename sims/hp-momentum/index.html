<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>작용 반작용과 운동량 보존 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎱</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--phy); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; line-height: 1.4; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .seg-wrap { display: flex; flex-wrap: wrap; width: 100%; border-radius: 20px; }
    .seg-wrap button { flex: 1 1 44%; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14.5px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .nudge:disabled { opacity: .4; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); font-family: inherit; }
    .chips button.on { border-color: var(--phy); background: color-mix(in srgb, var(--phy) 14%, white); color: #9a3412; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.3; }
    .num-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .num-row input { flex: 1; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 17px var(--font); color: var(--ink); background: #fff; }
    .num-row input.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .num-row .unit { font-weight: 800; color: var(--muted); font-size: 15px; white-space: nowrap; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini, table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td, table.mini th, table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th, table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }

    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar:has(> .segmented[hidden]) { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hp">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">물리학 · Ⅰ. 힘과 에너지</div>
      <h1>작용 반작용과 운동량 보존</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🤝 작용 반작용</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="collide">
            <button type="button" data-mode="pair" data-feature="pair">🤝 작용 반작용</button>
            <button type="button" data-mode="collide" data-feature="collide">🎱 일차원 충돌</button>
            <button type="button" data-mode="recoil" data-feature="recoil">🚀 반동과 발사</button>
            <button type="button" data-mode="apply" data-feature="apply">🏟️ 적용</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="줄로 연결된 두 수레의 힘 센서, 일차원 충돌 트랙과 운동량 막대, 스케이트·총·우주 공구·로켓의 반동, 자동차·당구공·뉴턴의 요람 적용 장면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">-</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">-</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">-</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">

        <!-- ① 줄 당기기 -->
        <div class="control" data-modes="pair" data-nocls>
          <div class="control-head"><span>🔵 수레 A 질량</span></div>
          <div class="segmented view-seg" id="pmASeg" role="group" aria-label="수레 A 질량">
            <button type="button" data-v="1">1.0 kg</button><button type="button" data-v="2">2.0 kg</button><button type="button" data-v="3">3.0 kg</button>
          </div>
        </div>
        <div class="control" data-modes="pair" data-nocls>
          <div class="control-head"><span>🟠 수레 B 질량</span></div>
          <div class="segmented view-seg" id="pmBSeg" role="group" aria-label="수레 B 질량">
            <button type="button" data-v="1">1.0 kg</button><button type="button" data-v="2">2.0 kg</button><button type="button" data-v="3">3.0 kg</button>
          </div>
        </div>
        <div class="control" data-modes="pair" data-nocls>
          <div class="control-head"><span>💪 당기는 세기(줄의 장력)</span></div>
          <div class="segmented view-seg" id="pfSeg" role="group" aria-label="당기는 세기">
            <button type="button" data-v="4">4 N</button><button type="button" data-v="6">6 N</button><button type="button" data-v="8">8 N</button>
          </div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bPull" type="button">▶ 줄 당기기</button></div>
          <p class="ctrl-note">줄이 감기며 두 수레가 서로 다가와요. 두 힘 센서 눈금을 비교해요.</p>
        </div>
        <div class="control" data-modes="pair" data-cls>
          <div class="control-head"><span>🧩 두 힘의 관계 고르기</span></div>
          <div id="clsRows"></div>
        </div>
        <!-- ② 충돌 -->
        <div class="control" data-modes="collide">
          <div class="control-head"><span>🛒 수레 고르기</span></div>
          <div class="segmented view-seg" id="cartSeg" role="group" aria-label="설정할 수레">
            <button type="button" data-c="A">수레 A</button><button type="button" data-c="B">수레 B</button>
          </div>
        </div>
        <div class="control" data-modes="collide">
          <div class="control-head"><label for="sMass">⚖️ 수레 <span id="lblCart">A</span> 질량</label><output id="oMass">1.0 kg</output></div>
          <div class="range-row"><input type="range" id="sMass" min="0.5" max="3" step="0.5" value="1" aria-label="질량 (0.5부터 3.0킬로그램)"></div>
          <div class="control-head" style="margin-top:6px"><label for="sVel">➡️ 처음 속도</label><output id="oVel">+2.0 m/s</output></div>
          <div class="range-row"><input type="range" id="sVel" min="-3" max="3" step="0.5" value="2" aria-label="처음 속도 (마이너스 3부터 플러스 3 m/s)"></div>
        </div>
        <div class="control" data-modes="collide">
          <div class="control-head"><span>💥 충돌 유형</span></div>
          <div class="segmented view-seg" id="typeSeg" role="group" aria-label="충돌 유형">
            <button type="button" data-t="stick">🧲 합체</button><button type="button" data-t="bounce">🔄 튕김(용수철)</button>
          </div>
          <div class="btn-row">
            <button class="btn btn-sm btn-primary" id="bColRun" type="button">▶ 충돌 시키기</button>
            <button class="btn btn-sm" id="bColClear" type="button">🗑 기록 지우기</button>
          </div>
        </div>
        <div class="control" data-modes="collide" data-pin>
          <div class="control-head"><label for="pInput">✏️ 충돌 후 총 운동량</label></div>
          <div class="num-row"><input id="pInput" type="text" inputmode="decimal" autocomplete="off" placeholder="예: 3.5" aria-label="충돌 후 총 운동량"><span class="unit">kg·m/s</span></div>
        </div>
        <!-- ③ 반동 -->
        <div class="control" data-modes="recoil">
          <div class="control-head"><span>🎬 장면 고르기</span></div>
          <div class="segmented seg-wrap" id="rcSeg" role="group" aria-label="장면">
            <button type="button" data-s="skate">⛸️ 스케이트</button><button type="button" data-s="gun">🔫 총</button>
            <button type="button" data-s="space">👨‍🚀 우주 공구</button><button type="button" data-s="rocket">🚀 로켓</button>
          </div>
        </div>
        <div class="control" data-modes="recoil" data-sc="skate">
          <div class="control-head"><span>🧍 오른쪽 선수 질량 (왼쪽은 60 kg)</span></div>
          <div class="segmented view-seg" id="rcMassSeg" role="group" aria-label="오른쪽 선수 질량">
            <button type="button" data-v="40">40 kg</button><button type="button" data-v="60">60 kg</button><button type="button" data-v="90">90 kg</button>
          </div>
        </div>
        <div class="control" data-modes="recoil" data-sc="rocket">
          <div class="control-head"><span>🌌 주변 환경</span></div>
          <div class="segmented view-seg" id="rcEnvSeg" role="group" aria-label="주변 환경">
            <button type="button" data-e="air">🌤️ 대기 중</button><button type="button" data-e="space">🌌 우주 공간</button>
          </div>
        </div>
        <div class="control" data-modes="recoil">
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bRcFire" type="button">🤝 서로 밀기</button></div>
        </div>
        <div class="control" data-modes="recoil" data-vin>
          <div class="control-head"><label for="vInput">✏️ 총의 반동 속력 (예측)</label></div>
          <div class="num-row"><input id="vInput" type="text" inputmode="decimal" autocomplete="off" placeholder="예: 2.5" aria-label="총의 반동 속력"><span class="unit">m/s</span></div>
        </div>
        <!-- ④ 적용 -->
        <div class="control" data-modes="apply">
          <div class="control-head"><span>🃏 장면 카드</span></div>
          <div class="segmented seg-wrap" id="apSeg" role="group" aria-label="장면 카드">
            <button type="button" data-s="car">🚗 자동차</button><button type="button" data-s="ball">🎱 당구공</button>
            <button type="button" data-s="swim">🏊 수영 출발</button><button type="button" data-s="cannon">💥 대포</button>
            <button type="button" data-s="cradle">🔔 뉴턴의 요람</button>
          </div>
        </div>
        <div class="control" data-modes="apply" data-ap="col rc">
          <div class="control-head"><span>📝 운동량 보존 식 세우기</span></div>
          <p class="ctrl-note" id="eqQ" style="margin:4px 0 6px"></p>
          <select class="sel-in" id="eqSel" aria-label="운동량 보존 식 고르기"></select>
        </div>
        <div class="control" data-modes="apply" data-ap="cradle">
          <div class="control-head"><span>🔔 들어 올릴 공의 개수</span></div>
          <div class="segmented view-seg" id="crSeg" role="group" aria-label="들어 올릴 공 개수">
            <button type="button" data-n="1">1개</button><button type="button" data-n="2">2개</button>
          </div>
        </div>
        <div class="control" data-modes="apply">
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bApRun" type="button">▶ 충돌 시키기</button></div>
        </div>

      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
