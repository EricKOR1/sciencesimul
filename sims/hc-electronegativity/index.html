<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#8b5cf6">
  <title>전기 음성도 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧲</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-card { background: #f3f0fb; }
    .stage-toolbar { min-height: 58px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar .segmented button { min-height: 40px; padding: 5px 10px; font-size: 14px; white-space: nowrap; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #resetBtn { font-size: 20px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-set { display: flex; flex-direction: column; gap: 10px; }
    .ctrl-set .segmented { align-self: stretch; flex-wrap: nowrap; }
    .ctrl-set .segmented button { flex: 1 1 0; min-width: 0; min-height: 44px; font-size: 14.5px; padding-left: 6px; padding-right: 6px; }
    .ctrl-set.compact > .control-head:first-child { display: none; }
    #cs-rule .sel-row .q { margin-bottom: 2px; }
    .ctrl-note { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
    .opt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .opt-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .opt-grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .opt {
      min-height: 46px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px;
      font-weight: 800; font-size: 14.5px; cursor: pointer; padding: 4px 6px; font-family: inherit; line-height: 1.2;
    }
    .opt.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .opt.done::after { content: " ✓"; color: var(--good); }
    .opt.wide { grid-column: 1 / -1; }
    .opt.go { background: var(--subject); color: #fff; border-color: var(--subject); }
    .opt.go:disabled { background: var(--surface-2); color: var(--muted); border-color: var(--line); }
    .opt:disabled { opacity: .5; cursor: not-allowed; }
    .opt.big { min-height: 64px; font-size: 20px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .nudge:disabled { opacity: .4; }
    .stage-hint { white-space: normal; width: max-content; max-width: calc(100% - 24px); text-align: center; top: 10px; bottom: auto; }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    sup, sub { font-size: .7em; line-height: 0; }
    .step-intro .si-q {
      background: #fff; border: 2px solid color-mix(in srgb, var(--subject) 45%, white); border-radius: 12px;
      padding: 9px 12px; font-weight: 800; font-size: 16px; color: #4c1d95; margin: 4px 0 8px;
    }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .sel-row { margin-top: 2px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.3; }
    .sel-in { width: 100%; min-height: 42px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    @media (max-width: 599px) {
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar .segmented button { padding: 5px 7px; font-size: 13px; }
      .readout .value.txt { font-size: 15px; }
    }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
  </style>
</head>
<body class="sim-page" data-subject="chem">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hc">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">화학 · Ⅱ. 물질의 구조와 성질</div>
      <h1>전기 음성도</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🪢 전자 줄다리기</span>
          <span class="spacer"></span>
          <div class="segmented" id="sceneSeg" role="group" aria-label="장면 고르기" data-feature="table">
            <button type="button" data-scene="tug" data-feature="tug">🪢 줄다리기</button>
            <button type="button" data-scene="table" data-feature="table">🔥 주기율표</button>
            <button type="button" data-scene="atom" data-feature="atom">⚛️ 핵과 전자</button>
            <button type="button" data-scene="order" data-feature="order">🎯 순서</button>
          </div>
          <button class="icon-btn" id="resetBtn" type="button" title="처음 상태로" aria-label="처음 상태로">↺</button>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="두 원자가 전자쌍을 끌어당기는 줄다리기, 전기 음성도 주기율표 히트맵과 그래프, 핵과 전자껍질 모형, 전기 음성도 순서 맞히기"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="roL1">-</span><span class="value txt" id="roV1">-</span></div>
        <div class="readout"><span class="label" id="roL2">-</span><span class="value txt" id="roV2">-</span></div>
        <div class="readout"><span class="label" id="roL3">-</span><span class="value txt" id="roV3">-</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <!-- ① 줄다리기 -->
        <div class="ctrl-set" id="cs-tug" hidden>
          <div class="control-head" style="margin-bottom:0"><span>🪢 경기 고르기</span></div>
          <div class="opt-grid three" id="matchBtns"></div>
          <div class="control-head" style="margin-bottom:0"><span>🔮 공유 전자쌍은 어느 쪽으로 쏠릴까요?</span></div>
          <div class="opt-grid three" id="predBtns"></div>
          <button type="button" class="opt go wide" id="goBtn">▶ 줄다리기 시작!</button>
        </div>
        <!-- ② 주기율표 -->
        <div class="ctrl-set" id="cs-table" hidden>
          <div class="control-head" style="margin-bottom:0"><span>📈 값을 그래프로 그려 볼 줄</span></div>
          <div class="opt-grid" id="serBtns"></div>
          <button type="button" class="opt go wide" id="drawBtn">📈 그래프 그리기</button>
        </div>
        <!-- ③ 핵과 전자 -->
        <div class="ctrl-set" id="cs-atom" hidden>
          <div class="control-head" style="margin-bottom:0"><span>⚛️ 비교할 줄</span></div>
          <div class="segmented" id="modeSeg" role="group" aria-label="비교할 줄 고르기">
            <button type="button" data-v="p2">2주기</button>
            <button type="button" data-v="p3">3주기</button>
            <button type="button" data-v="g17">17족</button>
          </div>
          <div class="control" style="margin:0">
            <div class="control-head"><label for="sEl" id="elLabel">🔢 원소</label><output id="oEl">Li</output></div>
            <div class="range-row">
              <button class="nudge" id="elMinus" type="button" aria-label="이전 원소">◀</button>
              <input type="range" id="sEl" min="0" max="6" step="1" value="0" aria-label="원소 고르기">
              <button class="nudge" id="elPlus" type="button" aria-label="다음 원소">▶</button>
            </div>
          </div>
        </div>
        <div class="ctrl-set" id="cs-rule" hidden>
          <div class="control-head" style="margin-bottom:0"><span>✍️ 규칙 문장 완성하기</span></div>
          <div id="ruleSel"></div>
        </div>
        <!-- ④ 순서 -->
        <div class="ctrl-set" id="cs-arr" hidden>
          <div class="control-head" style="margin-bottom:0"><span>🎯 전기 음성도가 작은 것부터 놓아요</span></div>
          <button type="button" class="opt wide" id="clearBtn">🧹 카드 모두 빼기</button>
        </div>
        <div class="ctrl-set" id="cs-cmp" hidden>
          <div class="control-head" style="margin-bottom:0"><span>🎯 전기 음성도가 더 큰 원소는?</span></div>
          <div class="opt-grid" id="cmpBtns"></div>
        </div>
        <p class="ctrl-note" id="ctlNote"></p>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
