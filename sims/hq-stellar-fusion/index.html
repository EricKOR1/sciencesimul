<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>별의 핵융합 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .chips button.done { border-color: var(--good); background: var(--good-soft); }
    .chips button:disabled { opacity: .45; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .num-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 17px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: #fff; }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    .sel-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  
    .stage-toolbar .segmented { flex-wrap: wrap; }
    .segmented button { white-space: nowrap; }
    .seg-4 button { flex: 1 1 0; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14px; }
    .tray-note { font-weight: 800; }
    .sub-hl { color: var(--subject); font-weight: 900; }

    .chips button small { font-weight: 700; opacity: .8; }
    .chips.tight button { padding: 4px 9px; font-size: 13.5px; }
    .btn-row.one .btn { flex: 1 1 100%; }
    .tick-note { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .chips.col button { flex: 1 1 100%; text-align: left; border-radius: 12px; font-size: 13.5px; line-height: 1.25; padding: 8px 12px; }

  
    .num-row { margin-top: 8px; }
    .num-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.3; }
    .num-line { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14.5px; flex-wrap: wrap; }
    .num-line .num-in { width: 110px; flex: none; }
    .num-line .un { color: var(--muted); }
    .fx-note { font-size: 13.5px; color: var(--muted); margin: 4px 0 0; line-height: 1.35; }
    .btn-row.four .btn { flex: 1 1 22%; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14px; }
    .tight-seg button { font-size: 13.5px; padding-left: 3px; padding-right: 3px; }

  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hq">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">전자기와 양자 · Ⅲ. 양자와 미시세계</div>
      <h1>별의 핵융합</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">⭐ 별의 핵융합</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="cond">
            <button type="button" data-mode="cond" data-feature="cond">🌡️ 핵융합 조건</button><button type="button" data-mode="mass" data-feature="mass">⚖️ 질량 결손</button><button type="button" data-mode="sun" data-feature="sun">☀️ 태양의 수지</button><button type="button" data-mode="light" data-feature="light">✨ 빛의 방출</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="온도에 따른 양성자 접근 거리와 쿨롱 장벽 로그 그래프, 양성자 4개와 헬륨 핵의 질량 저울과 에너지 변환기, 태양의 질량 손실과 수명 계산과 별의 질량별 수명 그래프, 태양 단면에서 광자의 무작위 이동과 별의 표면 온도에 따른 색과 스펙트럼"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">-</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">-</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">-</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="cond">
          <div class="control-head"><label for="sT">🌡️ 온도 T</label><output id="oT">1.0×10⁶ K</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sT" data-d="-1" aria-label="온도 T (10의 3제곱에서 10의 10제곱 켈빈, 로그 눈금) 줄이기">−</button><input type="range" id="sT" min="300" max="1000" step="1" value="600" aria-label="온도 T (10의 3제곱에서 10의 10제곱 켈빈, 로그 눈금)"><button class="nudge" type="button" data-for="sT" data-d="1" aria-label="온도 T (10의 3제곱에서 10의 10제곱 켈빈, 로그 눈금) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="cond">
          <div class="control-head"><span>📌 자주 쓰는 온도</span></div><div class="segmented view-seg tight-seg" id="tSeg" role="group" aria-label="📌 자주 쓰는 온도"><button type="button" data-v="300">10³ K</button><button type="button" data-v="500">10⁵ K</button><button type="button" data-v="718">태양 중심</button><button type="button" data-v="900">10⁹ K</button><button type="button" data-v="1000">10¹⁰ K</button></div>
        </div>
        <div class="control" data-modes="cond">
          <div class="control-head"><span>🚇 터널 효과</span></div><div class="segmented view-seg" id="tnSeg" role="group" aria-label="🚇 터널 효과"><button type="button" data-v="off">끄기</button><button type="button" data-v="on">켜기</button></div><p class="ctrl-note">켜면 화면에서 터널링 융합이 일어나요. (실제보다 훨씬 자주 보여 줘요.)</p>
        </div>
        <div class="control" data-modes="cond" data-match="selA">
          <div class="control-head"><span>✍️ 읽은 값으로 답하기</span></div><div id="selA"></div>
        </div>
        <div class="control" data-modes="mass">
          <div class="btn-row "><button class="btn btn-sm btn-primary" id="bFuse" type="button">⚗️ 핵융합 일으키기</button><button class="btn btn-sm " id="bRst" type="button">↺ 처음 상태</button></div>
        </div>
        <div class="control" data-modes="mass" data-match="numB">
          <div class="control-head"><span>🧮 질량 결손 계산</span></div><div id="numB"></div>
        </div>
        <div class="control" data-modes="mass">
          <div class="btn-row "><button class="btn btn-sm btn-primary" id="bConv" type="button">🔁 질량 → 에너지 변환</button></div><p class="ctrl-note">E = Δm × 931.5 MeV/u (1 u = 931.5 MeV/c²)</p>
        </div>
        <div class="control" data-modes="sun">
          <div class="control-head"><label for="sLs">☀️ 별의 광도 L</label><output id="oLs">3.8×10²⁶ W</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sLs" data-d="-1" aria-label="별의 광도 L (1.0에서 8.0, 단위 10의 26제곱 와트) 줄이기">−</button><input type="range" id="sLs" min="10" max="80" step="1" value="38" aria-label="별의 광도 L (1.0에서 8.0, 단위 10의 26제곱 와트)"><button class="nudge" type="button" data-for="sLs" data-d="1" aria-label="별의 광도 L (1.0에서 8.0, 단위 10의 26제곱 와트) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="sun">
          <div class="control-head"><label for="sFr">⛽ 연료로 쓰는 비율</label><output id="oFr">30 %</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sFr" data-d="-1" aria-label="핵융합 연료로 쓰는 질량의 비율 (1에서 30퍼센트) 줄이기">−</button><input type="range" id="sFr" min="1" max="30" step="1" value="30" aria-label="핵융합 연료로 쓰는 질량의 비율 (1에서 30퍼센트)"><button class="nudge" type="button" data-for="sFr" data-d="1" aria-label="핵융합 연료로 쓰는 질량의 비율 (1에서 30퍼센트) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="sun">
          <div class="control-head"><span>⚖️ 별의 질량</span></div><div class="segmented view-seg tight-seg" id="msSeg" role="group" aria-label="⚖️ 별의 질량"><button type="button" data-v="0.5">0.5 태양질량</button><button type="button" data-v="1">태양 (1)</button><button type="button" data-v="10">10 태양질량</button></div>
        </div>
        <div class="control" data-modes="sun" data-match="numC">
          <div class="control-head"><span>🧮 질량 손실 계산</span></div><div id="numC"></div>
        </div>
        <div class="control" data-modes="light">
          <div class="control-head"><span>🌡️ 별의 표면 온도</span></div><div class="segmented view-seg tight-seg" id="cSeg" role="group" aria-label="🌡️ 별의 표면 온도"><button type="button" data-v="3500">3500 K</button><button type="button" data-v="5800">5800 K</button><button type="button" data-v="10000">10000 K</button><button type="button" data-v="30000">30000 K</button></div>
        </div>
        <div class="control" data-modes="light">
          <div class="control-head"><label for="sFu">🔥 핵융합 세기</label><output id="oFu">100 %</output></div>
          <div class="range-row"><button class="nudge" type="button" data-for="sFu" data-d="-1" aria-label="핵융합 세기 (50에서 150퍼센트) 줄이기">−</button><input type="range" id="sFu" min="50" max="150" step="5" value="100" aria-label="핵융합 세기 (50에서 150퍼센트)"><button class="nudge" type="button" data-for="sFu" data-d="1" aria-label="핵융합 세기 (50에서 150퍼센트) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="light">
          <div class="btn-row "><button class="btn btn-sm btn-primary" id="bPh" type="button">✨ 광자 새로 보내기</button></div>
        </div>
        <div class="control" data-modes="light" data-match="selO">
          <div class="control-head"><span>✍️ 에너지가 이동하는 순서</span></div><div id="selO"></div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
