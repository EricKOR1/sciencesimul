<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0ea5e9">
  <title>연주시차와 별까지의 거리 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-card { background: #070d1f; }
    .sc-tall { display: none; }
    @media (max-width: 599px) { .sc-wide { display: none; } .sc-tall { display: block; } }
    .stage-toolbar { min-height: 56px; background: var(--surface); }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; }
    #resetBtn { font-size: 20px; }
    .segmented button { min-height: 40px; padding: 6px 12px; font-size: 14.5px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    .is-off { display: none !important; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1 1 0; min-width: 0; min-height: 46px; }
    .ctrl-note { font-size: 13.5px; color: var(--muted); margin: 4px 0 0; line-height: 1.45; }
    .btn-sm { min-height: 44px; }
    input[type=range] { height: 44px; }
    .game-foot button { min-height: 44px; }
    .mission-figure svg, .note-fig svg { border-radius: 12px; max-width: 100%; height: auto; }
    .note-fig { margin: 6px 0; text-align: center; }
    kbd { font-family: inherit; font-size: 12px; background: rgba(0,0,0,.12); border-radius: 5px; padding: 0 5px; }

    /* 측정 기록 표 */
    .data-card { flex: none; padding: 8px 12px; display: flex; align-items: center; gap: 12px; }
    .data-head { flex: none; display: flex; flex-direction: column; gap: 2px; font-size: 14.5px; line-height: 1.25; }
    .data-head .n { font-size: 12.5px; color: var(--muted); font-weight: 700; }
    .data-scroll { flex: 1; min-width: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .data-table { border-collapse: collapse; font-size: 14.5px; }
    .data-table th { text-align: left; white-space: nowrap; padding: 3px 10px 3px 2px; color: var(--muted); font-weight: 800; font-size: 13.5px; }
    .data-table td {
      min-width: 54px; text-align: center; padding: 3px 6px; border-left: 1px solid var(--line);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 800; white-space: nowrap;
    }
    .data-table td.empty { color: #c3ccd9; font-weight: 600; }
    .data-table tr:first-child td { color: #1d4ed8; }
    .data-table tr:last-child td { color: #b91c1c; }
    .data-table td.fresh { background: #fff4dc; }
    @media (max-width: 599px) {
      .data-card { flex-direction: column; align-items: stretch; gap: 4px; }
      .data-head { flex-direction: row; gap: 8px; align-items: baseline; }
      .data-table td { min-width: 44px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="earth">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g2">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중2 · Ⅷ. 별과 우주</div>
      <h1>연주시차와 별까지의 거리</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="sceneLabel">✏️ 연필 실험</span>
          <span class="spacer"></span>
          <div class="segmented is-off" id="sceneTabs" role="tablist" aria-label="장면 선택">
            <button type="button" data-scene="pencil" class="on">✏️ 연필</button>
            <button type="button" data-scene="orbit">🌍 궤도</button>
            <button type="button" data-scene="dist">📏 거리</button>
            <button type="button" data-scene="map">🗺 지도</button>
          </div>
          <button class="icon-btn" id="resetBtn" type="button" title="이 장면 처음 상태로" aria-label="이 장면 처음 상태로">↺</button>
        </div>
        <div class="stage-canvas sc-wide"><canvas id="cvWide" aria-label="연필 시차 실험, 지구 공전 궤도 모형과 망원경 시야, 별 거리 지도"></canvas></div>
        <div class="stage-canvas sc-tall"><canvas id="cvTall" aria-label="연필 시차 실험, 지구 공전 궤도 모형과 망원경 시야, 별 거리 지도"></canvas></div>
      </section>
      <div class="readouts" id="readouts">
        <div class="readout" id="ro0"><span class="label"></span><span class="value"></span></div>
        <div class="readout" id="ro1"><span class="label"></span><span class="value"></span></div>
        <div class="readout" id="ro2"><span class="label"></span><span class="value"></span></div>
      </div>
      <section class="card data-card is-off" id="recCard" data-feature="record">
        <div class="data-head"><b>📋 측정 기록</b><span class="n" id="dataN">기록 0개</span><span class="n">거리순</span></div>
        <div class="data-scroll">
          <table class="data-table"><tbody>
            <tr id="rowD"><th>거리 (pc)</th></tr>
            <tr id="rowP"><th>연주시차 (″)</th></tr>
          </tbody></table>
        </div>
      </section>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" id="cEye" data-feature="eyes">
          <button class="btn btn-primary btn-block" id="eyeBtn" type="button" style="min-height:54px;font-size:18px">👁 눈 바꾸기</button>
          <p class="ctrl-note" id="eyeNote">지금 뜬 눈: <b>왼눈</b> · <kbd>Space</kbd> 키나 위쪽 화면을 눌러도 돼요.</p>
        </div>
        <div class="control" id="cPencil" data-feature="pencil">
          <div class="control-head"><label for="sPencil">✏️ 연필 거리</label><output id="oPencil"></output></div>
          <input type="range" id="sPencil" min="15" max="60" step="1" value="40">
          <p class="ctrl-note">아래 그림의 연필 점을 끌어도 돼요.</p>
        </div>
        <div class="control" id="cMonth" data-feature="orbit">
          <div class="control-head"><label>🌍 지구의 위치</label><output id="oMonth"></output></div>
          <div class="btn-row">
            <button class="btn" id="monPrev" type="button" aria-label="한 달 전">◀ 이전 달</button>
            <button class="btn" id="monNext" type="button" aria-label="한 달 뒤">다음 달 ▶</button>
          </div>
          <p class="ctrl-note">화면 속 지구를 궤도 위에서 끌어도 돼요.</p>
        </div>
        <div class="control" id="cShot" data-feature="photo">
          <div class="btn-row">
            <button class="btn btn-primary" id="shotBtn" type="button">📸 관측 기록</button>
            <button class="btn" id="spinBtn" type="button">▶ 6개월 공전</button>
          </div>
        </div>
        <div class="control" id="cDist" data-feature="distance">
          <div class="control-head"><label for="sDist">↕ 별 S까지의 거리</label><output id="oDist"></output></div>
          <input type="range" id="sDist" min="1" max="10" step="1" value="1">
          <p class="ctrl-note">화면 속 별 S를 위아래로 끌어도 돼요.</p>
        </div>
        <div class="control" id="cRec" data-feature="record">
          <div class="btn-row">
            <button class="btn btn-primary" id="recBtn" type="button">📍 기록</button>
            <button class="btn" id="clearBtn" type="button">지우기</button>
          </div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
