<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#8b5cf6">
  <title>녹는점과 끓는점 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌡️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-toolbar { min-height: 61px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #resetBtn { font-size: 20px; }
    .stage-toolbar .segmented button { min-height: 44px; padding: 6px 12px; font-size: 14.5px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    .ctrl-note { font-size: 13.5px; color: var(--muted); margin: 8px 0 0; line-height: 1.45; }
    .btn-block { min-height: 52px; font-size: 17px; }
    .opt-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
    .opt-seg button {
      min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink);
      font-weight: 800; font-size: 16px; cursor: pointer; padding: 6px 8px; line-height: 1.25;
    }
    .opt-seg button small { display: block; font-size: 12px; font-weight: 700; color: var(--muted); }
    .opt-seg button[aria-pressed="true"] { border-color: var(--subject); background: #f3eeff; color: #4c1d95; box-shadow: 0 0 0 3px color-mix(in srgb, var(--subject) 18%, transparent); }
    .opt-seg button[disabled] { opacity: .55; cursor: not-allowed; }
    .pick-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .pick-tag {
      flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
      font-weight: 800; font-size: 20px; color: #fff; background: #64748b; box-shadow: 0 2px 0 rgba(0,0,0,.18);
    }
    .pick-tag.y { background: #7c6bd6; }
    .pick-sel {
      flex: 1; min-width: 0; min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface);
      font-size: 17px; font-weight: 700; padding: 6px 12px; color: var(--ink); cursor: pointer;
    }
    .pick-sel:focus-visible { outline: 3px solid color-mix(in srgb, var(--subject) 30%, transparent); border-color: var(--subject); }
    .pick-sel.set { border-color: #c4b5fd; background: #f6f3ff; }
    .readout .value.word { font-family: var(--font); font-size: 17px; line-height: 1.5; overflow: hidden; text-overflow: ellipsis; }
    .mission-figure svg { border-radius: 12px; }
    #heatBtn[disabled], #pressR[disabled] { opacity: .55; cursor: not-allowed; }
    @media (max-width: 599px) {
      .stage-toolbar { min-height: 0; }
      .stage-toolbar .segmented { width: 100%; }
      .stage-toolbar .segmented button { flex: 1 1 auto; padding: 6px 6px; font-size: 13.5px; }
      .readout .value.word { font-size: 15px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="chem">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g2">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중2 · Ⅰ. 물질의 특성</div>
      <h1>녹는점과 끓는점</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🧊 팔미트산의 녹는점 재기</span>
          <span class="spacer"></span>
          <div class="segmented" id="sceneSeg" role="group" aria-label="실험 장면" hidden>
            <button type="button" data-scene="melt">🧊 녹는점</button>
            <button type="button" data-scene="boil">♨️ 끓는점</button>
            <button type="button" data-scene="press">⛰️ 압력</button>
            <button type="button" data-scene="unk">🔎 구별</button>
          </div>
          <button class="icon-btn" id="resetBtn" type="button" title="처음 상태로" aria-label="처음 상태로">↺</button>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="시료를 가열하며 시간에 따른 온도를 재어 녹는점과 끓는점을 알아보고, 압력에 따른 끓는점의 변화와 물질 구별을 해 보는 실험 화면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts" id="readouts">
        <div class="readout"><span class="label" id="rl1">5 g의 온도</span><span class="value" id="r1">25<small>°C</small></span></div>
        <div class="readout"><span class="label" id="rl2">10 g의 온도</span><span class="value" id="r2">25<small>°C</small></span></div>
        <div class="readout"><span class="label" id="rl3">녹는점 (수평 구간)</span><span class="value" id="r3">–</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" id="ctlSub" hidden>
          <div class="opt-seg" id="subSeg" role="group" aria-label="끓는점을 잴 물질">
            <button type="button" data-sub="water" aria-pressed="true">물<small>H₂O</small></button>
            <button type="button" data-sub="eth" aria-pressed="false">에탄올<small>중탕으로 데워요</small></button>
          </div>
        </div>
        <div class="control" id="ctlPress" hidden>
          <div class="control-head"><label for="pressR">🧭 압력</label><output id="pressO">1.0 기압</output></div>
          <input type="range" id="pressR" min="0.5" max="2" step="0.1" value="1" aria-label="압력(기압)">
          <p class="ctrl-note">낮은 쪽은 높은 산, 높은 쪽은 압력솥이에요. 아래 카드를 눌러도 돼요.</p>
        </div>
        <div class="control" id="ctlPick" hidden>
          <div class="control-head"><label>🔎 X, Y는 어떤 물질일까?</label></div>
          <div class="pick-row"><span class="pick-tag">X</span>
            <select id="selX" class="pick-sel" aria-label="시료 X의 물질">
              <option value="">물질 고르기</option><option value="water">물</option><option value="eth">에탄올</option><option value="palm">팔미트산</option><option value="naph">나프탈렌</option>
            </select></div>
          <div class="pick-row"><span class="pick-tag y">Y</span>
            <select id="selY" class="pick-sel" aria-label="시료 Y의 물질">
              <option value="">물질 고르기</option><option value="water">물</option><option value="eth">에탄올</option><option value="palm">팔미트산</option><option value="naph">나프탈렌</option>
            </select></div>
        </div>
        <div class="control" id="ctlHeat">
          <button class="btn btn-primary btn-block" id="heatBtn" type="button">🔥 가열하기</button>
          <p class="ctrl-note" id="heatNote"></p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
