<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>무선 충전의 원리 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .seg-wrap { display: flex; flex-wrap: wrap; width: 100%; }
    .seg-wrap button { flex: 1 1 30%; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hp">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">물리학 · Ⅱ. 전기와 자기</div>
      <h1>무선 충전의 원리</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🔌 유도 전달</span>
          <span class="spacer"></span>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="송신 코일과 수신 코일 사이의 전자기 유도, 무선 충전기 구현, 간격에 따른 효율 그래프와 이물질, 무선 충전 기술 카드"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" id="viewCtl" hidden>
          <div class="control-head"><span>🔀 화면 고르기</span></div>
          <div class="segmented seg-wrap" id="viewSeg" role="group" aria-label="화면 고르기"></div>
        </div>
        <!-- ① 유도 전달 -->
        <div class="control" data-modes="obs">
          <div class="control-head"><span>🔋 송신 코일의 전원</span></div>
          <div class="segmented view-seg" id="srcSeg" role="group" aria-label="전원 종류">
            <button type="button" data-v="dc">직류 (전지)</button>
            <button type="button" data-v="ac">교류</button>
          </div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bSw" type="button">스위치 켜기</button></div>
        </div>
        <div class="control" data-modes="obs">
          <div class="control-head"><span>🌀 수신 코일 감은 수 (송신 코일 20회)</span></div>
          <div class="segmented view-seg" id="nrSeg" role="group" aria-label="수신 코일 감은 수">
            <button type="button" data-v="20">20회</button>
            <button type="button" data-v="40">40회 (2배)</button>
          </div>
        </div>
        <!-- ② 충전기 구현 -->
        <div class="control" data-modes="build">
          <div class="control-head"><label for="sNt">🌀 송신 코일 감은 수</label><output id="oNt">20회</output></div>
          <div class="range-row"><input type="range" id="sNt" min="10" max="40" step="5" value="20" aria-label="송신 코일 감은 수 (10부터 40회)"></div>
          <div class="control-head" style="margin-top:6px"><label for="sNr">🌀 수신 코일 감은 수</label><output id="oNr">35회</output></div>
          <div class="range-row"><input type="range" id="sNr" min="10" max="40" step="5" value="35" aria-label="수신 코일 감은 수 (10부터 40회)"></div>
        </div>
        <div class="control" data-modes="build">
          <div class="control-head"><label for="sGap">↕️ 코일 간격</label><output id="oGap">5 mm</output></div>
          <div class="range-row"><input type="range" id="sGap" min="0" max="20" step="1" value="5" aria-label="코일 간격 (0부터 20밀리미터)"></div>
          <div class="control-head" style="margin-top:6px"><label for="sOff">↔️ 중심 어긋남</label><output id="oOff">6 mm</output></div>
          <div class="range-row"><input type="range" id="sOff" min="0" max="10" step="1" value="6" aria-label="중심 어긋남 (0부터 10밀리미터)"></div>
        </div>
        <div class="control" data-modes="build">
          <div class="control-head"><span>〰️ 교류 주파수</span></div>
          <div class="segmented seg-wrap" id="fSeg" role="group" aria-label="교류 주파수">
            <button type="button" data-v="50">50 Hz</button>
            <button type="button" data-v="1000">1 kHz</button>
            <button type="button" data-v="10000">10 kHz</button>
            <button type="button" data-v="100000">100 kHz</button>
            <button type="button" data-v="150000">150 kHz</button>
          </div>
          <div class="btn-row">
            <button class="btn btn-sm btn-primary" id="bRec" type="button">📏 기록하기</button>
            <button class="btn btn-sm" id="bRecClear" type="button">🗑 지우기</button>
          </div>
        </div>
        <!-- ③ 효율 분석 -->
        <div class="control" data-modes="eff">
          <div class="control-head"><label for="sGap3">↕️ 코일 간격</label><output id="oGap3">5 mm</output></div>
          <div class="range-row"><input type="range" id="sGap3" min="0" max="20" step="1" value="5" aria-label="코일 간격 (0부터 20밀리미터)"></div>
          <div class="btn-row">
            <button class="btn btn-sm btn-primary" id="bPt" type="button">📍 점 찍기</button>
            <button class="btn btn-sm" id="bPtClear" type="button">🗑 지우기</button>
          </div>
        </div>
        <div class="control" data-modes="eff">
          <div class="control-head"><span>🪙 코일 사이의 동전</span></div>
          <div class="segmented view-seg" id="coinSeg" role="group" aria-label="동전">
            <button type="button" data-v="0">없음</button>
            <button type="button" data-v="1">올려 놓기</button>
          </div>
          <div class="control-head" style="margin-top:6px"><span>🛡️ 이물질 감지 기능</span></div>
          <div class="segmented view-seg" id="detSeg" role="group" aria-label="이물질 감지">
            <button type="button" data-v="0">끄기</button>
            <button type="button" data-v="1">켜기</button>
          </div>
        </div>
        <div class="control" data-modes="eff" data-need="coin">
          <div class="control-head"><span>🛠️ 충전기는 어떻게 해야 할까?</span></div>
          <select class="sel-in" id="coinSel" aria-label="이물질이 있을 때 충전기의 대처">
            <option value="">— 고르기 —</option>
            <option value="keep">그대로 계속 충전한다</option>
            <option value="boost">출력을 높여 더 빨리 충전한다</option>
            <option value="cut">전원을 차단하고 알린다</option>
          </select>
        </div>
        <!-- ④ 기술과 영향 -->
        <div class="control" data-modes="tech">
          <div class="control-head"><span>🧾 장점과 한계 분류</span></div>
          <p class="ctrl-note">오른쪽 칸을 누를 때마다 <b>장점 → 한계 → 비움</b> 순서로 바뀌어요.</p>
          <div class="btn-row"><button class="btn btn-sm" id="bClearTech" type="button">🗑 분류 지우기</button></div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
