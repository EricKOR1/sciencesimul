<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>점전하의 전기장 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .seg-wrap { display: flex; flex-wrap: wrap; width: 100%; }
    .seg-wrap button { flex: 1 1 44%; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .nudge:disabled { opacity: .4; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok, .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad, .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    .numrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .numrow .q { flex: 1 1 100%; font-weight: 800; font-size: 14px; line-height: 1.3; margin-bottom: 2px; }
    .numrow .pre, .numrow .unit { font-weight: 800; font-size: 15px; }
    .num-in { width: 84px; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 16px var(--font); color: var(--ink); background: #fff; text-align: right; }
    select.num-in { width: auto; text-align: left; padding-right: 4px; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .chips button:disabled { opacity: .45; cursor: not-allowed; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar:has(> .segmented[hidden]) { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hq">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">전자기와 양자 · Ⅰ. 전자기적 상호작용</div>
      <h1>점전하의 전기장</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">⚡ 전기력</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="field">
            <button type="button" data-mode="force" data-feature="force">⚡ 전기력</button><button type="button" data-mode="field" data-feature="field">🧭 전기장</button><button type="button" data-mode="graph" data-feature="graph">📈 거리 관계</button><button type="button" data-mode="sum" data-feature="sum">➕ 전기장 합</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="두 점전하 사이의 전기력, 점전하 주위 전기장과 시험 전하, 거리에 따른 전기장 그래프, 전기장의 벡터 합"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">

        <!-- ① 전기력 -->
        <div class="control" data-modes="force" data-gate-off="num1">
          <div class="control-head"><label for="sQa">🔴 전하 A의 전하량</label><output id="oQa"></output></div><div class="range-row"><button class="nudge" id="sQaM" type="button" aria-label="전하 A의 전하량 (0.5마이크로쿨롱부터 5마이크로쿨롱) 줄이기">−</button><input type="range" id="sQa" min="0.5" max="5" step="0.5" value="2" aria-label="전하 A의 전하량 (0.5마이크로쿨롱부터 5마이크로쿨롱)"><button class="nudge" id="sQaP" type="button" aria-label="전하 A의 전하량 (0.5마이크로쿨롱부터 5마이크로쿨롱) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="force" data-gate-off="num1">
          <div class="control-head"><label for="sQb">🔴 전하 B의 전하량</label><output id="oQb"></output></div><div class="range-row"><button class="nudge" id="sQbM" type="button" aria-label="전하 B의 전하량 (0.5마이크로쿨롱부터 5마이크로쿨롱) 줄이기">−</button><input type="range" id="sQb" min="0.5" max="5" step="0.5" value="3" aria-label="전하 B의 전하량 (0.5마이크로쿨롱부터 5마이크로쿨롱)"><button class="nudge" id="sQbP" type="button" aria-label="전하 B의 전하량 (0.5마이크로쿨롱부터 5마이크로쿨롱) 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="force" data-gate-off="num1">
          <div class="control-head"><label for="sR">↔️ 두 전하 사이 거리 r</label><output id="oR"></output></div><div class="range-row"><button class="nudge" id="sRM" type="button" aria-label="두 전하 사이 거리 (0.1미터부터 1미터) 줄이기">−</button><input type="range" id="sR" min="0.1" max="1" step="0.05" value="0.3" aria-label="두 전하 사이 거리 (0.1미터부터 1미터)"><button class="nudge" id="sRP" type="button" aria-label="두 전하 사이 거리 (0.1미터부터 1미터) 늘리기">+</button></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bRec" type="button">📋 표에 기록하기</button></div>
          <p class="ctrl-note">화면의 전하 B를 손가락으로 끌어도 돼요. 표의 한 줄과 같은 값으로 맞춘 뒤 기록해요.</p>
        </div>
        <div class="control" data-modes="force" data-gate="num1" id="num1Host"></div>
        <!-- ② 전기장 -->
        <div class="control" data-modes="field" data-gate-off="num2">
          <div class="control-head"><span>🔴 장을 만드는 전하 q (1 μC)</span></div>
          <div class="segmented view-seg" id="qSeg" role="group" aria-label="전하 q의 부호">
            <button type="button" data-v="1">q = +1 μC</button>
            <button type="button" data-v="-1">q = −1 μC</button>
          </div>
        </div>
        <div class="control" data-modes="field" data-gate-off="num2">
          <div class="control-head"><span>🟡 시험 전하 q′ (끌어서 옮겨요)</span></div>
          <div class="segmented seg-wrap" id="qpSeg" role="group" aria-label="시험 전하 q′ 고르기">
            <button type="button" data-v="1">+1 nC</button>
            <button type="button" data-v="2">+2 nC</button>
            <button type="button" data-v="3">+3 nC</button>
            <button type="button" data-v="-2">−2 nC</button>
          </div>
          <div class="btn-row"><button class="btn btn-sm" id="bGhost" type="button">👻 시험 전하 치우기</button></div>
        </div>
        <div class="control" data-modes="field" data-gate="num2" id="num2Host"></div>
        <!-- ③ 거리 관계 -->
        <div class="control" data-modes="graph">
          <div class="control-head"><span>🔴 전하 q</span></div>
          <div class="segmented view-seg" id="gqSeg" role="group" aria-label="전하 q 고르기">
            <button type="button" data-v="1">+1 μC</button>
            <button type="button" data-v="2">+2 μC</button>
            <button type="button" data-v="-1">−1 μC</button>
          </div>
        </div>
        <div class="control" data-modes="graph">
          <div class="control-head"><label for="sG">📍 측정 위치 r</label><output id="oG"></output></div><div class="range-row"><button class="nudge" id="sGM" type="button" aria-label="측정 위치 r (0.1미터부터 1미터) 줄이기">−</button><input type="range" id="sG" min="0.1" max="1" step="0.05" value="0.3" aria-label="측정 위치 r (0.1미터부터 1미터)"><button class="nudge" id="sGP" type="button" aria-label="측정 위치 r (0.1미터부터 1미터) 늘리기">+</button></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bPin" type="button">📌 점 찍기</button></div>
        </div>
        <div class="control" data-modes="graph" data-gate="num3" id="num3Host"></div>
        <!-- ④ 전기장 합 -->
        <div class="control" data-modes="sum" data-gate-off="num4">
          <div class="control-head"><span>🧩 배치 고르기</span></div>
          <div class="segmented seg-wrap" id="preSeg" role="group" aria-label="전하 배치 고르기">
            <button type="button" data-v="a">(a) + +  0인 점</button>
            <button type="button" data-v="b">(b) + +  P</button>
            <button type="button" data-v="c">(c) + −  P</button>
            <button type="button" data-v="d">🖨️ 잉크젯</button>
          </div>
        </div>
        <div class="control" data-modes="sum" data-sub="a" data-gate-off="num4">
          <div class="control-head"><span>📍 점 P의 위치 x</span><output id="oPx"></output></div>
          <div class="range-row">
            <button class="nudge" id="pxM" type="button" aria-label="점 P를 왼쪽으로 0.01미터">◀</button>
            <input type="range" id="sPx" min="-0.35" max="0.95" step="0.01" value="0.3" aria-label="점 P의 위치 x (−0.35미터부터 0.95미터)">
            <button class="nudge" id="pxP" type="button" aria-label="점 P를 오른쪽으로 0.01미터">▶</button>
          </div>
          <p class="ctrl-note">P를 끌어서 옮겨도 돼요. E합이 0이 되는 곳을 찾아요.</p>
        </div>
        <div class="control" data-modes="sum" data-sub="bc" data-gate-off="num4">
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bSum" type="button">▶ 벡터 더하기</button></div>
          <p class="ctrl-note">두 전하의 전기장 화살표 E₁, E₂를 평행사변형으로 더해요.</p>
        </div>
        <div class="control" data-modes="sum" data-sub="d" data-gate-off="num4">
          <div class="control-head"><span>💧 잉크 방울의 전하량 (−)</span></div>
          <div class="segmented view-seg" id="inkSeg" role="group" aria-label="잉크 방울의 전하량">
            <button type="button" data-v="0">0</button>
            <button type="button" data-v="1">−1</button>
            <button type="button" data-v="2">−2</button>
            <button type="button" data-v="3">−3</button>
          </div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bInk" type="button">💧 방울 쏘기</button><button class="btn btn-sm" id="bInkClr" type="button">🧹 종이 지우기</button></div>
        </div>
        <div class="control" data-modes="sum" data-gate="num4" id="num4Host"></div>

      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
