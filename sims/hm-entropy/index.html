<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>엔트로피와 비가역 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
<style>
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--phy); color: #fff; }
    #modeSeg { width: 100%; flex-wrap: wrap; }
    #modeSeg button { flex: 1 1 auto; min-width: 0; padding-left: 8px; padding-right: 8px; font-size: 14.5px; }
    #modeSeg button[hidden] { display: none !important; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; line-height: 1.4; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .seg-wrap { border-radius: 20px; display: flex; flex-wrap: wrap; width: 100%; }
    .seg-wrap button { flex: 1 1 auto; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .num-in { width: 100%; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 16px var(--font); color: var(--ink); background: #fff; }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .in-grid { display: grid; grid-template-columns: 78px 1fr; gap: 6px 8px; align-items: center; margin-top: 6px; }
    .in-grid .lab { font-weight: 800; font-size: 14px; line-height: 1.25; }
    .in-grid .sel-in { min-height: 44px; padding: 2px 6px; font-size: 14px; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); font-family: inherit; }
    .chips button.on { border-color: var(--phy); background: color-mix(in srgb, var(--phy) 14%, white); color: #9a3412; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini, table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td, table.mini th, table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th, table.mini th { background: var(--surface-2); font-weight: 800; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer { display: none; }
      #modeSeg button { font-size: 13.5px; padding-left: 6px; padding-right: 6px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hm">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">역학과 에너지 · Ⅱ. 열과 에너지</div>
      <h1>엔트로피와 비가역</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기">
            <button type="button" data-mode="video">📺 되돌릴 수 없음</button>
            <button type="button" data-mode="box">🧱 경우의 수</button>
            <button type="button" data-mode="heat">🌡️ 엔트로피</button>
            <button type="button" data-mode="apply">🏠 적용</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="되돌릴 수 없는 현상을 엔트로피로 설명하는 화면. 영상을 정방향과 거꾸로 재생해 보고, 칸막이를 열면 퍼지는 분자의 경우의 수를 세고, 열의 이동에서 엔트로피 변화의 합을 계산하고, 냉장고와 열기관 같은 사례에 적용해요."></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <!-- 되돌릴 수 없음 -->
        <div class="control" data-modes="video">
          <div class="control-head"><span>📺 영상 재생 방향</span></div>
          <div class="segmented seg-wrap" id="vDir" role="group" aria-label="재생 방향 고르기">
            <button type="button" data-d="f">▶ 정방향</button><button type="button" data-d="r">◀ 거꾸로</button></div>
          <p class="ctrl-note" id="nVd"></p>
        </div>
        <div class="control" data-modes="video" data-calc="judge">
          <div class="control-head"><span id="jHead">🧐 이 영상을 판정해요</span></div>
          <div class="btn-row"><button class="btn btn-sm" id="bJ1" type="button">⏪ 가역</button><button class="btn btn-sm" id="bJ2" type="button">🚫 비가역</button></div>
          <p class="ctrl-note">거꾸로 틀어도 어색하지 않으면 가역, 어색하면 비가역이에요.</p>
        </div>
        <div class="control" data-modes="video" data-calc="com">
          <div class="control-head"><span>🔎 비가역 현상의 공통점은?</span></div>
          <select class="sel-in" id="sCom" aria-label="비가역 현상의 공통점">
            <option value="">고르세요</option>
            <option value="a">에너지가 새로 생겨요</option>
            <option value="b">입자가 아주 많고, 고르게 퍼지는 쪽으로만 일어나요</option>
            <option value="c">에너지 보존이 깨져요</option>
            <option value="d">진동수가 일정해요</option>
          </select>
        </div>
        <!-- 경우의 수 -->
        <div class="control" data-modes="box">
          <div class="control-head"><label for="sN">⚛️ 분자 수 N</label><output id="oN">10개</output></div>
          <div class="range-row"><input type="range" id="sN" min="2" max="100" step="1" value="10" aria-label="분자 수"></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bOpen" type="button">🚪 칸막이 열기</button><button class="btn btn-sm" id="bFast" type="button">⏩ 빠르게</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="bBoxR" type="button">↺ 모두 왼쪽으로</button></div>
          <p class="ctrl-note" id="nBx"></p>
        </div>
        <div class="control" data-modes="box" data-calc="prob">
          <div class="control-head"><span>📝 모두 왼쪽에 있을 확률</span></div>
          <div class="in-grid">
            <span class="lab">N = 4</span><input class="num-in" id="iP4" type="text" inputmode="decimal" placeholder="예: 1/8" aria-label="분자 4개가 모두 왼쪽에 있을 확률">
            <span class="lab">N = 10</span><input class="num-in" id="iP10" type="text" inputmode="decimal" placeholder="예: 1/8" aria-label="분자 10개가 모두 왼쪽에 있을 확률">
          </div>
        </div>
        <!-- 엔트로피 -->
        <div class="control" data-modes="heat">
          <div class="control-head"><label for="sT1">🌡️ 물체 1의 온도 T₁</label><output id="oT1">600 K</output></div>
          <div class="range-row"><input type="range" id="sT1" min="200" max="800" step="10" value="600" aria-label="물체 1의 온도 (켈빈)"></div>
          <div class="control-head" style="margin-top:6px"><label for="sT2">🌡️ 물체 2의 온도 T₂</label><output id="oT2">300 K</output></div>
          <div class="range-row"><input type="range" id="sT2" min="200" max="800" step="10" value="300" aria-label="물체 2의 온도 (켈빈)"></div>
          <div class="segmented seg-wrap" id="hDir" role="group" aria-label="열이 이동하는 방향" style="margin-top:8px">
            <button type="button" data-d="12">열 600 J: 1 → 2</button><button type="button" data-d="21">열 600 J: 2 → 1</button></div>
        </div>
        <div class="control" data-modes="heat" data-calc="ds">
          <div class="control-head"><span>📝 엔트로피 변화 ΔS (J/K)</span></div>
          <div class="in-grid">
            <span class="lab">열을 잃은 물체</span><input class="num-in" id="iDs1" type="number" inputmode="decimal" step="any" aria-label="열을 잃은 물체의 엔트로피 변화 (줄 매 켈빈)">
            <span class="lab">열을 받은 물체</span><input class="num-in" id="iDs2" type="number" inputmode="decimal" step="any" aria-label="열을 받은 물체의 엔트로피 변화 (줄 매 켈빈)">
            <span class="lab">합</span><input class="num-in" id="iDsT" type="number" inputmode="decimal" step="any" aria-label="두 물체의 엔트로피 변화의 합 (줄 매 켈빈)">
          </div>
        </div>
        <!-- 적용 -->
        <div class="control" data-modes="apply">
          <div class="control-head"><span>🏠 시나리오 판정</span></div>
          <div class="btn-row"><button class="btn btn-sm" id="bApR" type="button">↺ 다시 판정하기</button></div>
          <p class="ctrl-note" id="nAp">카드를 눌러 '엔트로피 증가(일어나요)'와 '일어나지 않아요'를 골라요.</p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
