<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16a34a">
  <title>독립의 법칙 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    /* ---------- 무대 ---------- */
    .stage-card { background: #f3f8ef; }
    .stage-hint { white-space: normal; width: max-content; max-width: calc(100% - 24px); text-align: center; }
    .stage-actions {
      flex: none; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      padding: 8px 12px; border-top: 1px solid var(--line); background: var(--surface);
    }
    .stage-actions .spacer { flex: 1; }
    .stage-actions .btn { min-height: 46px; }
    .btn-cross {
      background: #ec4899; border-color: #ec4899; color: #fff; box-shadow: 0 3px 0 #be185d; padding: 10px 22px;
    }
    .btn-cross:active { box-shadow: 0 1px 0 #be185d; transform: translateY(2px); }
    @media (hover: hover) { .btn-cross:hover { background: #db2777; border-color: #db2777; } }
    .tb-group { display: inline-flex; align-items: center; gap: 8px; }
    .tb-label { font-size: 14px; font-weight: 800; color: var(--muted); }
    #nSeg button { min-width: 50px; min-height: 40px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 16px; }
    .target { animation: tgtPulse 1.1s ease-in-out infinite; }
    .segmented button.target { color: #0b6b39; }
    @keyframes tgtPulse {
      0%, 100% { box-shadow: inset 0 0 0 2px #14a058, 0 0 0 0 rgba(20, 160, 88, 0); }
      50% { box-shadow: inset 0 0 0 2px #14a058, 0 0 0 5px rgba(20, 160, 88, .28); }
    }

    /* ---------- 단계 소개 · 미션 그림 ---------- */
    .step-intro .si-q {
      background: #fff; border: 2px solid color-mix(in srgb, var(--subject) 45%, white); border-radius: 12px;
      padding: 9px 12px; font-weight: 800; font-size: 16px; color: #14532d; margin: 4px 0 8px;
    }
    .fig-peas { display: flex; align-items: center; justify-content: center; gap: 14px; }
    .fig-peas .fp { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
    .fig-peas .fp small { font-size: 13.5px; font-weight: 700; color: var(--muted); }
    .fig-peas .vs { font-size: 24px; font-weight: 800; color: #9aa5b6; }

    /* ---------- 퍼넷 사각형 ---------- */
    #pnCard { transition: box-shadow .25s; }
    #pnCard.pn-target { box-shadow: 0 0 0 3px #14a058, var(--shadow); order: -1; }
    .pn-title { margin-bottom: 6px; }
    .pn-sub { margin-left: auto; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 16px; color: var(--ink); }
    .pn-help { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
    .pn-palette { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
    .pn-pal {
      border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 4px 12px; cursor: pointer;
      font-weight: 800; font-size: 17px; display: inline-flex; gap: 5px; align-items: center; min-height: 46px;
    }
    .pn-pal.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 12%, white); box-shadow: 0 0 0 2px color-mix(in srgb, var(--subject) 25%, transparent); }
    .pn-pal.erase { font-size: 14px; }
    @media (hover: hover) { .pn-pal:hover { background: var(--surface-2); } }
    .pn-grid { display: grid; gap: 6px; }
    .pn-grid.g2 { grid-template-columns: 56px repeat(2, minmax(0, 1fr)); max-width: 420px; }
    .pn-grid.g4 { grid-template-columns: 44px repeat(4, minmax(0, 1fr)); gap: 4px; max-width: 560px; }
    .pn-corner { font-size: 13px; color: var(--muted); display: grid; place-items: center; font-weight: 800; line-height: 1.15; text-align: center; }
    .pn-gam { display: grid; place-items: center; min-height: 42px; }
    .pn-gam > span {
      min-width: 38px; height: 38px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 18px; padding: 0 7px; white-space: nowrap;
    }
    .g4 .pn-gam > span { min-width: 32px; height: 32px; font-size: 14px; padding: 0 5px; }
    .pn-gam.f > span { background: #ffe4ef; border: 2px solid #e0518d; }
    .pn-gam.m > span { background: #e3edff; border: 2px solid #4b7be5; }
    .pn-gam.q > span { background: #f1f3f7; border: 2px dashed #b4bfcf; color: #8a95a6; }
    .pn-cell {
      min-height: 62px; border: 2px dashed #c8d2e0; border-radius: 12px; background: #fafcff;
      display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
      font-weight: 800; font-size: 20px; color: var(--ink); padding: 2px; transition: background .15s, border-color .15s;
    }
    @media (hover: hover) { .pn-cell:hover:not([disabled]) { background: var(--surface-2); border-color: #a9b6c9; } }
    .pn-cell.filled { border-style: solid; border-color: #b9c6d8; background: #fff; }
    .pn-cell.bad { border-color: var(--bad); background: var(--bad-soft); }
    .pn-cell.warn { border-color: var(--warn); background: var(--warn-soft); }
    .pn-cell.good { border-color: var(--good); background: var(--good-soft); }
    .pn-cell[disabled] { cursor: default; color: #9aa5b6; }
    .g4 .pn-cell { min-height: 52px; flex-direction: column; gap: 1px; font-size: 13px; border-style: solid; cursor: default; padding: 3px 1px; }
    .g4 .pn-cell.c-RY { background: #fff7d1; border-color: #f0d36a; }
    .g4 .pn-cell.c-Ry { background: #e9f7dd; border-color: #a8d68a; }
    .g4 .pn-cell.c-rY { background: #fbeccb; border-color: #dcb35e; }
    .g4 .pn-cell.c-ry { background: #dcefd0; border-color: #86b86a; }
    .pn-foot { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .pn-foot .btn { min-height: 44px; }
    .pn-msg { font-size: 14px; font-weight: 700; color: var(--muted); flex-basis: 100%; }
    .pn-msg:empty { display: none; }
    .pn-msg.good { color: #0b6b39; }
    .pn-allele-R { color: #c2410c; }
    .pn-allele-Y { color: #2563eb; }

    /* 세로 태블릿: 퍼넷 사각형이 열리기 전에는 미션 패널을 넓게 */
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col.solo > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .stage-actions { gap: 8px; padding: 8px; }
      .btn-cross { padding: 9px 16px; }
      .pn-grid.g4 { grid-template-columns: 38px repeat(4, minmax(0, 1fr)); }
    }
  </style>
</head>
<body class="sim-page" data-subject="bio">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g3">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중3 · Ⅵ. 생식과 유전</div>
      <h1>독립의 법칙</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-canvas">
          <canvas id="cv" aria-label="두 쌍의 대립 형질 교배 실험대: 씨앗 보관함, 부모 자리, 생식세포, 자손 트레이, 결과 표"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
        <div class="stage-actions">
          <button class="btn btn-cross" id="crossBtn" type="button" data-feature="cross">🌸 교배하기</button>
          <button class="btn" id="selfBtn" type="button" title="한 그루의 완두가 스스로 꽃가루받이를 해요">🌼 자가 수분</button>
          <span class="spacer"></span>
          <div class="tb-group" data-feature="count">
            <span class="tb-label">자손 수</span>
            <div class="segmented" id="nSeg" role="group" aria-label="자손 수">
              <button type="button" data-n="20" class="on">20</button>
              <button type="button" data-n="100">100</button>
              <button type="button" data-n="400">400</button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <aside class="side-col">
      <section class="card" id="game"></section>
      <section class="card card-pad" id="pnCard" data-feature="punnett">
        <div class="card-title pn-title">🧮 퍼넷 사각형 <span class="pn-sub" id="pnSub"></span></div>
        <p class="pn-help" id="pnHelp"></p>
        <div class="pn-palette" id="pnPalette"></div>
        <div class="pn-grid g2" id="pnGrid"></div>
        <div class="pn-foot" id="pnFoot">
          <button class="btn btn-sm btn-primary" id="pnCheck" type="button">✔ 채점하기</button>
          <button class="btn btn-sm" id="pnClear" type="button">지우기</button>
          <div class="pn-msg" id="pnMsg"></div>
        </div>
      </section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
