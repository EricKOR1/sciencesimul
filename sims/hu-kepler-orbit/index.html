<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0ea5e9">
  <title>타원 궤도와 면적 속도 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-hint { bottom: auto; top: 12px; }
    .stage-toolbar { min-height: 58px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; }
    .stage-toolbar .segmented button { min-height: 40px; padding: 5px 10px; font-size: 14px; white-space: nowrap; }
    .stage-toolbar .segmented { flex-wrap: wrap; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard [hidden] { display: none !important; }
    .opt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 4px; }
    .opt-grid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .opt-grid.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .opt-grid.c5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .opt {
      min-height: 46px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px;
      font-weight: 800; font-size: 14.5px; cursor: pointer; padding: 4px 4px; font-family: inherit; line-height: 1.2;
    }
    .opt.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .opt.done { border-color: var(--good); background: var(--good-soft); color: #0b6b39; }
    .opt:disabled { opacity: .5; cursor: not-allowed; }
    .ctrl-note { margin: 6px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
    .btn-sm { min-height: 44px; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .concept table.mini, table.mini { border-collapse: collapse; margin: 6px 0; font-size: 13px; width: 100%; }
    .concept table.mini th, .concept table.mini td, table.mini th, table.mini td { border: 1px solid var(--line); padding: 4px 5px; text-align: center; }
    .concept table.mini th, table.mini th { background: var(--surface-2); font-weight: 800; }
    .num-in { width: 100%; min-height: 46px; border: 2px solid var(--line); border-radius: 10px; font: inherit; font-weight: 800; font-size: 17px; padding: 0 10px; background: var(--surface); color: var(--ink); text-align: center; }
    .num-in:focus { outline: none; border-color: var(--subject); }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .in-row { display: grid; grid-template-columns: 1fr 104px; gap: 8px; align-items: center; margin-top: 6px; font-weight: 800; font-size: 14.5px; line-height: 1.25; }
    .in-row .num-in { min-height: 42px; font-size: 16px; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .src-note { margin: 4px 0 0; font-size: 12.5px; color: #a16207; background: #fff7e0; border: 1px solid #f2d38a; border-radius: 10px; padding: 6px 9px; line-height: 1.4; }
    @media (max-width: 599px) {
      .readout { min-width: 0; }
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar .spacer { display: none; }
      .stage-toolbar .segmented button { padding: 5px 7px; font-size: 13px; }
    }
    input[type=range] { height: 40px; }
    .ticks { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); font-weight: 700; margin-top: -6px; padding: 0 2px; }
  </style>
</head>
<body class="sim-page" data-subject="earth">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hu">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">행성우주과학 · Ⅰ. 우주탐사와 행성계</div>
      <h1>타원 궤도와 면적 속도</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🌀 타원 궤도와 면적 속도</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="group" aria-label="장면 고르기" hidden>
            <button type="button" data-view="grav">☀ 태양의 중력</button>
            <button type="button" data-view="ellipse">📍 타원 궤도</button>
            <button type="button" data-view="area">⏱ 면적 속도</button>
            <button type="button" data-view="comet">☄️ 혜성</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="태양의 중력과 질량 비교 막대, 핀과 줄로 그리는 타원 궤도, 같은 시간 동안 쓸고 가는 부채꼴 넓이, 혜성 궤도가 있어요."></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="grav">
          <div class="control-head"><span>☀ 태양의 중력</span></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bGrav" type="button">☀ 태양 중력 끄기</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="bGReset" type="button">↺ 다시 출발</button></div>
        </div>
        <div class="control" data-modes="grav">
          <div class="control-head"><label for="sVk">➡️ 처음 접선 속도</label><output id="oVk">1.00 ×</output></div>
          <input type="range" id="sVk" min="0.6" max="1" step="0.05" value="1" aria-label="처음 접선 속도 (원 궤도 속력의 0.6배에서 1배)">
          <div class="ticks"><span>0.6 (떨어져요)</span><span>1.0 (원 궤도)</span></div>
        </div>
        <div class="control" data-modes="grav" id="calcRatio" hidden>
          <div class="control-head"><span>🧮 목성 중력 ÷ 태양 중력</span></div>
          <div class="in-row"><span>비 (×10⁻⁵)</span><input class="num-in" id="inRatio" type="text" inputmode="decimal" placeholder="예: 3.2" aria-label="목성의 중력 대 태양의 중력의 비 (10의 마이너스 5제곱 단위)" autocomplete="off"></div>
        </div>

        <div class="control" data-modes="ellipse">
          <div class="control-head"><label for="sA">📏 긴반지름 a</label><output id="oA">2.0 AU</output></div>
          <input type="range" id="sA" min="0.5" max="3" step="0.1" value="2" aria-label="긴반지름 a (0.5에서 3 AU)">
        </div>
        <div class="control" data-modes="ellipse">
          <div class="control-head"><label for="sE">📍 이심률 e = c / a</label><output id="oE">0.30</output></div>
          <input type="range" id="sE" min="0" max="0.9" step="0.01" value="0.3" aria-label="이심률 e (0에서 0.9)">
          <div class="ticks"><span>0 (원)</span><span>0.9 (길쭉)</span></div>
        </div>
        <div class="control" data-modes="ellipse">
          <div class="control-head"><span>🪐 행성의 e로 모양 보기</span></div>
          <div class="opt-grid c4" id="grpPl">
            <button class="opt" type="button" data-k="0">수성</button><button class="opt" type="button" data-k="1">금성</button><button class="opt" type="button" data-k="2">지구</button><button class="opt" type="button" data-k="3">화성</button>
            <button class="opt" type="button" data-k="4">목성</button><button class="opt" type="button" data-k="5">토성</button><button class="opt" type="button" data-k="6">천왕성</button><button class="opt" type="button" data-k="7">해왕성</button>
          </div>
        </div>

        <div class="control" data-modes="area">
          <div class="control-head"><label for="sE3">📍 이심률 e (모형)</label><output id="oE3">0.60</output></div>
          <input type="range" id="sE3" min="0.1" max="0.8" step="0.05" value="0.6" aria-label="이심률 e (0.1에서 0.8)">
        </div>
        <div class="control" data-modes="area">
          <div class="control-head"><span>🎨 한 달(T/12) 동안 쓸고 가는 넓이</span></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bNearP" type="button">🎨 근일점 쪽</button><button class="btn btn-sm btn-primary" id="bFarP" type="button">🎨 원일점 쪽</button></div>
          <div class="btn-row"><button class="btn btn-sm" id="bPaint" type="button">🎨 지금부터 한 달</button><button class="btn btn-sm" id="bPlay3" type="button">⏸ 멈춤</button><button class="btn btn-sm" id="bSecClr" type="button">🗑 지우기</button></div>
        </div>
        <div class="control" data-modes="area" id="calcRV" hidden>
          <div class="control-head"><span>🧮 지구의 r × v (AU·km/s)</span></div>
          <div class="in-row"><span>근일점</span><input class="num-in" id="inPer" type="text" inputmode="decimal" placeholder="예: 10" aria-label="근일점에서의 r 곱하기 v" autocomplete="off"></div>
          <div class="in-row"><span>원일점</span><input class="num-in" id="inAph" type="text" inputmode="decimal" placeholder="예: 10" aria-label="원일점에서의 r 곱하기 v" autocomplete="off"></div>
        </div>

        <div class="control" data-modes="comet">
          <div class="control-head"><label for="sA4">📏 긴반지름 a</label><output id="oA4">17.8 AU</output></div>
          <input type="range" id="sA4" min="1" max="30" step="0.1" value="17.8" aria-label="긴반지름 a (1에서 30 AU)">
        </div>
        <div class="control" data-modes="comet">
          <div class="control-head"><label for="sE4">📍 이심률 e</label><output id="oE4">0.967</output></div>
          <input type="range" id="sE4" min="0" max="0.97" step="0.01" value="0.97" aria-label="이심률 e (0에서 0.97)">
          <div class="btn-row"><button class="btn btn-sm" id="bHalley" type="button">☄️ 핼리 혜성으로</button><button class="btn btn-sm" id="bPlay4" type="button">⏸ 멈춤</button></div>
        </div>
        <div class="control" data-modes="comet">
          <div class="control-head"><span>🔍 보기</span></div>
          <div class="opt-grid" id="grpZoom"><button class="opt" type="button" data-k="a">전체 궤도</button><button class="opt" type="button" data-k="z">태양 가까이 (확대)</button></div>
        </div>
        <div class="control" data-modes="comet" id="calcVq" hidden>
          <div class="control-head"><span>🧮 핼리 혜성의 원일점 속력</span></div>
          <div class="in-row"><span>v원일점 (km/s)</span><input class="num-in" id="inVq" type="text" inputmode="decimal" placeholder="예: 5" aria-label="원일점에서의 속력 (킬로미터 매 초)" autocomplete="off"></div>
        </div>

      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
