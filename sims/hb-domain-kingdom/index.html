<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16a34a">
  <title>3역 6계 분류 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 58px; }
    .stage-toolbar .segmented { flex-wrap: wrap; }
    .stage-toolbar .segmented button { min-height: 40px; padding: 5px 10px; font-size: 14px; white-space: nowrap; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard [hidden] { display: none !important; }
    .btn-sm { min-height: 44px; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .ctrl-note { margin: 6px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
    .ctrl-note b { color: var(--ink); }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .seg-full { display: flex; width: 100%; }
    .seg-full button { flex: 1 1 0; min-width: 0; min-height: 44px; font-size: 14.5px; }
    .chip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    .chip-grid.three { grid-template-columns: 1fr 1fr 1fr; }
    .chip-grid button { min-height: 44px; padding: 6px 8px; border: 2px solid var(--line); background: #fff; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; color: var(--ink); text-align: center; }
    .chip-grid button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); }
    .chip-grid button.seen:not(.on) { border-color: color-mix(in srgb, var(--subject) 45%, white); }
    .chip-grid button:disabled { opacity: .45; cursor: not-allowed; }
    .chip-grid button:active { transform: scale(.98); }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .num-in { width: 100%; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 16px ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: #fff; text-align: right; }
    .num-in:focus { outline: none; border-color: var(--subject); }
    .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .in-unit { font-size: 12.5px; color: var(--muted); font-weight: 700; }
    .in-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; align-items: end; margin-top: 8px; }
    .in-row .lab { font-weight: 800; font-size: 13.5px; margin-bottom: 3px; line-height: 1.25; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    .pk-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .pk-item { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; color: var(--ink); }
    .pk-item:disabled { opacity: .35; cursor: default; }
    .pk-seq { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 46px; border: 2px dashed var(--line); border-radius: 12px; padding: 6px; }
    .pk-chip { min-height: 34px; padding: 3px 10px; border: 2px solid var(--subject); background: color-mix(in srgb, var(--subject) 12%, white); border-radius: 999px; font-weight: 800; font-size: 13.5px; cursor: pointer; color: var(--ink); }
    .pk-chip b { color: var(--subject); margin-right: 2px; }
    .pk-reset { margin-top: 8px; width: 100%; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 6px; }
    .tbl th, .tbl td { border: 1px solid var(--line); padding: 4px 4px; text-align: center; }
    .tbl th { background: var(--surface-2); font-weight: 800; }
    .tbl td.rowh { font-weight: 800; text-align: left; background: var(--surface-2); }
    .tbl select { width: 100%; min-height: 40px; border: 2px solid var(--line); border-radius: 8px; font: 800 13.5px var(--font); background: #fff; color: var(--ink); }
    .tbl select.ok { border-color: var(--good); background: var(--good-soft); }
    .tbl select.bad { border-color: var(--bad); background: var(--bad-soft); }
    .check-list { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; font-weight: 700; }
    .check-list li { display: flex; gap: 6px; align-items: baseline; }
    .check-list li.on { color: var(--good); }
    .btn-col { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    #modeSeg button.lv-off { display: none; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (max-width: 599px) {
      .readout .value { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar .segmented button { padding: 5px 8px; font-size: 13.5px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }

    .crit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    .crit-grid button { min-height: 44px; padding: 5px 8px; border: 2px solid var(--line); background: #fff; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; color: var(--ink); line-height: 1.2; position: relative; }
    .crit-grid button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 16%, white); }
    .crit-grid button .ord { display: inline-block; min-width: 20px; height: 20px; line-height: 20px; border-radius: 50%; background: var(--subject); color: #fff; font-size: 12px; margin-right: 4px; }
    .crit-grid button.poor { border-style: dashed; }
    .seg6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-top: 6px; }
    .seg6 button { min-height: 44px; padding: 4px 2px; border: 2px solid var(--line); background: #fff; border-radius: 12px; font-weight: 800; font-size: 13px; cursor: pointer; color: var(--ink); }
    .seg6 button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 16%, white); }
    .seg6 button.ok { border-color: var(--good); }
    .grp-legend { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; font-weight: 800; }
    .grp-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
    .sel-row { margin-top: 8px; }
    .sel-row:first-of-type { margin-top: 4px; }
    .sel-row .q { font-weight: 800; font-size: 13.5px; margin-bottom: 3px; line-height: 1.3; }
    </style>
</head>
<body class="sim-page" data-subject="bio">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hb">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">생명과학 · Ⅲ. 생명의 연속성과 다양성</div>
      <h1>3역 6계 분류</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🗂️ 분류 기준에 따라 묶기</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기">
            <button type="button" data-mode="crit" data-lv="1" data-feature="crit">🗂️ 기준 묶기</button>
            <button type="button" data-mode="rrna" data-lv="2" data-feature="rrna">🧬 서열 표</button>
            <button type="button" data-mode="dtable" data-lv="2" data-feature="dtable">📋 3역 비교</button>
            <button type="button" data-mode="six" data-lv="3" data-feature="six">🌳 6계 흐름도</button>
            <button type="button" data-mode="apply" data-lv="4" data-feature="apply">🔎 분류하기</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="생물 카드 16장을 핵막, 세포 수, 세포벽, 영양 방식 기준으로 묶는 판, 가상 rRNA 염기 서열 차이 표와 3역 비교표, 6계 분류 흐름도와 카드 놓기, 미지의 생물 6종의 역과 계 정하기"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="crit">
          <div class="control-head"><span>🗂️ 분류 기준 고르기 (최대 2개)</span></div>
          <div class="crit-grid" id="critGrid"></div>
          <p class="ctrl-note" id="critNote">기준을 누르는 순서가 ①, ②예요. 눌렀던 기준을 다시 누르면 빠져요.</p>
        </div>
        <div class="control" data-modes="rrna">
          <div class="control-head"><span>🎨 집단 색칠하기</span></div>
          <p class="ctrl-note">오른쪽(또는 아래) 서열 목록의 <b>줄을 눌러</b> 집단 색을 바꿔요. 표에서 <b>차이가 작은 것끼리</b> 같은 색으로 묶어요.</p>
          <div class="grp-legend"><span><i style="background:#cbd5e1"></i>미정</span><span><i style="background:#f97316"></i>집단 1</span><span><i style="background:#0ea5e9"></i>집단 2</span><span><i style="background:#22c55e"></i>집단 3</span></div>
          <p class="ctrl-note" id="rnNote"></p>
        </div>
        <div class="control" data-modes="dtable"><div class="control-head"><span>📋 비교표 채우기</span></div><p class="ctrl-note">그림의 칸을 눌러 알맞은 내용으로 바꿔요. 칸을 누를 때마다 보기가 차례로 바뀌어요.</p><p class="ctrl-note" id="dtNote"></p></div>
        <div class="control" data-modes="six">
          <div class="control-head"><span>🌳 흐름도</span></div>
          <p class="ctrl-note" id="sixNote"></p>
        </div>
        <div class="control" data-modes="apply">
          <div class="control-head"><span>🔎 미지의 생물 고르기</span></div>
          <div class="seg6" id="apCases"><button type="button" data-c="0">1</button><button type="button" data-c="1">2</button><button type="button" data-c="2">3</button><button type="button" data-c="3">4</button><button type="button" data-c="4">5</button><button type="button" data-c="5">6</button></div>
          <div id="apSels"></div>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
