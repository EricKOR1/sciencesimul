<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#8b5cf6">
  <title>일상과 산업의 화학 평형 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏭</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; line-height: 1.4; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .nudge:disabled { opacity: .4; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { flex: 1 1 auto; min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .chips button.done { border-color: var(--good); background: var(--good-soft); }
    .chips button.done.on { background: color-mix(in srgb, var(--good) 22%, white); }
    .coef-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
    .coef-row .nm { flex: 1; min-width: 0; font-weight: 800; font-size: 16px; }
    .coef-row .num { min-width: 26px; text-align: center; font: 800 20px ui-monospace, Menlo, Consolas, monospace; }
    .coef-row .nudge { width: 44px; height: 44px; }
    .coef-row .st-btn { flex: none; width: 58px; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; background: #fff; font: 800 15px var(--font); color: var(--ink); cursor: pointer; }
    .coef-row .st-btn.set { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 12%, white); }
    .coef-row .st-btn.okst { border-color: var(--good); background: var(--good-soft); }
    .coef-row.shake { animation: shakeX .38s; }
    .in-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .in-row label { flex: 1; font-weight: 800; font-size: 14.5px; line-height: 1.25; }
    .in-row input { width: 96px; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font: 800 16px var(--font); color: var(--ink); background: #fff; text-align: right; }
    .in-row input.ok { border-color: var(--good); background: var(--good-soft); }
    .in-row input.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .in-row span.u { width: 34px; font-weight: 800; color: var(--muted); font-size: 14px; }
    .sentence { font-weight: 800; font-size: 14.5px; line-height: 2.5; margin-top: 6px; }
    .sentence input { width: 66px; min-height: 40px; border: 2px solid var(--line); border-radius: 10px; padding: 2px 8px; font: 800 16px var(--font); color: var(--ink); background: #fff; text-align: right; }
    .sentence input.ok { border-color: var(--good); background: var(--good-soft); }
    .sentence input.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .calc-prompt { font-weight: 800; font-size: 15px; line-height: 1.5; margin: 4px 0 6px; }
    .calc-prompt .k { color: var(--subject); }
    .calc-done { background: var(--good-soft); border-radius: 12px; padding: 8px 12px; font-weight: 800; font-size: 14.5px; line-height: 1.5; color: #0b6b39; }
    .in-row.big input { width: 120px; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 16px; white-space: normal; line-height: 1.25; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 14px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .segmented button { padding-left: 8px; padding-right: 8px; font-size: 13.5px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; white-space: normal; }
    }
  
    .chips.small button { min-height: 44px; padding: 4px 10px; font-size: 14px; }
    .chips button:disabled { opacity: .45; cursor: default; }
    .chips button.vd-fwd.on { border-color: #14a058; background: #e4f6ec; color: #0b6b39; }
    .chips button.vd-rev.on { border-color: #e2464b; background: #fdeaea; color: #a3262b; }
    .chips button.vd-eq.on { border-color: #3867f4; background: #e8eefe; color: #2447b8; }
    .val-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .val-row .nm { width: 66px; font-weight: 800; font-size: 14.5px; }
    .val-row output { min-width: 52px; white-space: nowrap; text-align: right; font: 800 14.5px ui-monospace, Menlo, Consolas, monospace; }
    .ctrl-sub { font-weight: 800; font-size: 14px; color: var(--muted); margin: 8px 0 0; }
    .chk { display: flex; align-items: flex-start; gap: 8px; min-height: 44px; font-weight: 800; font-size: 14.5px; line-height: 1.35; padding: 6px 0; cursor: pointer; }
    .chk input { width: 22px; height: 22px; margin-top: 1px; flex: none; }
    .txt-area { width: 100%; min-height: 84px; border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; font: 700 15px var(--font); color: var(--ink); background: #fff; resize: vertical; box-sizing: border-box; }
    .opt-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .opt-list button { text-align: left; width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; background: #fff; padding: 8px 10px; font: 800 14px var(--font); color: var(--ink); line-height: 1.3; cursor: pointer; }
    .opt-list button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 12%, white); }
    .opt-list button.done { border-color: var(--good); background: var(--good-soft); }
    .opt-list button:disabled { cursor: default; }
    .sel-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .sel-row label { flex: 0 0 auto; font-weight: 800; font-size: 14.5px; max-width: 46%; line-height: 1.25; }
    .sel-row .sel-in { flex: 1; min-width: 0; }
  </style>
</head>
<body class="sim-page" data-subject="chem">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hc">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">화학 · Ⅲ. 화학 평형</div>
      <h1>일상과 산업의 화학 평형</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🍾 탄산음료</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기">
            <button type="button" data-mode="soda" data-feature="soda">🍾 탄산음료</button>
            <button type="button" data-mode="blood" data-feature="blood">🩸 산소 운반</button>
            <button type="button" data-mode="haber" data-feature="haber">🏭 암모니아</button>
            <button type="button" data-mode="cases" data-feature="cases">🃏 사례 조사</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="탄산음료 병 속 이산화 탄소, 헤모글로빈의 산소 결합, 암모니아 공장 모형, 화학 평형 사례 카드"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <!-- 탄산음료 -->
        <div class="control" data-modes="soda">
          <div class="control-head"><span>🍾 음료 병</span></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bCap" type="button">🔓 뚜껑 열기</button><button class="btn btn-sm" id="bNew" type="button">🍾 새 병 (닫힘)</button></div>
          <div class="control-head" style="margin-top:12px"><span>🌡️ 보관 온도</span></div>
          <div class="chips small" id="tChips" role="group" aria-label="보관 온도 고르기"></div>
        </div>
        <div class="control" data-modes="soda" data-gate="sdir">
          <div class="control-head"><span>📝 평형 이동 방향 표시</span></div>
          <p class="ctrl-sub">CO₂(g) ⇌ CO₂(aq) 에서 정반응 = 녹아 들어감, 역반응 = 기체로 나옴</p>
          <div class="sel-row"><label for="sd1">뚜껑을 열면 (압력↓)</label><select class="sel-in" id="sd1"></select></div>
          <div class="sel-row"><label for="sd2">온도를 높이면</label><select class="sel-in" id="sd2"></select></div>
        </div>

        <!-- 산소 운반 -->
        <div class="control" data-modes="blood">
          <div class="control-head"><span>🩸 산소 분압 P(O₂)</span><output id="oP2">100 mmHg</output></div>
          <div class="range-row"><button class="nudge" id="pMinus" type="button" aria-label="분압 5 줄이기">−</button><input type="range" id="pRange" min="10" max="120" step="5" value="100" aria-label="산소 분압"><button class="nudge" id="pPlus" type="button" aria-label="분압 5 늘리기">+</button></div>
          <div class="chips small" id="pChips" role="group" aria-label="장소 고르기"></div>
        </div>

        <!-- 암모니아 -->
        <div class="control" data-modes="haber">
          <div class="control-head"><span>🏭 반응 조건</span></div>
          <div class="val-row"><span class="nm">온도</span><input type="range" id="hT" min="200" max="500" step="100" value="400" aria-label="온도"><output id="oHT">400 °C</output></div>
          <div class="val-row"><span class="nm">압력</span><input type="range" id="hP" min="100" max="300" step="100" value="200" aria-label="압력"><output id="oHP">200기압</output></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bSep" type="button">❄️ 액화 분리 장치 켜기</button><button class="btn btn-sm" id="bHReset" type="button">↺ 처음부터</button></div>
        </div>
        <div class="control" data-modes="haber" data-gate="why">
          <div class="control-head"><span>📝 실제 공장 조건을 택하는 이유</span></div>
          <label class="chk"><input type="checkbox" id="w1"><span>낮은 온도에서는 반응이 너무 느려서, 철 촉매와 약 400~500 °C를 써요</span></label>
          <label class="chk"><input type="checkbox" id="w2"><span>압력을 더 높이면 수득률은 오르지만 설비 비용과 안전 부담이 커서 200~300기압을 써요</span></label>
          <label class="chk"><input type="checkbox" id="w3"><span>온도가 높을수록 평형 수득률이 높기 때문이에요</span></label>
          <label class="chk"><input type="checkbox" id="w4"><span>촉매를 쓰면 평형 수득률이 올라가기 때문이에요</span></label>
        </div>

        <!-- 사례 조사 -->
        <div class="control" data-modes="cases">
          <div class="control-head"><span id="cHead">🃏 사례 카드를 골라요</span></div>
          <p class="ctrl-sub">② 바꾼 조건</p><div class="opt-list" id="cCond" role="group" aria-label="바꾼 조건 고르기"></div>
          <p class="ctrl-sub">③ 이동 방향</p><div class="chips small" id="cDir" role="group" aria-label="이동 방향 고르기"></div>
          <div class="btn-row"><button class="btn btn-sm btn-primary" id="bCard" type="button">✔ 카드 정리하기</button></div>
          <p class="ctrl-note" id="cNote">그림에서 카드를 눌러 골라요.</p>
        </div>
        <div class="control" data-modes="cases" data-gate="write">
          <div class="control-head"><span>✍️ 이동 방향 설명 쓰기</span></div>
          <textarea class="txt-area" id="wText" placeholder="예) 산소 분압이 낮아지면 역반응이 일어나 …" aria-label="이동 방향 설명"></textarea>
        </div>

      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
