<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0ea5e9">
  <title>기권의 층 구조 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-card { background: #0a1330; }
    /* 태블릿: 가로 배치 캔버스 · 휴대폰: 세로 배치 캔버스 */
    .sc-tall { display: none; }
    @media (max-width: 599px) { .sc-wide { display: none; } .sc-tall { display: block; } }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    .is-off { display: none !important; }
    .seg-label { display: block; font-weight: 800; font-size: 14.5px; color: var(--muted); margin-bottom: 6px; }
    .segmented { display: flex; width: 100%; border-radius: 22px; }
    .segmented button { flex: 1 1 auto; min-height: 44px; padding: 6px 6px; font-size: 14px; white-space: nowrap; }
    .segmented button.on { color: #075985; }
    .play-row { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; }
    .play-row .btn { flex: 1 1 130px; }
    .ctrl-note { margin: 6px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
    .btn-sm { min-height: 44px; }
    .btn.on-state { background: #0f766e; border-color: #0f766e; color: #fff; box-shadow: 0 3px 0 #0a4f49; }
    input[type=range] { height: 44px; }
    .game-foot button { min-height: 44px; }
    .mission-figure svg { border-radius: 12px; max-width: 100%; height: auto; }
    .note-fig { margin: 6px 0; text-align: center; }
    .note-fig svg { max-width: 100%; height: auto; border-radius: 10px; }
    .cmp { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0; }
    .cmp th, .cmp td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
    .cmp th { background: var(--surface-2); font-weight: 800; }

  </style>
</head>
<body class="sim-page" data-subject="earth">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g3">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중3 · Ⅱ. 날씨와 기후변화</div>
      <h1>기권의 층 구조</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-canvas sc-wide"><canvas id="cvWide" aria-label="높이에 따른 기온을 측정해 그래프로 나타내고 기권을 네 권역으로 나누는 화면"></canvas></div>
        <div class="stage-canvas sc-tall"><canvas id="cvTall" aria-label="높이에 따른 기온을 측정해 그래프로 나타내고 기권을 네 권역으로 나누는 화면"></canvas></div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label">기구의 높이</span><span class="value" id="rH">0.0<small>km</small></span></div>
        <div class="readout"><span class="label">그 높이의 기온</span><span class="value" id="rT">15<small>°C</small></span></div>
        <div class="readout"><span class="label">기구의 부피</span><span class="value" id="rV">1.0<small>배</small></span></div>
      </div>

    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-feature="alt">
          <div class="control-head"><label for="sAlt">🎈 기구 높이</label><output id="oAlt">0 km</output></div>
          <input type="range" id="sAlt" min="0" max="12" step="0.1" value="0" aria-label="기구 높이">
        </div>
        <div class="control play-row" data-feature="alt">
          <button class="btn btn-sm" id="autoBtn" type="button">🎈 올라가기</button>
          <button class="btn btn-sm btn-primary" id="recBtn" type="button" data-feature="rec">📍 기온 기록하기</button>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
