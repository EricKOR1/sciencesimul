<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f26b3a">
  <title>트랜지스터 회로 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📢</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; }
    .stage-toolbar { min-height: 61px; }
    .segmented button { min-height: 44px; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #ctrlCard { display: flex; flex-direction: column; gap: 14px; }
    #ctrlCard .control { margin: 0; }
    #ctrlCard .btn-sm { min-height: 44px; }
    #ctrlCard [hidden] { display: none !important; }
    .ctrl-note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
    .view-seg { display: flex; width: 100%; }
    .view-seg button { flex: 1 1 0; min-width: 0; padding-left: 4px; padding-right: 4px; font-size: 14.5px; }
    .seg-wrap { display: flex; flex-wrap: wrap; width: 100%; }
    .seg-wrap button { flex: 1 1 44%; min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 14.5px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    .range-row input[type=range] { flex: 1; min-width: 0; height: 44px; }
    .nudge { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 900; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .nudge:active { transform: scale(.94); background: var(--surface-2); }
    .nudge:disabled { opacity: .4; }
    .sel-in { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 14.5px var(--font); color: var(--ink); background: #fff; }
    .sel-in.ok, .num-in.ok { border-color: var(--good); background: var(--good-soft); }
    .sel-in.bad, .num-in.bad { border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    .sel-row { margin-top: 8px; }
    .sel-row .q { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.25; }
    .numrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .numrow .q { flex: 1 1 100%; font-weight: 800; font-size: 14px; line-height: 1.3; margin-bottom: 2px; }
    .numrow .pre, .numrow .unit { font-weight: 800; font-size: 15px; }
    .num-in { width: 84px; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; font: 800 16px var(--font); color: var(--ink); background: #fff; text-align: right; }
    select.num-in { width: auto; text-align: left; padding-right: 4px; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chips button { min-height: 44px; padding: 6px 12px; border: 2px solid var(--line); background: #fff; border-radius: 999px; font-weight: 800; font-size: 14.5px; cursor: pointer; color: var(--ink); }
    .chips button.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .chips button:disabled { opacity: .45; cursor: not-allowed; }
    @media (max-width: 1100px) and (orientation: landscape) { .toolbar-label { display: none; } }
    @media (orientation: portrait) and (min-width: 600px) {
      .side-col:has(> #ctrlCard[hidden]) > #game { grid-column: 1 / -1; }
    }
    @media (max-width: 599px) {
      .readout .value.txt { font-size: 15px; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .spacer, .toolbar-label { display: none; }
      .stage-toolbar:has(> .segmented[hidden]) { display: none; }
      .segmented button { padding-left: 10px; padding-right: 10px; font-size: 14px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
    .tt { width: 100%; border-collapse: collapse; margin-top: 6px; }
    .tt th { font-size: 13px; color: var(--muted); font-weight: 800; padding: 2px 3px; }
    .tt td { text-align: center; font-weight: 800; padding: 3px; font-size: 15px; }
    .tt select.sel-in { min-height: 44px; font-size: 14px; padding: 2px 4px; }
    .tt-title { font-weight: 800; font-size: 14px; line-height: 1.3; }
  </style>
</head>
<body class="sim-page" data-subject="phy">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hq">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">전자기와 양자 · Ⅰ. 전자기적 상호작용</div>
      <h1>트랜지스터 회로</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🔌 스위치</span>
          <span class="spacer"></span>
          <div class="segmented" id="modeSeg" role="tablist" aria-label="화면 고르기" data-feature="amp">
            <button type="button" data-mode="sw" data-feature="sw">🔌 스위치</button><button type="button" data-mode="amp" data-feature="amp">📈 증폭</button><button type="button" data-mode="snd" data-feature="snd">📢 소리 증폭</button><button type="button" data-mode="logic" data-feature="logic">🧮 논리회로</button>
          </div>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="작은 신호로 큰 전류를 조절하는 트랜지스터를 스위치와 증폭기로 쓰고, 스피커 소리 증폭과 기초 논리회로를 분석하는 화면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts">
        <div class="readout"><span class="label" id="l1">—</span><span class="value txt" id="v1">—</span></div>
        <div class="readout"><span class="label" id="l2">—</span><span class="value txt" id="v2">—</span></div>
        <div class="readout"><span class="label" id="l3">—</span><span class="value txt" id="v3">—</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="control" data-modes="sw">
          <div class="control-head"><span>🔧 고르기</span></div>
          <div class="segmented view-seg" id="swSeg" role="group" aria-label="🔧 고르기"><button type="button" data-v="vin">🎚 입력 전압</button><button type="button" data-v="cds">🌙 자동 가로등</button></div>
        </div>
        <div class="control" data-modes="sw" data-sub="vin">
          <div class="control-head"><label for="sVin">🎚 입력 전압 V_in</label><output id="osVin"></output></div><div class="range-row"><button class="nudge" id="sVinM" type="button" aria-label="입력 전압 0볼트부터 5볼트 줄이기">−</button><input type="range" id="sVin" min="0" max="50" step="1" value="0" aria-label="입력 전압 0볼트부터 5볼트"><button class="nudge" id="sVinP" type="button" aria-label="입력 전압 0볼트부터 5볼트 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="sw" data-sub="cds">
          <div class="control-head"><label for="sBr">☀️ 주변 밝기 (0 깜깜 ~ 10 한낮)</label><output id="osBr"></output></div><div class="range-row"><button class="nudge" id="sBrM" type="button" aria-label="주변 밝기 0단계부터 10단계 줄이기">−</button><input type="range" id="sBr" min="0" max="10" step="1" value="10" aria-label="주변 밝기 0단계부터 10단계"><button class="nudge" id="sBrP" type="button" aria-label="주변 밝기 0단계부터 10단계 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="sw" data-gate="mw2" id="numWHost"></div>
        <div class="control" data-modes="amp" data-gate-off="ma2">
          <div class="control-head"><label for="sBias">⚙️ 바이어스 I_C0</label><output id="osBias"></output></div><div class="range-row"><button class="nudge" id="sBiasM" type="button" aria-label="바이어스 컬렉터 전류 0밀리암페어부터 4밀리암페어 줄이기">−</button><input type="range" id="sBias" min="0" max="8" step="1" value="4" aria-label="바이어스 컬렉터 전류 0밀리암페어부터 4밀리암페어"><button class="nudge" id="sBiasP" type="button" aria-label="바이어스 컬렉터 전류 0밀리암페어부터 4밀리암페어 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="amp" data-gate-off="ma2">
          <div class="control-head"><span>🎤 입력 신호 크기 (± μA)</span></div>
          <div class="segmented view-seg" id="aSeg" role="group" aria-label="🎤 입력 신호 크기 (± μA)"><button type="button" data-v="5">± 5</button><button type="button" data-v="10">± 10</button><button type="button" data-v="20">± 20</button><button type="button" data-v="30">± 30</button></div>
        </div>
        <div class="control" data-modes="amp" data-gate="ma2" id="numAHost"></div>
        <div class="control" data-modes="snd">
          <div class="control-head"><label for="sVoice">🎤 목소리 크기 (± μA)</label><output id="osVoice"></output></div><div class="range-row"><button class="nudge" id="sVoiceM" type="button" aria-label="마이크 목소리 크기 5마이크로암페어부터 30마이크로암페어 줄이기">−</button><input type="range" id="sVoice" min="1" max="6" step="1" value="2" aria-label="마이크 목소리 크기 5마이크로암페어부터 30마이크로암페어"><button class="nudge" id="sVoiceP" type="button" aria-label="마이크 목소리 크기 5마이크로암페어부터 30마이크로암페어 늘리기">+</button></div>
        </div>
        <div class="control" data-modes="snd"><div class="btn-row"><button class="btn btn-sm" id="bAm1" type="button">1단 증폭기: 켜짐</button><button class="btn btn-sm" id="bAm2" type="button">2단 증폭기: 켜짐</button></div><div class="btn-row"><button class="btn btn-sm" id="bClr" type="button">🧹 배선 지우기</button></div><p class="ctrl-note">증폭기 그림을 눌러도 켜고 끌 수 있어요.</p></div>
        <div class="control" data-modes="logic" data-gate-off="mg2 mg3 mg4">
          <div class="control-head"><span>🔧 고르기</span></div>
          <div class="segmented seg-wrap" id="lgSeg" role="group" aria-label="🔧 고르기"><button type="button" data-v="inv">🔌 트랜지스터 게이트</button><button type="button" data-v="nand">🧱 NAND로 만들기</button><button type="button" data-v="half">➕ 반가산기</button></div>
        </div>
        <div class="control" data-modes="logic" data-sub="inv" data-gate-off="mg3 mg4">
          <div class="control-head"><span>🔌 게이트 종류</span></div>
          <div class="segmented view-seg" id="gtSeg" role="group" aria-label="🔌 게이트 종류"><button type="button" data-v="not">NOT</button><button type="button" data-v="nand">NAND</button><button type="button" data-v="nor">NOR</button></div>
        </div>
        <div class="control" data-modes="logic" data-sub="nand" data-gate-off="mg2 mg3 mg4">
          <div class="control-head"><span>🧱 만들 게이트</span></div>
          <div class="segmented view-seg" id="nbSeg" role="group" aria-label="🧱 만들 게이트"><button type="button" data-v="not">NOT 만들기</button><button type="button" data-v="and">AND 만들기</button></div>
        </div>
        <div class="control" data-modes="logic" data-gate-off="mg4"><div class="control-head"><span>🎚 입력 스위치 (눌러서 바꿔요)</span></div><div class="btn-row"><button class="btn btn-sm" id="bInA" type="button">A: LOW</button><button class="btn btn-sm" id="bInB" type="button">B: LOW</button></div></div>
        <div class="control" data-modes="logic" data-gate="mg2" id="tblHost"></div>
        <div class="control" data-modes="logic" data-gate="mg3" id="selHHost"></div>
        <div class="control" data-modes="logic" data-gate="mg4" id="selGHost"></div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
