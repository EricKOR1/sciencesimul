<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#64748b">
  <title>과학 관련 직업과 미래 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-toolbar { min-height: 61px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .tb-group { display: inline-flex; align-items: center; gap: 6px; }
    .tb-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px;
      border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px;
      padding: 6px 14px; font-weight: 800; font-size: 15px; cursor: pointer; user-select: none; -webkit-user-select: none;
      transition: transform .08s ease, background .15s, border-color .15s, opacity .15s;
    }
    .tb-btn:active:not([disabled]) { transform: scale(.95); }
    .tb-btn[disabled] { opacity: .4; cursor: not-allowed; }
    .tb-btn.primary { background: var(--subject); border-color: var(--subject); color: #fff; box-shadow: 0 3px 0 color-mix(in srgb, var(--subject) 70%, black); }
    .tb-btn.round { padding: 0; width: 46px; font-size: 18px; }
    @media (hover: hover) { .tb-btn:hover:not([disabled]) { border-color: #c4cfdf; } .tb-btn.primary:hover:not([disabled]) { background: color-mix(in srgb, var(--subject) 88%, black); } }
    #ctrlCard { display: flex; flex-direction: column; gap: 10px; }
    .ctrl-title { font-weight: 800; font-size: 15px; color: var(--muted); }
    .scene-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .scene-grid button {
      min-height: 48px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); cursor: pointer;
      font-weight: 800; font-size: 15px; color: var(--muted); padding: 6px 8px;
    }
    .scene-grid button.on { border-color: var(--subject); color: var(--ink); background: color-mix(in srgb, var(--subject) 10%, white); }
    .ctrl-note { font-size: 13.5px; color: var(--muted); margin: 0; }
    .mission-figure .fig-row { font-size: 38px; line-height: 1.2; }
    .name-input { min-height: 44px; border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; font: inherit; font-weight: 800; font-size: 15px; width: 190px; max-width: 46vw; background: var(--surface); color: var(--ink); }
    .name-input:focus { outline: none; border-color: var(--subject); }
    .stage-hint { bottom: auto; top: 10px; }
    @media (max-width: 599px) {
      .stage-toolbar { min-height: 0; }
      .tb-btn { padding: 6px 12px; font-size: 14px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="sci">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g3">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중3 · Ⅷ. 과학과 나의 미래</div>
      <h1>과학 관련 직업과 미래</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="sceneLabel">📖 과학 직업 도감</span>
          <span class="spacer"></span>
          <button class="tb-btn" id="tbReset" type="button" hidden>↺ 처음부터</button>
          <input class="name-input" id="jobName" type="text" maxlength="14" placeholder="직업 이름 짓기 (선택)" autocomplete="off" aria-label="직업 이름 짓기" hidden>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="과학 직업 카드 도감, 직업과 과학 개념 연결, 미래 도시, 직업 변화 분류, 미래 직업 카드를 보여 주는 실험 화면"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard" hidden>
        <div class="ctrl-title">🔓 자유 탐구 · 장면 고르기</div>
        <div class="scene-grid" id="sceneGrid">
          <button type="button" data-scene="dex">📖 직업 도감</button>
          <button type="button" data-scene="link">🔗 직업-과학</button>
          <button type="button" data-scene="city">🏙️ 미래 도시</button>
          <button type="button" data-scene="sort">🗂️ 직업 변화</button>
          <button type="button" data-scene="design">🪪 직업 카드</button>
        </div>
        <p class="ctrl-note">모든 장면을 자유롭게 오가며 다시 살펴보세요.</p>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
