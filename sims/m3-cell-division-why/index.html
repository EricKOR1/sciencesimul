<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16a34a">
  <title>세포분열이 필요한 까닭 | 중학 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧫</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-card { background: #eef6f1; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; }
    .stage-toolbar { min-height: 56px; }
    #resetBtn { font-size: 20px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 10px; }
    .ctrl-set { display: flex; flex-direction: column; gap: 10px; }
    .ctrl-set[hidden] { display: none; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1 1 0; min-width: 0; min-height: 50px; font-size: 16px; }
    .ctrl-note { font-size: 13.5px; color: var(--muted); margin: 0; }
    .ctrl-set .segmented { align-self: stretch; }
    .ctrl-set .segmented button { flex: 1 1 0; min-height: 44px; font-size: 15px; }
    .target { animation: tgtPulse 1.1s ease-in-out infinite; }
    @keyframes tgtPulse {
      0%, 100% { box-shadow: 0 3px 0 rgba(0,0,0,.18), 0 0 0 0 rgba(20, 160, 88, 0); }
      50% { box-shadow: 0 3px 0 rgba(0,0,0,.18), 0 0 0 6px rgba(20, 160, 88, .32); }
    }
    .stage-hint { white-space: normal; width: max-content; max-width: calc(100% - 24px); text-align: center; }

    /* 단계 소개 */
    .step-intro .si-q {
      background: #fff; border: 2px solid color-mix(in srgb, var(--subject) 45%, white); border-radius: 12px;
      padding: 9px 12px; font-weight: 800; font-size: 16px; color: #14532d; margin: 4px 0 8px;
    }
    .si-safe { font-size: 14px; background: #fff7e0; border: 1px solid #f3d98a; border-radius: 10px; padding: 6px 10px; color: #7a5200; }

    /* 표 (정육면체의 표면적과 부피) */
    .data-card { flex: none; padding: 8px 12px; display: flex; align-items: center; gap: 12px; }
    .data-card[hidden] { display: none; }
    .data-head { flex: none; display: flex; flex-direction: column; gap: 2px; font-size: 14.5px; line-height: 1.25; }
    .data-head .n { font-size: 12.5px; color: var(--muted); font-weight: 700; }
    .data-scroll { flex: 1; min-width: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .vtable { border-collapse: separate; border-spacing: 4px 3px; width: 100%; font-size: 14.5px; }
    .vtable th { text-align: left; white-space: nowrap; padding: 2px 8px 2px 2px; color: var(--muted); font-weight: 800; font-size: 13.5px; }
    .vtable thead th { text-align: center; color: var(--ink); }
    .vtable td { text-align: center; padding: 0; min-width: 62px; }
    .vtable .given { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 800; color: var(--ink); background: var(--surface-2); border-radius: 10px; height: 38px; line-height: 38px; }
    .vtable input {
      width: 100%; min-width: 0; height: 38px; border: 2px dashed #b4bfcf; border-radius: 10px; background: #fff; text-align: center;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 800; font-size: 17px; color: var(--ink); padding: 0 4px;
    }
    .vtable input:focus { outline: none; border-style: solid; border-color: var(--subject); box-shadow: 0 0 0 3px color-mix(in srgb, var(--subject) 22%, transparent); }
    .vtable input.ok { border-style: solid; border-color: var(--good); background: var(--good-soft); color: #0b6b39; }
    .vtable input.bad { border-style: solid; border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    @media (max-width: 599px) {
      .data-card { flex-direction: column; align-items: stretch; gap: 4px; }
      .data-head { flex-direction: row; gap: 8px; align-items: baseline; }
      .vtable td { min-width: 52px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="bio">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#g3">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">중3 · Ⅵ. 생식과 유전</div>
      <h1>세포분열이 필요한 까닭</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">🧫 우무 정육면체 실험</span>
          <span class="spacer"></span>
          <button class="icon-btn" id="resetBtn" type="button" title="처음 상태로" aria-label="처음 상태로">↺</button>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="우무 정육면체에 색이 스며드는 실험, 세포 크기 모형, 생쥐와 코끼리의 세포 비교"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts" id="readouts">
        <div class="readout"><span class="label" id="roL1">-</span><span class="value" id="roV1">-</span></div>
        <div class="readout"><span class="label" id="roL2">-</span><span class="value" id="roV2">-</span></div>
        <div class="readout"><span class="label" id="roL3">-</span><span class="value" id="roV3">-</span></div>
      </div>
      <section class="card data-card" id="tableCard" hidden>
        <div class="data-head"><b>📋 정육면체 표</b><span class="n">빈칸을 채워 보세요</span></div>
        <div class="data-scroll">
          <table class="vtable" id="vtable"></table>
        </div>
      </section>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <div class="ctrl-set" id="cs-soak">
          <div class="btn-row">
            <button class="btn btn-subject" id="soakBtn" type="button">🧪 용액에 담그기</button>
            <button class="btn" id="cutBtn" type="button" data-feature="cut" disabled>🔪 꺼내서 자르기</button>
          </div>
          <p class="ctrl-note" id="soakNote">우무 조각을 묽은 수산화 나트륨 수용액에 10분 담가요.</p>
        </div>
        <div class="ctrl-set" id="cs-table" hidden>
          <div class="segmented" id="viewSeg" role="group" aria-label="보기 방식">
            <button type="button" data-v="area" class="on">🟦 겉넓이(표면)</button>
            <button type="button" data-v="volume">🟧 부피(속)</button>
          </div>
          <p class="ctrl-note">정육면체 모형으로 칸을 세어 보며 표의 빈칸을 채워요.</p>
        </div>
        <div class="ctrl-set" id="cs-cell" hidden>
          <div class="btn-row">
            <button class="btn btn-subject" id="growBtn" type="button">🌱 키우기</button>
            <button class="btn" id="divBtn" type="button" data-feature="divide">✂️ 분열시키기</button>
          </div>
          <p class="ctrl-note" id="cellNote">세포를 키우면서 물질이 중심까지 가는지 살펴봐요.</p>
        </div>
        <div class="ctrl-set" id="cs-life" hidden>
          <div class="segmented" id="lifeSeg" role="group" aria-label="비교 대상">
            <button type="button" data-s="animals" class="on">🐭🐘 동물</button>
            <button type="button" data-s="root">🌱 뿌리 끝</button>
          </div>
          <button class="btn btn-subject" id="rootBtn" type="button" hidden>🌱 뿌리 자라게 하기</button>
          <p class="ctrl-note" id="lifeNote">생쥐와 코끼리를 눌러 같은 크기의 조직을 확대해 봐요.</p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
