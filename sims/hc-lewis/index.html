<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#8b5cf6">
  <title>루이스 전자점식 | 고등 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚫</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .stage-card { background: #f3f0fb; }
    .stage-toolbar { min-height: 61px; }
    .toolbar-label { font-weight: 800; color: var(--muted); font-size: 15px; padding-left: 4px; }
    .stage-toolbar .segmented button { min-height: 44px; padding: 5px 12px; font-size: 14.5px; white-space: nowrap; }
    .segmented button.on { background: var(--subject); color: #fff; }
    #resetBtn { font-size: 20px; }
    #ctrlCard { display: flex; flex-direction: column; gap: 12px; }
    #ctrlCard .control { margin: 0; }
    .ctrl-set { display: flex; flex-direction: column; gap: 10px; }
    .ctrl-set[hidden] { display: none; }
    .ctrl-set .segmented { align-self: stretch; flex-wrap: nowrap; }
    .ctrl-set .segmented button { flex: 1 1 0; min-width: 0; min-height: 44px; font-size: 14.5px; padding-left: 4px; padding-right: 4px; }
    .ctrl-note { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
    .opt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .opt-grid.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .opt {
      min-height: 46px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px;
      font-weight: 800; font-size: 14.5px; cursor: pointer; padding: 4px 6px; font-family: inherit; line-height: 1.2;
    }
    .opt[hidden] { display: none; }
    .opt.on { border-color: var(--subject); background: color-mix(in srgb, var(--subject) 14%, white); color: color-mix(in srgb, var(--subject) 70%, black); }
    .opt.done::after { content: " ✓"; color: var(--good); }
    .opt.wide { grid-column: 1 / -1; }
    .opt:disabled { opacity: .45; cursor: not-allowed; }
    .opt.primary { background: var(--subject); border-color: var(--subject); color: #fff; }
    .opt.primary:disabled { background: #b9a9ee; border-color: #b9a9ee; }
    .step-card { background: #f8f6fe; border: 2px solid #ddd3fa; border-radius: 12px; padding: 8px 10px; font-size: 14px; line-height: 1.45; color: #2b3445; }
    .step-card b { color: #5b21b6; }
    .tbl-card { font-size: 14px; }
    .tbl-card .tq { font-weight: 800; margin-bottom: 4px; }
    .tbl { border-collapse: separate; border-spacing: 4px 3px; width: 100%; }
    .tbl th { font-size: 13px; color: var(--muted); font-weight: 800; }
    .tbl td:first-child { font-weight: 800; white-space: nowrap; }
    .tbl select {
      width: 100%; min-width: 0; height: 40px; border: 2px dashed #b4bfcf; border-radius: 10px; background: #fff; text-align: center; text-align-last: center;
      font-weight: 800; font-size: 14.5px; color: var(--ink); padding: 0 2px; font-family: inherit;
    }
    .tbl select.ok { border-style: solid; border-color: var(--good); background: var(--good-soft); color: #0b6b39; }
    .tbl select.bad { border-style: solid; border-color: var(--bad); background: var(--bad-soft); animation: shakeX .38s; }
    @keyframes shakeX { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .stage-hint { white-space: normal; width: max-content; max-width: calc(100% - 24px); text-align: center; }
    .stage-canvas .stage-hint { top: 10px; bottom: auto; }
    .readout .value.txt { font-family: var(--font); font-size: 17px; white-space: normal; line-height: 1.25; }
    .readout .value sup, .readout .value sub { font-size: .6em; }
    .step-intro .si-q {
      background: #fff; border: 2px solid color-mix(in srgb, var(--subject) 45%, white); border-radius: 12px;
      padding: 9px 12px; font-weight: 800; font-size: 16px; color: #4c1d95; margin: 4px 0 8px;
    }
    sup, sub { font-size: .7em; line-height: 0; }
    .fig-box { display: block; margin: 4px auto; max-width: 100%; }
    .concept table.mini { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
    .concept table.mini th, .concept table.mini td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
    .concept table.mini th { background: var(--surface-2); font-weight: 800; }
    @media (max-width: 599px) {
      .stage-toolbar .spacer { display: none; }
      .stage-toolbar { gap: 6px; padding: 8px; }
      .stage-toolbar .segmented button { padding: 5px 7px; font-size: 13px; }
      .readout .value.txt { font-size: 15px; }
      .stage-hint { font-size: 13px; padding: 5px 12px; }
    }
  </style>
</head>
<body class="sim-page" data-subject="chem">
  <header class="sim-header">
    <a class="btn btn-sm btn-back" href="../../index.html#hc">←<span> 목록</span></a>
    <div class="sim-title">
      <div class="sim-unit">화학 · Ⅱ. 물질의 구조와 성질</div>
      <h1>루이스 전자점식</h1>
    </div>
    <div class="sim-header-right">
      <div class="star-meter" id="starMeter" title="획득한 별"></div>
      <button class="icon-btn" id="soundBtn" type="button">🔊</button>
    </div>
  </header>

  <main class="sim-main">
    <div class="stage-col">
      <section class="card stage-card">
        <div class="stage-toolbar">
          <span class="toolbar-label" id="tbLabel">⚫ 원자의 점</span>
          <div class="segmented" id="sceneSeg" role="group" aria-label="장면 고르기">
            <button type="button" data-scene="atom" data-feature="atom">⚫ 원자의 점</button>
            <button type="button" data-scene="mol" data-feature="mol">🤝 분자 그리기</button>
            <button type="button" data-scene="wizard" data-feature="wizard">📝 5단계</button>
            <button type="button" data-scene="ionic" data-feature="exc">⚡ 이온 결합</button>
          </div>
          <span class="spacer"></span>
          <div class="segmented" id="viewSeg" role="group" aria-label="표기 방식" data-feature="mol">
            <button type="button" data-view="dot" class="on">점식</button>
            <button type="button" data-view="line">구조식</button>
          </div>
          <button class="icon-btn" id="resetBtn" type="button" title="처음 상태로" aria-label="처음 상태로">↺</button>
        </div>
        <div class="stage-canvas">
          <canvas id="cv" aria-label="루이스 전자점식 시뮬레이션: 원자의 원자가 전자 점, 분자의 공유 전자쌍과 비공유 전자쌍, 5단계 그리기, 이온 결합 전자점식"></canvas>
          <div class="stage-hint hide" id="stageHint"></div>
        </div>
      </section>
      <div class="readouts" id="readouts">
        <div class="readout"><span class="label" id="roL1">-</span><span class="value txt" id="roV1">-</span></div>
        <div class="readout"><span class="label" id="roL2">-</span><span class="value txt" id="roV2">-</span></div>
        <div class="readout"><span class="label" id="roL3">-</span><span class="value txt" id="roV3">-</span></div>
      </div>
    </div>

    <aside class="side-col">
      <section class="card card-pad" id="ctrlCard">
        <!-- 원자의 점 -->
        <div class="ctrl-set" id="cs-atom" hidden>
          <div class="opt-grid">
            <button type="button" class="opt primary" id="addDot">➕ 점 찍기</button>
            <button type="button" class="opt" id="clrDot">🧹 점 지우기</button>
          </div>
          <p class="ctrl-note" id="atomNote">아래 주기율표에서 원소를 고르고, 최외각 전자 수만큼 점을 찍어요.</p>
        </div>
        <!-- 분자 그리기 -->
        <div class="ctrl-set" id="cs-mol" hidden>
          <div class="segmented" id="molSeg" role="group" aria-label="만들 분자">
            <button type="button" data-m="H2" class="on">H<sub>2</sub></button>
            <button type="button" data-m="HF">HF</button>
            <button type="button" data-m="H2O">H<sub>2</sub>O</button>
            <button type="button" data-m="NH3">NH<sub>3</sub></button>
            <button type="button" data-m="CH4">CH<sub>4</sub></button>
          </div>
          <p class="ctrl-note" id="molNote">바깥 원자를 끌어 가운데 원자에 가까이 가져가거나 눌러 보세요.</p>
          <div class="tbl-card" id="molTable" hidden>
            <div class="tq">📋 전자쌍 수 세어 표 채우기</div>
            <table class="tbl">
              <thead><tr><th>분자</th><th>공유 전자쌍</th><th>비공유 전자쌍</th></tr></thead>
              <tbody id="tblBody"></tbody>
            </table>
          </div>
        </div>
        <!-- 5단계 -->
        <div class="ctrl-set" id="cs-wizard" hidden>
          <div class="opt-grid g3" id="wizSel">
            <button type="button" class="opt" data-w="CO2">CO<sub>2</sub></button>
            <button type="button" class="opt" data-w="N2">N<sub>2</sub></button>
            <button type="button" class="opt" data-w="O2">O<sub>2</sub></button>
            <button type="button" class="opt" data-w="HCN">HCN</button>
            <button type="button" class="opt" data-w="C2H4">C<sub>2</sub>H<sub>4</sub></button>
            <button type="button" class="opt" data-w="BeCl2" data-feature="exc">BeCl<sub>2</sub></button>
            <button type="button" class="opt" data-w="BF3" data-feature="exc">BF<sub>3</sub></button>
            <button type="button" class="opt" data-w="PCl3" data-feature="exc">PCl<sub>3</sub></button>
            <button type="button" class="opt" data-w="CCl4" data-feature="exc">CCl<sub>4</sub></button>
          </div>
          <div class="step-card" id="wizNote">-</div>
          <div class="opt-grid">
            <button type="button" class="opt" id="wizBack">◀ 이전</button>
            <button type="button" class="opt primary" id="wizNext">다음 ▶</button>
          </div>
        </div>
        <!-- 이온 결합 -->
        <div class="ctrl-set" id="cs-ionic" hidden>
          <div class="segmented" id="ionSeg" role="group" aria-label="이온 결합 화합물">
            <button type="button" data-i="NaCl" class="on">NaCl</button>
            <button type="button" data-i="MgO">MgO</button>
            <button type="button" data-i="Na2O">Na<sub>2</sub>O</button>
          </div>
          <p class="ctrl-note" id="ionNote">금속 원자의 전자 점을 눌러 비금속 원자로 옮겨 보세요.</p>
        </div>
      </section>
      <section class="card" id="game"></section>
    </aside>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/anim.js"></script>
  <script src="../../assets/js/catalog.js"></script>
  <script src="sim.js"></script>
</body>
</html>
