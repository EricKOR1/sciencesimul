<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <title>친구 화면 보기 | 과학 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👀</text></svg>">
  <link rel="stylesheet" href="assets/fonts/pretendard/pretendardvariable-dynamic-subset.css">
  <style>
    :root { --bg: #0e1116; --bar: #171b22; --ink: #eef1f5; --muted: #a3acba; --line: #2a303b; --primary: #5b9dff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--ink); font-family: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
    .w-bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 16px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); background: var(--bar); border-bottom: 1px solid var(--line); }
    .w-bar a { color: var(--ink); text-decoration: none; font-weight: 800; font-size: 15px; white-space: nowrap; }
    .w-who { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
    .w-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: #7d8796; }
    .w-dot.on { background: #2fbf71; box-shadow: 0 0 0 4px rgba(47,191,113,.2); }
    .w-dot.wait { background: #ffb400; }
    .w-dot.bad { background: #ff6b6b; }
    .w-tag { flex: none; font-size: 12.5px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
    .w-stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
    #wFrame { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; border: 0; background: #fff; pointer-events: none; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
    .w-msg { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: min(560px, 92%); background: rgba(23,27,34,.94); border: 1px solid var(--line); color: var(--ink); padding: 10px 16px; border-radius: 14px; font-weight: 700; font-size: 15px; text-align: center; z-index: 2; }
    .w-msg[hidden] { display: none; }
    .w-form { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px 16px; text-align: center; }
    .w-form[hidden] { display: none; }
    .w-form h1 { margin: 0; font-size: 26px; font-weight: 800; }
    .w-form p { margin: 0; color: var(--muted); }
    .w-form form { display: flex; gap: 8px; width: min(360px, 100%); }
    .w-form input { flex: 1; min-width: 0; font: inherit; font-size: 22px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; text-align: center; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--bar); color: var(--ink); }
    .w-form button { font: inherit; font-weight: 800; font-size: 17px; border: 0; border-radius: 14px; padding: 0 18px; background: var(--primary); color: #0b1220; cursor: pointer; }
    /* 전체 화면 · 가로 보기 (기본) */
    body.full .w-bar { display: none; }
    body.full .w-msg { bottom: 10px; }
    body.rot .w-stage { position: fixed; top: 0; left: 100vw; width: 100vh; height: 100vw; flex: none; transform-origin: top left; transform: rotate(90deg); }
    body.rot .w-msg { left: 50%; top: 50%; bottom: auto; transform: translate(-50%, -50%) rotate(90deg); max-width: 80vh; }
    .w-fs { position: fixed; z-index: 5; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); display: none; gap: 6px; }
    body.full .w-fs { display: flex; }
    body.rot .w-fs { top: auto; bottom: max(8px, env(safe-area-inset-bottom)); right: max(8px, env(safe-area-inset-right)); transform: rotate(90deg) translateY(-100%); transform-origin: right bottom; }
    .w-fs button { font: inherit; font-size: 13px; font-weight: 800; color: #fff; background: rgba(23,27,34,.72); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
    .w-tap { position: fixed; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(23,27,34,.9); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 16px; padding: 12px 18px; font-weight: 800; font-size: 15px; text-align: center; pointer-events: none; }
    body.rot .w-tap { transform: translate(-50%, -50%) rotate(90deg); }
    .w-tap[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="w-bar">
    <a href="index.html" title="과학 시뮬레이션 첫 화면">🔬</a>
    <div class="w-who"><span class="w-dot" id="wDot"></span><span id="wWho">친구 화면 보기</span></div>
    <span class="w-tag">보기 전용</span>
  </div>
  <div class="w-form" id="wForm" hidden>
    <h1>👀 친구 화면 보기</h1>
    <p>친구의 📡 공유 창에 있는 코드를 입력해요.</p>
    <form><input type="text" maxlength="7" placeholder="ABC-234" autocomplete="off" aria-label="친구 코드"><button type="submit">보기</button></form>
  </div>
  <div class="w-stage" id="wStage" hidden>
    <iframe id="wFrame" title="친구의 학습 화면" tabindex="-1"></iframe>
  </div>
  <div class="w-msg" id="wMsg" role="status" hidden></div>
  <div class="w-fs" id="wFs"><button type="button" id="wNormal" title="기본 화면으로">↙ 작게 보기</button></div>
  <div class="w-tap" id="wTap" hidden>👆 화면을 한 번 누르면 전체 화면으로 볼 수 있어요</div>
  <script src="assets/js/watch.js"></script>
</body>
</html>
